651cf98b598483ee6649598b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/da240f73137f84a0cc776ac8418582660681c556-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/728b6b46da5a317bcb22582ac505e1a68a44ad90-96x96.jpg"],"ko":[["심해석 삼지창","피즈의 기본 공격이 추가 지속 피해를 입힙니다."],["성게 찌르기","피즈가 대상을 뚫고 지나가며 마법 피해를 줍니다. 적중 시 효과도 적용됩니다."],["치명적 파도","피즈의 다음 기본 공격을 강화하여 추가 피해를 입히고 유닛을 처치하면 치명적 파도의 재사용 대기시간을 초기화합니다. 추가 기본 공격은 추가 피해를 입힙니다."],["장난치기 / 재간둥이","피즈가 자신의 창 위로 뛰어올라 목표로 지정할 수 없게 됩니다. 이 상태에서 피즈는 땅을 내리치거나 다시금 뛰어오를 수 있습니다."],["미끼 뿌리기","피즈가 지정한 방향으로 마법 물고기를 풀어놓으면, 이 물고기를 건드리는 챔피언에게 들러붙어 이동 속도를 늦춥니다. 잠시 후 상어가 땅 밑에서 튀어나와 대상을 띄워올리며 주변에 있는 적은 옆으로 밀어냅니다. 상어에게 맞은 적은 모두 마법 피해를 입으며 속도가 느려집니다."]],"en":[["Seastone Trident","Fizz's attacks deal additional damage over time."],["Urchin Strike","Fizz dashes through his target, dealing magic damage and applying on hit effects."],["Rending Wave","Empowers Fizz' next attack to deal bonus damage, and killing a unit resets Rending Wave's cooldown. Additional attacks deal more damage."],["Playful / Trickster","Fizz hops into the air, landing gracefully upon his spear and becoming untargetable. From this position, Fizz can either slam the ground or choose to jump again before smashing back down."],["Chum the Waters","Fizz tosses a fish in a direction that attaches to any champion that touches it, slowing the target. After a short delay, a shark erupts from the ground, knocking up the target and knocking any nearby enemies aside. All enemies hit are dealt magic damage and slowed."]],"zh":[["海神三叉戟","飛斯的普攻會隨著時間造成額外傷害。"],["現撈海膽","飛斯猛衝穿過目標，造成魔法傷害，並造成命中效果。"],["裂岸大浪","強化飛斯的下一次普攻造成額外傷害，擊殺單位能重置裂岸大浪冷卻時間。重複對相同目標普攻能造成更多傷害。"],["愛玩小飛/調皮小飛","飛斯跳到空中，利用他的三叉戟優雅的落地並進入無法被指定的狀態。飛斯處在這個狀態的時候，可以選擇直擊地面或是在落地前再次跳躍。"],["海之霸主","飛斯朝一個方向丟出一條魚，這條魚會附著在碰到牠的任何英雄身上，並造成緩速。在一小段延遲之後，地面會冒出一隻鯊魚將目標擊飛、將所有鄰近敵人擊退，並對所有命中的敵人造成魔法傷害與緩速。"]],"n":[["0",""],["8/7/7/6",""],["10/9/9/8",""],["16/14/12/10",""],["85/70/55",""]]},"10087":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7ff27f375c46d2bfcf9e258c28d704678ef3756d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/048b1938c593978abc012641da2e6a3d011711a9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/14f0b8ab1a1071f299e46972b82e540394b8dfae-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/947ca890d3baa2dec7e0b4388f03aebf8b4e455a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/913aa713b1ac03c67ac1500655cadc149b0d3e44-96x96.jpg"],"ko":[["짧은 도화선","직스의 모든 스킬이 구조물에도 피해를 입힙니다. 주기적으로 직스의 다음 스킬이 추가 마법 피해를 입힙니다. 직스가 스킬을 사용할 때마다 이 스킬의 재사용 대기시간이 감소합니다."],["반동 폭탄","직스가 반동 폭탄을 던져 마법 피해를 입힙니다."],["휴대용 폭약","직스가 폭약을 던지면 4초 후, 혹은 스킬을 다시 사용할 때 터집니다. 휴대용 폭약은 폭발 시 적들에게 마법 피해를 주고 멀리 밀어냅니다. 직스 역시 밀려나지만, 피해는 입지 않습니다. 약해진 적 포탑에는 휴대용 폭약이 마법공학 폭발을 일으켜 피해를 입힐 수 있습니다."],["마법공학 지뢰밭","직스가 밟으면 폭발하는 지뢰를 뿌려, 지뢰에 닿은 적은 마법 피해를 입고 둔화됩니다. 같은 대상이 연속해서 지뢰를 밟으면 받는 피해량이 감소합니다."],["지옥 화염 폭탄","직스가 궁극의 무기인 지옥 화염 폭탄을 조립하여 매우 멀리 날립니다. 폭발의 중심부에 있는 적들은 외곽에 있는 적들보다 더 큰 피해를 입습니다. 즉시 시전 시, 지옥 화염 폭탄이 체력이 가장 낮은 적을 대상으로 지정합니다."]],"en":[["Short Fuse","All of Ziggs’s abilities also damage structures. Periodically, his next ability deals bonus magic damage. This cooldown is reduced whenever Ziggs uses an ability."],["Bouncing Bomb","Ziggs throws a bouncing bomb that deals magic damage."],["Satchel Charge","Ziggs flings an explosive charge that detonates after 4 seconds, or when this ability is activated again. The explosion deals magic damage to enemies, knocking them away. Ziggs is also knocked away, but takes no damage. Ziggs can use the Satchel to hexplode vulnerable enemy turrets."],["Hexplosive Minefield","Ziggs scatters proximity mines that detonate on enemy contact, dealing magic damage and slowing. Successive mine detonations on the same target deal reduced damage."],["Mega Inferno Bomb","Ziggs deploys his ultimate creation, the Mega Inferno Bomb, hurling it an enormous distance. Enemies in the primary blast zone take more damage than those farther away. When quick casting, the bomb will target the enemy with the lowest HP."]],"zh":[["即刻爆發","希格斯所有技能都能對建築物造成傷害。每隔一段時間，下次施放的技能會造成額外魔法傷害。每次希格斯使用技能時都會縮短此被動的冷卻時間。"],["彈跳炸彈","希格斯擲出一個彈跳炸彈，造成魔法傷害。"],["技術性引爆","希格斯甩出於4秒後引爆的炸彈，再次使用此技能可直接引爆炸彈。炸彈對敵方造成魔法傷害，同時將他們擊退。希格斯也會被擊退，但不會受到任何傷害。希格斯可以使用技術性引爆來摧毀脆弱的敵方防禦塔。"],["海克斯詭雷","希格斯散射出感應式地雷，敵方接觸後會受到魔法傷害及緩速效果。相同目標連續引爆地雷時之後受到的傷害較少。"],["煉獄炸彈","希格斯準備好他極致的完美創作「煉獄炸彈」，朝著極遠的目標區域投出。位於核心攻擊範圍的敵人會比外圍敵人承受更多傷害。快速施放時，炸彈會投向生命值最低的敵軍。"]],"n":[["24",""],["5/5/4/4",""],["18/16/14/12",""],["15/15/15/15",""],["85/75/65",""]]},"10088":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cc79ca54535607f30edf4c21395b81e918120ccd-800x800.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b52ec0d5f211df0a8a550d5f883ef1e02cbdaa77-800x800.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/94181b4966a60ba4ed63bdde1953cf012f81a0c5-800x800.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1faf41fbb304bf963a67f86de0f24b984bf29f54-800x800.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/51cefa20574dfdd403cdf1d5bc44ce0a9f88feb8-800x800.jpg"],"ko":[["육식","초가스가 적을 처치할 때마다 체력과 마나를 회복합니다. 대상이 챔피언, 포탑, 에픽 몬스터라면 회복량이 두 배로 증가합니다."],["파열","초가스가 지정한 위치의 땅을 파열시켜 적들을 공중에 띄우고, 피해를 입히며, 둔화시킵니다."],["흉포한 울부짖음","초가스가 원뿔 형태의 지역에 무시무시한 비명을 질러, 적에게 마법 피해를 입히고 몇 초 동안 침묵시킵니다."],["날카로운 가시","초가스의 기본 공격이 치명적인 가시를 발사해, 경로상의 모든 적에게 피해를 입히고 둔화시킵니다."],["포식","초가스가 적을 먹어 치워 큰 고정 피해를 입힙니다. 이 스킬로 대상을 처치하면 초가스의 몸집이 커지고 최대 체력을 얻습니다. 이 효과는 적을 먹어 치울 때마다 중첩됩니다."]],"en":[["Carnivore","Whenever Cho'Gath kills an enemy unit, it recovers health and mana. The effect is doubled if the enemy is a champion, turret, or epic monster."],["Rupture","Cho’Gath ruptures the ground at target location, knocking enemy units into the air, dealing damage and slowing them."],["Feral Scream","Cho'Gath unleashes a terrible scream at enemies in a cone, dealing magic damage and Silencing enemies for a few seconds."],["Vorpal Spikes","Cho'Gath's attacks release deadly spikes, dealing damage and slowing all enemy units in front of it."],["Feast","Cho’Gath devours an enemy unit, dealing a high amount of true damage. If the target is killed, Cho'Gath grows in size, gaining maximum health. This effect stacks with each enemy devoured."]],"zh":[["肉食者","科加斯每次擊殺敵方單位時，會恢復生命和魔力。若目標是英雄、防禦塔或史詩級野怪，效果加倍。"],["破裂","科加斯撕裂目標位置的地面，將敵軍拋向空中，造成傷害並減速。"],["野性尖嘯","科加斯向前方扇形範圍施放恐怖聲波，造成魔法傷害並使目標沉默數秒。"],["恐懼尖刺","科加斯的攻擊會釋放致命尖刺，傷害並緩速前方所有敵軍。"],["饗宴","科加斯吞噬一個敵方單位，造成大量真實傷害。如果目標被擊殺，科加斯的體型會變大，提高最大生命。效果隨吞噬的敵軍數疊加。"]],"n":[["0",""],["6",""],["12/11/10/9",""],["7/6/5/4",""],["70/60/50",""]]},"10089":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c19c83ad1e82baecf45d7b2796792d6d27dbf6b9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dd6a35997502bc3f7f41c9d0394d9ff0abace285-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/2e64b237e7186e7857ab4b01c83dd9371ff3b7a2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1c0a37f1132b68a257c33a883499bd8e300d8ad2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/65c872d529c771b12d7f393df180bf38d72b9c8e-96x96.jpg"],"ko":[["서비스 시간","그라가스가 스킬을 사용하면 주기적으로 체력을 회복합니다."],["술통 굴리기","그라가스가 술통을 굴려 폭발시킵니다. 술통은 3초 뒤 자동으로 폭발하며 스킬을 다시 사용하여 직접 폭발시킬수도 있습니다. 이 스킬에 당한 적은 이동 속도가 느려집니다."],["취중 분노","이 스킬을 사용하면 받는 피해가 줄어들고 다음번 기본 공격 시 근처의 모든 대상에게 추가 마법 피해를 입힙니다."],["몸통 박치기","그라가스가 지정 위치로 몸을 날려 가장 먼저 부딪히는 적과 그 주변의 다른 적 유닛에게 피해를 주며 기절시킵니다."],["술통 폭발","그라가스가 술통을 지정한 위치에 던져, 폭발 반경 내의 적들에게 피해를 입히고 멀리 밀어냅니다."]],"en":[["Happy Hour","Gragas periodically heals upon using an ability."],["Barrel Roll","Gragas rolls his cask to a location, which can be activated to explode or will explode on its own after 3 seconds. Enemies struck by the blast have their Movement Speed slowed."],["Drunken Rage","Gragas guzzles down brew from his cask for 1 second. After finishing, he becomes drunkenly empowered, dealing magic damage to all nearby enemies on his next basic attack and reducing damage received."],["Body Slam","Gragas charges to a location and collides with the first enemy unit he comes across, dealing damage to all nearby enemy units and stunning them."],["Explosive Cask","Gragas hurls his cask to a location, dealing damage and knocking back enemies caught in the blast radius."]],"zh":[["歡樂時光","古拉格斯每隔一段時間就能使用技能來治療自身。"],["滾動酒桶","古拉格斯將酒桶滾到目標地點，可以主動引爆或在到達目標地點3秒後自行爆炸。被炸到的敵人跑速會降低。"],["醉酒狂暴","古拉格斯狂飲酒桶裡的佳釀，在 1 秒的引導時間完成後會獲得強化能力，對下次普攻目標和鄰近敵人造成魔法傷害，並減少所受的傷害。"],["肉彈衝擊","古拉格斯朝指定位置衝刺，撞上第一個敵方單位時停止，擊暈所有鄰近敵方單位並造成傷害。"],["爆破酒桶","古拉格斯將他的酒桶丟向指定位置，擊退爆炸範圍內的所有敵人並造成傷害。"]],"n":[["0",""],["9/8/7/6",""],["5",""],["15/14/13/12",""],["85/70/55",""]]},"10090":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/f54b1f86c8b3c1fc0326a9159c62fa1a92d9a1b8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1f478246978315efd2ba0e160c078507e5bf7247-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2f2700bd00e8f489494cb5424e72639b53473a4d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f41d177c123b13f783235fcc5a3748a00e5bdc36-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/179bef101af7f2478cd6aa12400e176cc3e5c316-96x96.jpg"],"ko":[["핏빛 계약","블라디미르는 추가 체력 30당 1의 주문력을 얻으며, 주문력 1당 1.6의 체력을 얻습니다. (이 효과는 서로 중첩되지 않습니다.)"],["수혈","블라디미르가 대상 적으로부터 체력을 흡수합니다. 수혈을 충분히 한 뒤에는 수혈의 피해량과 치유량이 잠깐 동안 크게 늘어납니다."],["피의 웅덩이","블라디미르가 피의 웅덩이로 변해 2초 동안 공격 대상이 되지 않습니다. 또한 웅덩이 위에 서 있는 적의 속도가 느려지며 블라디미르가 이들의 체력을 흡수합니다."],["선혈의 파도","블라디미르가 자신의 체력을 희생해 피의 웅덩이를 채웁니다. 웅덩이가 파도를 방출하면 주변 지역에 피해를 입히지만 적 유닛이 파도를 가로막을 수 있습니다."],["혈사병","블라디미르가 혈사병으로 목표 지역을 오염시킵니다. 질병에 감염된 적은 일정 시간 동안 더 큰 피해를 입습니다. 감염된 적은 몇 초 뒤 마법 피해를 입으며 피해를 입은 적 챔피언 수에 비례해 블라디미르의 체력이 회복됩니다."]],"en":[["Crimson Pact","Every 30 points of bonus Health gives Vladimir 1 Ability Power and every 1 point of Ability Power gives Vladimir 1.6 bonus Health (does not stack with itself)."],["Transfusion","Vladimir steals life from the target enemy. When Vladimir's resource is full, Transfusion will benefit from massively increased damage and healing for a brief time."],["Sanguine Pool","Vladimir sinks into a pool of blood, becoming untargetable for 2 seconds. Additionally, enemies on the pool are slowed and Vladimir siphons life from them."],["Tides of Blood","Vladimir pays his own health to charge up a reservoir of blood which, when released, deals damage in the area around him but can be blocked by enemy units."],["Hemoplague","Vladimir infects an area with a virulent plague. Affected enemies take increased damage for the duration. After a few seconds, Hemoplague deals magic damage to infected enemies and heals Vladimir for each enemy Champion hit."]],"zh":[["血色契約","每30點額外生命會增加弗拉迪米爾1點魔法攻擊，每1點魔法攻擊會增加弗拉迪米爾1.6點額外生命（該效果不會迴圈累加）。"],["鮮血轉換","弗拉迪米爾從他的目標身上抽取生命。當滿足條件時，鮮血轉換傷害會大幅增加，並在短時間內獲得治療效果。"],["血紅之池","弗拉迪米爾潛入血泊之中，不能被選為目標，持續2秒。血泊上的敵人被減速，同時弗拉迪米爾吸取他們的生命。"],["血之潮汐","弗拉迪米爾消耗自身生命來儲存一股血液，當施放時對周圍單位造成傷害，但不能穿透目標。"],["血之瘟疫","弗拉迪米爾向目標區域注入劇毒瘟疫。持續時間內增加被感染的敵人所受到的傷害。血之瘟疫在數秒後會對被感染的敵人造成額外魔法傷害並治療弗拉迪米爾。"]],"n":[["0",""],["9/7/6/4",""],["25/22/19/16",""],["12/10/7/5",""],["90",""]]},"10091":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/029ed19d4b70ba8d44d01a1301360a8a09a15163-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/38b37b63b605267258007958d7312fd15f095eec-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/607f9526c3dabdcdc30b9e28887e1c5fbf8ce6a5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3c837d03bb8e15d2cc03c8e01ca411c491792b3b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f0eaa13d3cdc73b833af670a9ebbc92fd563ab18-96x96.jpg"],"ko":[["밀려오는 파도","나미의 스킬에 맞은 아군 챔피언은 짧은 시간 동안 이동 속도가 상승합니다."],["물의 감옥","거대한 물방울을 지정한 위치로 발사해 물방울이 닿은 적에게 피해를 입히고 닿는 순간 기절시킵니다."],["밀물 썰물","밀려드는 파도를 보내 아군 및 적 챔피언을 번갈아 맞히면서, 아군은 치유하고 적에게는 피해를 입힙니다."],["파도 소환사의 축복","잠시 동안 아군 챔피언들을 강화해, 기본 공격과 스킬 사용 시 추가 마법 피해를 입히고 대상에게 둔화를 걸 수 있게 만듭니다."],["해일","적들을 공중으로 띄우고 둔화를 걸면서 피해를 입히는 거대한 해일을 소환합니다. 여기에 맞은 아군은 밀려오는 파도의 효과를 두 배로 받습니다."]],"en":[["Surging Tides","When Nami's abilities hit allied champions they gain Movement Speed for a short duration."],["Aqua Prison","Sends a bubble to a target area, dealing damage and stunning all enemies on impact."],["Ebb and Flow","Unleashes a stream of water that bounces back and forth between allied and enemy champions, healing allies and damaging enemies."],["Tidecaller's Blessing","Empowers an allied champion for a short duration. The ally's basic attacks and spells deal bonus magic damage and slow the target."],["Tidal Wave","Summons a massive Tidal Wave that knocks up, slows, and damages enemies. Allies hit gain double the effect of Surging Tides."]],"zh":[["疾速波濤","友方英雄被娜米技能擊中時，會在短時間內增加跑速。"],["禁錮水牢","丟出一個泡泡到指定地點，命中時對範圍內的所有敵人造成傷害與暈眩。"],["跳躍水柱","釋放一股水流，在友方和敵方英雄間來回彈跳，治療友方英雄並傷害敵方英雄。"],["深海恩賜","短時間強化一位友方英雄，該名友軍的普攻與技能會造成額外魔法傷害並緩速目標。"],["驚滔駭浪","召喚一道滔天巨浪向前推進，把敵人擊飛並造成緩速與傷害。被擊中的友軍其身上疾速波濤的效果會加倍。"]],"n":[["0",""],["12/11/10/9",""],["10/10/10/10",""],["11/11/11/11",""],["75/70/65",""]]},"10092":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/620a140684393e24fd478c4cbca55a925f92553c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f2e1256017f16597ca524ff1bc13df9ebfca57e7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1ed015b028fcc96353f3e1200918321af6d2e7c2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/40f8b5777edf79a07574485b517bf4aee232c836-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/02acead0cb59ca94a343b6c80e3ec674e62bb9ca-96x96.jpg"],"ko":[["룬 검","리븐이 스킬을 사용하면 검이 충전됩니다. 기본 공격을 가하면 충전 횟수를 소모해 추가 피해를 입힙니다."],["부러진 날개","리븐이 돌진하며 적을 베어 넘깁니다. 이 스킬은 세 번 사용할 수 있으며 세 번째로 사용할 때에는 맞은 적을 밀쳐냅니다."],["기 폭발","리븐이 기를 폭발시켜 근처의 적에게 피해를 주며 기절시킵니다."],["용맹","리븐이 짧은 거리를 나아가며 피해를 일부 흡수합니다."],["추방자의 검","리븐이 자신의 옛 검에 힘을 불어넣어 추가 공격력과 공격 사거리를 얻습니다. 또한, 지속시간 동안 강력한 원거리 스킬인 바람 가르기를 한 번 사용할 수 있게 됩니다. 대상 처치에 관여하면 이 스킬의 지속시간이 늘어나고 바람 가르기를 1회 재사용할 수 있습니다."]],"en":[["Runic Blade","Riven's abilities charge her blade, and her basic attacks expend charges to deal an additional damage."],["Broken Wings","Riven lashes out in a series of strikes. This ability can be reactivated three times in a short time frame with the third hit knocking back nearby enemies."],["Ki Burst","Riven emits a Ki Burst, damaging and stunning nearby enemies."],["Valor","Riven steps forward a short distance and blocks incoming damage."],["Blade of the Exile","Riven empowers her keepsake weapon with energy, and gains Attack Damage and Range. During this time, she also gains the ability to use Wind Slash, a powerful ranged attack, once. Taking down a target with her will extend the ability time and grant a re-cast of Wind Slash."]],"zh":[["符文破刃","施放技能可使雷玟的刀刃充能，普攻會消耗充能，造成額外傷害。"],["斷罪之翼","雷玟使用一連串的攻擊。此技能可在短時間內重新施放2次，第三次可以將鄰近敵人全數擊退。"],["符文衝擊","雷玟發出氣波，造成傷害並且暈眩鄰近敵人。"],["勇者無敵","雷玟向前衝刺一小段距離，並且抵擋接下來的傷害。"],["放逐之刃","雷玟使用能量強化武器，增加物理攻擊與攻擊距離。除此之外，在這段期間她可以使用一次強力的遠距離攻擊「暴風斬」。期間取得擊殺或助攻，即可延長技能持續時間，並可再次施展「暴風斬」。"]],"n":[["0",""],["12/12/12/12",""],["8/8/7/7",""],["9/8/7/6",""],["75/60/45",""]]},"10093":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/14c275f8f04323032045623b5a793d24034a59bd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d5a722a276c0ada86db0869d9d07d70b08ee6aac-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b6ed488f0a88ce747ab4e5efe6e60dc28d9b3b4f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/92af0a6a1c01ff35b605134397cd2cb1669e0efb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/40fe8e66e73971887ea23f8a879e3be032bbc9ce-96x96.jpg"],"ko":[["죽지 않는 복수심","적을 처치하거나 어시스트를 올리면 잠시 바루스의 공격 속도가 상승합니다. 챔피언을 처치한 경우 공격 속도가 더 큰 폭으로 상승합니다."],["꿰뚫는 화살","바루스가 조준한 다음 강화된 화살을 발사하면, 조준한 시간에 비례하여 사거리와 피해량이 늘어납니다."],["역병 화살","기본 지속 효과: 바루스의 기본 공격이 추가 마법 피해를 입히고 역병을 붙입니다. 바루스가 이 대상을 다른 스킬로 공격하면 역병이 폭발하며 대상의 최대 체력에 비례한 마법 피해를 입힙니다. 사용 시: 다음번 꿰뚫는 화살이 강화됩니다."],["퍼붓는 화살","바루스가 화살을 비처럼 쏟아부어 물리 피해를 주고 지면을 오염시킵니다. 오염된 지면은 적의 이동 속도를 늦추며 자신에 대한 체력 회복 및 재생 효과를 감소시킵니다."],["부패의 사슬","바루스가 부패의 촉수를 발사하여 처음 맞은 적 챔피언의 이동을 차단합니다. 촉수는 주변의 감염되지 않은 챔피언들에게 계속 뻗어 나가 닿은 적들을 모두 이동 불가 상태로 만듭니다."]],"en":[["Living Vengeance","On kill or assist, Varus temporarily gains Attack Speed. This bonus is larger if the enemy is a champion."],["Piercing Arrow","Varus readies and then fires a powerful shot that gains extra range and damage the longer he spends preparing to fire."],["Blighted Quiver","Passive: Varus' basic attacks deal bonus magic damage and apply Blight. Varus' other abilities detonate Blight, dealing magic damage based on the target's maximum Health. Active: Varus empowers his next Piercing Arrow."],["Hail of Arrows","Varus fires a hail of arrows that deal physical damage and desecrate the ground. Desecrated ground slows enemies' Movement Speed and reduces their self healing and regeneration."],["Chain of Corruption","Varus flings out a damaging tendril of corruption that immobilizes the first enemy champion hit and then spreads towards nearby uninfected champions, immobilizing them too on contact."]],"zh":[["復仇怒火","當擊殺敵人或助攻時，法洛士會暫時性地提升攻速。若目標是英雄，則提升的幅度會更大。"],["破甲箭","法洛士累積力量射出一發強力箭矢，蓄力的時間越長，射程與傷害就越高。"],["荒蕪箭袋","被動：法洛士的普攻會造成額外魔法傷害，同時附加衰竭效果。法洛士的其他技能可觸發衰竭效果，根據目標的最大生命造成魔法傷害。主動：強化法洛士的下一發破甲箭。"],["腐敗箭雨","法洛士發射一陣箭雨，造成物理傷害並汙染目標區域。受污染的區域會降低敵人的跑速、自我治療量和生命回復量。"],["墮落連鎖","法洛士發射扭曲的墮落能量，將第一個命中的敵方英雄定身，然後擴散至鄰近未受影響的英雄，在接觸時也將他們定身。"]],"n":[["0",""],["15/14/13/12",""],["25",""],["13/12/11/10",""],["75/65/55",""]]},"10094":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f90827da91c3efa3f73d507acc40037da034e0ab-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bcbb01c79f2aa5ce06229c43932172f97cd1c06a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2a501bed85c1436430ac1c5d2ec0c2f95b5eeaad-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/96cb9194ba5e8bf4cc8e6e322b73689ebf68ee3f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/dd3c3ff7307886ebb1505304319ae71ae3454da7-96x96.jpg"],"ko":[["아이오니아의 열정","이렐리아의 스킬이 적에게 적중하면 중첩이 쌓이며, 중첩에 따라 추가 공격 속도가 적용됩니다. 최대 중첩이 쌓이면 적중 시 피해도 증가합니다."],["칼날 쇄도","이렐리아가 돌진해 대상을 공격하고 체력을 회복합니다. 대상에게 표식이 있거나 칼날 쇄도로 적을 처치하면 칼날 쇄도의 재사용 대기시간이 초기화됩니다."],["저항의 춤","이렐리아가 칼날에 힘을 충전한 뒤 공격합니다. 충전 중에는 이렐리아가 받는 물리 피해량이 감소하며 충전을 오래 할수록 공격이 강력해집니다."],["쌍검협무","이렐리아가 칼날 두 개를 던진 후 두 칼날이 서로를 향해 날아갑니다. 날아가는 칼날에 맞은 적은 피해를 입으며 기절한 뒤 표식이 생깁니다."],["선봉진격검","이렐리아가 칼날 다발을 발사합니다. 적 챔피언에게 적중하면 칼날 다발이 넓게 펼쳐지며 이때 칼날에 적중한 모든 적에게 피해를 주고 표식을 남깁니다. 또한 칼날이 형성한 결계를 적이 통과하면 피해를 입고 둔화됩니다."]],"en":[["Ionian Fervor","When Irelia strikes enemies with spells she gains stacking bonus Attack Speed. At maximum stacks she also gains bonus damage on hit."],["Bladesurge","Irelia dashes forward to strike her target, healing herself. If the target is Marked or dies to Bladesurge, its cooldown refreshes."],["Defiant Dance","Irelia charges a strike that deals more damage as she charges. She takes reduced physical damage during the charge."],["Flawless Duet","Irelia sends out two blades which converge on each other. Enemies caught in between are damaged, stunned and Marked."],["Vanguard's Edge","Irelia fires a massive number of blades that explode outward upon hitting an enemy champion. Enemies hit by the blades are damaged and Marked. Afterwards the blades form a wall that will damage and slow enemies that walk through it."]],"zh":[["愛歐尼亞狂熱","伊瑞莉雅使用技能擊中敵人時獲得可以疊加的攻速加成。達最大層數時將對目標造成額外傷害。"],["利刃衝擊","伊瑞莉雅朝目標衝刺並造成傷害，同時使自身回復生命。若該目標已被標記或是死於利刃衝擊，此技能的冷卻時間將會重置。"],["不屈秘舞","伊瑞莉雅替劍刃充能，充能越久接下來造成的傷害越高。充能期間受到的物理傷害將大幅降低。"],["無瑕重刃","伊瑞莉雅朝兩個指定位置各射出一把劍刀，兩者隨後交會飛擊。被兩把劍刃同時擊中的敵人會受到傷害、暈眩，以及標記。"],["護劍化形","伊瑞莉雅朝指定方向射出大量劍刃，命中敵方英雄後朝周圍散開，對擊中的敵人造成傷害並進行標記。接著劍刃會在地上形成一道劍陣，傷害並緩速所有經過的敵人。"]],"n":[["0",""],["9/8/7/6",""],["14/13/12/11",""],["12/11/10/9",""],["70/65/60",""]]},"10095":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/64522a426633969553de57153352991b090e5a8c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/34a9768b260702eb1d92032d35a6cc81337719c1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/b70f54b930e53b2f3647b33be7f4ec23ad13a08d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/6c26851015e722cc7b70c72311d78ed60aba83ee-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/026f0679e80e02b3081f2db0c75299bcad7df7e3-96x96.jpg"],"ko":[["탐욕","카타리나가 최근에 피해를 입힌 챔피언이 사망할 때마다 카타리나에게 적용 중인 스킬 재사용 대기시간이 크게 감소합니다. 카타리나가 단검을 다시 주우면 근처 적을 모두 공격해 마법 피해를 입힙니다."],["단검 투척","카타리나가 대상에게 단검을 던집니다. 단검은 근처 적들에게 튕겼다가 땅에 떨어집니다."],["준비","카타리나가 단검을 머리 위로 던지며 이동 속도가 크게 빨라집니다."],["순보","카타리나가 단검 또는 유닛 근처로 순간이동해 가장 가까운 적에게 피해를 입힙니다. 단검을 주우면 순보의 재사용 대기시간이 감소합니다."],["죽음의 연꽃","카타리나가 칼날 돌풍을 일으켜 지속 피해를 입히고 회복량을 감소시킵니다. 잠시 느리게 위치를 조정할 수 있습니다."]],"en":[["Voracity","Whenever an enemy champion dies that Katarina has damaged recently, her remaining ability cooldowns are dramatically reduced. If Katarina picks up a Dagger, she uses it to slash through all nearby enemies, dealing magic damage."],["Bouncing Blade","Katarina throws a Dagger at the target that then bounces to nearby enemies before ricocheting onto the ground."],["Preparation","Katarina gains a burst of movement speed, tossing a Dagger into the air directly above herself."],["Shunpo","Katarina blinks to a location near a Dagger or unit, dealing damage to the nearest enemy. Picking up a Dagger reduces Shunpo's cooldown."],["Death Lotus","Katarina becomes a flurry of blades, dealing damage over time and applying healing reduction. Katarina is able to slowly reposition for a short time."]],"zh":[["貪婪","當剛受到卡特蓮娜傷害的敵方英雄陣亡時，她的技能冷卻時間會大幅降低。卡特蓮娜撿起匕首時，可以利用匕首來攻擊所有鄰近敵人，造成魔法傷害。"],["彈射利刃","卡特蓮娜對目標投擲一把匕首，匕首會彈到鄰近敵人身上，直至彈落到地面。"],["備戰","卡特蓮娜向自己正上方投擲匕首，短時間內大幅增加跑速。"],["瞬步","卡特蓮娜瞬移到單位或匕首附近，並對最近的敵人造成傷害。撿起匕首會降低瞬步的冷卻時間。"],["死亡蓮花","卡特蓮娜化為刀刃旋風，造成持續性傷害，並施加重創效果。卡特蓮娜能在短時間內慢慢位移。"]],"n":[["0",""],["10/9/8/7",""],["14/13/12/11",""],["11/10/9/8",""],["60/50/40",""]]},"10096":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/82bff72f4bf213e63524a8000e7a3e574c6c61c2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/aaf6fe45c3174c2c04c1f9171753881413759032-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/0aeb46cdca0c5ddbe643cafd2ec3b333257a7808-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/343d12652e4cb45e53b6d8dbf1798bbc8e14d3e9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/2b8ae93a939c9c3aab2a0f5555cf8ebb14bf48ed-96x96.jpg"],"ko":[["독성 급류","신지드가 근처 챔피언을 회피하며 일시적으로 이동 속도가 증가합니다."],["맹독의 자취","신지드 뒤로 독구름을 남겨 구름에 들어가는 적에게 피해를 입힙니다."],["초강력 접착제","초강력 접착제가 든 시험관을 바닥에 던져 그 위를 지나가는 적을 둔화시키고 이동 스킬을 사용할 수 없게 합니다."],["던져넘기기","적을 신지드 뒤편으로 높이 던지며 피해를 줍니다. 신지드가 뒤로 던진 대상이 초강력 접착제 위에 착지하면 속박 효과가 적용됩니다."],["광기의 물약","신지드가 조합된 화학 물질을 마시고 향상된 전투 능력을 얻습니다."]],"en":[["Noxious Slipstream","Singed drafts off nearby champions, gaining a burst of movement speed when passing them."],["Poison Trail","Leaves a trail of poison behind Singed, dealing damage to enemies caught in the path."],["Mega Adhesive","Throws a vial of mega adhesive on the ground, slowing and grounding enemies who walk on it."],["Fling","Damages target enemy unit and flings them into the air behind Singed. If the target Singed flings lands in his Mega Adhesive, they are also rooted."],["Insanity Potion","Singed drinks a potent brew of chemicals, granting him increased combat stats."]],"zh":[["毒氣推進","辛吉德利用鄰近英雄身邊的氣流加速，經過他們時會獲得大量跑速。"],["劇毒蹤跡","辛吉德在身後留下一道毒氣，對處於路徑上的敵人造成傷害。"],["強力粘膠","對地上丟出一瓶強力粘膠，使踩到的敵人緩速且無法使用位移技能。"],["過肩摔","傷害目標敵方單位，並將他們投擲到辛吉德身後。如果目標被投擲到強力粘膠上，則該目標被定身。"],["瘋狂藥劑","辛吉德喝下精心炮製的化學藥劑，大幅提高戰鬥屬性。"]],"n":[["0",""],["1",""],["14/13/12/11",""],["13/13/13/13",""],["70/65/60",""]]},"10097":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/177f8d1678cf430025cc36cd98d74cffe1530aed-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e15465e241c4a66ecb541b9b8d539eb13b5fc3b7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ea8b1be4f96c8f44d68d4716f75361a3fc4d8146-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c5173986c29fbcde347ed89cec6e73a28169df13-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/26f95883b00046f25f10bf5ba813285a8ab2cc85-96x96.jpg"],"ko":[["구원","소라카는 체력이 낮은 아군 쪽으로 이동할 때 속도가 더 빨라집니다."],["별부름","지정한 위치에 하늘에서 별이 떨어져 적에게 마법 피해를 입히고 둔화시킵니다. 별부름이 적 챔피언에게 적중하면 소라카가 별의 가호를 얻어 체력을 회복합니다. 아군 챔피언 3명의 체력을 회복시키면 소라카의 다음 별부름이 강화되어 더 넓은 범위에 더 큰 피해를 입힙니다."],["은하의 마력","소라카가 아군 챔피언의 체력을 회복시킵니다. 초과된 체력 회복량은 보호막으로 전환됩니다."],["별의 균형","영역 내의 모든 적에게 피해를 입히고 침묵시키는 구역을 생성합니다. 영역이 해제될 때 아직 안에 남아있는 모든 적은 제자리에 묶입니다."],["기원","소라카가 아군에게 희망을 불어넣어 자신과 아군 챔피언들의 체력을 즉시 회복합니다."]],"en":[["Salvation","Soraka runs faster towards nearby low health allies."],["Starcall","A star falls from the sky at the target location dealing magic damage and slowing enemies. If an enemy champion is hit by Starcall, Soraka is rejuvenated and recovers Health. After healing 3 ally champions, her next Starcall is empowered and deals more damage in a larger area."],["Astral Infusion","Soraka heals a friendly champion. Excess healing is converted into a shield."],["Equinox","Creates a zone at a location that damages and silences all enemies inside. When the zone expires, all enemies still inside are rooted."],["Wish","Soraka fills her allies with hope, instantly restoring health to herself and all friendly champions."]],"zh":[["群星指路","索拉卡加速跑向生命值低落的鄰近友軍。"],["殞星召喚","殞落星辰從天而降，造成魔法傷害並使敵軍緩速。如果殞星召喚擊中敵方英雄，索拉卡將進入回春狀態，並回復生命值。回復3名友方英雄生命後，索拉卡下一次施放的殞星召喚將獲得強化，對更大範圍內的敵軍造成額外傷害。"],["星之祝福","索拉卡治療友方英雄，超額治療量會轉為護盾。"],["寂靜星河","創造一個結界，沉默所有範圍內的敵軍並造成傷害。結界消失時，仍在範圍內的所有敵軍會被定身。"],["祈願","索拉卡讓友軍充滿希望，立刻回復自身與所有友方英雄的生命值。"]],"n":[["0",""],["7/6/5/4",""],["7/6/5/4",""],["20/18/16/14",""],["85/80/75",""]]},"10098":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/23fa797f779dae3db16d6c2dad0568d0aa14af22-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/28e779a46c7103067d17cf91ef976b2f58621144-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/983025d2de4dc48b591a826e162be27c1212ad7c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bf066efa4c882272086fd78fa80d2c39c5fc5177-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8186530fdd1c9c2a8125e9335097d1a5e9aea0ed-96x96.jpg"],"ko":[["끓어오르는 주문의 힘","이즈리얼이 스킬을 적중시킬 때마다 공격 속도가 증가합니다. (최대 4회 중첩)"],["신비한 화살","이즈리얼이 에너지로 이루어진 화살을 발사합니다. 적 유닛에게 명중하면 모든 스킬의 재사용 대기시간이 약간 감소합니다."],["정수의 흐름","이즈리얼이 구체를 발사해 처음으로 적중한 챔피언이나 목표물에 남아있게 합니다. 구체에 적중된 적을 공격하면 구체가 폭발하며 피해를 입힙니다."],["비전 이동","이즈리얼이 목표 위치로 순간이동하여 가장 가까운 적을 향해 유도 화살을 발사합니다. 정수의 흐름에 맞은 대상을 우선적으로 공격합니다."],["정조준 일격","이즈리얼이 힘을 모은 후 강력한 에너지를 발사해 관통하는 적 모두에게 큰 피해를 입힙니다. (에픽 몬스터를 제외한 몬스터와 미니언 대상으로는 피해량이 감소합니다.)"]],"en":[["Rising Spell Force","Ezreal gains increasing Attack Speed each time he successfully hits a spell, stacking up to 4 times."],["Mystic Shot","Ezreal fires a damaging bolt of energy which reduces all of his cooldowns slightly if it strikes an enemy unit."],["Essence Flux","Ezreal fires an orb that sticks to the first champion or objective hit. If Ezreal hits an enemy with the orb, it detonates and deals damage."],["Arcane Shift","Ezreal teleports to a target nearby location and fires a homing bolt which strikes the nearest enemy unit. Prioritizes enemies stuck with Essence Flux."],["Trueshot Barrage","Ezreal winds up before firing a powerful barrage of energy that deals massive damage to each unit it passes through (damage is reduced for minions and non-epic monsters)."]],"zh":[["咒能高漲","伊澤瑞爾的技能每次命中目標時都會使自身攻速提升，最多可疊加4次。"],["秘術射擊","伊澤瑞爾發射一枚能量彈，成功命中一名敵方單位時所有技能都將縮短些許冷卻時間。"],["精華躍動","伊澤瑞爾發射一顆能量球，其會附著在首位擊中的敵方英雄或地圖物件。若伊澤瑞爾攻擊被能量球附著的單位，能量球將引爆並對該目標造成傷害。"],["奧術躍遷","伊澤瑞爾傳送至鄰近區域並向最近的敵方單位發射魔法箭。會優先鎖定身上有精華躍動印記的單位。"],["精準彈幕","伊澤瑞爾詠唱後發射強大的能量波，對路徑上的敵方單位造成大量傷害 (對小兵和非史詩級野怪造成的傷害減少)。"]],"n":[["0",""],["5/5/4/4",""],["10/10/10/10",""],["24/20/17/13",""],["80/70/60",""]]},"10099":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3a2ee2db9d8184c2ecdcee4cf85d8f36cd97f8ae-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/823b17647ae9b1ddfe90022a8b58f7c64974c95e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a4cacd61c02fddb8147dc2c66356ea4bedb097f5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/e43d45e368c126f1442cff38d640cbecf168d33a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/768f89f003877ad72f75ffe194454134f78d24b0-96x96.jpg"],"ko":[["석상의 강타","몇 초에 한 번씩 갈리오의 다음 기본 공격이 강화되어, 공격 속도가 증가하고 주변에 마법 피해를 추가로 입힙니다. 에픽 몬스터 또는 적 챔피언에게 스킬을 맞히면 이 효과의 재사용 대기시간이 3초 줄어듭니다. 재사용 대기시간은 스킬 사용 1회당 한 번씩만 감소합니다."],["전장의 돌풍","갈리오가 두 개의 돌풍을 발사합니다. 두 돌풍이 합쳐지면 소용돌이가 일어나 지속 피해를 입힙니다."],["듀란드의 방패","갈리오가 방어 태세에 들어가, 둔화된 상태로 힘을 모읍니다. 충전을 멈추면 주변의 적 챔피언을 도발하며 피해를 입힙니다."],["정의의 주먹","갈리오가 짧게 뒤로 물러났다가 돌진하여, 처음 충돌하는 적 챔피언에게 피해를 입히고 공중에 띄웁니다."],["영웅출현","갈리오가 아군의 위치를 착지 지점으로 정해 해당 지점 주변의 모든 아군에게 마법 보호막을 씌웁니다. 잠시 후 갈리오가 착지 지점에 떨어지며 주변 적을 띄워 올립니다."]],"en":[["Colossal Smash","Every few seconds, Galio's next basic attack deals bonus magic damage in an area. Galio gains attack speed when Colossal Smash is up. When an ability hits an epic monster or enemy champion, it reduces the cooldown of Colossal Smash by 3 seconds. This effect can only be triggered once per cast."],["Winds of War","Galio fires two windblasts that converge into a large tornado that deals damage over time."],["Shield of Durand","Galio charges a defensive stance, moving slowly. Upon releasing the charge, Galio will taunt and damage nearby enemy champions."],["Justice Punch","Galio will briefly step back and charge, damaging and knocking up the first enemy champion he encounters."],["Hero's Entrance","Galio designates an ally's position as his landing spot, granting all allies in the area a magic shield. After a delay Galio smashes down location, knocking up nearby enemies."]],"zh":[["護國意志","每過幾秒，加里歐下一次普攻可對範圍內敵軍造成額外魔法傷害。「護國意志」準備就緒時，提升攻速。技能命中史詩級野怪或敵方英雄時，「護國意志」冷卻時間縮短3秒。每次施放技能只能觸發一次效果。"],["征戰風暴","加里歐釋放兩道氣流，氣流匯聚之後形成一股造成持續傷害的旋風。"],["杜蘭德之盾","加里歐以防禦姿態開始蓄力，並降低跑速。解除後嘲諷並傷害鄰近敵方英雄。"],["光榮制裁","加里歐稍稍後退之後向前衝刺，傷害並擊飛第一位撞到的敵方英雄。"],["英靈之門","加里歐指定一位友軍所在位置為降落點，並賦予範圍內所有友軍魔法護盾。短暫延遲之後，加里歐會降落至友軍原先的位置，擊飛所有鄰近敵人。"]],"n":[["5",""],["11/10/8/7",""],["18/17/16/15",""],["10/9/8/7",""],["90/80/70",""]]},"10100":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/6ad8a62a37d7221936e23ecfe219528f514ebaec-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e8b1e3783d5d53c598bba4ed0e67b8750c32a362-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c88213821b4a1ff0f0eb1d2e1c6f3f5a60a21527-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/058b4d550eb2850ef08b1c5920e000a643bc3b49-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f25d2f3fc17a73c72a2982c74c3ea5f6ee38de31-96x96.jpg"],"ko":[["비열한 싸움","세 번째 기본 공격 또는 스킬 공격마다 추가 물리 피해를 입힙니다. 대상이 챔피언인 경우 잠시 동안 피해를 흡수하는 보호막을 얻습니다."],["복수의 부메랑","일반적인 부메랑 스킬처럼 날아갈 때 한 번, 돌아올 때 한 번, 적을 총 두 번 타격합니다. 부메랑은 마지막 대상에게 적중한 이후 일정 거리까지 날아가며, 이때 다른 대상에게 적중할 경우 사거리가 증가합니다. (이론적으로 사거리는 무한입니다.)"],["악당 처단","기본 지속 효과: 아크샨의 아군을 처치한 적은 몇 초간 악당이 됩니다. 악당을 처치하면 아크샨이 추가 골드를 얻고 사망한 아군의 부활 대기시간을 감소시킵니다. 사용 시: 몇 초간 위장 상태가 됩니다. 벽 근처나 수풀 안에 있으면 지속시간이 초기화됩니다. 악당을 향해 이동할 때 이동 속도를 얻습니다."],["영웅의 비상","몇 초간 벽에 고정되는 갈고리총을 발사해 밧줄에 매달린 채 이동합니다. 이동하는 동안 최근 피해를 입힌 적에게 탄환을 발사합니다."],["인과응보","적 챔피언을 조준하고 몇 초간 탄환을 과충전합니다."]],"en":[["Dirty Fighting","Every third attack or ability hit deals bonus physical damages. Against champions, also gains damage shield for brief moment."],["Avengerang","Like a typical boomerang spell, can hit each enemy twice (once on way out and in). Boomerang will reach some units beyond the last target hit, if it hits a different target during this it’s range will extend (theoretically range is infinite)"],["Going Rogue","Passive: Enemies that kill Akshan’s allies become Scoundrels for few brief seconds. Killing a Scoundrel grants Akshan bonus golds and reduces the fallen ally’s death timer. Active: Gain camouflage for a few seconds. Duration is refreshed when Akshan is near a wall or in brush. Gains movement speed when moving toward Scoundrels."],["Heroic Swing","Akshan fires a rope that attaches to a wall for a few seconds to allow him to swing in a circle. While swinging, Akshan shoots an enemy he has recently damaged."],["Comeuppance","Locks onto an enemy champion and begins overcharging Mist shots over a few seconds."]],"zh":[["無賴之道","普攻或技能每命中三次，將造成額外物理傷害；若目標是英雄，則另外獲得暫時護盾。"],["復仇迴力鏢","顧名思義，這個迴力鏢技能可以攻擊敵人兩次（一次射出去，一次飛回來）。發射後每次擊中敵人，皆可增加迴力鏢射程，因此理論上來說若不斷擊中目標，射程也會無限增加。"],["離經叛道","被動：擊殺埃可尚友軍的敵軍將變成惡徒，持續數秒。埃可尚擊殺惡徒時，可獲得額外金幣，並減少陣亡友軍的復活倒數。主動：在幾秒內進入偽裝狀態；埃可尚在地形物附近或草叢裡時，技能持續時間會重置。埃可尚跑向惡徒時會增加跑速。"],["英勇勾索","埃可尚發射鉤索到地形物上，可固定數秒，並借力擺盪。擺盪時，會射擊剛剛傷害過的敵人。"],["因果蓄能彈","鎖定瞄準敵方英雄，在數秒內使武器填充黯霧彈並發射。"]],"n":[["0",""],["8/7/6/5",""],["14/10/6/2",""],["18/16/14/12",""],["65/60/55",""]]},"10101":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/55043dccfd2a0500d8c14320e5af100f71a56d25-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/18b5b9c0648d58101d0bab3e1581a8fc8e0cda5f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3a14f8a3de984b6bc166ac5c6e226af312352626-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a9b3315405982bfefe35f351d9b98ca87a2f38c9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/cb70e4541ed6f48ba2fbd31947dcb02da3328e1c-96x96.jpg"],"ko":[["마법공학 축전기","제이스가 무기를 바꾸면 잠시 동안 이동 속도가 증가합니다."],["하늘로! / 전격 폭발","해머 사용 시: 공중으로 도약해 적들에게 물리 피해를 입히고 이동 속도를 감소시킵니다. 캐논 사용 시: 적을 맞히거나 사거리 끝에 닿으면 폭발하는 전기 구체를 발사해 맞은 적 모두에게 물리 피해를 입힙니다."],["전류 역장 / 초전하","해머 사용 시: 기본 지속 효과: 매 공격 시마다 마나가 회복됩니다. 사용 시: 몇 초 동안 주위 적에게 피해를 입히는 전류 역장을 생성합니다. 캐논 사용 시: 동력이 대폭 증가하여 다음 몇 차례의 공격에 대한 공격 속도가 최대로 증가합니다."],["천둥 강타 / 가속 관문","해머 사용 시: 적에게 마법 피해를 가하고 짧은 거리 만큼 뒤로 밀쳐냅니다. 캐논 사용 시: 가속 관문을 열어, 이 관문을 통과하는 모든 아군 챔피언의 이동 속도를 증가시킵니다. 이 관문을 통해 전격 폭발을 발사할 경우 전기 구체의 이동 속도와 사거리가 증가하며, 피해량 또한 증가합니다."],["머큐리 캐논 / 머큐리 해머","해머 사용 시: 머큐리 해머를 머큐리 캐논으로 변환하여 새로운 스킬을 사용하며 사거리가 늘어납니다. 변환 후 첫 번째 공격은 적의 방어력과 마법 저항력을 감소시킵니다. 캐논 사용 시: 머큐리 캐논을 머큐리 해머로 변환하여 새로운 스킬을 사용하며 방어력과 마법 저항력이 증가합니다. 변환 후 첫 번째 공격은 추가 마법 피해를 입힙니다."]],"en":[["Hextech Capacitor","When Jayce swaps weapons he gains movement speed for a short duration."],["To the Skies! / Shock Blast","Hammer Stance: Leaps to an enemy dealing physical damage and slowing enemies. Cannon Stance: Fires an orb of electricity that detonates upon hitting an enemy (or reaching the end of its path) dealing physical damage to all enemies hit."],["Lightning Field / Hyper Charge","Hammer Stance: Passive: Restores Mana per strike. Active: Creates a field of lightning damaging nearby enemies for several seconds. Cannon Stance: Gains a burst of energy, increasing Attack Speed to maximum for several attacks."],["Thundering Blow / Acceleration Gate","Hammer Stance: Deals magic damage to an enemy and knocks them back a short distance. Cannon Stance: Deploys an Acceleration Gate increasing the Movement Speed of all allied champions who pass through it. If Shock Blast is fired through the gate the missile speed, range, and damage will increase."],["Mercury Cannon / Mercury Hammer","Hammer Stance: Transforms the Mercury Hammer into the Mercury Cannon gaining new abilities and increased range. The first attack in this form reduces the target's Armor and Magic Resist. Cannon Stance: Transforms the Mercury Cannon into the Mercury Hammer gaining new abilities and increasing Armor and Magic Resist. The first attack in this form deals additional magic damage."]],"zh":[["海克斯電容器","杰西切換武器時，會在短時間內增加跑速。"],["浩瀚無垠／電磁脈衝","戰鎚型態：跳向一名敵軍，造成物理傷害並使敵軍緩速。加農型態：發射一枚電球，在接觸敵軍或是抵達射程終點時爆炸，對所有擊中的敵軍造成物理傷害。"],["離子領域／超頻導體","戰鎚型態：被動：每一下普攻都能回復魔力。主動：創造一個閃電力場，在數秒內對鄰近敵軍造成傷害。加農型態：獲得一股能量，接下來數次普攻的攻速大幅提升。"],["風馳電掣／中子加速裝置","戰鎚型態：對一名敵軍造成魔法傷害，並將之擊退一小段距離。加農型態：部署一道中子加速裝置，讓所有通過的友方英雄跑速提升。如果發射電磁脈衝通過裝置，其飛行速度、射程和傷害量都會提升。"],["水星加農／水星戰鎚","戰鎚型態：將水星戰鎚轉換成水星加農，獲得新的技能並提升攻擊距離。此型態的第一下普攻能降低目標的物理防禦和魔法防禦。加農型態：將水星加農轉換成水星戰鎚，獲得新的技能並提升物理防禦和魔法防禦。此型態的第一下普攻能造成額外魔法傷害。"]],"n":[["0",""],["14/12/10/8/6",""],["10",""],["18/16/14/12/10",""],["5",""]]},"10102":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/40d2ff0fadbdcfcdffeb6eba58c89fcdf708d4c9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f2682df49b4155d0144a57f21c8812b0d358e61b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3772fdd8ed3b85c9044ff3edb406bdaba58e2fde-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/452a804bf55ae9b8ea623652ca39c5023a69f39e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/eca38c2679bde1bf6944dd545b4a40b23f9e5e9e-96x96.jpg"],"ko":[["화염의 메아리","우르곳은 기본 공격과 심판의 원으로 다리에서 불꽃을 발사해 물리 피해를 입힙니다."],["부식성 폭약","부식성 폭약을 지정한 위치에 발사하여 물리 피해를 입히고 적중당한 적을 둔화시킵니다."],["심판의 원","우르곳이 둔화된 상태로 주변 적을 사격합니다. 우르곳은 최근 다른 스킬을 적중시킨 적 챔피언을 우선 공격하며, 화염의 메아리를 발동시킬 수 있습니다."],["경멸","우르곳이 한 방향으로 돌진하며 자신에게 보호막을 씌우고 챔피언이 아닌 대상을 밀어냅니다. 적 챔피언과 충돌하면 우르곳이 멈추고 적 챔피언을 자신의 뒤로 던집니다."],["불사의 공포","우르곳이 마공학 송곳 섬광탄을 발사하여 섬광탄이 처음 적중한 적 챔피언에게 꽂힙니다. 해당 챔피언의 체력이 일정 수준 이하로 떨어지면 우르곳이 그를 약자라고 판단하여 처형할 수 있습니다."]],"en":[["Echoing Flames","Urgot's basic attacks and Purge periodically trigger blasts of flame from his legs, dealing physical damage."],["Corrosive Charge","Fires an explosive charge at the target location, dealing physical damage and slowing enemies caught in the explosion."],["Purge","Urgot slows himself while he unloads his weapon on nearby enemies. Prioritizes enemy champions Urgot has recently struck with other abilities and triggers Echoing Flames."],["Disdain","Urgot charges in a direction, shielding himself and trampling non-champion enemies. If he catches an enemy champion, he will stop and hurl them out of his way."],["Fear Beyond Death","Urgot fires a chem-drill that impales the first enemy champion hit. If that champion falls below a health threshold, Urgot judges them weak and can execute them."]],"zh":[["振盪火砲","烏爾加特的普攻及殺戮射擊會定期使他的腳向外噴射出火焰，造成物理傷害。"],["酸性榴彈","朝指定位置發射一枚爆炸榴彈，爆炸後對所有被擊中的敵人造成物理傷害及緩速效果。"],["殺戮射擊","烏爾加特急速射擊鄰近敵人，技能發動期間他的跑速會降低。此技能會優先射擊近期被烏爾加特其他技能擊中的敵方英雄，同時也會觸發振盪火砲。"],["恐怖襲擊","烏爾加特朝任一方向衝刺，賦予自身護盾並踐踏路徑上所有敵方非英雄單位。若抓到敵方英雄，則會停止衝刺，並將該名英雄拋到身後。"],["索命虐殺","烏爾加特發射一個鑽頭，命中首位敵方英雄後會穿刺目標。若目標的生命低於一定值，烏爾加特可以用鎖鏈將他們拖向自己，並立刻處決目標。"]],"n":[["0",""],["9/9/8/8",""],["12/8/4/0",""],["14/13/12/11",""],["60/55/50",""]]},"10103":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/e8edc7324929cb69de2ef5c9179d945efb9ffcfb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d45ce0e35e931ce61ca9dde770e84bbf1e079e9b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/10fefc0f781c89555c85724d998de4ff0980c374-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/75645f8b4542fcb120d0732e80f325ceabc8b286-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/251e1fa529c267da8b9bf3643205ea3a06657cbf-96x96.jpg"],"ko":[["공허석","카사딘이 시야에 있는 적에게 스킬을 사용하면 마법 피해를 감소시키는 보호막을 얻습니다."],["무의 구체","카사딘이 마법 피해를 입히고 적중당한 첫 번째 적을 침묵시키는 구체를 발사합니다."],["황천의 검","카사딘의 다음 기본 공격이 강화되어 사거리가 증가하고 추가 마법 피해를 입히며 적중 시 잃은 마나의 일부를 회복합니다. 황천의 검으로 대상을 처치할 경우 재사용 대기시간이 감소합니다."],["힘의 파동","원뿔 범위 내 모든 적에게 마법 피해를 입히고 둔화시킵니다. 카사딘 주변에서 스킬이 사용되었다면 힘의 파동이 강화되어 피해량과 둔화율이 증가합니다."],["균열 이동","카사딘이 대상 지역으로 순간적으로 이동하면서 주변 적 유닛에게 마법 피해를 입힙니다. 균열 이동 사용 후 일정 시간 내에 해당 스킬을 다시 사용하면 마나를 더 소모해 추가 피해를 입힙니다. (최대 3회)"]],"en":[["Void Stone","When Kassadin casts a spell near a visible enemy champion, he gains a magic shield."],["Null Sphere","Fires an orb that deals magic damage and silences the first enemy hit."],["Nether Blade","Empowers his next basic attack within to gain range and deal bonus magic damage and restore a percentage of missing mana on hit. If Nether Blade kills the target its remaining cooldown is reduced."],["Force Pulse","Deals magic damage to enemies in a cone and slows them. Force Pulse becomes enhanced after other spells are cast nearby, dealing increased magic damage and slowing instead."],["Riftwalk","Blinks to target location and deals magic damage to nearby enemies. Casting Riftwalk causes the next Riftwalk within a certain amount of time to deal more damage and cost double the mana. (Up to 3 times)"]],"zh":[["虛空之石","卡薩丁在可見敵方英雄附近施放技能後，會獲得一個可吸收魔法傷害的護盾。"],["虛無法球","發射能量法球造成魔法傷害，並沉默第一名擊中的敵軍。"],["虛空之刃","卡薩丁的下次普攻會增加攻擊距離，在命中時造成額外魔法傷害，並回復一定比例的已損失魔力。 若虛空之刃擊殺目標，其剩餘冷卻時間會減少。"],["能量脈衝","對錐形範圍內的敵軍造成魔法傷害與緩速。 自身和鄰近單位施放其他技能達一定次數後，此技能會強化，造成更多魔法傷害與更強緩速效果。"],["虛空行走","瞬間傳送到目標地點，並對鄰近敵軍造成魔法傷害。特定時限內此技能可連續施放，每次消耗兩倍魔力並造成更多傷害（最多可再額外施放三次）。"]],"n":[["0",""],["10/9/8/7",""],["10/10/10/10",""],["12/10/8/6",""],["5/3/2",""]]},"10104":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/842434ad82a25eecdf9c8b20f8608efcf76bee7d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8ca0e25878c87ec02760d3e2b418fd6dc6a65f60-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/771365939e576d798f85293763ffd788d2e7353a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/2076b0d2987e9b33f7087bba7151377ba5ed3c8f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/21c0827d15a1b5996cda2f2c1af56fe89949bb0d-96x96.jpg"],"ko":[["무모한 충동","사미라가 마지막으로 맞힌 공격과 다른 기본 공격 또는 스킬을 적중시키면 콤보를 1회 쌓습니다. 근접 공격 사거리 내에 있는 적을 공격하면 추가 마법 피해를 입힙니다. 이동 불가 효과에 영향을 받은 적에게 기본 공격을 가하면 최대 사거리까지 돌진합니다. 해당 적이 공중으로 띄워진 상태라면 사미라도 대상을 잠시 동안 공중으로 띄워 올립니다."],["천부적 재능","사미라가 총을 쏘거나 검을 휘둘러 피해를 입힙니다. 거침없는 질주 도중 사용하면 돌진이 끝난 후 경로 내에 있는 모든 적을 공격합니다."],["원형 검무","사미라가 주변에 검을 휘두르며 적에게 피해를 입히고 적의 투사체를 파괴합니다."],["거침없는 질주","사미라가 적(구조물 포함)을 통과해 돌진합니다. 돌진 도중 통과하는 모든 적을 베고 공격 속도를 얻습니다. 적 챔피언을 처치하면 이 스킬의 재사용 대기시간이 초기화됩니다."],["지옥불 난사","사미라가 무기를 난사해 주변의 모든 적에게 공격을 퍼붓습니다."]],"en":[["Daredevil Impulse","Samira builds a combo by hitting attacks or abilities unique from the previous hit. Samira's attacks in melee range deal additional magic damage. Samira's attacks against enemies affected by Immobilizing effects will dash her to her attack range. If the enemy is Knocked Up, she also keeps them Knocked Up briefly."],["Flair","Samira fires a shot or swings her sword, dealing damage. If cast during Wild Rush, strike all enemies in her path upon completion."],["Blade Whirl","Samira slashes around her, damaging enemies and destroying enemy missiles."],["Wild Rush","Samira dashes through an enemy (including structures), slashing enemies she passes through and gaining Attack Speed. Killing an enemy champion refreshes this ability's cooldown."],["Inferno Trigger","Samira unleashes a torrent of shots from her weapons, wildly shooting all enemies surrounding her."]],"zh":[["敢死風采","煞蜜拉使用不同技能或普攻命中目標時，便會累積Combo。煞蜜拉的普攻在近戰距離會額外造成魔法傷害。若普攻擊中受到硬控場的敵軍，煞蜜拉會直接衝到她的攻擊範圍內；若該敵軍正遭到擊飛，煞蜜拉會短暫延長其擊飛時間。"],["狂戰本能","煞蜜拉進行一次射擊或斬擊，對敵軍造成傷害。若在「狂野突進」期間施放此技能，煞蜜拉便會在衝刺後打擊路徑上的所有敵軍。"],["劍刃風暴","煞蜜拉進行旋轉揮斬，對敵軍造成傷害並破壞進入範圍的飛射物。"],["狂野突進","煞蜜拉衝過一名敵軍（可穿過建築物與地形物），斬擊路徑上的敵軍並增加攻速。擊殺敵方英雄會重置此技能的冷卻時間。"],["地獄火狂襲","煞蜜拉開槍瘋狂連射鄰近敵軍。"]],"n":[["0",""],["6/5/3/2",""],["22/20/18/16",""],["20/17/14/11",""],["6",""]]},"10105":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/bdfed53e63326d4f0db131312fa1ab4fa4eea5d4-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/843166b60b48c2993727b947b9f5405ccff45c08-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/168f470456592a11f7a27b2813414145ef58174d-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/7ee6bbf423eb1efbfef0b10db5f4d1dd1579b6ce-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b8352ce5c0e147b7b7b8af3383208c4319aba584-256x256.png"],"ko":[["방랑자의 부름","바드가 고대의 종을 끌어모아 경험치, 마나, 비전투 시 이동 속도를 얻습니다. 고대의 종을 모을 때마다 바드의 정령이 강화됩니다. 바드가 주기적으로 정령을 소환해 기본 공격을 보조하고 추가 피해를 입히게 합니다. 고대의 종을 충분히 모으면 정령이 광역 피해를 입히고 적중한 적을 둔화시킵니다."],["우주의 결속","바드가 관통하는 투사체를 발사하여 처음 적중한 적에게 피해를 입히고 둔화시킵니다. 관통 후 벽을 맞히면 첫 번째 대상을 기절시키고, 다른 적을 맞히면 두 대상을 모두 기절시킵니다."],["수호자의 성소","바드가 지정한 위치에 체력 회복 성소를 생성해 처음 들어온 아군 챔피언에게 이동 속도, 주문력을 부여하고 체력을 회복시킵니다. 성소의 체력 회복 효율은 짧은 시간에 걸쳐 점차 증가합니다."],["신비한 차원문","바드가 근처 지형에 일방통행 차원문을 엽니다. 아군과 적 챔피언 모두 차원문을 통해 해당 지형을 통과할 수 있습니다."],["운명의 소용돌이","바드가 지정한 지역에 영혼 에너지를 던져, 적중한 모든 챔피언, 미니언, 몬스터, 포탑을 잠시 경직 및 기절시킵니다. 여기에 맞은 적은 지속시간 동안 위치가 드러납니다."]],"en":[["Traveler’s Call","Bard attracts and collects Chimes, granting him XP, Mana, and out-of-combat Move Speed. Every collected Chime buffs Bard’s Meeps. Bard summons Meeps regularly, assisting with his basic attacks and dealing extra magic damage. When Bard has collected enough Chimes, his meeps will also deal damage in an area and slow enemies hit."],["Cosmic Binding","Bard fires a missile which will damage and slow the first enemy struck, and continue onward. If it strikes a wall, it will stun the initial target; if it strikes another enemy, it will stun them both."],["Caretaker’s Shrine","Bard conjures a Health shrine at a target location, granting the first ally champion to enter Move Speed, AP, and Health. The shrine continues growing for a short while, powering up its healing value."],["Magical Journey","Bard opens a portal in nearby terrain. Ally and enemy champions alike can take a one-way trip through that terrain by moving into the portal."],["Tempered Fate","Bard sends spirit energy arcing to a location, putting all champions, minions, monsters, and turrets hit into stasis for a brief time, as well as stunning them. Enemies hit are revealed for the duration."]],"zh":[["旅者引領","巴德能吸引並收集調和之音，賦予自身經驗、魔力，以及脫離戰鬥跑速。收集調和之音能強化巴德的米普。巴德會定期召喚米普，協助他普攻並造成額外魔法傷害。巴德收集足夠的調和之音後，米普會對命中的敵軍造成範圍傷害和緩速效果。"],["宇宙制約","巴德朝指定方向造成衝擊波，傷害並緩速第一位命中的敵軍，且會持續前進。若衝擊波命中牆壁，則暈眩第一個目標；若命中另一位敵軍，則兩者皆被暈眩。"],["守望神龕","巴德於指定地點放置守護神龕，賦予第一位進入的友方英雄跑速、魔攻，以及生命。神龕會持續成長一小段時間，強化其生命回復量。"],["奇幻旅程","巴德於鄰近地形開啟一道傳送門，友方和敵方英雄均可進入該傳送門，單向穿越地形。"],["凝滯命域","巴德朝指定區域發射精靈能量，使所有英雄、士兵、野怪，以及防禦塔在短時間內陷入凝滯及暈眩狀態；期間揭露命中的敵軍。"]],"n":[["0",""],["10/9/8/7",""],["15/14/14/13",""],["19/17/16/14",""],["75/65/55",""]]},"10106":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/23e1c590cbbcb6c0fb1be62a7df2d7bdcd7f39a6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a642b89f20a9e61e863269adb55c6e94c25a4d87-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8ec5a3d616009a36c374832734175faa20f27108-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5db6db12705a809d4d1c0b64ab101adf48636763-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e2a848d5535d17d34e3cd6bb894f613fcbf2eb3d-96x96.jpg"],"ko":[["광전사의 분노","잃은 체력 1%마다 올라프의 공격 속도가 1%씩 증가합니다."],["역류","올라프가 지정한 곳에 도끼를 던져 맞은 적에게 피해를 입히고 이동 속도를 늦춥니다. 올라프가 도끼를 다시 집으면 이 스킬의 재사용 대기시간이 4.5초 감소합니다."],["광포한 공격","올라프의 공격 속도가 상승하며 생명력 흡수를 얻고 잃은 체력에 비례하여 회복량이 증가합니다."],["무모한 강타","올라프가 적에게 돌진해 강력한 공격을 가하여 대상에게 고정 피해를 입힙니다. 대상을 처치하지 못하면 올라프가 고정 피해를 입습니다."],["라그나로크","올라프가 잠시 동안 이동 방해 효과에 면역이 됩니다."]],"en":[["Berserker Rage","Olaf's Attack Speed is increased by 1% for each 1% of his Health he is missing."],["Undertow","Olaf throws an axe into the ground at a target location, dealing damage to enemies it passes through and slowing their Movement Speed. If Olaf picks up the axe, the ability's cooldown is reduced by 4.5 seconds."],["Vicious Strikes","Olaf's Attack Speed is increased, he gains Physical Vamp and has increased healing from all sources based on how much Health he is missing."],["Reckless Swing","Olaf dashes to an enemy and attacks with such force that it deals true damage to his target. If the target does not die, Olaf takes true damage."],["Ragnarok","Olaf temporarily becomes immune to disables."]],"zh":[["狂戰之怒","歐拉夫每損失1%生命，就會增加1%攻速。"],["逆流投擲","歐拉夫向目標區域投擲戰斧，對所有穿過的單位造成傷害並造成緩速。如果歐拉夫撿起斧頭，該技能冷卻時間減少4.5秒。"],["殘暴打擊","歐拉夫增加攻速、獲得普攻吸血效果，並根據已損失的生命增加所受到的治療量（不限來源）。"],["魯莽揮擊","歐拉夫以破釜沉舟之勢衝向敵人，對目標造成真實傷害；若未擊殺目標，則歐拉夫自己得承受真實傷害。"],["諸神黃昏","歐拉夫暫時對限制行動的效果免疫。"]],"n":[["0",""],["7/7/7/7",""],["15/14/13/12",""],["10/9/8/7",""],["60/55/50",""]]},"10107":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/17299554b18651045d3837d5d92a7ed616bae4f7-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/9dc244cc9badaad48afb954320d8a95c24cd8239-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3aca2a84f8315d60a4a03603cd6c544bdb77b2fe-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3f17fcf469571a496230ee7abbc9cd1b9525f578-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d2428cdf3e99a8d83cd6cb37391b5f9fea538838-512x512.jpg"],"ko":[["재빠른 발놀림","시비르가 적 챔피언을 공격할 때 짧은 시간 동안 이동 속도가 대폭 상승합니다."],["부메랑 검","시비르가 십자날 검을 부메랑처럼 던져서 두 번 피해를 입힙니다."],["튕기는 부메랑","시비르의 다음 몇 번의 기본 공격은 공격 속도가 증가하고, 첫 번째 목표물에 적중한 후 주위 적들에게 튕기며, 튕겼을 때는 감소된 피해를 입힙니다."],["주문 방어막","시비르가 마법 보호막을 만들어 자신을 대상으로 한 적 스킬 1개를 막아냅니다. 성공적으로 방어하면 체력을 얻고 일시적으로 이동 속도가 대폭 증가합니다."],["사냥 개시","시비르가 전장에서 아군을 이끌며 잠시 동안 이동 속도를 대폭 상승시킵니다. 또한 시비르의 스킬 재사용 대기시간이 감소합니다. 시비르는 적에게 피해를 입힐 때 사기 중첩을 얻으며 아군에게 이로운 효과를 제공하고 사기 최대 중첩 시 궁극기의 지속시간을 초기화합니다."]],"en":[["Fleet of Foot","Sivir gains a short burst of Move Speed when she attacks an enemy champion."],["Boomerang Blade","Sivir hurls her crossblade like a boomerang, dealing damage each way."],["Ricochet","Sivir's next few basic attacks gain additional attack speed and bounce to nearby targets, dealing reduced damage while bouncing."],["Spell Shield","Creates a magical barrier that blocks a single enemy ability cast on Sivir. She receives health and a burst of movement speed if a spell is blocked."],["On the Hunt","Sivir leads her allies in battle, granting them a burst of move speed for a short time. In addition, her ability cooldowns are reduced. Sivir gains morale when damaging an enemy, granting a buff to allies and refreshing her ultimate at max morale."]],"zh":[["戰鬥動能","希維爾在攻擊一名敵方英雄時會短暫獲得爆發性的跑速。"],["迴旋之刃","希維爾投擲迴旋鏢，對路徑上所有敵人造成傷害。"],["十字彈射","希維爾接下來的數次普攻獲得額外攻速，並會彈射至附近目標身上，彈射時造成的傷害降低。"],["法術護盾","希維爾發出一道魔法屏障抵擋敵方技能，如果成功阻擋一個技能，她可獲得生命與瞬間提升的跑速。"],["狩獵","希維爾帶領友軍衝入戰場，使他們在一段時間內跑速大幅提升。此外，希維爾的技能冷卻時間會減少。 對敵軍造成傷害時可獲得士氣，士氣滿層時，即可強化友軍並刷新大絕。"]],"n":[["0",""],["9/9/8/8",""],["12",""],["22/20/18/16",""],["80/70/60",""]]},"10108":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/19767a64f3d9565b4007a6d99c6838ce9b6f882a-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/fb7edc345203b225ccef075001d065ca64fc3b37-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/94ad5e8334b31eadd300ffb7c4ff4c657817ce17-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/62e1be1679cf0b13ee534fb1282236f769a15e75-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/04d0105a2b7b33abaea90c8669a8fe888c75eb09-512x512.png"],"ko":[["타오르는 힘","밀리오의 스킬에 닿은 아군은 다음 공격으로 큰 추가 피해를 입히고 대상을 불태웁니다."],["초특급 불꽃 킥","적을 밀쳐내는 공을 걷어찹니다. 적중한 공은 위로 날아가 적을 향해 떨어지며 충돌한 영역 주변에 있는 적들에게 피해를 입히고 둔화시킵니다."],["아늑한 모닥불","아군을 회복시키고 공격 사거리를 증가시키는 구역을 만듭니다. 이 구역은 스킬을 사용한 지점에서 가장 가까운 아군을 따라다닙니다."],["따스한 포옹","아군 한 명에게 보호막을 부여해 잠시 동안 이동 속도를 높여줍니다. 이 스킬은 2회까지 충전됩니다."],["생명의 온기","치유의 불꽃을 보내 범위 내 아군의 체력을 회복시키고 군중 제어 효과를 제거합니다."]],"en":[["Fired Up!","Milio's abilities enchant allies on touch, making their next damage deal a burst of extra damage and burn the target."],["Ultra Mega Fire Kick","Kick a ball that knocks back an enemy. The ball launches upward on hit and falls toward the enemy, damaging and slowing enemies in the area upon impact."],["Cozy Campfire","Create an empowering zone that heals allies and increases attack range to those inside. The zone follows the ally nearest to the cast point."],["Warm Hugs","Milio tosses a shield to an ally, temporarily increasing their movement speed. This ability has 2 charges."],["Breath of Life","Milio unleashes a wave of soothing flames that heal and remove crowd control effects from allies in range."]],"zh":[["爐火餘溫","米里歐的技能碰到友軍時會強化他們，使其下次施放技能或普攻時造成額外爆發傷害，並使目標燃燒。"],["究極火焰球","踢出一顆火球，擊退敵軍。火球擊中後會向上彈起並向敵軍掉落，對撞擊範圍內的敵軍造成傷害與緩速效果。"],["舒適營火","召喚營火，治療範圍內的友軍並增加其攻擊距離。營火範圍會跟著離施放點最近的友軍移動。"],["溫暖擁抱","米里歐向一名友軍丟出護盾，並暫時增加友軍的跑速。此技能有2個充能。"],["賦生燄息","米里歐釋放一股療癒之焰，治療範圍內的友軍，並移除友軍受到的控場效果。"]],"n":[["0",""],["10/10/10/10",""],["24/22/20/18",""],["0/0/0/0",""],["100/90/80",""]]},"10109":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/2015c279d3734588e40472b75bf067b50d86b57d-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/08cadccf97eecb00123167bea77d4543e3259729-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/83bc1c59bdafd04646cd9e4e73f6a200ada612ab-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/1f65a7117fdee24a5f0c665d0737f9c8676ab5e6-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/6755f83a30210fc7581499edb7647a8f6ea783de-256x256.png"],"ko":[["냉기의 지배","리산드라 주변의 적 챔피언이 쓰러지면 얼음 노예가 됩니다. 얼음 노예는 주변의 적을 모두 둔화시키고 잠시 후 극도로 차가운 냉기에 의해 폭발하며 마법 피해를 입힙니다."],["얼음 파편","적을 맞히면 부서지는 얼음창을 던져 마법 피해를 입히고 이동 속도를 늦춥니다. 파편들이 대상을 꿰뚫고 나가, 여기에 맞는 다른 적들에게도 동일한 피해를 입힙니다."],["서릿발","주변 적들을 꽁꽁 얼려 마법 피해를 입히면서 발을 묶습니다."],["얼음갈퀴 길","리산드라가 마법 피해를 주는 얼음갈퀴를 생성합니다. 이 스킬을 다시 시전하면 리산드라가 얼음갈퀴의 현재 위치로 순간이동합니다."],["얼음 무덤","적 챔피언에게 시전하면 대상이 꽁꽁 얼면서 기절합니다. 리산드라에게 시전하면 몸을 검은 얼음으로 감싸, 대상으로 지정할 수 없는 무적 상태가 된 채로 자신을 치유합니다. 그 다음 검은 얼음이 대상에게서 번져나가 적들에게 마법 피해를 주며 이동 속도를 늦춥니다."]],"en":[["Iceborn Subjugation","When an enemy champion dies near Lissandra they become a Frozen Thrall. Frozen Thralls slow nearby enemies and then, after a delay, shatter from the intense cold, dealing magic damage to nearby targets."],["Ice Shard","Throws a spear of ice that shatters when it hits an enemy, dealing magic damage and slowing Move Speed. Shards pass through the target, dealing the same damage to other enemies hit."],["Ring of Frost","Freezes nearby enemies in ice, dealing magic damage and rooting them."],["Glacial Path","Lissandra creates an ice claw that deals magic damage. Reactivating this ability transports Lissandra to the claw's current location."],["Frozen Tomb","If cast on an enemy champion, the target is frozen solid, stunning it. If cast on Lissandra, she encases herself in dark ice, healing herself while becoming untargetable and invulnerable. Dark ice then emanates from the target dealing magic damage to enemies and slowing Move Speed."]],"zh":[["寒霜霸權","敵方英雄在麗珊卓附近死亡時，會變成冰霜奴魔。冰霜奴魔會緩速鄰近敵軍並在延遲後粉碎，對附近目標造成魔法傷害。"],["幽影碎冰","麗珊卓投射出冰晶，當命中敵人時立即爆裂化為碎片，造成魔法傷害和降低目標的跑速。擊中第一個目標之後，部分的碎晶會穿透過去，對範圍內的其他敵人造成相同傷害。"],["暴雪結界","凍結四周的敵人，對範圍內的鄰近敵軍造成魔法傷害和定身效果。"],["急速冰刺","麗珊卓創造一波冰刺造成魔法傷害，再次使用該技能時可以讓麗珊卓瞬間傳送到冰刺當下的位置。"],["永凍墳地","如果施放的對象是敵方英雄，目標會遭到凍結並無法動彈。如果對象是麗珊卓本人，她會被黑暗冰晶包圍，這段期間麗珊卓會回復自身生命，此外，她將處於無敵狀態並無法被指定為攻擊目標。接著黑暗冰晶會向四周射出，對範圍內敵人造成魔法傷害和緩速效果。"]],"n":[["0",""],["7/6/5/4",""],["11/10/9/8",""],["20/17/14/11",""],["80/70/60",""]]},"10110":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/4ac81c154694c81a7df934e9a53956ad7ebaf683-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/4d26e193295b0a4d596edba5ec697afd8e01498e-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d16e24a94abb4793b1ba1481f3ea7166f561e01e-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/139235899b0a57dd87b9cdfe64a9f3929075b5dc-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1564a9f4cf196fb021278a874aafbadaa704fd24-800x800.png"],"ko":[["이케시아식 마무리","코그모는 사망한 후에도 잠시 움직일 수 있습니다. 그동안 이동 속도를 얻고, 지속시간이 종료되면 폭발하여 주변 적에게 고정 피해를 입힙니다."],["부식성 침","코그모가 부식성 침을 발사하여 적에게 마법 피해를 입히고 대상의 방어력과 마법 저항력을 잠시 감소시킵니다."],["생체마법 폭격","코그모의 기본 공격이 강화되어, 사거리가 증가하고 대상의 최대 체력에 비례하는 마법 피해를 입힙니다."],["공허의 분비물","코그모가 지정한 방향으로 분비물을 뱉어, 지나가는 적에게 피해를 입히고 둔화시키는 흔적을 남깁니다."],["살아있는 곡사포","기본 지속 효과: 코그모가 공격 속도를 얻습니다.\\n사용 시: 코그모가 목표 지점에 산성 액체를 발사해 적중한 적에게 마법 피해를 입히고 위치를 드러냅니다. 체력이 낮은 적은 추가 피해를 받습니다. 살아있는 곡사포는 짧은 시간 동안 여러 차례 사용하면 마나 소모량이 증가합니다."]],"en":[["Icathian Surprise","Upon death, Kog’Maw continues moving, gaining Move Speed for a brief time. After a short period Kog’Maw explodes, dealing True Damage to nearby enemies."],["Caustic Spittle","Kog'Maw launches a corrosive projectile which deals Magic Damage and weakens the target's Armor and Magic Resist for a short time."],["Bio-arcane Barrage","Kog'Maw's basic attacks gain range and deal a percent of the target's maximum Health as Magic Damage."],["Void Ooze","Kog'Maw launches ooze in target direction damaging all enemies it passes through and leaves a trail slowing enemies."],["Living Artillery","Passive: Kog’Maw gains Attack Speed. Kog'Maw fires acid in area dealing Magic Damage to and revealing enemies hit. Damage is increased when targeting low Health enemies. Additionally, multiple Living Artilleries in a short period of time cause them to cost additional Mana."]],"zh":[["來自伊卡西亞的驚喜","死亡時，寇格魔能繼續移動，並在短時間內獲得跑速。接著寇格魔會爆炸，對鄰近敵軍造成真實傷害。"],["腐蝕唾液","寇格魔發射一團腐蝕性的唾沫，造成魔法傷害並在數秒內減弱目標的雙防。"],["生化彈幕","寇格魔的普攻射程提升，並能造成目標最大生命值一定比例的魔法傷害。"],["虛空淤泥","寇格魔朝目標方向拋射出一團分泌物，對穿過的所有敵軍造成傷害，且會留下緩速敵軍的軌跡。"],["生化巨炮","被動：寇格魔攻速增加。\\n寇格魔向目標區域射出酸液，造成魔法傷害並揭露遭命中敵軍的位置。若目標為低生命值敵軍，則造成更多傷害。此外，短時間內連續使用「生化巨炮」，將消耗額外的魔力。"]],"n":[["0",""],["6",""],["16",""],["11/11/11/11",""],["2/1/1",""]]},"10112":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/615ecd9e9f576fd330756bd380934d9bc2b65a1b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/6285bb59b7abe7561f222c8b819113225e917864-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3a7fa9f660cd112bd587aa22d3aa3252f4329e79-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/0906295e23c34a119e27fbd5c95d2455395672fa-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/801861e397d864a0686e720ff209bd810886aa2c-96x96.jpg"],"ko":[["헤드샷","케이틀린은 덫 또는 투망에 걸린 대상을 공격할 때나 일정 횟수 이상의 기본 공격을 했을 때 헤드샷을 발사하여 치명타 확률에 비례한 추가 피해를 입힙니다. 덫에 걸리거나 투망에 맞은 대상에게는 케이틀린의 헤드샷 공격 사거리가 두 배가 됩니다."],["필트오버 피스메이커","케이틀린이 소총을 1초 동안 조준한 후 관통하는 탄환을 발사하여 물리 피해를 입힙니다. (다음 명중하는 대상에게는 더 낮은 피해가 들어갑니다.)"],["요들잡이 덫","케이틀린이 요들을 잡기 위한 함정을 설치합니다. 함정이 발동하면 함정에 걸린 적 챔피언은 1.5초간 모습이 드러나며 이동할 수 없게 되고, 케이틀린의 헤드샷이 강화됩니다."],["90구경 투망","케이틀린이 무거운 그물을 발사하여 적을 느리게 합니다. 그 반동으로 케이틀린은 뒤로 밀려납니다."],["비장의 한 발","케이틀린이 공을 들인 완벽한 사격을 하여 먼 거리에서 하나의 대상에게 큰 피해를 입힙니다. 적 챔피언이 자신의 아군을 위해 총알을 막아낼 수 있습니다."]],"en":[["Headshot","Every few basic attacks, or against a target she has trapped or netted, Caitlyn will fire a headshot dealing bonus damage that scales with her critical strike chance. On trapped or netted targets, Caitlyn's Headshot attack range is doubled."],["Piltover Peacemaker","Caitlyn revs up her rifle for 1 second to unleash a penetrating shot that deals physical damage (deals less damage to subsequent targets)."],["Yordle Snap Trap","Caitlyn sets a trap to find sneaky yordles. When sprung, the trap reveals and immobilizes the enemy champion for brief period, granting Caitlyn an empowered Headshot."],["90 Caliber Net","Caitlyn fires a heavy net to slow her target. The recoil knocks Caitlyn back."],["Ace in the Hole","Caitlyn takes time to line up the perfect shot, dealing massive damage to a single target at a huge range. Enemy champions can intercept the bullet for their ally."]],"zh":[["爆頭","每幾次基本攻擊，或攻擊踩到陷阱、被獵網命中的敵人，凱特琳就可以造成爆頭，額外傷害隨暴擊率成長。對踩到陷阱或被獵網命中的敵人，凱特琳的爆頭距離變為兩倍。"],["鎮暴射擊","凱特琳瞄準後 1 秒發射穿透性射擊，造成物理傷害。（穿透後傷害衰減)。"],["捕獲陷阱","凱特琳設置陷阱來捕捉狡猾的約德爾人，對所有英雄有效。敵人踩到時將被硬控場 1.5 秒，並且暴露出他的位置一小段時間。"],["九零式獵網","凱特琳發射很重的鐵網來緩速目標。強大的後座力會讓凱特琳往後退。"],["王牌射手","凱特琳花費時間準備一發完美射擊，可對遠距離的單一目標造成物理傷害。敵方英雄可為他的盟友攔截下子彈。"]],"n":[["0",""],["9/8/7/6",""],["0/0/0/0",""],["16/14/12/10",""],["65/55/45",""]]},"10116":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8aaa806a008b0509f0bbe829e0061e06d19decce-512x512.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f7e942acf1aa3ce8cb7dd2c2ab5e1d05ef16c073-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cd057c9c4edd983b563285c60ba5367d5136156d-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cdeab99b74c5bca3cfe61b220fe2228212714cb9-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d4a77ee03a740b6aa4119798714823fdaa9ec9a1-512x512.png"],"ko":[["갑옷 파쇄","렐의 기본 공격과 스킬은 적중 시 마법 피해를 추가로 입히고, 적 챔피언의 방어력과 마법 저항력을 훔칩니다. 이 효과는 추가로 적중하면 지속시간이 초기화되며, 5회까지 중첩됩니다."],["파열의 일격","렐이 창을 찔러 적중한 적에게 마법 피해를 입히고, 보호막을 파괴하며, 기절시킵니다."],["철마술: 붕괴","탑승 상태 기본 지속 효과: 렐이 이동 속도를 얻습니다. 사용 시: 렐이 탈것에서 뛰어내리며 지정한 위치로 도약해, 적을 공중에 띄우고 보호막을 얻습니다. 중갑 상태 기본 지속 효과: 렐이 방어력, 마법 저항력, 공격 속도, 공격 사거리를 얻지만 느려집니다. 사용 시: 렐이 탈것에 오르며 점차 감소하는 이동 속도를 얻고, 다음 기본 공격 시 적을 공중에 띄웁니다."],["전속력","렐이 자신과 아군에게 이동 속도를 부여합니다. 적이나 서로를 향해 이동하면 효과가 2배로 증가합니다. 렐의 다음 기본 공격 또는 파열의 일격이 폭발을 일으켜 마법 피해를 입힙니다."],["자기 폭풍","렐이 자기 폭발을 일으켜 주변 적을 자신 쪽으로 끌어당깁니다. 계속해서 근처의 적 챔피언을 끌어당기며 마법 피해를 입힙니다."]],"en":[["Break the Mold","Rell's Basic Attacks and Abilities deal additional Magic Damage and steal Enemy Champion’s Armor and Magic Resist on hit. Refreshes on subsequent hits and stacks up to 5 times. Basic attacks deal Bonus Magic Damage."],["Shattering Strike","Rell throws her lance, dealing Magic Damage to enemies hit, breaking Enemy Shields and stunning them."],["Ferromancy: Crashdown","Mounted Passive: Rell gains Move Speed. Active: Rell dismounts, leaping towards target location, knocking enemies up and gains a Shield. Dismounted Passive: While dismounted, Rell gains Armor, Magic Resist, Attack Speed, and Attack Range, but is slowed. Active: Rell forms her Mount, gaining a burst of speed and her next basic attack knocks up enemies hit."],["Full Tilt","Rells grants herself and ally Move Speed, doubled toward enemies and each other. Her next Basic Attack or Shattering Strike explodes, dealing Magic Damage."],["Magnet Storm","Rell explodes in a magnetic fury, pulling nearby enemies toward herself. Rell continues pulling in nearby enemy champions, dealing Magic Damage."]],"zh":[["破鑄者","銳兒的普攻與技能在命中時會造成額外魔法傷害，並偷取敵方英雄的雙防。連續命中將刷新效果，最多累加五次。普攻造成額外魔法傷害。"],["鐵碎之擊","銳兒投擲長槍，對命中的敵軍造成魔法傷害，打破其護盾並造成暈眩。"],["馭鐵之術：解構","騎乘狀態 被動：銳兒增加跑速。 主動：銳兒穿上重甲，躍向目標地點，將敵軍擊飛並獲得護盾。 重甲型態 被動：在重甲型態下會增加雙防、攻速與攻擊距離，但移動速度變慢。 主動：銳兒建構她的坐騎，獲得爆發性的跑速並擊飛下一次普攻命中的敵軍。"],["全速突進","銳兒賦予自身與友軍跑速，向敵軍或彼此移動時效果倍增。下一次普攻或「鐵碎之擊」會產生爆炸，造成魔法傷害。"],["磁能風暴","銳兒爆發出磁能之怒，將鄰近敵軍拉向自身。之後持續將鄰近敵方英雄拉向自身，造成魔法傷害。"]],"n":[["0",""],["11/10/9/8",""],["9/9/9/9",""],["13/13/13/13",""],["75/70/65",""]]},"10117":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/326e7f2d1d5060f1181e6719d859db739e7d3fdb-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c37f7109f557ebbb3a51ec897467f429a08491ba-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/735d32aee2455bd6537970890ccca2e93620a6f5-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/fa8ab350919f20376c02f1935fc6c7de47898e91-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/226a5dbf56591d6b314401b81f8c5b0f085a7423-256x256.png"],"ko":[["진동의 가닥","스카너의 기본 공격, 부서진 대지, 지반 돌출, 꿰뚫기가 전율을 적용합니다. 전율이 최대 중첩된 적은 그 지속시간 동안 최대 체력에 비례하는 마법 피해를 받습니다."],["부서진 대지/지반 돌출","스카너가 지면에서 바위를 뜯어내 기본 공격을 강화합니다. 바위는 강력한 투사체로 던질 수 있습니다."],["대지의 수호자","스카너가 보호막을 얻고, 지진을 일으켜 그 충격파로 적에게 피해를 입히고 둔화시킵니다."],["이쉬탈의 격돌","스카너가 지형을 무시하며 전방으로 돌진합니다. 챔피언이나 대형 몬스터와 닿으면 대상을 끌고 다니다가, 다음에 충돌하는 벽에 내동댕이쳐 피해를 입히고 기절시킵니다."],["꿰뚫기","스카너가 꼬리를 앞으로 휘둘러 적 챔피언에게 피해를 입히고 제압합니다. 제압당한 대상은 스카너를 따라 끌려다닙니다. 적 챔피언을 맞힌 경우 스카너가 이동 속도를 얻습니다. 부서진 대지가 활성화 중이라면 지반 돌출을 먼저 사용합니다."]],"en":[["Threads of Vibration","Skarner's Attacks, Shattered Earth, Upheaval, and Impale, apply Quaking. At max stacks of Quaking, enemies take max Health magic damage over its duration."],["Shattered Earth/upheaval","Skarner rips a boulder from the earth that empowers his attacks and can be thrown as a powerful projectile."],["Seismic Bastion","Skarner gains a shield and creates an earthquake whose shockwave damages and slows foes."],["Ixtal's Impact","Skarner charges forward and passes through terrain. If he collides with a champion or large monster, he'll slam them into the next wall he hits to damage and stun them."],["Impale","Skarner's tails lash forward to damage and suppress enemy champions. Suppressed victims will be dragged along by Skarner as he moves around. If Skarner hits at least one champion, he gains Move Speed. If Shattered Earth is active, Skarner will first cast Upheaval."]],"zh":[["震動餘波","史加納的普攻、「翻天覆地」、「尖岩飛彈」及「蠍尾穿刺」，會附加顫抖。堆滿顫抖時，敵軍會在持續期間受到根據最大生命的魔法傷害。"],["翻天覆地/尖岩飛彈","史加納從地表揚起巨石，強化自身的普攻，並且可以擲出造成大量傷害。"],["壁壘波動","史加納獲得護盾，並引發地震，震波會對敵軍造成傷害和緩速效果。"],["伊克斯塔爾衝擊","史加納衝刺，可穿越地形障礙。如果在衝刺過程中撞上英雄或大型野怪，則會將其重重撞上之後的牆面，造成傷害與暈眩。"],["蠍尾穿刺","史加納的尾巴向前一刺，傷害並壓制敵方英雄，移動時將之四處拖行。史加納若命中至少一名英雄，則會增加跑速。如果「翻天覆地」處於啟動狀態，史加納會先施放「尖岩飛彈」。"]],"n":[["0",""],["6/5/4/3",""],["8/7/6/5",""],["18/16/14/12",""],["80/70/60",""]]},"10118":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4eacd53a66c7aa39d36d338ba0decdfb08d49250-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b25bf4be48983c15c7ce7edccea858f687affadb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1f2f92cbb03feb22b98e11c5a21c0f50459b62f9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/792c164709502909fec11b85d7275c05fc9ed125-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2350f87cc35c800902c8e40ebe288f679c2d4823-96x96.jpg"],"ko":[["기 보호막","스킬을 사용하면 쉔이 보호막을 얻습니다. 다른 챔피언에게 스킬로 영향을 주면 이 효과의 재사용 대기시간이 감소합니다."],["황혼 강습","쉔이 기의 검을 불러들여 공격해 대상의 최대 체력에 비례한 피해를 입힙니다. 기의 검이 적 챔피언과 충돌하면 쉔의 기본 공격이 크게 강화되며, 기의 검에 부딪힌 적들은 쉔으로부터 달아날 때 둔화됩니다."],["의지의 결계","쉔이 기의 검을 아군에게 보내 적의 기본 공격을 막아주는 구역을 생성합니다."],["그림자 돌진","쉔이 지정한 방향으로 돌진해, 경로상의 적들을 도발합니다."],["단결된 의지","쉔이 아군 챔피언에게 보호막을 씌워 대상이 받는 피해를 흡수하고 잠시 후 대상에게 순간이동합니다."]],"en":[["Ki Barrier","After casting a spell, Shen gets a shield. Affecting other champions reduces the cooldown of this effect."],["Twilight Assault","Shen recalls his spirit blade to attack with it, dealing damage based on the target's max health. The attacks are greatly empowered if it collides with an enemy champion, and all collided enemies are slowed while running away from Shen."],["Spirit's Refuge","Shen sends his spirit blade to an ally, creating a zone that blocks enemy attacks."],["Shadow Dash","Shen dashes in a direction, taunting enemies in his path"],["Stand United","Shen shields target allied champion from incoming damage, and soon after teleports to their location."]],"zh":[["凝氣盾","慎每次施放技能後皆會獲得一個護盾；若其技能影響到其他英雄，則會減少此效果的冷卻時間。"],["暮光強襲","慎召回靈氣利刃，強化接下來的普攻，根據目標最大生命造成傷害。如果召回過程中靈氣利刃與敵方英雄接觸，則會提升強化普攻效果，且所有接觸到的敵軍在跑離慎時會受到緩速。"],["靈氣庇護","慎命令靈氣利刃飛往友方英雄，並產生一個可以擋下敵軍普攻的防護罩。"],["影襲","慎朝目標方向衝刺，嘲諷路徑上的敵軍。"],["並肩作戰","慎開始詠唱技能並賦予友方英雄護盾，在詠唱完成後隨即傳送到該友軍的位置。"]],"n":[["10",""],["8/7/6/5","75/70/65/60"],["18/16/14/12","20/20/20/20"],["16/14/12/10","75/75/75/75"],["110/100/90",""]]},"10119":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/9082ae5399375300780db93e5d7b8a601ea77b81-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f2d9a1bef4999fc8945cd1b9dc545f5b94d00589-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c0ac793df4ab276fabf7a2162d0cfcb2383814bf-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bc2754465a07dbc07cb99d7df8b8f8644c4f448d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/11aef3994f7aae05e4a5dc3e94e7ed9ac535abeb-96x96.jpg"],"ko":[["불길","브랜드의 스킬이 대상을 불길로 휘감아, 1초 동안 피해를 줍니다. 불길은 두 번까지 중첩되며, 적이 불타는 동안 브랜드가 적을 처치하면 마나를 회복합니다. 챔피언이나 대형 몬스터에 불길이 두 번 중첩되면 불안정해져 3초 후 폭발하고, 근처 적에게 스킬 효과를 적용하며 막대한 피해를 입힙니다."],["불태우기","브랜드가 적에게 처음 적중하면 멈추는 불덩이를 발사해 피해를 입히고 기본 지속 효과의 중첩을 적용합니다. 대상이 기본 지속 효과의 영향을 받는 상태라면 잠시 기절합니다."],["화염 기둥","잠시 후 목표 지점에 화염 기둥을 생성하여 해당 지역에 있는 적 유닛에게 마법 피해를 입힙니다."],["발화","브랜드가 목표에 강력한 폭발을 일으켜 마법 피해를 입힙니다. 폭발은 주변 적들에게 퍼집니다. 대상이 불타는 상태라면 발화의 전파 범위가 두 배가 됩니다."],["파멸의 불덩이","브랜드가 대상에게 날아가는 불덩이를 발사해 피해를 입히고 기본 지속 효과의 중첩을 적용합니다. 불덩이는 근처 대상에게 튕깁니다. 브랜드는 피해를 입지 않습니다."]],"en":[["Blaze","Brand's spells light his targets ablaze, dealing damage over 1 seconds, stacking up to 2 times. If Brand kills an enemy while it is ablaze he regains mana. When Blaze reaches max stacks on a Champion or large monster, it becomes unstable. It detonates in 3 seconds, applying spell effects and dealing massive damage in an area around the victim."],["Sear","Launches a projectile that stops on the first enemy hit, dealing damage and applying a stack of Brand’s passive. If the target was previously afflicted by Brand’s passive they are also briefly stunned."],["Pillar of Flame","After a short delay, Brand creates a Pillar of Flame at a target area, dealing magic damage to enemy units within the area."],["Conflagration","Brand conjures a powerful blast at his target that spreads to nearby enemies, dealing magic damage. If the target is ablaze, Conflagration's spread is doubled."],["Pyroclasm","Launches a projectile that travels to the target, dealing damage and applying a stack of Brand’s passive. The projectile will then bounce to a nearby target. Does not damage Brand."]],"zh":[["烈炎鐵血","布蘭德的技能會附加烈炎標記，使目標在1秒內受到持續傷害，最多可疊加2層；擊殺帶有烈炎標記的敵軍時，布蘭德會回復魔力。敵方英雄或大型野怪身上疊滿烈炎標記時，會在3秒後爆炸，對周圍敵軍施加技能效果並造成大量傷害。"],["火焰烙印","發射一團火球，造成傷害並附加一層烈炎標記；只能擊中一名敵軍，不會彈跳。若目標原先身上已經帶有烈炎標記，則還會暫時受到暈眩。"],["煉獄風暴","短暫延遲後，在目標區域召喚煉獄風暴，對範圍內的敵軍單位造成魔法傷害。"],["天火燎原","布蘭德召喚強烈的天火燒灼目標，並延燒到鄰近敵軍，造成魔法傷害。若目標原先身上已經帶有烈炎標記，則延燒的數量翻倍。"],["末日熔岩","向目標發射一團岩漿，造成傷害並施加一層烈炎標記，隨後會彈跳到鄰近敵軍身上。此技能不會傷害布蘭德自己。"]],"n":[["0",""],["7/7/6/6",""],["9/9/8/8",""],["11/10/9/8",""],["70/65/60",""]]},"10120":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/f9fe3f8b98bde4f52a1c713055681ba175d58a5c-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/1c617c652a581ec99405240226ca677467b6cb5d-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/e5f020d67d7861a00eb7146673a858d05c2bae93-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/2c965de8330fe73c80088eec10762fcf121ab8a9-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/2539d88abcace84ef274d79c15dd660b7af491c2-512x512.png"],"ko":[["페트리사이트 폭발","사일러스는 스킬 사용 시 충전을 1회씩, 최대 3회 얻습니다. 이후 기본 공격을 가하면 충전량을 1회 소모해 사슬을 휘둘러, 적중한 적에게 추가 마법 피해를 입힙니다. 충전을 보유 중일 때는 공격 속도를 얻습니다."],["사슬 후려치기","사일러스가 사슬을 휘둘러, 적에게 피해를 입히고 둔화시킵니다. 잠시 후 사슬이 교차한 지점에서 폭발이 일어나 마법 피해를 입힙니다."],["국왕시해자","사일러스가 마법의 힘으로 적에게 돌진해 마법 피해를 입힙니다. 챔피언에게 사용하면 체력을 회복합니다."],["도주/억압","사일러스가 지정한 위치로 돌진한 뒤 재사용을 준비합니다. 스킬을 다시 사용하면 사슬을 던져, 처음 적중한 적을 향해 이동하며 피해를 입힙니다."],["강탈","사일러스가 적 챔피언의 궁극기를 강탈해 자유롭게 사용합니다."]],"en":[["Petricite Burst","After using an ability, Sylas stores a charge, stacking up to three. Sylas’ basic attacks expend a charge, whirling his chains and dealing bonus magic damage to enemies hit. If Sylas has at least one charge, he gains attack speed."],["Chain Lash","Sylas lashes out with his chains, dealing damage and slowing enemies. After a delay, energy explodes from the chains’ intersection point, dealing magic damage."],["Kingslayer","Sylas lunges at an enemy with magical force, dealing magic damage and healing himself against enemy champions."],["Abscond/abduct","Sylas dashes to a location and prepares a recast. He can recast the ability, throwing his chains out, pulling himself to the first enemy hit, and dealing damage."],["Hijack","Sylas hijacks an enemy champion, stealing their ultimate ability to use freely."]],"zh":[["反魔法英石衝擊","在施放一項技能後，賽勒斯會儲存一層充能，最多3層。賽勒斯普攻時，會消耗一層充能，向四周揮舞鎖鍊，對命中的敵軍造成額外魔法傷害。擁有至少1層充能時，賽勒斯獲得攻速。"],["鍊斬","賽勒斯揮動鎖鍊，對敵軍造成傷害與緩速。短暫延遲後，能量會從鎖鍊的交叉處引爆並造成魔法傷害。"],["弒君之道","賽勒斯挾帶著強大的魔法力量衝向敵軍，造成魔法傷害並在目標為敵方英雄時治療自己。"],["逆罪突進／罪獄鍊罰","賽勒斯衝向指定位置並準備重施技能。他可以重施技能來擲出鎖鍊，將自己拉向第一個命中的敵軍，並造成傷害。"],["盜技禁鍊","賽勒斯劫持一名敵方英雄，竊取其大絕，可以自由施放。"]],"n":[["0",""],["9/8/7/6",""],["12/10/8/6",""],["12/11/10/9",""],["80/55/30",""]]},"10121":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/50cde43c4dde7c120dde8114d412ffffcc47eeb2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/025145e9ab470726f4fb521ca7f1aeb021477dbd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b36c17227b52720b83667d8f9b43c22e28d1c96d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/864ca9d31eb0c52b173b44d9824bf0ec5ca10d98-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a1346ef84d7d13e33b7d48be3b9efeab95aa2c0e-96x96.jpg"],"ko":[["분노의 지배","레넥톤이 기본 공격 시 분노를 생성합니다. 레넥톤의 체력이 낮으면 생성되는 분노가 증가합니다. 분노는 레넥톤의 스킬을 강화하며 추가 효과를 줍니다."],["양떼 도륙","레넥톤이 검을 휘둘러 주변의 모든 적에게 어느 정도의 물리 피해를 입히고, 입힌 피해량의 일부를 체력으로 회복합니다. 분노가 50이상일 경우 피해량과 치유량이 상승합니다."],["무자비한 포식자","레넥톤이 대상을 두 번 베어 어느 정도의 물리 피해를 입히고 기절시킵니다. 분노가 50 이상일 경우 적을 세 번 베어 높은 물리 피해를 입히고 더 오래 기절시킵니다."],["자르고 토막내기","레넥톤이 돌진하여 경로상에 있는 적 유닛에게 피해를 입힙니다. 강화 시 적중한 유닛에게 추가 피해를 입히고 방어력을 낮춥니다."],["강신","레넥톤이 폭군의 형상을 취하여 추가 체력을 얻고 주변 적에게 피해를 입힙니다. 폭군 형태로 있는 동안에는 레넥톤의 분노가 주기적으로 상승합니다."]],"en":[["Reign of Anger","Renekton's attacks generate Fury, increased when he is low on life. This Fury can empower his abilities with bonus effects."],["Cull the Meek","Renekton swings his blade, dealing moderate physical damage to all targets around him, and heals for a small portion of the damage dealt. If he has more than 50 Fury, his damage and heal are increased."],["Ruthless Predator","Renekton slashes his target twice, dealing moderate physical damage and a stun. If Renekton has more than 50 Fury, he slashes his target three times, dealing high physical damage, and stunning for longer."],["Slice and Dice","Renekton dashes, dealing damage to units along the way. Empowered, Renekton deals bonus damage and reduces the Armor of units hit."],["Dominus","Renekton transforms into the Tyrant form, gaining bonus Health and dealing damage to enemies around him. While in this form, Renekton gains Fury periodically."]],"zh":[["怒不可遏","雷尼克頓的普攻可產生怒氣值，生命低於一定比利時會產生更多；怒氣能夠強化他的技能，獲得額外效果。"],["弱肉強食","雷尼克頓揮動大劍，對所有鄰近敵人造成中等物理傷害，同時回復造成傷害的部分生命。當怒氣值超過50時，會增加所造成的傷害與回血量。"],["庖丁解牛","雷尼克頓狂斬目標2次，造成中等物理傷害並暈眩敵軍。當怒氣值超過50時，則改為狂斬目標3次，造成重度物理傷害，並暈眩敵軍更久。"],["大切八塊","雷尼克頓向前衝刺，對路徑上的敵人造成傷害。受到怒氣強化後，雷尼克頓可以造成額外傷害，並降低被擊中單位的物理防禦。"],["君臨天下","雷尼克頓進入暴君型態，增加生命並對鄰近敵人造成傷害。在暴君型態時，每秒會固定產生怒氣。"]],"n":[["0",""],["7",""],["14/12/10/8",""],["14/13/11/10",""],["75/70/65",""]]},"10122":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/6e5ce73c9475b9de8aaa235199189aae1873aa9d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/cb7656cc9a81bfd94034f191c2b3ce3a306d496c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e5b91bb24bb81dd43d9967771e4af00831037f34-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7d9274b70e74b6c293accf72bc60301de83fb22c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/303c7c779ee994f8ded506c526091ee57704a416-96x96.jpg"],"ko":[["극악무도","베이가가 적 챔피언을 적중시키면 기본 지속 효과 중첩을 얻습니다."],["사악한 일격","베이가가 어둠의 에너지를 발사하여 처음 맞은 적 둘에게 마법 피해를 입힙니다. 이 스킬로 적 유닛을 처치하면 베이가의 주문력이 영구적으로 상승합니다."],["암흑 물질","베이가가 지정한 위치에 하늘에서 거대한 암흑 물질을 떨어뜨려 마법 피해를 입힙니다. 극악 중첩이 쌓이면 암흑 물질의 재사용 대기시간이 감소합니다."],["사건의 지평선","베이가가 공간의 가장자리를 왜곡해 지나가는 적을 기절시키는 감옥을 생성합니다."],["태초의 폭발","적 챔피언을 맞춰 매우 큰 마법 피해를 입힙니다. 피해량은 대상의 잃은 체력에 비례해 증가합니다."]],"en":[["Phenomenal Evil Power","Veigar now gains passive stacks by hitting enemy champions once again."],["Baleful Strike","Veigar unleashes a bolt of dark energy that deals magic damage to the first two enemies hit. Units killed by this bolt grant Veigar some ability power permanently."],["Dark Matter","Veigar calls a great mass of dark matter to fall from the sky to the target location, dealing magic damage when it lands. Stacks of Phenomenal Evil reduce Dark Matter's cooldown."],["Event Horizon","Veigar twists the edges of space, creating a cage that Stuns enemies that pass through."],["Primordial Burst","Blasts target enemy champion, dealing a large amount of magic damage, increasing based on the target's missing health."]],"zh":[["極度邪惡能量","維迦現在用技能重複命中敵方英雄也可獲得被動疊層。"],["黑暗祭祀","維迦釋放一道黑暗能量鍊，對前兩個擊中的敵軍造成魔法傷害。擊殺敵軍將永久提高維迦的魔法攻擊。"],["黑暗物質","維迦從天際召喚一大團黑暗物質轟擊目標區域，對範圍內的敵軍造成魔法傷害。極度邪惡疊層會減少黑暗物質的冷卻時間。"],["扭曲空間","維迦扭曲空間的邊界，創造一個牢籠，通過的敵軍會被暈眩。"],["能量爆裂","使用爆裂能量攻擊目標敵方英雄，造成大量魔法傷害，且傷害會根據目標已損失的生命增加。"]],"n":[["0",""],["5/5/4/4",""],["8/8/8/8",""],["18/17/16/15",""],["60/55/50",""]]},"10123":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9ac91a90f05f8d354954189671465257169c3913-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/12b639877795378586b33440f20f07f0a033ee6c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e6f14dc1e07f1b91e6d8bce4a95503ddb10d7d8e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/79125f040057878feebd3b2835dd3068f1fa0614-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2d3057c56896eb827665aca01e377091c8c24e15-96x96.jpg"],"ko":[["면죄","세나 근처에서 유닛이 쓰러지면 그 영혼이 주기적으로 검은 안개에 갇히게 됩니다. 세나는 해당 영혼을 공격하여 영혼을 죽음 속에 가둔 안개를 흡수하고 영혼을 해방시킬 수 있습니다. 안개는 세나의 유물포를 강화시켜 추가 공격력, 공격 사거리, 치명타 확률을 부여합니다. 세나의 유물포 공격 속도가 느려지고 추가 피해를 입히며 잠시 공격 대상의 이동 속도를 일부 흡수합니다."],["꿰뚫는 어둠","꿰뚫는 어둠의 사용 범위는 세나의 공격 사거리와 같으며 시전 시간은 공격 속도에 비례해 감소합니다. 무엇이든 대상으로 지정할 수 있으며, 적 챔피언을 맞히면 적중 시 효과를 적용합니다."],["마지막 포옹","세나가 검은 안개의 파동을 방출합니다. 검은 안개가 적에게 적중하면 맹렬히 달라붙어 잠시 후 해당 적과 주변의 모든 적을 속박합니다."],["검은 안개의 저주","세나가 어둠을 받아들이고 망령이 되어 무기에 흡수된 검은 안개를 폭풍으로 만듭니다. 폭풍 속에 들어간 아군은 위장 상태가 되며 세나처럼 망령이 됩니다. 망령이 되면 추가 이동 속도를 얻고 대상으로 지정할 수 없는 상태가 되며 정체를 숨길 수 있습니다."],["여명의 그림자","세나가 쓰러진 감시자들의 유물석으로부터 힘을 빌려 유물포를 해체한 후 신성한 빛과 그림자로 변형시킵니다. 그리고 전장을 가득 채우는 광선을 쏘아 아군에게 보호막을 부여하고 적에게는 피해를 줍니다."]],"en":[["Absolution","When units die near Senna, their souls are periodically trapped by the Black Mist. Senna can attack these souls to free them, absorbing the Mist that held them in death. Mist fuels her Relic Cannon's power with increased Attack Damage, Attack Range, and Critical Strike Chance. Attacks from Senna's Relic Cannon take longer to fire, deals bonus damage , and briefly grant her a portion of her target's Movement Speed."],["Piercing Darkness","Piercing Darkness’s cast range matches Senna’s attack range and its cast time is improved with Attack Speed. It can target anything and applies on-hit effects to enemy champions."],["Last Embrace","Senna sends forth a wave of Black Mist. If it hits an enemy it latches onto them hungrily, rooting them and everything nearby after a brief delay."],["Curse of the Black Mist","Senna draws the Mist she has stored in her weapon into a storm around her, embracing darkness and becoming a wraith within. Allies who enter the area are camouflaged and also appear as wraiths as the Mist shrouds them. Wraiths gain increased movement speed, are unselectable, and hide their identities."],["Dawning Shadow","Senna calls upon the relic stones of fallen Sentinels, splitting her relic cannon into a holy array of shadow and light. She then fires a global beam that shields allies from harm, while damaging enemies caught in the center."]],"zh":[["赦罪","當有單位在姍娜附近陣亡時，他們的靈魂有可能會被黯霧困住。姍娜可以攻擊這些靈魂以還他們自由，並吸收束縛他們的黯霧。黯霧會強化她的聖遺加農砲，增加她的物理攻擊、攻擊距離以及暴擊率。聖遺加農砲的普攻需時較長，但會造成額外傷害，並短暫給予姍娜目標的一部分跑速。"],["刺骨幽闇","刺骨幽闇的施放距離和姍娜的攻擊距離相同，且其施放時間會隨著攻速上升而減少。此技能可以鎖定任何目標，並對命中的敵方英雄施加命中效果。"],["終末之擁","姍娜向前釋放一團黯霧，若命中敵軍，黯霧便會饑渴地纏住目標，在短暫延遲後定身目標及所有鄰近敵軍。"],["黯霧詛咒","姍娜釋放儲存在武器中的黯霧，在身周形成一團風暴，緊接著擁抱黑暗並化為幽魂。進入這個區域的友軍會進入偽裝狀態，且因為黯霧包覆，友軍離開該區域現身時，也會以幽魂的姿態顯現。幽魂會增加跑速、無法被指定，並且會隱藏自己的身份。"],["黎明之影","姍娜召喚殞落哨兵們的聖石，將她的聖遺加農砲拆分成一座光與影的神聖陣列。她隨後發射一道橫跨地圖的光束，賦予被光束壟罩的友軍護盾，同時對光束正中央的敵軍造成傷害。"]],"n":[["0",""],["15/15/15/15",""],["11/11/11/11",""],["22/20/18/16",""],["85/80/75",""]]},"10124":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f4a0827d6e473e5ff752d943b9acfd47f698a1de-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/28dbd474e0d32b001664d6f149c802d6db547035-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/816987b8ce1986457374275d0d0f1ead75ed73f1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a2a0b9985af826baf7051412dd72e46693b59000-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8c44262d9de51b9d14a240333c2
