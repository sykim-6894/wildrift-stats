      patchIntro: '仅整理官方更新公告中的改动项目和数值。官方公告只有繁体中文版，英雄和装备名称为台服译名。设计师说明和较长的介绍请查看原文。',
      noPatch: '未能获取更新公告', nChamp: '英雄 {n}', nEtc: '其他 {n}',
      glance: '概览', more: ' 等另外{n}项', count: '{n}项', viewWin: '查看{n}胜率',
      cut: '更多说明见原文', orig: '查看 {v} 更新公告原文',
      mAll: '全部排名', mPick: '推荐', mMove: '变动', delta: '变化',
      sSleep: '冷门强势', sSleepD: '胜率高但登场率低的英雄',
      sBan: '建议禁用', sBanD: '胜率和登场率都高的英雄',
      sTrap: '陷阱选择', sTrapD: '登场率高但胜率低的英雄',
      sUp: '上升', sDown: '下降', moveD: '{a} → {b} 胜率变化（百分点）',
      noneList: '暂无', moveWait: '累积两天以上数据后显示',
      trend: '胜率走势 · {p} · {t}',
      skills: '技能', skCd: '冷却时间', skCost: '消耗', skSec: '秒',
      skNote: '冷却时间和消耗为各等级数值，来自国服。技能说明取自官方网站',
      open: '展开', shut: '收起'
    }
  };
  var lang = 'ko';
  try {
    var savedLang = localStorage.getItem('wr-lang');
    var nav = (navigator.language || 'ko').toLowerCase();
    lang = LANGS.indexOf(savedLang) >= 0 ? savedLang : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('zh') === 0 ? 'zh' : 'en';
  } catch (e) {}
  function t(key, vars) {
    var s = T[lang][key];
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  // [한국어, 영어, 중국어] 배열에서 현재 언어의 이름을 고른다. 없으면 영어, 그다음 한국어.
  function nm(arr) {
    if (typeof arr === 'string') return arr;
    return arr[LANGS.indexOf(lang)] || arr[1] || arr[0];
  }

  var POS = ['2', '5', '1', '3', '4'];
  var TIER = ['1', '2', '3', '4'];

  var state = { pos: '2', tier: '1', sort: 1, q: '', hero: null, hpos: null, view: 'stats', mode: 'all' };
  try {
    var saved = JSON.parse(localStorage.getItem('wr-state') || '{}');
    if (POS.indexOf(saved.pos) >= 0) state.pos = saved.pos;
    if (TIER.indexOf(saved.tier) >= 0) state.tier = saved.tier;
  } catch (e) {}
  function save() {
    try { localStorage.setItem('wr-state', JSON.stringify({ pos: state.pos, tier: state.tier })); } catch (e) {}
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }
  function pct(v) { return v.toFixed(2) + '%'; }
  function avatar(id) {
    var h = D.heroes[id], box = el('span', 'ava');
    var img = new Image();
    img.alt = ''; img.loading = 'lazy';
    img.onerror = function () { box.textContent = nm(h.n).charAt(0); };
    img.src = h.a;
    box.appendChild(img);
    return box;
  }
  function winBar(w) {
    var bar = el('span', 'bar'), i = el('i', w >= 50 ? 'up' : 'down');
    i.style.width = Math.min(Math.abs(w - 50) / 8, 1) * 50 + '%';
    bar.appendChild(i);
    return bar;
  }
  function sorted(tier, pos, col) {
    return (D.stats[tier][pos] || []).slice().sort(function (a, b) { return b[col] - a[col]; });
  }

  // 컨트롤
  var tabs = $('tabs');
  POS.forEach(function (p) {
    var b = el('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.pos = p;
    b.onclick = function () { state.pos = p; save(); render(); };
    tabs.appendChild(b);
  });
  var tiers = $('tiers');
  TIER.forEach(function (tr) {
    var b = el('button');
    b.type = 'button'; b.dataset.tier = tr;
    b.onclick = function () { state.tier = tr; save(); render(); };
    tiers.appendChild(b);
  });
  var MODES = [['all', 'mAll'], ['pick', 'mPick'], ['move', 'mMove']];
  var modes = $('modes');
  MODES.forEach(function (m) {
    var b = el('button');
    b.type = 'button'; b.dataset.mode = m[0]; b.dataset.key = m[1];
    b.onclick = function () { state.mode = m[0]; render(); };
    modes.appendChild(b);
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value.trim(); renderList(); });
  each(document.querySelectorAll('#head button'), function (b) {
    b.onclick = function () { if (state.mode === 'all') { state.sort = +b.dataset.sort; render(); } };
  });
  each($('langs').children, function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      try { localStorage.setItem('wr-lang', lang); } catch (e) {}
      applyLang();
    };
  });

  // 고정 문구를 현재 언어로 바꾸고 화면을 다시 그린다
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.documentElement.style.setProperty('--t-open', JSON.stringify(t('open')));
    document.documentElement.style.setProperty('--t-close', JSON.stringify(t('shut')));
    $('h1a').textContent = t('h1a'); $('h1b').textContent = t('h1b');
    $('meta').textContent = t('meta', { d: D.date });
    each($('langs').children, function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    each($('views').children, function (b) { b.textContent = t(b.dataset.view === 'stats' ? 'vStats' : 'vPatch'); });
    tabs.setAttribute('aria-label', t('posLabel'));
    tiers.setAttribute('aria-label', t('tierLabel'));
    each(tabs.children, function (b) { b.textContent = T[lang].pos[b.dataset.pos]; });
    each(tiers.children, function (b) { b.textContent = T[lang].tier[b.dataset.tier]; });
    $('q').placeholder = t('search'); $('q').setAttribute('aria-label', t('search'));
    $('col-champ').textContent = t('champ');
    each(modes.children, function (b) { b.textContent = t(b.dataset.key); });
    $('foot1').textContent = t('foot1'); $('foot2').textContent = t('foot2');
    render();
    if (state.hero) renderSheet();
    if (patchBuilt) buildPatches();
  }

  function render() {
    each(tabs.children, function (b) {
      b.setAttribute('aria-selected', b.dataset.pos === state.pos ? 'true' : 'false');
    });
    each(tiers.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.tier === state.tier ? 'true' : 'false');
    });
    each(modes.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode ? 'true' : 'false');
    });
    // 변동 보기에서는 가운데 열이 변동폭, 오른쪽 열이 픽률이다
    var cols = state.mode === 'move' ? { 1: 'win', 2: 'delta', 3: 'pick' } : { 1: 'win', 2: 'pick', 3: 'ban' };
    $('head').classList.toggle('static', state.mode !== 'all');
    each(document.querySelectorAll('#head button'), function (b) {
      b.textContent = t(cols[b.dataset.sort]);
      if (state.mode === 'all' && +b.dataset.sort === state.sort) b.setAttribute('aria-sort', 'descending');
      else b.removeAttribute('aria-sort');
    });
    $('q').hidden = state.mode !== 'all';
    renderList();
  }

  // 표의 한 줄. c2, c3 은 오른쪽 두 칸에 들어갈 글자, c2cls 는 가운데 칸의 색 표시(up/down)
  function rowEl(r, no, c2, c3, c2cls) {
    var h = D.heroes[r[0]], name = nm(h.n);
    var li = el('li');
    var b = el('button', 'rowbtn grid');
    b.type = 'button';
    b.setAttribute('aria-label', t('detail', { n: name }));
    b.appendChild(el('span', 'rank', no));
    b.appendChild(avatar(r[0]));
    b.appendChild(el('span', 'name', name));
    var win = el('span', 'win');
    win.appendChild(el('b', '', pct(r[1])));
    win.appendChild(winBar(r[1]));
    b.appendChild(win);
    b.appendChild(el('span', 'num' + (c2cls ? ' ' + c2cls : ''), c2));
    b.appendChild(el('span', 'num', c3));
    b.onclick = function () { openHero(r[0], state.pos); };
    li.appendChild(b);
    return li;
  }
  function section(list, title, desc, rows, make) {
    var s = el('li', 'sect');
    s.appendChild(el('span', 'st', title));
    if (desc) s.appendChild(el('span', 'sd', desc));
    list.appendChild(s);
    if (!rows.length) { list.appendChild(el('li', 'none', t('noneList'))); return; }
    rows.forEach(function (r, i) { list.appendChild(make(r, i)); });
  }

  // 추천: 지금 수치만으로 나눈 세 묶음
  function picks(rows) {
    var ps = rows.map(function (r) { return r[2]; }).sort(function (a, b) { return a - b; });
    var median = ps.length ? ps[Math.floor(ps.length / 2)] : 0;
    function top(filter, score) {
      return rows.filter(filter).sort(function (a, b) { return score(b) - score(a); }).slice(0, 5);
    }
    return {
      sleep: top(function (r) { return r[1] >= 51 && r[2] < median && r[2] >= 0.5; }, function (r) { return r[1]; }),
      ban: top(function (r) { return r[1] >= 51 && r[2] >= median; }, function (r) { return (r[1] - 50) * r[2]; }),
      trap: top(function (r) { return r[1] < 49.5 && r[2] >= median; }, function (r) { return r[2]; })
    };
  }
  // 변동: 최근 기록(최대 7일 전)과 오늘의 승률 차이
  function movers(rows) {
    var H = D.hist || { d: [], w: {} }, days = H.d || [];
    var w = ((H.w || {})[state.tier] || {})[state.pos] || {};
    var last = days.length - 1, first = Math.max(0, last - 7), out = [];
    if (last < 1) return null;
    rows.forEach(function (r) {
      var sr = w[r[0]];
      if (!sr || sr[last] == null) return;
      for (var i = first; i < last; i++) if (sr[i] != null) { out.push({ r: r, d: sr[last] - sr[i] }); break; }
    });
    out.sort(function (a, b) { return b.d - a.d; });
    return {
      from: days[first].slice(5), to: days[last].slice(5),
      up: out.filter(function (x) { return x.d > 0; }).slice(0, 5),
      down: out.filter(function (x) { return x.d < 0; }).reverse().slice(0, 5)
    };
  }
  function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2); }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    var rows = sorted(state.tier, state.pos, state.mode === 'all' ? state.sort : 1);
    if (!rows.length) { list.appendChild(el('li', 'empty', t('noStats'))); return; }

    if (state.mode === 'pick') {
      var p = picks(rows);
      var plain = function (r, i) { return rowEl(r, i + 1, pct(r[2]), pct(r[3])); };
      section(list, t('sBan'), t('sBanD'), p.ban, plain);
      section(list, t('sSleep'), t('sSleepD'), p.sleep, plain);
      section(list, t('sTrap'), t('sTrapD'), p.trap, plain);
      return;
    }
    if (state.mode === 'move') {
      var m = movers(rows);
      if (!m) { list.appendChild(el('li', 'empty', t('moveWait'))); return; }
      var desc = t('moveD', { a: m.from, b: m.to });
      var moved = function (x, i) { return rowEl(x.r, i + 1, signed(x.d), pct(x.r[2]), x.d > 0 ? 'up' : 'down'); };
      section(list, t('sUp'), desc, m.up, moved);
      section(list, t('sDown'), desc, m.down, moved);
      return;
    }

    var q = state.q.toLowerCase(), shown = 0;
    rows.forEach(function (r, idx) {
      // 검색은 어느 언어 이름으로든 된다
      if (q && D.heroes[r[0]].n.join('\n').toLowerCase().indexOf(q) === -1) return;
      shown++;
      list.appendChild(rowEl(r, idx + 1, pct(r[2]), pct(r[3])));
    });
    if (!shown) list.appendChild(el('li', 'empty', t('noResult', { q: state.q })));
  }

  // 상세 시트
  var scrim = $('scrim'), sheet = $('sheet');
  function find(tier, pos, id) {
    var rows = sorted(tier, pos, 1);
    for (var i = 0; i < rows.length; i++) if (rows[i][0] === id) return { row: rows[i], rank: i + 1, total: rows.length };
    return null;
  }
  function openHero(id, pos) {
    state.hero = id; state.hpos = pos; state.skill = 0;
    renderSheet();
    scrim.classList.add('open');
    sheet.scrollTop = 0;
    sheet.focus();
    try { if (location.hash !== '#c-' + id) location.hash = 'c-' + id; } catch (e) {}
  }
  function closeHero() {
    state.hero = null;
    scrim.classList.remove('open');
    try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  function renderSheet() {
    var id = state.hero, h = D.heroes[id];
    sheet.textContent = '';

    var head = el('div', 'sheet-head');
    head.appendChild(avatar(id));
    var ttl = el('h2', '', nm(h.n)); ttl.id = 'sheet-title';
    head.appendChild(ttl);
    var c = el('button', 'close', t('close')); c.type = 'button'; c.onclick = closeHero;
    head.appendChild(c);
    sheet.appendChild(head);

    // 포지션별 요약 (선택한 랭크 구간)
    var played = POS.filter(function (p) { return find(state.tier, p, id); });
    if (played.length && !find(state.tier, state.hpos, id)) state.hpos = played[0];
    var s1 = el('section');
    s1.appendChild(el('h3', '', t('byPos', { t: T[lang].tier[state.tier] })));
    if (!played.length) {
      s1.appendChild(el('p', 'empty', t('noStats')));
    } else {
      var pg = el('div', 'posgrid');
      played.forEach(function (p) {
        var f = find(state.tier, p, id);
        var card = el('button', 'poscard');
        card.type = 'button';
        card.setAttribute('aria-pressed', p === state.hpos ? 'true' : 'false');
        card.appendChild(el('span', 'p', T[lang].pos[p]));
        card.appendChild(el('span', 'w', pct(f.row[1])));
        card.appendChild(winBar(f.row[1]));
        card.appendChild(el('span', 's', t('rankOf', { r: f.rank, n: f.total })));
        card.appendChild(el('span', 's', t('pickBan', { p: pct(f.row[2]), b: pct(f.row[3]) })));
        card.onclick = function () { state.hpos = p; renderSheet(); };
        pg.appendChild(card);
      });
      s1.appendChild(pg);
    }
    sheet.appendChild(s1);

    // 랭크 구간별 비교 (선택한 포지션)
    var s2 = el('section');
    s2.appendChild(el('h3', '', t('byTier', { p: T[lang].pos[state.hpos] })));
    var wrap = el('div', 'tablewrap'), table = el('table'), thead = el('thead'), trh = el('tr');
    ['thTier', 'win', 'thRank', 'pick', 'ban'].forEach(function (k) { trh.appendChild(el('th', '', t(k))); });
    thead.appendChild(trh); table.appendChild(thead);
    var tb = el('tbody');
    TIER.forEach(function (tr) {
      var f = find(tr, state.hpos, id), row = el('tr', tr === state.tier ? 'cur' : '');
      row.appendChild(el('td', '', T[lang].tier[tr]));
      if (f) {
        row.appendChild(el('td', f.row[1] >= 50 ? 'up' : 'down', pct(f.row[1])));
        row.appendChild(el('td', '', f.rank + ' / ' + f.total));
        row.appendChild(el('td', '', pct(f.row[2])));
        row.appendChild(el('td', '', pct(f.row[3])));
      } else {
        var td = el('td', '', t('none')); td.colSpan = 4; td.style.color = 'var(--mute)';
        row.appendChild(td);
      }
      tb.appendChild(row);
    });
    table.appendChild(tb); wrap.appendChild(table); s2.appendChild(wrap);
    sheet.appendChild(s2);

    // 승률 추이 (선택한 포지션·구간)
    var H = D.hist || { d: [], w: {} };
    var series = (((H.w || {})[state.tier] || {})[state.hpos] || {})[id];
    if (series) {
      var s4 = el('section', 'trend');
      s4.appendChild(el('h3', '', t('trend', { p: T[lang].pos[state.hpos], t: T[lang].tier[state.tier] })));
      var pts = [];
      series.forEach(function (v, i) { if (v != null) pts.push([i, v]); });
      if (pts.length < 2) s4.appendChild(el('p', '', t('moveWait')));
      else s4.appendChild(trendSvg(H.d, pts));
      sheet.appendChild(s4);
    }

    // 스킬: 아이콘을 누르면 이름, 재사용 대기시간, 설명이 아래에 나온다
    var SK = (D.skills || {})[id];
    if (SK) {
      var list = SK[lang] || SK.en || SK.ko;
      var KEYS = ['P', '1', '2', '3', 'R'];
      var s5 = el('section', 'skills');
      s5.appendChild(el('h3', '', t('skills')));
      var bar = el('div', 'skbar'), info = el('div', 'skinfo');
      function showSkill(i) {
        state.skill = i;
        each(bar.children, function (b, j) { b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
        info.textContent = '';
        var sn = el('div', 'sn');
        sn.appendChild(el('span', 'k', KEYS[i]));
        sn.appendChild(document.createTextNode(list[i][0]));
        info.appendChild(sn);
        var nums = SK.n && SK.n[i], row = el('div', 'nums');
        if (nums && nums[0] && /[1-9]/.test(nums[0])) { var a = el('span', '', t('skCd') + ' '); a.appendChild(el('b', '', nums[0] + t('skSec'))); row.appendChild(a); }
        if (nums && nums[1] && /[1-9]/.test(nums[1])) { var c = el('span', '', t('skCost') + ' '); c.appendChild(el('b', '', nums[1])); row.appendChild(c); }
        if (row.children.length) info.appendChild(row);
        info.appendChild(el('p', 'sd', list[i][1]));
      }
      list.forEach(function (sk, i) {
        var b = el('button', 'skbtn');
        b.type = 'button'; b.title = sk[0]; b.setAttribute('aria-label', sk[0]);
        var ico = el('span', 'ico');
        if (SK.i[i]) {
          var im = new Image(); im.alt = ''; im.loading = 'lazy';
          im.onerror = function () { ico.textContent = KEYS[i]; ico.style.cssText = 'display:grid;place-items:center;color:var(--sub)'; };
          im.src = SK.i[i]; ico.appendChild(im);
        }
        b.appendChild(ico);
        b.appendChild(el('span', 'key', KEYS[i]));
        b.onclick = function () { showSkill(i); };
        bar.appendChild(b);
      });
      s5.appendChild(bar);
      s5.appendChild(info);
      s5.appendChild(el('p', 'note', t('skNote')));
      sheet.appendChild(s5);
      showSkill(Math.min(state.skill || 0, list.length - 1));
    }

    // 빌드
    var s3 = el('section');
    s3.appendChild(el('h3', '', t('build')));
    var build = el('div', 'build');
    var B = (D.builds || {})[id];
    // 아이콘에 마우스를 올리면 이름이 뜨고, 누르면(터치 화면) 묶음 제목 옆에 이름이 표시된다.
    function group(label, refs, numbered, round) {
      if (!refs || !refs.length) return;
      var g = el('div', 'bgroup');
      var ghead = el('div', 'bhead');
      ghead.appendChild(el('span', 'blabel', label));
      var picked = el('span', 'bpicked');
      picked.setAttribute('aria-live', 'polite');
      ghead.appendChild(picked);
      g.appendChild(ghead);
      var chips = el(numbered ? 'ol' : 'ul', 'chips');
      refs.forEach(function (ref, i) {
        var thing = D.things[ref] || [['?'], ''], name = nm(thing[0]), src = thing[1];
        var li = el('li');
        var b = el('button', 'icon' + (round ? ' round' : ''));
        b.type = 'button'; b.title = name; b.setAttribute('aria-label', name);
        function asText() { b.className = 'chip'; b.textContent = name; }
        if (src) {
          var img = new Image();
          img.alt = ''; img.loading = 'lazy';
          img.onerror = asText;
          img.src = src;
          b.appendChild(img);
          if (numbered) b.appendChild(el('span', 'no', i + 1));
        } else asText();
        b.onclick = function () {
          each(chips.querySelectorAll('.on'), function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          picked.textContent = name;
        };
        li.appendChild(b);
        chips.appendChild(li);
      });
      g.appendChild(chips);
      build.appendChild(g);
    }
    if (B) {
      group(t('bStart'), B.s);
      group(t('bCore'), B.c, true);
      group(t('bBoots'), B.b);
      group(t('bFinal'), B.f, true);
      group(t('bKey'), B.r.slice(0, 1), false, true);
      group(t('bRunes'), B.r.slice(1), false, true);
      group(t('bSpells'), B.sp);
      build.appendChild(el('p', '', t('buildNote', { v: B.p ? t('buildPatch', { v: B.p }) : '' })));
    } else {
      build.appendChild(el('p', '', t('noBuild')));
    }
    if (h.g) {
      var a = el('a', 'go', t('guide'));
      a.href = h.g; a.target = '_blank'; a.rel = 'noopener';
      build.appendChild(a);
    }
    s3.appendChild(build);
    sheet.appendChild(s3);
  }
  // 승률 추이 선 그래프. 범위 안에 50%가 있으면 기준선을 긋는다.
  function trendSvg(days, pts) {
    var NS = 'http://www.w3.org/2000/svg', W = 328, Hh = 96, L = 4, R = 52, T0 = 12, B = 20;
    function node(tag, attrs, text) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text != null) e.textContent = text;
      return e;
    }
    var vals = pts.map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = Math.max((hi - lo) * 0.25, 0.3);
    lo -= pad; hi += pad;
    var n = days.length - 1 || 1;
    function x(i) { return L + (W - L - R) * i / n; }
    function y(v) { return T0 + (Hh - T0 - B) * (hi - v) / (hi - lo); }
    var svg = node('svg', { viewBox: '0 0 ' + W + ' ' + Hh, role: 'img' });
    svg.setAttribute('aria-label', pts.map(function (p) { return days[p[0]].slice(5) + ' ' + p[1].toFixed(2) + '%'; }).join(', '));
    if (lo < 50 && hi > 50) {
      svg.appendChild(node('line', { 'class': 'ref', x1: L, x2: W - R, y1: y(50), y2: y(50) }));
      svg.appendChild(node('text', { x: W - R + 8, y: y(50) + 3 }, '50%'));
    }
    svg.appendChild(node('polyline', { 'class': 'ln', points: pts.map(function (p) { return x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ') }));
    pts.forEach(function (p, i) {
      var end = i === pts.length - 1;
      svg.appendChild(node('circle', { 'class': end ? 'end' : 'pt', cx: x(p[0]), cy: y(p[1]), r: end ? 3 : 1.5 }));
    });
    var lastP = pts[pts.length - 1], firstP = pts[0];
    svg.appendChild(node('text', { 'class': 'val', x: W - R + 8, y: y(lastP[1]) + 4 }, lastP[1].toFixed(2) + '%'));
    svg.appendChild(node('text', { x: x(firstP[0]), y: Hh - 4 }, days[firstP[0]].slice(5)));
    svg.appendChild(node('text', { x: x(lastP[0]), y: Hh - 4, 'text-anchor': 'end' }, days[lastP[0]].slice(5)));
    return svg;
  }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeHero(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.hero) closeHero(); });
  function fromHash() {
    var hash = location.hash || '';
    var m = /^#c-(\d+)$/.exec(hash);
    if (m && D.heroes[m[1]]) { if (state.hero !== m[1]) openHero(m[1], state.pos); return; }
    if (state.hero) { state.hero = null; scrim.classList.remove('open'); }
    if (hash === '#patch-notes') showView('patch');
    else if (hash === '' || hash === '#') showView(state.view || 'stats');
  }
  window.addEventListener('hashchange', fromHash);

  // 화면 전환: 승률표 / 패치 노트
  var viewStats = $('view-stats'), viewPatch = $('view-patch');
  var viewBtns = $('views').children, patchBuilt = false;
  function showView(v) {
    state.view = v;
    viewStats.hidden = v !== 'stats';
    viewPatch.hidden = v !== 'patch';
    each(viewBtns, function (b) {
      if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (v === 'patch' && !patchBuilt) { buildPatches(); patchBuilt = true; }
  }
  each(viewBtns, function (b) {
    b.onclick = function () {
      showView(b.dataset.view);
      try { history.replaceState(null, '', location.pathname + location.search + (b.dataset.view === 'patch' ? '#patch-notes' : '')); } catch (e) {}
    };
  });

  // 패치 노트 속 챔피언 이름(어느 언어든, 대만 표기 포함)으로 챔피언을 찾는다
  var heroByName = {};
  function key(s) { return String(s).toLowerCase().replace(/[\s'’.·&]/g, ''); }
  Object.keys(D.heroes).forEach(function (id) {
    var h = D.heroes[id];
    h.n.concat(h.x ? [h.x] : []).forEach(function (n) { if (n) heroByName[key(n)] = id; });
  });
  function heroId(name) { return heroByName[key(name)]; }

  // "A → B" 줄은 바뀐 뒤 값(B)을 강조한다
  function changeLine(text) {
    var li = el('li'), i = text.lastIndexOf('→');
    if (i < 0) { li.textContent = text; return li; }
    li.appendChild(document.createTextNode(text.slice(0, i + 1) + ' '));
    li.appendChild(el('span', 'to', text.slice(i + 1).trim()));
    return li;
  }
  function namesOf(sec) {
    // 소제목(lv 3)만 있는 항목은 묶음 이름이라 요약에서는 실제 변경 항목만 센다
    var real = sec.g.filter(function (g) { return sec.k === 'champ' || g.c.length || g.lv !== 3; });
    return (real.length ? real : sec.g).map(function (g) { return g.n; });
  }
  function buildPatches() {
    var all = D.patches || {};
    if (Array.isArray(all)) all = { ko: all };
    var P = all[lang] && all[lang].length ? all[lang] : (all.en || all.ko || []);
    // 다시 그릴 때 펼쳐 둔 패치는 그대로 둔다
    var wasOpen = {};
    each(viewPatch.querySelectorAll('details.patch'), function (d) { wasOpen[d.dataset.v] = d.open; });
    viewPatch.textContent = '';
    if (!P.length) { viewPatch.appendChild(el('p', 'empty', t('noPatch'))); return; }
    viewPatch.appendChild(el('p', 'pnote', t('patchIntro')));
    P.forEach(function (p, idx) {
      var d = el('details', 'patch');
      d.dataset.v = p.v;
      d.open = p.v in wasOpen ? wasOpen[p.v] : idx === 0;
      var sum = el('summary');
      sum.appendChild(el('span', 'pver', p.v));
      sum.appendChild(el('span', 'pdate', p.date));
      var nChamp = 0, nEtc = 0;
      p.s.forEach(function (s) { if (s.k === 'champ') nChamp += s.g.length; else nEtc += namesOf(s).length; });
      sum.appendChild(el('span', 'pcount', (nChamp ? t('nChamp', { n: nChamp }) + ' · ' : '') + t('nEtc', { n: nEtc })));
      d.appendChild(sum);

      var body = el('div', 'pbody');
      if (p.desc) body.appendChild(el('p', 'pdesc', p.desc));

      // 한눈에 보기
      var glance = el('div', 'glance');
      glance.appendChild(el('h3', '', t('glance')));
      p.s.forEach(function (s) {
        var row = el('div', 'grow');
        var names = namesOf(s);
        row.appendChild(el('span', 'gt', s.t + ' ' + names.length));
        if (s.k === 'champ') {
          var box = el('div', 'champs');
          s.g.forEach(function (g) {
            var id = heroId(g.n);
            var label = id ? nm(D.heroes[id].n) : g.n;
            var c = el(id ? 'button' : 'span', 'champ');
            if (id) {
              c.type = 'button'; c.title = t('viewWin', { n: label });
              c.appendChild(avatar(id));
              c.onclick = function () { openHero(id, state.pos); };
            } else c.style.paddingLeft = '10px';
            c.appendChild(document.createTextNode(label));
            box.appendChild(c);
          });
          row.appendChild(box);
        } else {
          var shown = names.slice(0, 12).join(', ');
          row.appendChild(el('span', 'names', shown + (names.length > 12 ? t('more', { n: names.length - 12 }) : '')));
        }
        glance.appendChild(row);
      });
      body.appendChild(glance);

      // 항목별 변경 내용 (눌러서 펼침)
      var secs = el('div');
      p.s.forEach(function (s) {
        var sd = el('details', 'sec'), ss = el('summary');
        ss.appendChild(el('span', '', s.t));
        ss.appendChild(el('span', 'n', t('count', { n: namesOf(s).length })));
        sd.appendChild(ss);
        var sb = el('div', 'secbody');
        s.g.forEach(function (g) {
          var pg = el('div', 'pg' + (g.lv === 3 ? ' sub' : ''));
          var gn = el('div', 'gn');
          var id = s.k === 'champ' ? heroId(g.n) : null;
          if (id) gn.appendChild(avatar(id));
          gn.appendChild(document.createTextNode(id ? nm(D.heroes[id].n) : g.n));
          pg.appendChild(gn);
          g.c.forEach(function (c) {
            if (c.t) pg.appendChild(el('div', 'ct', c.t));
            if (c.l.length) {
              var ul = el('ul');
              c.l.forEach(function (line) { ul.appendChild(changeLine(line)); });
              pg.appendChild(ul);
            }
            if (c.x) pg.appendChild(el('div', 'cut', t('cut')));
          });
          sb.appendChild(pg);
        });
        sd.appendChild(sb);
        secs.appendChild(sd);
      });
      body.appendChild(secs);

      var a = el('a', 'orig', t('orig', { v: p.v }));
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      body.appendChild(a);
      d.appendChild(body);
      viewPatch.appendChild(d);
    });
  }

  applyLang();
  showView('stats');
  fromHash();
})();
</script>
