<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와일드리프트 정보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  방향: 경기 기록지. 무채색 표면 위에 얇은 줄로 나눈 표, 숫자는 고정폭.
  색은 챔피언 초상화·아이콘과 승률 막대가 맡고, 황동색은 "지금 선택된 것"에만 쓴다.
  고유 표시: 승률 막대의 50% 기준선.
  간격은 4px 단위.
*/
:root {
  color-scheme: dark;
  --bg: #121314;
  --raise: #1b1c1e;
  --raise-2: #232527;
  --line: rgba(236, 238, 240, 0.09);
  --text: #eceef0;
  --sub: #a4a8ad;
  --mute: #7f848a;
  --brass: #d2ac5a;
  --up: #4cc38a;
  --down: #e5675f;
  --font: "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
html:lang(zh) {
  --font: "IBM Plex Sans KR", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

/* 숫자는 모두 고정폭 */
.rank, .num, .win b, .pdate, .pver, .pcount, td, .poscard .w, .poscard .s, .icon .no, #meta {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
html:lang(ko) #meta, html:lang(zh) #meta, html:lang(ko) .poscard .s, html:lang(zh) .poscard .s,
html:lang(ko) .pcount, html:lang(zh) .pcount { font-family: var(--font); }

/* 머리 */
/* 첫 줄: 제목과 언어 선택, 둘째 줄: 집계 기준 */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 20px 0 16px; }
header.top > div:first-child { display: contents; }
h1 { grid-row: 1; grid-column: 1; }
.langs { grid-row: 1; grid-column: 2; }
.meta { grid-row: 2; grid-column: 1 / -1; }
h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }
h1 span { color: inherit; }
.meta { margin: 0; padding: 4px 0 0; font-size: 12px; line-height: 16px; color: var(--mute); }
.langs { display: flex; gap: 12px; flex: none; }
.langs button { font-size: 12px; line-height: 16px; color: var(--mute); padding: 4px 0; transition: color 140ms var(--ease); }
.langs button:hover { color: var(--sub); }
.langs button[aria-pressed="true"] { color: var(--text); }

.views { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.views button {
  padding: 8px 0; margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  font-size: 15px; color: var(--mute);
  transition: color 140ms var(--ease);
}
.views button:hover { color: var(--sub); }
.views button[aria-current="page"] { color: var(--text); font-weight: 500; border-bottom-color: var(--brass); }

/* 승률표: 조작부 */
.controls {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 12px 0;
  display: flex; flex-direction: column; gap: 12px;
}
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--raise); border-radius: 10px; padding: 4px; }
.tabs button {
  padding: 8px 0; border-radius: 6px;
  font-size: 14px; color: var(--sub); text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color 140ms var(--ease), background-color 140ms var(--ease);
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] {
  background: var(--raise-2); color: var(--text); font-weight: 500;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.row2 { display: flex; flex-direction: column; gap: 12px; }
.tiers { display: flex; gap: 16px; flex-wrap: wrap; padding: 0 4px; }
.tiers button { font-size: 13px; color: var(--mute); padding: 4px 0; transition: color 140ms var(--ease); }
.tiers button:hover { color: var(--sub); }
.tiers button[aria-pressed="true"] { color: var(--brass); }
#q {
  width: 100%; min-width: 0;
  background: var(--raise); border: 1px solid transparent; border-radius: 8px;
  padding: 8px 12px; font-size: 14px; line-height: 20px;
}
#q::placeholder { color: var(--mute); }
#q:focus { outline: none; border-color: var(--line); background: var(--raise-2); }

/* 승률표: 표 */
.grid {
  display: grid;
  grid-template-columns: 24px 36px minmax(0, 1fr) 88px 52px 52px;
  align-items: center;
  column-gap: 8px;
}
.head { padding: 4px 0 8px; color: var(--mute); font-size: 12px; line-height: 16px; border-bottom: 1px solid var(--line); }
.head button { color: var(--mute); font-size: 12px; text-align: right; padding: 4px 0; transition: color 140ms var(--ease); }
.head button:hover { color: var(--sub); }
.head button[aria-sort="descending"] { color: var(--text); }
.head button[aria-sort="descending"]::after { content: " ↓"; font-family: var(--mono); }

ol#list { list-style: none; margin: 0; padding: 0; }
#list li { border-bottom: 1px solid var(--line); }
#list button.rowbtn {
  width: 100%; padding: 8px 0; text-align: left;
  transition: background-color 140ms var(--ease);
}
#list button.rowbtn:hover { background: var(--raise); }
#list button.rowbtn:active { background: var(--raise-2); }
.rank { color: var(--mute); font-size: 12px; text-align: right; }
.ava {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--raise-2);
  display: grid; place-items: center; overflow: hidden;
  font-size: 14px; font-weight: 500; color: var(--sub);
}
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name { font-size: 15px; line-height: 20px; overflow-wrap: break-word; }
.num { text-align: right; font-size: 12px; color: var(--sub); }
.win { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.win b { font-size: 14px; font-weight: 500; text-align: right; color: var(--text); }
/* 50%를 가운데에 둔 막대: 오른쪽이 50% 초과, 왼쪽이 미만. 기준선이 이 페이지의 고유 표시다. */
.bar { position: relative; display: block; width: 100%; height: 2px; background: var(--line); }
.bar::before { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 8px; background: var(--mute); }
.bar i { position: absolute; top: 0; height: 100%; }
.bar i.up { left: 50%; background: var(--up); }
.bar i.down { right: 50%; background: var(--down); }
td.up { color: var(--up); }
td.down { color: var(--down); }
.empty { color: var(--mute); padding: 24px 8px; text-align: center; margin: 0; }

footer { color: var(--mute); font-size: 12px; line-height: 16px; margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }

/* 상세 시트 */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%;
  overflow-y: auto;
  background: var(--raise);
  border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 16px 16px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.scrim.open .sheet { animation: rise 320ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { .scrim.open .sheet { animation: none; } * { transition: none !important; } }
@media (min-width: 640px) {
  .scrim { align-items: center; }
  .sheet { border: 1px solid var(--line); border-radius: 16px; }
}
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet-head .ava { width: 48px; height: 48px; flex: none; }
.sheet-head h2 { font-size: 20px; line-height: 24px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow-wrap: break-word; }
.close {
  flex: none; background: var(--raise-2); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--sub);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: color 140ms var(--ease);
}
.close:hover { color: var(--text); }
.sheet h3, .glance h3 { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--mute); margin: 0 0 8px; }
.posgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.poscard {
  background: var(--bg); border: 1px solid transparent; border-radius: 10px;
  padding: 12px; text-align: left;
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color 140ms var(--ease);
}
.poscard:hover { border-color: var(--line); }
.poscard[aria-pressed="true"] { border-color: var(--brass); }
.poscard .p { font-size: 13px; color: var(--sub); }
.poscard .w { font-size: 24px; line-height: 28px; font-weight: 500; color: var(--text); }
.poscard .bar { margin: 4px 0 8px; }
.poscard .s { font-size: 12px; line-height: 16px; color: var(--mute); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; font-family: var(--font); padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th { color: var(--mute); font-weight: 400; font-size: 12px; }
td { color: var(--sub); }
tr.cur td:first-child { color: var(--text); font-weight: 500; }

/* 추천 빌드 */
.build { display: flex; flex-direction: column; gap: 16px; }
.build p { margin: 0; font-size: 12px; line-height: 16px; color: var(--mute); }
.bgroup { display: flex; flex-direction: column; gap: 8px; }
.bhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.blabel { font-size: 12px; line-height: 16px; color: var(--sub); }
.bpicked { font-size: 13px; color: var(--text); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--raise-2); border-radius: 8px;
  padding: 4px 12px; font-size: 13px; min-height: 44px;
}
.icon {
  position: relative; display: block;
  width: 44px; height: 44px;
  background: var(--raise-2); border-radius: 8px;
}
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
.icon.round, .icon.round img { border-radius: 50%; }
.icon.on, .chip.on { box-shadow: 0 0 0 2px var(--brass); }
.icon .no {
  position: absolute; left: -4px; top: -4px;
  min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--bg); color: var(--sub);
  font-size: 10px; line-height: 16px; text-align: center;
}
.build a.go {
  align-self: flex-start;
  background: var(--raise-2); color: var(--text); text-decoration: none;
  border-radius: 8px; padding: 8px 16px; font-size: 13px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* 패치 노트 */
#view-patch { padding-top: 12px; display: flex; flex-direction: column; }
.pnote { font-size: 12px; line-height: 16px; color: var(--mute); margin: 0 0 4px; }
details.patch { border-bottom: 1px solid var(--line); }
details.patch > summary {
  list-style: none; cursor: pointer; padding: 16px 0;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
details.patch > summary::-webkit-details-marker, details.sec > summary::-webkit-details-marker { display: none; }
.pver { font-size: 20px; line-height: 24px; font-weight: 500; color: var(--text); }
.pdate { font-size: 12px; color: var(--mute); }
.pcount { font-size: 12px; color: var(--mute); margin-left: auto; }
/* 접힘 표시: 선으로 그린 꺾쇠 */
details.patch > summary::after, details.sec > summary .n::after {
  content: ""; display: inline-block; width: 6px; height: 6px;
  border-right: 1.5px solid var(--mute); border-bottom: 1.5px solid var(--mute);
  transform: translateY(-3px) rotate(45deg);
  transition: transform 160ms var(--ease);
}
details.patch[open] > summary::after, details.sec[open] > summary .n::after { transform: translateY(1px) rotate(-135deg); }
.pbody { padding: 0 0 20px; display: flex; flex-direction: column; gap: 20px; }
.pdesc { margin: 0; font-size: 14px; color: var(--sub); }
.glance { display: flex; flex-direction: column; gap: 16px; }
.glance h3 { margin: 0; }
.grow { display: flex; flex-direction: column; gap: 8px; }
.grow .gt { font-size: 12px; line-height: 16px; color: var(--sub); }
.grow .names { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
.champs { display: flex; flex-wrap: wrap; gap: 8px; }
.champ {
  display: flex; align-items: center; gap: 8px;
  background: var(--raise); border-radius: 8px;
  padding: 4px 12px 4px 4px; font-size: 13px;
  transition: background-color 140ms var(--ease);
}
button.champ:hover { background: var(--raise-2); }
.champ .ava { width: 24px; height: 24px; border-radius: 4px; font-size: 12px; }
details.sec { border-top: 1px solid var(--line); }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 12px 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 14px; font-weight: 500;
}
details.sec > summary .n { color: var(--mute); font-weight: 400; font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.secbody { display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
.pg { display: flex; flex-direction: column; gap: 4px; }
.pg .gn { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.pg .gn .ava { width: 24px; height: 24px; border-radius: 4px; font-size: 12px; }
.pg.sub .gn { color: var(--sub); font-weight: 400; font-size: 12px; padding-top: 4px; }
.pg .ct { font-size: 12px; line-height: 16px; color: var(--mute); margin-top: 4px; }
.pg ul { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
.pg li { overflow-wrap: anywhere; }
.pg li .to { color: var(--text); font-weight: 500; }
.pg .cut { font-size: 12px; color: var(--mute); }
a.orig { align-self: flex-start; color: var(--sub); font-size: 13px; text-underline-offset: 4px; }
a.orig:hover { color: var(--text); }

@media (max-width: 400px) {
  .grid { grid-template-columns: 20px 36px minmax(0, 1fr) 76px 44px 44px; }
  .tiers { gap: 12px; }
}

/* 승률표 안의 보기 전환: 전체 순위 / 추천 / 변동 */
.modes { display: flex; gap: 16px; padding: 12px 4px 0; }
.modes button { font-size: 13px; color: var(--mute); padding: 4px 0; transition: color 140ms var(--ease); }
.modes button:hover { color: var(--sub); }
.modes button[aria-pressed="true"] { color: var(--text); font-weight: 500; }
.head.static button { pointer-events: none; }
#list li.sect { border-bottom: 1px solid var(--line); padding: 24px 0 8px; display: flex; flex-direction: column; gap: 4px; }
#list li.sect:first-child { padding-top: 12px; }
.sect .st { font-size: 15px; font-weight: 500; }
.sect .sd { font-size: 12px; line-height: 16px; color: var(--mute); }
#list li.none { padding: 12px 0; color: var(--mute); font-size: 13px; }
.num.up { color: var(--up); }
.num.down { color: var(--down); }
/* 스킬 */
.skills { display: flex; flex-direction: column; gap: 12px; }
.skbar { display: flex; gap: 8px; }
.skbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 44px; }
.skbtn .ico {
  display: block; width: 44px; height: 44px; border-radius: 8px;
  background: var(--raise-2); overflow: hidden;
  transition: box-shadow 140ms var(--ease);
}
.skbtn .ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.skbtn .key { font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--mute); }
.skbtn[aria-pressed="true"] .ico { box-shadow: 0 0 0 2px var(--brass); }
.skbtn[aria-pressed="true"] .key { color: var(--text); }
.skinfo { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.skinfo .sn { font-size: 15px; font-weight: 500; }
.skinfo .sn .k { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--mute); margin-right: 8px; }
.skinfo .nums { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; line-height: 16px; color: var(--mute); }
.skinfo .nums b { font-family: var(--mono); font-weight: 400; color: var(--sub); }
.skinfo .sd { margin: 0; font-size: 13px; line-height: 20px; color: var(--sub); }
.skills .note { margin: 0; font-size: 12px; line-height: 16px; color: var(--mute); }
/* 승률 추이 그래프 */
.trend svg { display: block; width: 100%; height: auto; overflow: visible; }
.trend text { font-family: var(--mono); font-size: 10px; fill: var(--mute); }
.trend .ref { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 2 3; }
.trend .ln { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.trend .pt { fill: var(--sub); }
.trend .end { fill: var(--text); }
.trend .val { fill: var(--text); font-size: 11px; }
.trend p { margin: 0; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span id="h1a">와일드리프트</span> <span id="h1b">정보</span></h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko" lang="ko">한국어</button>
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="zh" lang="zh">中文</button>
    </div>
  </header>

  <nav class="views" id="views">
    <button type="button" data-view="stats"></button>
    <button type="button" data-view="patch"></button>
  </nav>

  <div id="view-patch" hidden></div>

  <div id="view-stats">
  <div class="modes" id="modes"></div>
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="row2">
      <div class="tiers" id="tiers"></div>
      <input id="q" type="search" autocomplete="off">
    </div>
  </div>

  <div class="grid head" id="head">
    <span style="text-align:center">#</span><span></span><span id="col-champ"></span>
    <button type="button" data-sort="1"></button>
    <button type="button" data-sort="2"></button>
    <button type="button" data-sort="3"></button>
  </div>
  <ol id="list"></ol>

  <footer>
    <span id="foot1"></span>
    <span id="foot2"></span>
  </footer>
  </div>
</div>

<div class="scrim" id="scrim">

."],"x":1}]},{"n":"여신의 눈물","lv":4,"c":[{"t":"","l":["가격: 500골드 → 400골드","[삭제] 스킬 가속: 5"]}]},{"n":"삭제된 아이템","lv":4,"c":[{"t":"","l":["타오르는 불꽃과 마찬가지로, 새롭게 바뀐 환경에서는 더 이상 정글용 태양불꽃 방패가 필요하지 않기에 삭제됩니다.","화염 왕관","밀려오는 비늘은 늘 정체성이 명확하지 않은 아이템이었습니다. 능력치와 효과 모두 쇠사슬 조끼와 차별화하기에는 턱없이 부족한 수준이기에 이제는 보내 주려 합니다.","밀려오는 비늘","쐐기검 또한 마지막 사용자를 잃었으므로 일단은 삭제됩니다.","쐐기검","위 내용을 참고해 주세요.","화염 왕관"]}]}]},{"t":"룬 조정 사항","k":"etc","g":[{"n":"치명적 속도","lv":3,"c":[{"t":"","l":[],"x":1}]},{"n":"정복자","lv":3,"c":[{"t":"","l":["중첩당 얻는 능력치: 3~5의 추가 공격력/4~8의 주문력 (1.25~1.6배) → 3~5의 추가 공격력/5~8.33의 주문력 (1.667배로 통일)"]}]},{"n":"전설: 가속","lv":3,"c":[{"t":"","l":["전설: 강인함을 대체합니다.","적 처치에 관여하거나 몬스터 또는 미니언을 처치하면 1.5의 중첩되는 스킬 가속을 얻습니다. 이 효과로 최대 15의 스킬 가속을 얻을 수 있습니다."]}]},{"n":"철거","lv":4,"c":[{"t":"","l":["삭제된 아이템","삭제된 아이템"],"x":1}]}]},{"t":"전장 조정 사항","k":"etc","g":[{"n":"정글 조정","lv":3,"c":[]},{"n":"강타 조정","lv":3,"c":[{"t":"","l":["[삭제] 강타를 보유한 챔피언은 기본 공격과 스킬로 몬스터에게 추가 피해를 입힙니다.","[신규] 에픽 몬스터 외의 몬스터가 강타를 보유한 챔피언에게 50%의 피해만을 입힙니다.","[삭제] 강타 사용 시 체력을 회복합니다.","[신규] 대형 몬스터를 처치한 챔피언은 100~260의 체력을 회복합니다. (몬스터 레벨에 비례, 9레벨에 최대치)"],"x":1}]},{"n":"정글 골드 흐름 조정","lv":3,"c":[{"t":"","l":["강타를 보유한 챔피언은 20초마다 1회의 적립 중첩을 얻습니다. 정글 캠프를 처치할 때마다 중첩 1회를 소모해 45골드를 추가로 획득합니다. (최대 3회 중첩)","강타를 보유한 챔피언은 공격로에서 30~100%의 경험치를 얻습니다. 이 수치는 분 단위로 상승하며, 게임 시간 15분에 100%가 됩니다.","강타를 보유하지 않은 챔피언은 몬스터로부터 50~80%의 경험치만을 얻습니다. 이 수치는 분 단위로 상승하며, 게임 시간 12분에 80%가 됩니다."],"x":1}]},{"n":"강타 업그레이드 규칙","lv":3,"c":[{"t":"","l":["최초 피해량: 600의 고정 피해","적립 중첩을 소모하면 강타가 업그레이드됩니다.","중첩 8회 소모:","1,000의 고정 피해를 입히도록 업그레이드됩니다.","중첩 20회 소모:","1,400의 고정 피해를 입히도록 업그레이드됩니다.","이후 30초마다 적립 중첩을 1회씩 얻습니다.","정글과 강가에서 5%의 추가 이동 속도를 얻습니다. (비전투 시 10%로 증가)","각 정글 캠프에서 20골드를 추가로 획득합니다."]}]},{"n":"정글 몬스터 규칙","lv":3,"c":[{"t":"","l":["원소 드래곤 (5~15레벨):","체력 4,900~10,900, 공격력 70, 방어력 59~119, 마법 저항력 41~81","협곡의 전령 (5~15레벨):","체력 7,100~11,100, 공격력 100~200, 방어력 79~139, 마법 저항력 52~82","소환된 협곡의 전령 (5~15레벨):","체력 5,300~7,300, 공격력 80~130, 방어력 54~114, 마법 저항력 32~62","소환된 협곡의 전령 돌진 시 지급하는 골드: 200골드 → 50골드","내셔 남작 (9~15레벨):","체력 14,000~18,500, 공격력 280~490, 방어력 96~168, 마법 저항력 56~98","에너지 쇄도 공격력 계수: 60% → 30%"],"x":1}]},{"n":"전장 체계 조정","lv":3,"c":[]},{"n":"포탑","lv":3,"c":[]},{"n":"수정 과잉성장","lv":3,"c":[{"t":"","l":["이제 공격을 가할 수 있는 모든 공격로 포탑에 수정 과잉성장이 적용됩니다.","포탑에는 시간이 지남에 따라 점차 수정이 자라며, 챔피언에게 처음으로 기본 공격을 받으면 자란 수정이 모두 폭발해 고정 피해를 받습니다.","포탑을 공격하는 팀의 평균 레벨이 높을수록 수정 폭발의 피해량도 증가합니다.","재사용 대기시간: 수정 과잉성장은 포탑이 생성된 직후 50초간 재사용 대기에 들어갑니다. 50초가 지나고 나면 수정이 자라기 시작합니다.","최소 피해량: 포탑 최대 체력의 2~8.7% (공격하는 팀의 레벨에 비례)","최대 피해량: 포탑 최대 체력의 3.3~18.9% (공격하는 팀의 레벨에 비례)","외곽 포탑이 아직 남아 있을 때는 내부 포탑과 억제기 포탑에 수정 과잉성장이 적용되지 않으며, 외곽 포탑이 파괴된 뒤부터 수정이 자라기 시작합니다.","포탑의 공격 사거리 내에 미니언이 없고 포탑이 받는 피해가 감소한 상태일 때는 수정을 폭발시킬 수 없습니다."],"x":1}]},{"n":"포탑 체계 조정","lv":3,"c":[]},{"n":"포탑 조정","lv":4,"c":[{"t":"","l":["모든 포탑","[신규] 모든 포탑은 근접 챔피언으로부터 20% 증가한 피해를 받습니다.","포탑 방패 적용 대상: 외곽 포탑, 내부 포탑, 억제기 포탑","이제 포탑 방패가 영구적으로 유지됩니다.","포탑 방패는 포탑의 체력이 90/75/55/30/0%에 도달할 때마다 하나씩 파괴됩니다.","[삭제] 이제 외곽/내부 포탑이 파괴되어도 해당 공격로의 내부/억제기 포탑이 30초간 보호막을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 2분 동안 내셔 남작 공격로와 중단 공격로의 포탑이 50의 추가 방어력 및 마법 저항력을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 6분 동안 외곽 포탑이 남은 체력에 비례하는 추가 방어력 및 마법 저항력을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 5분 동안 공격 사거리 내에 다수의 적 챔피언이 있어도 포탑이 추가 능력치를 얻지 않습니다.","[신규] 게임 시간 5분부터 외곽 포탑의 방어력, 마법 저항력, 포탑 방패 골드가 4회에 걸쳐 감소하기 시작합니다."],"x":1}]},{"n":"게임 흐름 조정","lv":3,"c":[{"t":"","l":["근접 미니언:","챔피언으로부터 받는 피해 감소량: 50~70% (게임 시간 11~25분)","미니언으로부터 받는 피해 감소량: 80%","공격력 증가량: 10","포탑으로부터 받는 피해 감소량: 25%","원거리 미니언:","챔피언으로부터 받는 피해 감소량: 50~70% (게임 시간 11~25분)","미니언으로부터 받는 피해 감소량: 20%","공격력 증가량: 30","포탑으로부터 받는 피해 감소량: 25%"],"x":1}]},{"n":"미니언","lv":3,"c":[]},{"n":"슈퍼 미니언 오라","lv":3,"c":[{"t":"","l":["포탑 1개 파괴:","방어력 35, 마법 저항력 35","포탑 2개 파괴:","방어력 35, 마법 저항력 35","공격력 15%","포탑 3개 파괴:","방어력 35, 마법 저항력 35","공격력 40%"]}]},{"n":"미니언 능력치","lv":3,"c":[{"t":"","l":["기본 체력: 800 → 1,100","구조물 대상 피해량: 게임 시간 23분에 최대치인 100% 도달 → 84%로 고정","[신규] 모든 미니언은 챔피언에게 60%의 피해를 입힙니다.","[신규] 미니언이 게임 시간 5분 30초부터 150초가 지날 때마다 25의 이동 속도를 얻습니다. (최대 6회 중첩)","[삭제] 이제 미니언이 게임 시간 11분부터 분당 10%의 비전투 시 이동 속도를 얻지 않습니다.","미니언 경험치 획득 거리: 8 → 10"]}]},{"n":"미니언 공격로 압박 버프","lv":3,"c":[{"t":"","l":["[신규] 미니언 대상 추가 피해량: (5% + (공격로 내 포탑 우위의 5%)) × 팀 평균 레벨 우위","[신규] 미니언 대상 피해 감소량: 1 + (공격로 내 포탑 우위 × 팀 평균 레벨 우위)"]}]},{"n":"생명력 흡수","lv":3,"c":[{"t":"","l":[],"x":1}]}]},{"t":"기타 게임 내 요소 조정","k":"etc","g":[{"n":"훈련 캠프","lv":3,"c":[{"t":"","l":["이제 연습 모드에서 어디서든 상점을 사용할 수 있습니다. 아이템 구매, 구매 취소, 판매 등이 가능합니다."]}]},{"n":"사용자 설정 모드","lv":3,"c":[{"t":"","l":["새로운 사용자 설정 모드인 대결 사용자 설정이 추가됩니다. 두 플레이어가 칼바람 나락 맵에서 1대1 대결을 펼치는 모드입니다."]}]},{"n":"소환사의 협곡","lv":3,"c":[{"t":"","l":["이제 플레이어가 기지 내에서 아이템을 구매할 수 있는 위치에 있으면 골드 표시가 강조됩니다.","이제 기지 내에 있을 때 아이템 가격 차가 표시됩니다.","원소 드래곤이 생성 대기 중일 때 둥지 위를 맴도는 그림자가 표시됩니다."]}]},{"n":"게임 내 핵심 아이템 추천","lv":3,"c":[]}]},{"t":"모험 모드","k":"etc","g":[{"n":"전투 축제 S7","lv":3,"c":[]},{"n":"무무무작위 총력전","lv":3,"c":[]},{"n":"테마 증강","lv":3,"c":[]},{"n":"HEARTSTEEL","lv":4,"c":[]},{"n":"True Damage","lv":4,"c":[]},{"n":"펜타킬 강림","lv":4,"c":[]},{"n":"음파 시즌 테마","lv":3,"c":[]},{"n":"신규 아이템","lv":3,"c":[]},{"n":"끝없는 갈망","lv":4,"c":[]},{"n":"불경한 히드라","lv":4,"c":[]},{"n":"강철의 영약","lv":4,"c":[]},{"n":"마법의 영약","lv":4,"c":[]},{"n":"분노의 영약","lv":4,"c":[]},{"n":"증강 목록 조정","lv":3,"c":[]},{"n":"증강 조정","lv":3,"c":[]}]},{"t":"시스템","k":"etc","g":[{"n":"신규 시스템","lv":3,"c":[]},{"n":"신규 시즌 시작","lv":3,"c":[{"t":"","l":["S 등급보다 높은 전설 S 등급이 추가됩니다. 이 등급을 달성한 플레이어는 랭크 불굴 포인트를 추가로 받습니다.","랭크 및 전설 랭크 게임의 종료 후 평가 인터페이스가 업데이트되어 플레이어의 성적을 더 명확하게, 종합적으로 확인할 수 있게 됩니다.","이번 평가 시스템 변경 사항은 랭크 및 전설 랭크 게임에만 적용됩니다."],"x":1}]},{"n":"전설 랭크","lv":3,"c":[{"t":"","l":["전설의 시험 이벤트가 추가됩니다. 이제 우수한 성적으로 주어진 도전을 완료하면 즉시 전설의 마스터로 승급할 수 있습니다.","지역별 전설 랭크 순위표가 추가됩니다. 능력만 된다면 이제 자신의 실력을 과시하며 더욱 치열한 경쟁으로 영광을 누릴 수 있습니다.","챔피언별로 전설 랭크 지수의 한도를 잠금 해제하는 기능이 추가됩니다. 해당하는 챔피언으로 순수 승리 횟수를 쌓으면 그 전설 랭크 지수의 상한이 점차 증가합니다.","이제 게임에서 패배해도 챔피언 점수가 차감되지 않습니다. 규정을 위반한 경우를 제외하면 챔피언 점수는 계속해서 오르기만 합니다.","챔피언 게임 성적 점수가 랭크 성적 점수로 대체됩니다. 이제 이 점수는 랭크 게임을 통해서만 획득할 수 있습니다.","전설의 도전에 관련된 변수와 값 또한 최적화됩니다.","지난 시즌 성과에 대한 점수 "t":"","l":["Price: 500 → 400","[Removed] 5 Ability Haste"]}]},{"n":"Items Removed","lv":4,"c":[{"t":"","l":["Like Shimmering Spark, with the new jungle system, we no longer need a jungle-specific version of Sunfire Aegis.","Searing Crown","Surging Scales","Stinger has also lost its last remaining user, so we're removing it for now.","Stinger","See above.","Searing Crown"],"x":1}]}]},{"t":"RUNE ADJUSTMENTS","k":"etc","g":[{"n":"Lethal Tempo","lv":4,"c":[{"t":"","l":[],"x":1}]},{"n":"Conqueror","lv":4,"c":[{"t":"","l":[],"x":1}]},{"n":"Legend: Haste","lv":4,"c":[{"t":"","l":["Replaces Legend: Tenacity","Takedowns and killing monsters and minions grant Ability Haste, up to a maximum of 15 Ability Haste, with each stack granting 1.5 Ability Haste."]}]},{"n":"Demolish","lv":4,"c":[{"t":"","l":[],"x":1}]},{"n":"Ingenious Hunter","lv":4,"c":[{"t":"","l":["Removed","Removed"]}]}]},{"t":"BATTLEFIELD ADJUSTMENTS","k":"etc","g":[{"n":"Jungle Adjustments","lv":3,"c":[]},{"n":"Smite Adjustments","lv":4,"c":[{"t":"","l":["[Removed] Champions with Smite deal bonus ability and basic attack damage to monsters.","[New] Non-epic monsters deal 50% damage to champions with Smite.","[Removed] Casting Smite restores Health.","[New] Killing a large monster restores 100–260 Health to the killer (scales with monster level, reaching the maximum at level 9)."],"x":1}]},{"n":"Jungle Economy Adjustments","lv":4,"c":[{"t":"","l":["Champions with Smite gain 30% - 100% of lane experience, increasing over time once per minute and reaching 100% at 15 minutes.","Champions without Smite gain only 50% - 80% experience from monsters, increasing over time once per minute and reaching 80% at 12 minutes."],"x":1}]},{"n":"Smite Upgrade Rules","lv":4,"c":[{"t":"","l":["Initial damage: 600 true damage","Upgrade Smite by consuming Eco-system Protection stacks.","Consume 8 total stacks.","Upgrade to 1000 true damage.","Consume 20 total stacks.","Upgrade to 1400 true damage.","Afterward, gain 1 Eco-system Protection stack every 30 seconds.","Gain 5% bonus Movement Speed in the jungle and river, increased to 10% while out of combat.","Gain an additional 20 bonus gold from each jungle camp."]}]},{"n":"Jungle Monster Rules","lv":4,"c":[{"t":"","l":["Elemental Dragons (levels 5 - 15):","Health 4900 - 10900, Attack Damage 70, Armor 59 - 119, Magic Resistance 41 - 81","Rift Herald (levels 5 - 15):","Health 7100 - 11100, Attack Damage 100 - 200, Armor 79 - 139, Magic Resistance 52 - 82","Summoned Rift Herald (levels 5 - 15):","Health 5300 - 7300, Attack Damage 80 - 130, Armor 54 - 114, Magic Resistance 32 - 62","Gold granted when the Summoned Rift Herald charges: 200 → 50","Baron Nashor (levels 9 - 15):","Health 14000 - 18500, Attack Damage 280 - 490, Armor 96 - 168, Magic Resistance 56 - 98","Energy Surge Attack Damage ratio: 60% → 30%"],"x":1}]},{"n":"Battlefield system Adjustments","lv":3,"c":[]},{"n":"Turrets","lv":4,"c":[]},{"n":"Crystalline Overgrowth","lv":4,"c":[{"t":"","l":["All attackable lane turrets are now affected by Crystalline Overgrowth.","Turrets crystallize over time. A champion's first basic attack detonates all accumulated crystals, dealing True Damage.","The higher the average level of the attacking team, the higher the crystal detonation damage.","Cooldown: After a turret spawns, Crystalline Overgrowth has a 50-second cooldown. Once the cooldown ends, crystals begin to accumulate.","Minimum damage: 2%–8.7% of the turret's maximum Health (based on the attacking team's level)","Maximum damage: 3.3%–18.9% of the turret's maximum Health (based on the attacking team's level)","When no minions are within turret range and the turret's damage reduction is active, the crystals cannot be detonated."],"x":1}]},{"n":"Turret Related Adjustments","lv":4,"c":[]},{"n":"Turret Adjustments","lv":5,"c":[{"t":"","l":["All Turrets","[New] All turrets take 20% increased damage from melee champions.","Turret plating distribution: Outer turrets, inner turrets, and inhibitor turrets.","Turret plating now persists permanently.","Turret plates are tied to Health thresholds. A turret loses 1 plate whenever its Health falls below 90%, 75%, 55%, 30%, and 0%.","[Removed] When an outer/inner turret is destroyed, the corresponding inner/inhibitor turret no longer gains a 30-second shield.","[Removed] During the first 2 minutes of the game, Baron Lane and Mid Lane turrets no longer gain 50 bonus Armor and Magic Resist.","[Removed] During the first 6 minutes of the game, outer turrets no longer gain Armor and Magic Resist based on their remaining Health.","[Removed] During the first 5 minutes of the game, turrets no longer gain bonus stats when multiple enemy champions are within their attack range.","[New] Starting at 5:00, outer turret Armor, Magic Resistance, and turret plate Gold rewards begin to decay, up to 4 times."],"x":1}]},{"n":"Battlefield Tempo Adjustments","lv":3,"c":[{"t":"","l":["Melee Minions:","Reduced damage from champions: 50% - 70% (11:00 - 25:00)","Reduced damage from minions: 80%","Attack Damage increase: 10","Reduced damage from turrets: 25%","Caster Minion:","Reduced damage from champions: 50% - 70% (11:00 - 25:00)","Reduced damage from minions: 20%","Attack Damage increase: 30","Reduced damage from turrets: 25%"],"x":1}]},{"n":"Minions","lv":4,"c":[]},{"n":"Super Minion Aura","lv":4,"c":[{"t":"","l":["1 Turret:","35 Armor, 35 Magic Resistance","2 Turrets:","35 Armor, 35 Magic Resistance","Attack Damage: 15%","3 Turrets:","35 Armor, 35 Magic Resistance","Attack Damage: 40%"]}]},{"n":"Minion Stats","lv":4,"c":[{"t":"","l":["Base Health: 800 → 1100","Damage to structures: Reaches a maximum of 100% at 23:00 → Fixed at 84%","[New] All minions deal 60% damage to champions.","[New] Starting at 5:30, minions gain 25 Movement Speed every 150 seconds, up to 6 times.","[Removed] Starting at 11:00, minions no longer gain 10% out-of-combat Movement Speed per minute.","Minion experience range: 8 → 10"]}]},{"n":"Minion Push Buffs","lv":4,"c":[{"t":"","l":["[New] Bonus damage to minions: (5% + (5% × turret advantage in the lane)) × team average level advantage","[New] Damage reduction against minions: 1 + (turret advantage in the lane × team average level advantage)"]}]},{"n":"Lifesteal","lv":3,"c":[{"t":"","l":[],"x":1}]},{"n":"OTHER IN-GAME ADJUSTMENTS","lv":3,"c":[]},{"n":"Training Camp","lv":3,"c":[{"t":"","l":["You can now interact with the shop from anywhere in Practice Mode, including buying items, undoing purchases, and selling items."]}]},{"n":"Custom Mode","lv":3,"c":[{"t":"","l":["Added a new custom game mode: Rift Trials, where two players face off in a 1v1 on the Baron Lane of Summoner's Rift."]}]},{"n":"Summoner’s Rift","lv":3,"c":[{"t":"","l":["When players are within the item purchase area at their base, the Gold display will now be highlighted.","Item price differences can now be displayed while within the base.","When an Elemental Dragon is about to spawn, its shadow can be seen circling above its spawn location."]}]},{"n":"In-Game Key Item Recommendations","lv":3,"c":[]}]},{"t":"Adventure Mode","k":"etc","g":[{"n":"Battlefest S7","lv":3,"c":[]},{"n":"AAA ARAM","lv":3,"c":[]},{"n":"Themed Augments","lv":4,"c":[]},{"n":"Heartsteel","lv":4,"c":[]},{"n":"True Damage","lv":4,"c":[]},{"n":"Rock ‘n’ Pentakill","lv":4,"c":[]},{"n":"Sonic Waves Season Theme","lv":3,"c":[]},{"n":"New Items","lv":3,"c":[]},{"n":"Endless Hunger","lv":4,"c":[]},{"n":"Profane Hydra","lv":4,"c":[]},{"n":"Elixir of Iron","lv":4,"c":[]},{"n":"Elixir of Sorcery","lv":4,"c":[]},{"n":"Elixir of Wrath","lv":4,"c":[]},{"n":"Augment pool Adjustments","lv":4,"c":[]},{"n":"Augments Adjustments","lv":4,"c":[]}]},{"t":"SYSTEM","k":"etc","g":[{"n":"NEW SYSTEM","lv":3,"c":[]},{"n":"New Season Begins","lv":3,"c":[{"t":"","l":["Added a new rating above S: Legendary S. Players who earn a Legendary S rating will also receive additional Ranked Fortitude.","Updated the post-game evaluation interface for Ranked and Legendary Ranked to pr 貢獻，讓MVP結果能更真實反映玩家的實際表現。","新增一個比S級更高的評分等級：傳說S級。獲得傳說S級評分的玩家會獲得額外積分韌性。","更新積分對戰與傳奇積分對戰的賽後評分介面，讓玩家能更清楚、全面地總覽對戰表現。","以上評分系統改動僅適用於積分對戰和傳奇積分對戰。"],"x":1}]},{"n":"傳奇積分對戰","lv":3,"c":[]},{"n":"我們將更新傳奇積分對戰，鼓勵更多技術高強的玩家加入競爭，並幫助你更快達到最能展現實力的層級。我們會調整進入條件、晉升流程和積分系統，讓登上巔峰的過程更加順暢且更有成就感。","lv":3,"c":[{"t":"","l":["降低參賽門檻：本賽季達到大師的玩家，或是上賽季達到宗師以上的玩家，都能夠參加傳奇積分對戰。","新增了傳奇試煉活動。表現出色並完成指定挑戰，即可直接晉升至傳奇大師。","新增地區傳奇積分排行榜，讓技巧高超的玩家有更多機會展現實力並爭取榮耀。","調整較高牌階的積分系統。當玩家達到更高牌階時，必須維持更高的勝率才能繼續爬分，進一步提升高牌階的競爭價值。","已移除傳奇積分表現分數，但保留傳奇積分加成。你的傳奇積分牌階越高，加成也會越高。傳奇積分加成數值也大幅提升。","為傳奇積分加成加上了英雄解鎖機制。玩家必須用某位英雄累積淨勝場數，才能逐步解鎖該英雄的傳奇積分加成。","英雄戰績分數將不再因落敗而降低。除非涉及違規情形，否則英雄戰績分數只會增加。","英雄表現分數已更名為積分對戰表現評分。在這次調整後，此評分只能透過積分對戰獲得。","傳奇積分挑戰的對應加成和數值已重新調整改善。","移除了上一賽季傳承分數加成，新增了多樣專精分數加成。"],"x":1}]},{"n":"禁角系統規則調整","lv":3,"c":[{"t":"","l":["在白金到鑽石的積分對戰中，戰隊的禁用英雄數量將從每隊三個增加到每隊五個。"],"x":1}]},{"n":"隊友增幅裝置推薦","lv":4,"c":[]}]},{"t":"附錄","k":"etc","g":[{"n":"英雄續戰力調整詳細列表","lv":3,"c":[]},{"n":"蓋倫","lv":4,"c":[{"t":"","l":["基礎生命：660 → 690","基礎物防：52 → 44","每級物防：5.8 → 5"]}]},{"n":"厄薩斯","lv":4,"c":[{"t":"","l":["每級物防：4.5 → 5","基礎魔防：40 → 36"]}]},{"n":"雷葛爾","lv":4,"c":[{"t":"","l":["基礎生命：660 → 630","每級生命成長：128 → 136"]}]},{"n":"阿姆姆","lv":4,"c":[{"t":"","l":["每級生命成長：104 → 114"]}]},{"n":"努努和威朗普","lv":4,"c":[{"t":"","l":["基礎生命：690 → 630","每級生命成長：120 → 124"]}]},{"n":"艾克","lv":4,"c":[{"t":"","l":["基礎生命：630 → 650","每級生命成長：120 → 126"]}]},{"n":"卡力斯","lv":4,"c":[{"t":"","l":["基礎生命：630 → 640","每級生命成長：120 → 128"]}]},{"n":"趙信","lv":4,"c":[{"t":"","l":["基礎生命：690 → 650","每級物防：4.3 → 4.7","每級生命成長：120 → 130"]}]},{"n":"赫克林","lv":4,"c":[{"t":"","l":["基礎物防：46 → 42","每級物防：5 → 5.4","每級生命成長：120 → 130"]}]},{"n":"布郎姆","lv":4,"c":[{"t":"","l":["基礎生命：690 → 630","基礎物防：52 → 46","每級生命成長：120 → 136"]}]},{"n":"燼","lv":4,"c":[{"t":"","l":["基礎生命：600 → 630"]}]},{"n":"伊芙琳","lv":4,"c":[{"t":"","l":["基礎生命：600 → 630"]}]},{"n":"阿卡莉","lv":4,"c":[{"t":"","l":["每級生命成長：140 → 150"]}]},{"n":"潘森","lv":4,"c":[{"t":"","l":["基礎生命：690 → 660","基礎物防：52 → 48","每級生命成長：120 → 132"]}]},{"n":"菲歐拉","lv":4,"c":[{"t":""," champions. On activation, he dashes in a direction."],["World Ender","Aatrox unleashes his demonic form, fearing nearby enemy minions and gaining attack damage, increased healing, and Move Speed. If he gets a takedown, this effect is extended."]],"zh":[["冥使劍姿","每隔一段時間，厄薩斯的下一次普攻會造成額外物理傷害並治療自身，傷害與治癒量取決於目標的最大生命。"],["冥血邪劍","厄薩斯猛力揮砍大劍，造成物理傷害。最多可揮砍3次，每次都有不同的技能範圍。"],["冥府血鏈","厄薩斯猛擊地面，對首位命中的敵軍造成傷害。若技能範圍內的敵方英雄和大型野怪未能及時逃離，就會被拉回中心，再次受到傷害。"],["冥影衝鋒","被動：厄薩斯對敵方英雄造成傷害時回復自身生命。施放技能時則會朝指定方向衝刺。"],["劍魔滅世","厄薩斯化身為惡魔形態，對附近的敵方士兵造成恐懼效果，並增加物理傷害、治療量以及跑速。若厄薩斯在此狀態下取得擊殺或助攻，技能效果將延長。"]],"n":[["0",""],["12/10/8/6",""],["15/14/13/12",""],["8/7/6/5",""],["75/65/55",""]]},"10003":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/090fd8465f3f506ab1ddc5b2ae884acfa34aaa69-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3f3f744d2a2730e5bf6b7d507f88cc641cc67312-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/2c683da61dd7cc7bbba29448bf89b670339c1b16-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/72411e62eff9d511b01253d60225dcb1207dcba0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/681b7dc3ab435f7684ac5288272dce4c88ba0807-96x96.jpg"],"ko":[["광채","럭스의 공격 스킬은 5초 동안 적을 빛의 에너지로 가득 채웁니다. 럭스의 기본 공격으로 이 에너지를 불태우면 적은 럭스의 레벨에 비례하는 추가 마법 피해를 받습니다."],["빛의 속박","럭스가 빛의 구를 발사하여 최대 2명의 적 유닛을 속박하며 피해를 입힙니다."],["프리즘 보호막","럭스가 마법봉을 던져 아군 주변의 빛을 구부리며 적의 공격으로부터 보호해줍니다."],["광휘의 특이점","지정한 지역에 뒤틀린 빛의 구체를 띄워 주변 적의 속도를 늦춥니다. 럭스는 이 빛을 폭발시켜 피해를 입힐 수 있습니다."],["최후의 섬광","럭스가 에너지를 모아 빛 기둥을 발사하며 목표 지역에 있는 모든 대상에게 피해를 입힙니다. 또한 이는 럭스의 기본 지속 효과 스킬을 발동시키고 광채 효과의 지속시간을 갱신합니다."]],"en":[["Illumination","Lux's damaging spells charge the target with energy for 5 seconds. Lux's next attack ignites the energy, dealing bonus magic damage (depending on Lux's level) to the target."],["Light Binding","Lux releases a sphere of light that binds and deals damage to up to two enemy units."],["Prismatic Barrier","Lux throws her wand and bends the light around any friendly target it touches, protecting them from enemy damage."],["Lucent Singularity","Fires an anomaly of twisted light to an area, which slows nearby enemies. Lux can detonate it to damage enemies in the area of effect."],["Final Spark","After gathering energy, Lux fires a beam of light that deals damage to all targets in the area. In addition, triggers Lux's passive ability and refreshes the Illumination debuff duration."]],"zh":[["光芒四射","拉克絲的傷害技能會標記目標5秒。拉克絲的下次普攻會引燃敵人，對目標造成額外魔法傷害（傷害量取決於拉克絲的等級）。"],["光明束縛","拉克絲釋放出一個光球，束縛並傷害最多兩個敵方單位。"],["稜光障壁","拉克絲丟出她的魔杖，並扭曲魔杖所接觸的任何友方目標周圍光線，保護這些友軍不受敵方攻擊。"],["光明異點","朝一個區域發射一個不規則的扭曲之光，使鄰近敵人緩速。拉克絲可以直接引爆它，在範圍內對敵人造成傷害。"],["終極閃光","在積蓄能量之後，拉克絲發射一道光束，對區域內所有敵方目標造成傷害。此外，此技能將觸發拉克絲的被動技能並刷新光芒四射減益效果的持續時間。"]],"n":[["0",""],["9/9/9/9",""],["12/11/10/9",""],["9/9/8/8",""],["55/45/40",""]]},"10004":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/05075a2bfe7f8d885be0e9237738c055dcd4e4b1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/72c747828b9206739fe60fb4653341df0ab3df12-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/01fccf6c11aee0d7b5a4602fd3c2c6ed5591ab62-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/38640333263d6002d9b1911ec7eda5f742e3ea33-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7a597597108f944a0001191562201d85e31e895c-96x96.jpg"],"ko":[["저주의 손길","아무무의 기본 공격을 받은 대상은 저주에 걸려 마법 피해를 입을 때마다 추가 고정 피해를 받습니다."],["붕대 던지기","아무무가 끈적끈적한 붕대를 던져 적을 기절시키고 피해를 입히며 가까이 이동합니다."],["절망","적이 절망으로 인해 매 초마다 최대 체력에 비례한 피해를 입고 저주가 초기화됩니다."],["짜증내기","아무무가 받는 물리 피해를 영구적으로 감소시킵니다. 활성화 시 아무무가 주변 적에게 분노를 방출합니다. 아무무가 공격당할 때마다 짜증내기의 재사용 대기시간이 0.5초씩 감소합니다."],["슬픈 미라의 저주","아무무가 붕대로 주변 유닛을 휘감아 저주를 내리고 공격과 이동을 막으며 피해를 입힙니다."]],"en":[["Cursed Touch","Amumu's basic attacks Curse his enemies, causing them to take bonus true damage from incoming magic damage."],["Bandage Toss","Amumu tosses a sticky bandage at a target, stunning and damaging the target while he pulls himself to them."],["Despair","Overcome by anguish, nearby enemies lose a percentage of their maximum Health each second and have their Curses refreshed."],["Tantrum","Permanently reduces the physical damage Amumu would take. Amumu can unleash his rage, dealing damage to surrounding enemies. Each time Amumu is hit, the cooldown on Tantrum is reduced by 0.5 seconds."],["Curse of the Sad Mummy","Amumu entangles surrounding enemy units in bandages, applying his Curse, damaging them and rendering them unable to attack or move."]],"zh":[["詛咒之觸","阿姆姆的普攻會詛咒敵人，使其受到任何魔法傷害時將承受額外真實傷害。"],["繃帶牽引","阿姆姆對一個目標丟出黏性繃帶，在擊暈、傷害目標的同時將自己拉往目標。"],["絕望","周圍敵人陷入絕望，每秒損失相當於其最大生命一定百分比的生命，並刷新他們身上的詛咒。"],["憤怒","永久降低阿姆姆受的物理傷害。阿姆姆可以釋放怒火，對鄰近敵人造成傷害。阿姆姆每被攻擊一次，該技能的冷卻時間就會減少0.5秒。"],["木乃伊之咒","阿姆姆用繃帶將附近敵方單位通通纏住，對目標造成傷害，使其無法攻擊或移動，並在他們身上附加詛咒。"]],"n":[["0",""],["3/3/3/3",""],["1/1/1/1",""],["9/8/7/6",""],["105/95/85",""]]},"10005":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/42bfe3e43b846f48326334e3f06e43b2e26e3070-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d9065eefc982731bf93850a9698306611bab3635-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6e58bb982cc87c720515d5866e5061c8fbb20a99-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6381df16d124bc02207544718e46c8afc16f6ad9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4105acd0d152cbe7cc8989d57dc16ee0e4fc692d-96x96.jpg"],"ko":[["다르킨의 낫","케인은 다르킨 무기 라아스트를 휘두르는 한편 제압하려고 하고, 라아스트는 케인을 잠식하려 합니다. 다르킨이 승리하거나, 아니면 케인이 라아스트를 제압해 그림자 암살자가 될 수도 있습니다. 다르킨: 챔피언에게 가한 스킬 피해에 비례해 체력을 회복합니다. 그림자 암살자: 적 챔피언과 전투 시작 후 첫 몇 초 동안 추가 피해를 입힙니다."],["살상돌격","케인이 앞으로 돌진하며 적을 공격합니다. 돌진 및 공격 시 모두 피해를 입힙니다."],["몰아치는 낫","케인이 직선상의 대상 모두에게 피해를 입히고 둔화시킵니다."],["그림자의 길","케인이 지형을 통과해 이동할 수 있습니다."],["그림자의 지배","케인이 적에게 파고들었다가 빠져나오면서 큰 피해를 입힙니다."]],"en":[["The Darkin Scythe","Kayn wields an ancient weapon and fights Rhaast, the darkin within it, for control. Either the Darkin will triumph, or Kayn will master Rhaast and become the Shadow Assassin. Darkin: Heal for a percentage of spell damage dealt to champions. Shadow Assassin: For the first few seconds in combat with enemy champions, deal bonus damage."],["Reaping Slash","Kayn dashes, then slashes. Both deal damage."],["Blade's Reach","Kayn damages and slows targets in a line."],["Shadow Step","Kayn can walk through terrain."],["Umbral Trespass","Kayn hides in an enemy's body, dealing massive damage when he bursts out."]],"zh":[["冥血罪鐮","慨影揮舞著古老的武器，同時不斷與寄宿於武器之中的冥血族人勒哈斯特爭奪身體的控制權。不是冥血族人獲勝，就是慨影壓制住勒哈斯特並變為詭影刺客。冥血族裔：使用技能對英雄造成傷害時，依技能傷害回復一定百分比的生命。詭影刺客：與敵方英雄戰鬥的前幾秒內造成額外傷害。"],["獵魂斬","慨影向前衝刺，接著揮舞手中的鐮刀。衝刺的過程及最後攻擊時都會造成傷害。"],["散華刃","慨影對前方一直線上的敵軍造成傷害，並使其緩速。"],["夜叉行","慨影可以穿越地形物。"],["伏影滅","慨影潛入一名敵軍的軀體，脫離時造成大量傷害。"]],"n":[["0",""],["6/6/5/5",""],["12/11/10/9",""],["0/0/0/0",""],["80/70/60",""]]},"10006":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fe3944441fc21ae6cd5e5cee2ee0ac0b7e5e87fe-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8db8a6480c1c580365fed1ddfdae4e1296c5f475-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/58153a183007c4b43c36bedc6386cb2e706814ef-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ce817364650f8ca92bebe472c391511e667ff75d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3ef9f1ce11529afaae63a542796f2f2ea546cdb5-96x96.jpg"],"ko":[["보이지 않는 포식자","렝가가 수풀에서 기본 공격하면 대상에게 도약합니다. 개별 적 챔피언 처치 관여 시 렝가가 추가 공격력을 얻습니다. 렝가는 기본 스킬을 사용하면 기본 스킬을 강화해 주는 야성을 얻습니다. 강화 스킬을 사용하면 렝가가 일시적으로 추가 이동 속도를 얻습니다."],["포악함","렝가가 다음 몇 번의 기본 공격 시 공격 속도가 증가합니다. 첫 번째 기본 공격이 추가 물리 피해를 입히며 치명타로 적용되고 치명타 확률에 따라 피해량이 증가합니다. 야성: 렝가의 공격 속도가 더 증가하고 첫 번째 기본 공격이 더 높은 물리 피해를 입힙니다."],["전투의 포효","렝가가 주변 적에게 피해를 입히고 최근에 입은 피해의 일부만큼 자신의 체력을 회복합니다. 야성: 렝가가 피해를 더 입히고 자신에게 적용된 모든 군중 제어 효과를 해제합니다."],["올가미 투척","렝가가 올가미를 던져 물리 피해를 입히고 적중당한 적을 둔화시킵니다. 또한 올가미는 적을 드러내고 주변 지역의 시야를 제공합니다. 야성: 렝가가 피해를 더 입히고 대상을 속박합니다."],["사냥의 전율","일정 시간 렝가의 이동 속도가 증가하고 가장 가까운 적 챔피언의 모습을 드러냅니다. 잠시 후 렝가가 위장 상태가 되며 다음 기본 공격으로 대상의 방어력을 감소시킵니다."]],"en":[["Unseen Predator","Rengar leaps to his target when attacking if he is in the brush. Unique enemy champion takedowns grant him bonus Attack Damage. Casting basic abilities grants Rengar Ferocity which empowers his basic abilities. Casting empowered abilities briefly grants him bonus Movement Speed."],["Savagery","Rengar's next couple of attacks gain Attack Speed. The first attack deals additional physical damage and Critically Strikes, with Critical Strike Chance further increasing the damage. Ferocity: Rengar gains even more Attack Speed and the first attack deals even more physical damage."],["Battle Roar","Rengar damages nearby enemies and heals himself for some of the recent damage he has taken. Ferocity: Rengar deals more damage and removes all crowd control effects from himself."],["Bola Strike","Rengar throws a bola, dealing physical damage and slowing the target struck. The bola also reveals the target and grants vision of the surrounding area. Ferocity: Rengar deals more damage and roots the target."],["Thrill of the Hunt","Rengar gains movement speed and reveals the nearest enemy champion for a period of time. Shortly after casting Rengar becomes camoflauged with his next attack shredding the target's armor for a period of time."]],"zh":[["潛行怒獅","雷葛爾躲在草叢中時，普攻會跳起來向目標撲擊。 對不同敵方英雄的擊殺或助攻會賦予他額外物理攻擊。 施放基礎技能會賦予雷葛爾殘虐值，強化他的基礎技能。 施放強化技能會在短時間內賦予他額外跑速。"],["兇殘打擊","雷葛爾接下來幾次普攻會增加攻速。第一下普攻造成額外物理攻擊並會暴擊，且暴擊率會進一步提升傷害。 殘虐加成：雷葛爾提高攻速加成，且第一下普攻可造成更多物理傷害。"],["怒獅戰吼","雷葛爾對鄰近敵軍造成傷害，並回復近期受到傷害的一部分生命。 殘虐加成：雷葛爾造成更多傷害，並解除自身控場效果。"],["狩獵拋繩","雷葛爾丟出飛石絆索，造成物理傷害並使命中的目標緩速。絆索也會揭露目標並賦予周遭區域的視野。 殘虐加成：雷葛爾造成更多傷害並定身目標。"],["血性獵殺","雷葛爾增加跑速，並可揭露最近的敵方英雄行蹤一段時間。施放後數秒雷葛爾會偽裝自己，同時下一次普攻可在一段時間內削弱目標物理防禦。"]],"n":[["0",""],["5/5/4/4",""],["16/14/12/10",""],["10",""],["85/75/65",""]]},"10007":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7bfe4f9b39db557a2d72c7564a7bc9839c7eaf67-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b57d69fe63c9eca1358d5b65351c1ea1899a9bf3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/105c213510bac0bfc4ecf71fa9dd3f886bd7fe02-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3f31aa4a221a324cf354f23ac791f1852ffcf200-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/506c25ed03aa3b9ea6e5d43802b9895eb8c10433-96x96.jpg"],"ko":[["만트라","스킬을 세 번 사용하면 카르마의 다음 스킬이 강화됩니다."],["내면의 열정","카르마가 영적 에너지 구체를 발사합니다. 구체는 적 유닛에게 적중 시 폭발하며 피해를 입힙니다. 만트라 추가 효과: 폭발과 함께 내면의 열정이 가진 파괴력을 증가시킵니다. 잠시 후에 강력한 힘을 방출해 피해를 입힙니다."],["굳은 결의","카르마가 적을 두 명까지 자신과 연결합니다. 연결된 대상은 피해를 입고 위치가 드러납니다. 연결이 끊어지지 않으면 대상이 한 번 더 피해를 입고 속박됩니다. 만트라 추가 효과: 두 대상이 서로와 연결되어 추가 피해를 받고 속박 지속시간이 늘어납니다. 범위 내 적이 하나뿐이면 대상이 카르마와 두 번째로 가까운 적과 연결됩니다."],["고무","카르마가 보호막을 소환해 아군이 받는 피해를 흡수하고 대상의 이동 속도를 올려 줍니다. 만트라 추가 효과: 대상에게서 에너지가 흘러나와 보호막을 강화하고 주변 아군 챔피언들에게도 고무 효과를 줍니다."],["초월적 포용","카르마가 대상 지점에 영적 에너지 고리를 생성합니다. 잠시 후 고리가 폭발해 안에 있는 모든 적에게 마법 피해를 입히고 몇 초간 둔화시킵니다. 원 가장자리에서 적중당한 적은 중심을 향해 당겨집니다. 카르마가 즉시 만트라 상태에 들어갑니다."]],"en":[["Mantra","After using 3 abilities, Karma's next ability will be enhanced."],["Inner Flame","Karma sends forth a ball of spirit energy that explodes and deals damage upon hitting an enemy unit. Mantra Bonus: In addition to the explosion, Mantra increases the destructive power of her Inner Flame, creating a cataclysm which deals damage after a short delay."],["Focused Resolve","Karma creates a tether between herself and up to two targeted enemies dealing damage and revealing them. If the tethers are not broken, the enemies will be rooted and damaged again. Mantra Bonus: Karma creates an additional tether between the targets, dealing extra damage and extending the root duration. If only a single enemy is within range, a tether will spread from them to the next nearest enemy."],["Inspire","Karma summons a protective shield that absorbs incoming damage and increases the Move Speed of the protected ally. Mantra Bonus: Energy radiates out from her target, strengthening the initial shield and applying Inspire to nearby allied champions."],["Transcendent Embrace","Karma forms a ring of spirit energy at a target location. After a brief delay, it detonates, dealing magic damage to all enemies inside and slowing them for a few seconds. If enemies are hit at the edge of the ring, they will be pulled in toward the center. Karma immediately enters the Mantra state."]],"zh":[["真言符印","施放3次技能後，卡瑪下一次施放的技能會強化。"],["輪迴怒火","卡瑪發出一道精神能量光束，命中目標時會引爆，對敵軍造成傷害。真言符印加成：除了原有的技能效果外，可以提高輪迴怒火造成的傷害，同時再創造一個災禍空間，經過短暫的延遲後對其中的敵軍造成傷害。"],["特化鏈結","卡瑪製造一條能量鎖鏈連結自身與目標敵軍，對目標造成傷害並揭露其位置。若能量鎖鏈未被破壞，敵軍會被定身並再次受到傷害。真言符印加成：卡瑪在兩個目標之間額外製造一條能量鎖鏈，造成額外傷害並延長定身時間。若施放範圍之內只有一名敵軍，則該敵軍身上會生出另一條鎖鏈連結距離最近的另一名敵軍。"],["靈能啟示","卡瑪賦予友軍護盾，為其吸收傷害並增加跑速。真言符印加成：能量自目標向外溢散，強化初始護盾並對鄰近友軍附加靈能啟示效果。"],["飛昇擁抱","卡瑪在目標位置形成一個精神能量圓圈，短暫延遲後會引爆，對所有區域內敵軍造成魔法傷害與緩速維持數秒。若敵軍被擊中時位在圓圈邊緣，則會被拉向中心。施放此技能後卡瑪會立即進入真言符印狀態。"]],"n":[["0",""],["9/8/7/6",""],["15/15/15/15",""],["10/9/8/7",""],["70/65/60",""]]},"10008":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e8061f08256ca278b9238504f9dd822f029f2ad5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/150d836deaba6ad81b31700d5d2becba3a8850f8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/34fe6fa918a83a2702927a358cb96a26b488652d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1374b337f9c57b5408252ff2585810d657420dc0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e053ad79b9b5c2add0b525591e0e578d4527fd2e-96x96.jpg"],"ko":[["프렐요드의 부름","누누가 윌럼프와 주변 아군 1명의 공격 속도와 이동 속도를 증가시키고, 윌럼프의 기본 공격이 대상 근처의 적에게 피해를 줍니다."],["잡아먹기","윌럼프가 미니언, 몬스터, 또는 적 챔피언을 물어뜯어 피해를 입히고 체력을 회복합니다."],["데굴데굴 눈덩이!","윌럼프가 굴릴수록 크기와 속도가 증가하는 눈덩이를 생성합니다. 눈덩이는 적에게 피해를 입히고 공중으로 띄워 올립니다."],["눈덩이 팡팡팡","누누가 눈덩이를 난사해 적에게 피해를 입힙니다. 누누의 공격이 끝나면 윌럼프가 눈덩이에 맞은 챔피언이나 대형 몬스터를 속박합니다."],["절대 영도","누누와 윌럼프가 일정 범위에 강력한 눈보라를 생성하여 적을 둔화시키고 눈보라가 끝난 후 범위 내 적에게 큰 피해를 입힙니다."]],"en":[["Call of the Freljord","Nunu increases the attack speed and movement speed of Willump and a nearby ally, and causes Willump's basic attacks to damage enemies around the target."],["Consume","Willump takes a bite out of a minion, monster, or enemy champion, dealing damage and healing himself."],["Biggest Snowball Ever!","Willump creates a snowball that grows in size and speed as he rolls it. The snowball damages and knocks up enemies."],["Snowball Barrage","Nunu throws multiple snowballs that damage enemies. When he's finished, Willump roots any champions or large monsters that were hit by a snowball."],["Absolute Zero","Nunu & Willump create a powerful blizzard in an area that slows enemies and deals massive damage at the end."]],"zh":[["弗雷爾卓德之喚","努努提升威朗普和一名鄰近友軍的攻速和跑速，並使威朗普的普攻可以傷害目標周圍的敵軍。"],["吞噬","威朗普撕咬一個士兵、野怪或敵方英雄，對目標造成傷害並回復自身生命。"],["巨無霸雪球！","威朗普滾起一顆會越滾越大及越快的雪球。雪球會擊飛敵軍並造成傷害。"],["雪球連擊","努努投擲多個雪球來對敵軍造成傷害。施放完成後，威朗普會定身被雪球擊中的敵方英雄或大型野怪。"],["絕對零度","努努和威朗普召喚巨大暴風雪，緩速範圍內的敵軍，並在詠唱結束後對其造成大量傷害。"]],"n":[["0",""],["10/10/10/10",""],["12/12/12/12",""],["12/12/12/12",""],["70/70/70",""]]},"10009":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/0655c0b1c759bda95e7bffbbe3a9c167cd98b55e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/40dabb603e639bb03b684e2c2f29199395cc42be-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d507fc509c705470c59870b354388ebead4284d9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e7f19f4008c6d91a449ded2db07185f8f46c616d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/65c4216d32b04b39325af841c1143ed9624af78a-96x96.jpg"],"ko":[["파쇄격","오공과 분신들의 기본 공격과 스킬이 적에게 파쇄격 중첩을 쌓습니다. 중첩 수에 비례해 오공과 분신들이 대상에게 입히는 피해량이 증가합니다."],["황금 지팡이","기본 지속 효과로 스킬 사용 시 오공의 다음 기본 공격 사거리가 증가합니다. 사용 시 오공이 다음 기본 공격으로 추가 피해를 입히고 체력을 회복합니다."],["분신 전사","오공이 투명 상태가 되어 분신을 남기고 지정한 방향으로 돌진합니다. 분신은 주변 적을 공격해 감소한 피해를 입히고, 오공의 황금 지팡이와 회전격을 따라 합니다."],["근두운 급습","오공이 대상 적에게 돌진하며 분신을 내보내 대상 근처의 적을 공격하여 적중한 적 모두에게 피해를 입힙니다. 오공의 공격 속도가 일시적으로 증가합니다."],["회전격","오공이 여의봉을 늘린 후 빙빙 휘두르며 이동 속도가 증가합니다. 적중당한 적은 피해를 입고 공중에 떠오릅니다. 잠시 후에 회전격을 다시 사용할 수 있습니다."]],"en":[["Crushing Blows","Wukong and his clones' attacks and abilities apply stacks of Crushing Blows. For each stack, Wukong and his clones deal increased damage to the target."],["Golden Staff","Passively gives Wukong's next attack bonus range after casting an ability. Wukong's next attack deals additional damage and heals him."],["Warrior Trickster","Wukong becomes Invisible and dashes in a direction, leaving behind a clone that will attack enemies for reduced damage, mimicking Golden Staff and Cyclone."],["Nimbus Strike","Wukong dashes to a targeted enemy and sends out images to attack enemies near his target, dealing damage to each enemy struck, and grants Wukong a temporary Attack Speed increase."],["Cyclone","Wukong extends his staff and spins it around repeatedly, gaining Movement Speed. Enemies struck take damage and are knocked up. Cyclone can be recast within a short time window."]],"zh":[["定海神兵","悟空與分身的普攻與技能將對目標附加定海神兵，每層可使悟空與分身對目標造成的傷害增加。"],["黃金之杖","被動：施放技能後，悟空的下一次普攻會增加攻擊範圍。主動：使悟空的下一次普攻造成額外傷害並治療自己。"],["分身術","悟空進入潛隱狀態並衝往一個方向，留下一個分身來攻擊鄰近的敵人；分身的攻擊傷害較低，能模仿本尊使出黃金之杖和無極風暴。"],["筋斗突擊","悟空衝向目標敵人並幻化出分身攻擊目標附近的敵人，對每個命中的敵人造成傷害，並使悟空的攻速暫時提升。"],["無極風暴","悟空伸長金箍棒並快速旋轉，期間增加跑速。命中時會對敵人造成傷害，並且擊飛敵人。無極風暴可以在短時間內施放兩次。"]],"n":[["0",""],["8/7/7/6",""],["14/13/13/12",""],["8/8/8/8",""],["80/70/60",""]]},"10010":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/97e5965b2529a9e553b64325d547b1789de9ba7e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/95118f38a406dc5f3e33127281ae20d6a5d2bdb7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e5406bc711247f3f78f3b7c190577b941fa029d5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e958e743a0fa920cde3da51bc893ace2db3b0b40-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ed832452c2e6c8e43c433491293750cd929f3657-96x96.jpg"],"ko":[["어둠 사냥꾼","베인이 악당을 무자비하게 사냥합니다. 적 챔피언에게 접근할 때 이동 속도가 30 증가합니다."],["구르기","베인이 구르기를 하며 다음 공격 대상을 신중하게 선택합니다. 베인의 다음 공격은 추가 피해를 입힙니다."],["은화살","베인이 사악한 존재에게만 피해를 주는 특수 금속이 달린 볼트를 사용합니다. 같은 대상에게 세 번째 공격 또는 스킬이 명중하면 대상 최대 체력에 비례한 고정 피해를 추가로 입힙니다. 스킬을 사용하면 베인의 공격 속도가 증가하고 은화살로 입힌 피해량의 일부만큼 체력을 회복합니다."],["선고","베인이 등에서 커다란 석궁을 뽑아 거대한 볼트를 발사하여 대상을 뒤로 날려보내고 대상에게 피해를 줍니다. 지형과 부딪힌 대상은 지형에 꽂힌 채 추가 피해를 받고 기절합니다."],["결전의 시간","격렬한 전투에 대비한 베인이 공격력을 높이고 구르기 시 투명 상태가 되며 어둠 사냥꾼의 이동 속도 증가량이 더 늘어납니다. 적 챔피언이 베인에게서 피해를 입은 후 몇 초 안에 사망하면 결전의 시간 지속시간이 연장됩니다."]],"en":[["Night Hunter","Vayne ruthlessly hunts evil-doers, gaining 30 Move Speed when moving toward nearby enemy champions."],["Tumble","Vayne tumbles, maneuvering to carefully place her next shot. Her next attack deals bonus damage."],["Silver Bolts","Vayne tips her bolts with a rare metal, toxic to evil things. The third consecutive attack or ability against the same target deals a percentage of the target's max health as bonus true damage. Activating this ability gives Vayne bonus Attack Speed and she heals for some of Silver Bolts' damage."],["Condemn","Vayne draws a heavy crossbow from her back, and fires a huge bolt at her target, knocking them back and dealing damage. If they collide with terrain, they are impaled, dealing bonus damage and stunning them."],["Final Hour","Readying herself for an epic confrontation, Vayne gains increased Attack Damage, Invisibility during Tumble, and more bonus Movement Speed from Night Hunter. When an enemy champion damaged by Vayne dies within a few seconds, Final Hour's duration is extended."]],"zh":[["夜之狩獵","汎無情地獵殺邪惡事物，往鄰近敵方英雄移動時，增加30跑速。"],["翻滾瞄準","汎向前翻滾，並為下一次普攻做好準備。她下次的普攻將造成額外傷害。"],["神聖銀箭","汎在箭尖塗上了對所有邪惡事物有害的稀有金屬。對相同目標使用普攻或技能三次以後，會造成目標最大生命百分比的真實傷害。主動使用此技能能增加攻速，並使自身回復神聖銀箭造成的部分傷害。"],["重型弩箭","汎拿出背後的重弩對目標發射巨大的弩箭，將敵人擊退的同時也造成傷害。如果目標與地形發生碰撞，便會遭到刺穿，在受到額外傷害的同時也會遭到擊暈。"],["死亡通緝","整裝準備發動追殺，使物理攻擊增加，使用翻滾瞄準時附加潛隱效果，並且獲得額外被動跑速加成效果。敵方英雄遭到汎攻擊，且在數秒內陣亡時，死亡通緝的效果將延長。"]],"n":[["0",""],["5/4/3/2",""],["18/17/16/15",""],["21/18/15/12",""],["70/65/60",""]]},"10011":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9589c60f5329d26496ab94311c6eda2e1be33b0c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bb0ecba41db8d3f1cdd5cb284053bd58f49917c6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/055c1a1a4100c479fcaa1ce01a5a607f9fcee22c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fff8496d1fec4f7f3908f95c559980152eb48845-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ecd1af4b45ea957dc369a91df31bf39f1e33a6dc-96x96.jpg"],"ko":[["Z 드라이브 공진","같은 대상에 대한 세 번째 기본 공격 및 스킬 공격마다 추가 마법 피해를 입힙니다. 대상이 챔피언일 경우, 에코의 이동 속도가 상승합니다."],["시간의 톱니바퀴","에코가 적 챔피언에게 맞으면 펼쳐져서 시간 왜곡 지대를 만들고, 지대 안에 있는 적 모두를 둔화시키며 피해를 입히는 시간 톱니바퀴를 던집니다. 잠시 후 톱니바퀴는 되감겨 에코에게 돌아오며, 경로 상에 있는 적에게 피해를 입힙니다."],["평행 시간 교차","에코의 기본 공격이 체력이 낮은 적에게 추가 마법 피해를 입힙니다. 에코가 평행 시간 교차를 사용하면 시간의 균열을 열어 몇 초 후에 퍼져나가는 불안정한 특이점을 만들어내며, 이 안에 갇힌 적들을 둔화시킵니다. 에코가 특이점 안에 들어가면 자신은 보호막을 얻으며, 적들의 시간을 멈추며 기절시킵니다."],["시간 도약","에코가 회피하며 굴러 Z 드라이브를 충전합니다. 다음 번 공격은 추가 피해를 입히며 시공간을 왜곡하여 에코가 대상 쪽으로 순간이동합니다."],["시공간 붕괴","에코가 시공간을 붕괴시켜 대상으로 지정할 수 없게 되며 더 유리한 지점으로 시간을 되돌립니다. 몇 초 전 아무 때로나 돌아가며, 이 동안 입은 피해의 일부가 회복됩니다. 에코가 착지하는 지역 부근의 적들은 큰 피해를 입습니다."]],"en":[["Z-drive Resonance","Every third attack or damaging spell on the same target deals bonus magic damage, and grants Ekko a burst of speed if the target is a champion."],["Timewinder","Ekko throws a temporal grenade that expands into a time-distortion field upon hitting an enemy champion, slowing and damaging anyone caught inside. After a delay, the grenade rewinds back to Ekko, dealing damage on its return."],["Parallel Convergence","Ekko's basic attacks deal bonus magic damage to low health enemies. He can cast Parallel Convergence to split the timeline, creating an anomaly after a few seconds that slows enemies caught inside. If Ekko enters the anomaly, he gains shielding and stuns enemies by suspending them in time."],["Phase Dive","Ekko rolls evasively while charging up his Z-Drive. His next attack deals bonus damage and warps reality, teleporting him to his target."],["Chronobreak","Ekko shatters his timeline, becoming untargetable and rewinding to a more favorable point in time. He returns to whenever he was a few seconds ago, and heals for a percentage of the damage received in that duration. Enemies near his arrival zone take massive damage."]],"zh":[["共振驅動-Z","對同一目標的第三下普攻或傷害性技能會造成額外魔法傷害。若目標為英雄，則艾克會短暫增加跑速。"],["時光樞紐","艾克往目標方向投擲一顆時空彈，擊中敵方英雄時，此裝置會展開一個時光力場，緩速力場內的敵軍並造成傷害。在短暫延遲後，裝置會合起並回到艾克身邊，對路徑上所有敵軍造成傷害。"],["時空攔截","艾克的普攻會對生命值低的敵軍造成額外魔法傷害。他可以施放時空攔截，分開時間軸，在數秒後創造一個會緩速範圍內敵軍的力場。若艾克進入力場，會立即獲得護盾並暫停時間，使敵軍暈眩。"],["相位轉移","艾克一邊充能「驅動-Z」，一邊翻滾閃躲，他的下次普攻會造成額外傷害並扭曲現實，使其瞬移至目標旁邊。"],["計時開始","艾克打破時間軸，變得無法用普攻與技能指定，並倒回至對自己更有利的時間點。艾克回到數秒前的位置並回復部分期間受到的傷害。他出現時對鄰近敵軍造成大量傷害。"]],"n":[["0",""],["8/7/7/6",""],["20/18/16/14",""],["9/8/7/6",""],["80/60/40",""]]},"10012":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d37d104a81847f7bd01de183065cf66683c3adbf-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f0bcd7967ff11ddb8168d150a304f6cf2e9d017e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/54e86149bec0e487f86e7c7964607a9cce245b06-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/9816b07ca98ec19705049d8f4ae666e206f0dd85-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/eb793c70ee0798f06c31f87c7f617ae06889a679-96x96.jpg"],"ko":[["시계태엽 감기","오리아나의 기본 공격은 추가 마법 피해를 입힙니다. 같은 적을 연속으로 공격할수록 추가 마법 피해량도 커집니다."],["명령: 공격","오리아나가 구체에게 목표 지점으로 돌진하라고 명령하여 구체가 대상 지점으로 가는 동안 마주치는 대상에게 마법 피해를 줍니다. 여러 대상을 맞히는 경우 뒤로 갈수록 피해량이 작아집니다. 구체는 목표 지점에 머뭅니다."],["명령: 불협화음","오리아나가 구체에게 에너지파를 방출하도록 명령하여 근처에 있는 적에게 마법 피해를 입힙니다. 이때 생긴 자기장은 아군의 이동 속도를 높이고 적의 이동 속도는 늦춥니다."],["명령: 보호","오리아나가 구체에게 아군을 따라다니며 이들을 보호하고 도중에 마주치는 적에게 마법 피해를 입히도록 명령합니다. 구체는 또한 보호하는 챔피언의 방어력 및 마법 저항력을 높여줍니다."],["명령: 충격파","오리아나가 구체에게 충격파를 방출하도록 명령하여 근처에 있는 적에게 마법 피해를 주며 잠시 뒤 적을 구체 쪽으로 잡아당깁니다."]],"en":[["Clockwork Windup","Orianna's Attacks deal additional magic damage. This damage increases the more Orianna Attacks the same target."],["Command: Attack","Orianna commands her Ball to fire toward a target location, dealing magic damage to targets along the way (deals less damage to subsequent targets). Her Ball remains at the target location after."],["Command: Dissonance","Orianna commands her Ball to release a pulse of energy, dealing magic damage around it. This leaves a field behind that speeds up allies and slows enemies."],["Command: Protect","Orianna commands her Ball to attach to an allied champion, Shielding them and dealing magic damage to any enemies it passes through on the way. Additionally, the Ball grants additional Armor and Magic Resist to the champion it is attached to."],["Command: Shockwave","Orianna commands her Ball to unleash a shockwave, dealing magic damage and launching nearby enemies towards the Ball after a short delay."]],"zh":[["魔法發條","奧莉安娜的普攻造成額外的魔法傷害。對同一目標普攻越多次，額外傷害就越高。"],["指令：貫穿","奧莉安娜朝著目標地點發射球體，對路徑上的所有目標造成魔法傷害（傷害隨著目標數遞減）。使用招數後球體會停留在目標地點。"],["指令：失衡","奧莉安娜指揮她的球體釋放能量脈衝，對周遭敵人造成魔法傷害，並且留下一道能量場讓友軍加速、敵軍減速。"],["指令：守護","奧莉安娜指揮球體附著於友軍英雄身上，展開防護罩並且對於飛行路徑上的敵人造成魔法傷害。此外，被球體附著的英雄獲得額外的物理防禦和魔法防禦強化。"],["終極指令：脈衝","奧莉安娜指揮球體在短暫延遲後釋放衝擊波，造成魔法傷害並且迫使鄰近敵人向球體聚集。"]],"n":[["0",""],["7/6/4/3",""],["7/7/7/7",""],["9",""],["75/65/55",""]]},"10013":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/48e1919a464e9999719470a28095018d9de21ec8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e90909bd2fd64569415e5a5d72444fb8913cc71e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/eeb23febb42ad327244fbb7473159ee0b9964535-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f2693fb876e179cd0cd8ab7a63eb7a3d296d2480-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/b455286831732745e1840396fb3afbbf5c2f388e-96x96.jpg"],"ko":[["서늘한 달빛 검","3번째 기본 공격마다 주위 적들을 베어 추가 마법 피해를 입힙니다. 스킬을 사용하면 다음 기본 공격 3회의 공격 속도가 증가합니다."],["초승달 검기","달 에너지를 부채꼴 모양으로 발사하여 마법 피해를 입히고 달빛 효과를 적용합니다."],["은빛 가호","다이애나 주위를 도는 구체를 세 개 생성합니다. 구체는 적과 닿으면 폭발해서 주변에 피해를 입힙니다. 또한 다이애나가 일시적으로 보호막을 얻으며, 마지막 구체가 폭발하면 보호막이 더욱 강해집니다."],["월광 쇄도","다이애나가 적에게 돌진해 마법 피해를 입힙니다. 대상이 달빛 효과를 받고 있으면 이 스킬의 재사용 대기시간이 초기화되고, 주변 적의 달빛 효과가 사라집니다."],["달빛 낙하","다이애나가 달을 소환해 주변의 적을 둔화시키고, 점점 커지는 구역에 있는 적에게 달빛 효과를 적용합니다. 버튼에서 손을 떼면 달을 내리쳐 적을 다이애나 쪽으로 끌어당기고 충전 시간에 비례해 피해를 입힙니다."]],"en":[["Moonsilver Blade","Every third strike cleaves nearby enemies for an additional magic damage. After using an ability, Diana gains attack speed for her next 3 attacks."],["Crescent Strike","Unleashes a bolt of lunar energy in an arc dealing magic damage, and applying Moonlight."],["Pale Cascade","Diana creates three orbiting spheres that detonate on contact with enemies to deal damage in an area. She also gains a temporary shield that absorbs damage. If her third sphere detonates, the shield gains additional strength."],["Lunar Rush","Diana dashes to an enemy and deals magic damage. Lunar Rush has no cooldown when used to dash to an enemy afflicted with Moonlight, removing Moonlight in an area."],["Moonfall","Diana summons the moon in an area, slowing enemies nearby and applying Moonlight in a growing area. Releasing the button slams the moon down, spiraling enemies toward her and dealing damage scaling with the charge time."]],"zh":[["銀月之刃","每三次普攻會劈砍附近的敵人，造成額外魔法傷害。施放技能後，黛安娜的接下來3次普攻會提升攻速。"],["月牙衝擊","釋放一波月之力，弧形衝擊波會造成魔法傷害，並附加月光精華效果。"],["蒼白月瀑","黛安娜召喚三個月亮般的星體，觸及敵人後會引爆，造成範圍傷害。她同時獲得一個可短暫吸收傷害的護盾，如果三個星體都爆炸，這個護盾將獲得強化。"],["朔月幻步","黛安娜衝向一名敵人並造成魔法傷害。目標身上有月光精華效果時，朔月幻步無需冷卻時間，但會移除範圍內所有敵人的月光精華。"],["月隕","黛安娜召喚月亮，在逐漸擴大的範圍內使周遭敵人緩速，並附加月光精華。放開按鍵時，月亮向下殞落，以引力將敵人吸向黛安娜並造成傷害，傷害高低取決於蓄力時間。"]],"n":[["0",""],["8/7/6/5",""],["13/11/10/8",""],["18/16/14/12",""],["70/65/60",""]]},"10014":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/41ea501d4e89ab505f29db95d124d60237428266-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/2acfcb729b53768dde3e1579178c18888d15fc56-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dfa8a09e6ea9b71518547da24bb5edc05ad13e3c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a8611191e09d7995d43fb2a0562688c675b4e8a1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3450fd39cd4b3f671ccf5eb191856e8770a210a8-96x96.jpg"],"ko":[["반짝반짝!","스킬 사용 후 기본 공격 시 추가 마법 피해를 입힙니다."],["통통별","조이가 별을 발사합니다. 별이 날아가는 도중에 방향을 바꿀 수 있으며, 별의 총 이동거리에 비례해 피해량이 증가합니다."],["주문도둑","적이 소환사 주문이나 사용 효과가 있는 아이템을 사용하면 주문 파편이 남고, 조이는 그 파편을 주워 해당 주문 및 효과를 사용할 수 있습니다. 또한 조이가 소환사 주문을 사용하면 미사일이 3개 생성되어 가장 가까운 적에게 날아갑니다."],["헤롱헤롱쿨쿨방울","대상을 졸음 상태에 빠지게 한 뒤 잠들게 합니다. 잠든 뒤 처음으로 입는 피해는 두 배로 적용됩니다. (최대치 있음)"],["차원 넘기","1초 동안 근처 위치로 순간적으로 이동한 뒤 다시 되돌아옵니다."]],"en":[["More Sparkles!","Zoe's next basic attack after casting a spell deals bonus magic damage."],["Paddle Star!","Zoe fires a missile that she can redirect in flight. Deals more damage the longer it flies in a straight line."],["Spell Thief","Zoe can pick up the remnants of enemy summoner spell and active item casts and cast them once herself. Whenever she casts a summoner spell, she gains 3 missiles that fire at the nearest target."],["Sleepy Trouble Bubble","Causes the target to become drowsy, then fall asleep. The first source of damage that breaks the sleep is doubled, up to a cap."],["Portal Jump","Blink to a nearby position for 1 second. Then blink back."]],"zh":[["閃耀星火","柔依施放技能後，接下來的普攻將造成額外魔法傷害。"],["星迴百轉","柔依發射一顆星星，飛行期間她可以重啟技能，將星星導向至新的位置。星星在直線上飛行的距離越長，造成的傷害越高。"],["法術竊盜","柔依可拾起敵方召喚師技能及主動道具效果的碎片，並施放一次該召喚師技能或主動道具效果。每次施放召喚師技能時，她會發射3顆星彈，朝最接近的敵方目標發射。"],["沉睡夢域","使目標疲倦，接著陷入沉睡。首次對該目標的攻擊會喚醒目標並造成雙倍傷害，此傷害不會超過系統設定的上限。"],["星界躍動","暫時傳送至附近新的位置，1秒後返回原本的位置。"]],"n":[["0",""],["8/7/7/6",""],["0",""],["15/14/13/12",""],["11/8/5",""]]},"10015":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/184a3037ab6c864295bbf81167a22bc5e7669859-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/65261c0970d87df3224b81af3fb86e8cb3881ede-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9d6cb44b1613a0177432fc9999599b2b84df5ae7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/61c39ecf2c12ec73f7b6c92a8be490a8dca603aa-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/86318c917e24d66155c98ffc7804b94b28a70d93-96x96.jpg"],"ko":[["격노","트린다미어가 일반 공격, 치명타 공격 그리고 마지막 일격을 날릴 때마다 분노를 획득합니다. 분노는 트린다미어의 치명타 확률을 높이며 피의 갈망을 사용하면 소모됩니다."],["피의 갈망","트린다미어는 전투의 스릴에 희열을 느낍니다. 트린다미어의 체력이 낮으면 낮을수록 공격력이 상승합니다. 피의 갈망 스킬 사용 시 트린다미어는 분노 수치를 소모하여 체력을 회복할 수 있습니다."],["조롱의 외침","트린다미어가 모욕적인 외침으로 주변 챔피언들의 공격력을 낮춥니다. 트린다미어에게서 등을 돌린 챔피언들은 이동 속도 역시 느려집니다."],["회전 베기","트린다미어가 공격 경로에 있는 적 유닛을 칼로 베어 피해를 입힙니다."],["불사의 분노","전투를 향한 트린다미어의 욕망이 너무나도 강해 죽을 수 없는 몸이 됩니다."]],"en":[["Battle Fury","Tryndamere gains Fury for each attack, critical strike, and killing blow he makes. Fury passively increases his Critical Strike Chance and can be consumed with his Bloodlust spell."],["Bloodlust","Tryndamere thrives on the thrills of combat, increasing his Attack Damage as he is more and more wounded. He can cast Bloodlust to consume his Fury and heal himself."],["Mocking Shout","Tryndamere lets out an insulting cry, decreasing surrounding champions' Attack Damage. Enemies with their backs turned to Tryndamere also have their Movement Speed reduced."],["Spinning Slash","Tryndamere slices toward a target unit, dealing damage to enemies in his path."],["Undying Rage","Tryndamere's lust for battle becomes so strong that he is unable to die, no matter how wounded he becomes."]],"zh":[["戰鬥狂怒","泰達米爾每次攻擊、暴擊、或擊殺單位都可獲得怒氣。怒氣可以增加暴擊率並且使用於嗜血殺戮技能上。"],["嗜血殺戮","泰達米爾對於戰鬥感到興奮，受到傷害越多，物理攻擊越高。他能夠施放嗜血殺戮來消耗怒氣並治療自己。"],["嘲諷","泰達米爾發出戰嚎，降低周遭敵人的物理攻擊。背對泰達米爾的目標跑速也會下降。"],["旋風斬","泰達米爾切向目標單位，對路徑上的敵人造成傷害。"],["無盡怒火","泰達米爾是如此渴望戰鬥，以至於承受再多的傷害也不會死亡。"]],"n":[["0",""],["12",""],["12",""],["11/10/9/8",""],["90/80/70",""]]},"10016":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/b28071cfe8fe1af7a110ce73e1ce43673944594b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ea0c7af213e571a9bdd30889b8868aa400d4631e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ffe2fbca388bf0bb551b5f807ec460d4e215fbc6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6a3b4693f1c13dccc304659b0b55ab46b637dee5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/37d0a2e79fb324e283b4042a8fc407d9d7b57c20-96x96.jpg"],"ko":[["결심","세 번째 기본 공격 시마다 추가 피해를 입히고 자신의 체력을 회복합니다."],["삼조격","신 짜오의 다음 세 번의 기본 공격이 더 큰 피해를 입히고, 세 번째 공격에서 상대를 공중으로 띄웁니다."],["풍전참뢰","신 짜오가 창으로 앞을 가른 뒤 그대로 찌릅니다. 적중당한 적은 둔화됩니다."],["무쌍돌격","신 짜오가 적에게 돌격하여 그 지점에 있던 모든 적에게 피해를 입히고 잠깐 동안 둔화시킵니다."],["현월수호","신 짜오가 주위 적들에게 각 유닛의 현재 체력에 비례한 피해를 입히고 도전 받지 않은 대상을 뒤로 밀어냅니다. 적 챔피언이 일정 거리 밖에 있을 경우 신 짜오를 공격해도 피해를 입히지 못합니다."]],"en":[["Determination","Every third attack deals bonus damage and heals Xin Zhao."],["Three Talon Strike","Xin Zhao's next 3 standard attacks deal increased damage with the third attack knocking an opponent into the air."],["Wind Becomes Lightning","Xin Zhao slashes in front of himself with his spear, then thrusts it forward, slowing affected enemies."],["Audacious Charge","Xin Zhao charges to an enemy, dealing damage to all enemies in the area and slowing them briefly."],["Crescent Guard","Xin Zhao deals damage to nearby enemies based on their current Health and knocks non-challenged targets back. Xin Zhao is impervious to damage dealt by champions outside of the circle created."]],"zh":[["鬥戰決心","每三下普攻造成額外物理傷害，並治療趙信自身生命。"],["三重爪擊","趙信的接下來三次的普攻傷害提升，且第三次普攻會將對手擊飛。"],["風雷迅馳","趙信向前揮舞他的長戟，接著朝前方突刺，使受到影響的敵人緩速。"],["一騎當先","趙信朝一名敵人衝鋒，對區域內所有敵人造成傷害，並使他們暫時受到緩速。"],["新月無雙","趙信對鄰近敵人造成傷害，傷害值取決於敵人當前生命，同時將挑戰目標以外的敵人擊退。趙信可以抵擋所有來自圈外英雄的傷害。"]],"n":[["0",""],["9/8/7/6",""],["11/9/8/6",""],["11/11/11/11",""],["80/70/60",""]]},"10017":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0371e2057feaccf934e6d986d6c79bd93d4be01a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5b105c59f8f629f500c7dd5eca1a2fbe6c7f1c07-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c4476f83828908e33f911768f91b812c09c810d3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/94aad1127a4858320821cf29c665ee69084530b0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7de1100b260f41abc68b796d1fb076126b00de5f-96x96.jpg"],"ko":[["보이지 않는 위협","카직스가 적의 시야에서 벗어나면 다음 기본 공격으로 적 챔피언에게 추가 마법 피해를 입히고 잠시 둔화시킵니다."],["공포 감지","카직스가 갈고리를 휘둘러 물리 피해를 가하며, 대상이 고립된 경우 추가 피해를 입힙니다. 진화한 거대 갈고리: 기본 공격 및 공포 감지의 사거리가 증가하고, 고립된 대상 (근처에 팀원 및 포탑이 없는 적) 공격 시 재사용 대기시간이 크게 감소합니다."],["공허의 가시","카직스가 가시를 발사해 물리 피해를 입힙니다. 폭발 사거리 내에 있으면 체력이 일부 회복됩니다. 진화한 가시 어깨: 가시를 추가로 발사해 적의 모습을 드러내고 둔화시킵니다."],["도약","대상 지역으로 도약해 물리 피해를 입힙니다. 진화한 날개: 도약 사거리가 크게 증가하고 챔피언 처치 관여 시 재사용 대기시간이 초기화됩니다."],["공허의 습격","기본 지속 효과: 공허의 습격 레벨이 오를 때마다 카직스의 스킬 중 하나를 진화시킬 수 있습니다. 사용 시: 카직스가 투명 상태가 되며 이동 속도가 잠시 증가합니다. 진화한 활성 보호색: 투명 상태의 지속시간이 증가하며 여러 번 사용할 수 있습니다."]],"en":[["Unseen Threat","When the enemy team loses sight of Kha'Zix its next attack against enemy champions deals bonus magic damage and slows them briefly."],["Taste Their Fear","Kha'Zix causes physical damage by slashes with its claws dealing additional damage if the target is isolated. Evolved Reaper Claws: basic attacks and Taste Their Fear have increased range and if a target is isolated, meaning that they have no teammates or turrets nearby, then a significant portion of Taste Their Fear's cooldown is refunded."],["Void Spike","Kha'Zix fires spikes to deal physical damage while also partially healing itself if it is within the explosion. Evolved Spike Racks: fires additional spikes revealing and slowing enemies for a short duration."],["Leap","Kha'Zix leaps to a targeted area and deals physical damage. Evolved Wings: Leap gains significant range and the cooldown is refunded on champion takedowns."],["Void Assault","Passive: each upgrade to Void Assault allows for Kha'Zix to evolve one of his abilities. Active: Kha'Zix becomes invisible and gains movement speed briefly. Evolved Adaptive Cloaking: invisibility duration lasts longer and can be cast multiple times."]],"zh":[["暗影殺機","如果脫離敵方視野，卡力斯下一次對敵方英雄發動普攻時，可造成額外魔法傷害並使目標暫時緩速。"],["孤獨的恐懼","卡力斯揮動利爪，造成物理傷害，對孤立目標還可造成額外傷害。進化死神之爪：普攻與孤獨的恐懼攻擊範圍增加。如果目標孤立，也就是周遭沒有隊友或防禦塔，則可返還大量孤獨的恐懼冷卻時間。"],["虛空尖刺","射出爆裂尖刺，造成物理傷害。若卡力斯位於爆炸範圍內，將使自身回復生命。進化尖刺拷問：射出額外尖刺，短時間內揭露敵人行蹤並使其緩速。"],["掠翅飛躍","卡力斯跳到目標區域，造成物理傷害。進化飛翅：跳躍範圍大幅增加，擊殺或助攻敵方英雄可返還冷卻時間。"],["虛空突襲","被動：每次升級虛空突襲，都可以進化一個卡力斯的技能。主動：卡力斯進入潛隱狀態，並短暫提升跑速。進化自適應化形：潛隱持續時間延長，並可連續施放數次。"]],"n":[["0",""],["5/4/4/3",""],["9/9/9/9",""],["18/16/14/12",""],["75/65/55",""]]},"10018":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/15e2529b96f56993dac7b9218c44698fa561a3c2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/30b22cf52c9cf21ece17a217af0153a4fb5d1eff-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/aaad94098f0a6ab6c0d70d67c99e4a28c52d1f19-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/fa19f0effc1be6d30fe2afd5372237e12df5fb85-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7727824cd16c591254904058922187a4eccb8cc7-96x96.jpg"],"ko":[["신난다!","징크스는 적 챔피언이나 에픽 정글 몬스터 처치 또는 구조물 파괴를 도우면 이동 속도와 공격 속도가 대폭 상승합니다."],["휘릭휘릭!","징크스는 '빵야빵야' 미니건과 '생선대가리' 로켓 런처 중에서 원하는 것을 선택하여 기본 공격을 변경할 수 있습니다. 미니건으로 공격하면 공격 속도가 상승하고, 로켓 런처로 공격하면 광역 피해를 주고 사거리가 증가하며 마나가 소모됩니다."],["빠직!","징크스가 빠직!으로 전기 충격파를 발사해 처음 적중한 적을 둔화시키고 위치를 드러내며 피해를 입힙니다."],["와작와작 뻥!","징크스가 와작와작 지뢰를 일렬로 던지면 5초 후에 폭발하며 주변 적들을 불태웁니다. 와작와작 지뢰는 적 챔피언이 밟으면 물어뜯어 제자리에 묶습니다."],["초강력 초토화 로켓!","징크스가 맵을 가로지르는 강력한 로켓을 발사합니다. 발사 후 비행 거리에 비례해 로켓의 피해량이 증가합니다. 로켓은 적 챔피언과 충돌하면 폭발하며, 해당 챔피언과 주위의 적에게 잃은 체력에 비례하여 피해를 입힙니다."]],"en":[["Get Excited!","Jinx receives massively increased Movement Speed and Attack Speed whenever she helps kill or destroy an enemy champions epic jungle monster, or structure."],["Switcheroo!","Jinx modifies her basic attacks by swapping between Pow-Pow, her minigun and Fishbones, her rocket launcher. Attacks with Pow-Pow grant Attack Speed, while attacks with Fishbones deal area of effect damage, gain increased range, and drain Mana."],["Zap!","Jinx uses Zapper, her shock pistol, to fire a blast that deals damage to the first enemy hit, slowing and revealing it."],["Flame Chompers!","Jinx throws out a line of snare grenades that explode after 5 seconds, lighting enemies on fire. Flame Chompers will bite enemy champions who walk over them, rooting them in place."],["Super Mega Death Rocket!","Jinx fires a super rocket across the map that gains damage as it travels. The rocket will explode upon colliding with an enemy champion, dealing damage to it and surrounding enemies based on their missing Health."]],"zh":[["狂躁！","每當吉茵珂絲參與擊殺敵方英雄、史詩級野怪或是摧毀敵方建築物時，她的跑速與攻速就會大幅提升。"],["鬼靈精怪！","吉茵珂絲會調整普攻使用武器，她的砰砰鏈砲和惡鯊會互相切換，使用砰砰攻擊會增加攻速，使用惡鯊攻擊則會造成區域傷害、消耗魔力並獲得額外攻擊範圍。"],["咻咻！","吉茵珂絲使用她的衝擊槍，發射一道衝擊波，對第一個命中的敵人造成傷害、使其緩速並揭露其位置。"],["咬咬手榴彈！","吉茵珂絲丟出一排咬咬手榴彈陷阱，在 5 秒後引爆，將手榴彈所在區域點火，著火的敵人每秒會承受魔法傷害，這些咬咬手榴彈在敵人經過的時候將會狠咬敵人一口，並且將其定身在原地。"],["超威能死亡火箭！","吉茵珂絲發射一發橫越地圖的超級火箭，飛行距離越遠傷害越高。火箭將會在衝撞到敵方英雄時爆炸，對該名英雄與其附近的敵人根據他們所剩生命來造成傷害。"]],"n":[["0",""],["1/1/1/1",""],["8/7/6/5",""],["15/13/11/9",""],["60/50/40",""]]},"10019":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/90699903eb0a05252107d0d833ad8bf546ddd976-96x96.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b61313dc1bb9e5387877b2779308f45aeca9b909-96x96.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6acf3dba72d549f599fcaa2edb95f643a7fa79fb-96x96.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7b4048342aeb45771082de5832cac2429c02f634-96x96.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5289af14ade94e53faa9f047749cb8f4f764882d-96x96.png"],"ko":[["출정","헤카림의 공격력이 추가 이동 속도의 일정 비율만큼 증가합니다."],["회오리 베기","헤카림이 주변 적을 베어 물리 피해를 입힙니다. 한 명의 적이라도 적중 시 다음 회오리 베기의 피해량이 증가하며 재사용 대기시간이 감소합니다."],["공포의 망령","헤카림이 방어력과 마법 저항력을 얻습니다. 주변 적들에게 마법 피해를 입히고, 적들이 입은 피해의 일정 비율에 해당하는 체력을 회복합니다."],["파멸의 돌격","잠깐 동안 헤카림의 이동 속도가 빨라지고 다른 유닛을 통과해 이동할 수 있습니다. 다음번 공격은 대상을 뒤로 밀어내고, 스킬을 사용한 후 이동한 거리에 비례하여 추가 물리 피해를 입힙니다."],["그림자의 맹습","헤카림이 유령 기수들을 소환하며 전방으로 돌진해 일직선 상에 마법 피해를 입힙니다. 헤카림이 돌격을 멈추면 충격파가 발생하여, 주변 적들이 공포에 사로잡혀 달아납니다."]],"en":[["Warpath","Hecarim gains Attack Damage equal to a percentage of his bonus Move Speed."],["Rampage","Hecarim cleaves nearby enemies dealing physical damage. If Hecarim damages at least one enemy, he increases the damage and lowers the cooldown of subsequent Rampages."],["Spirit of Dread","Hecarim gains Armor and Magic Resist. Hecarim deals magic damage to nearby enemies, and gains Health equal to a percentage of any damage those enemies suffer."],["Devastating Charge","Hecarim gains increasing Move Speed and can move through units for a short duration. His next attack knocks the target back and deals additional physical damage based on the distance he has traveled since activating the ability."],["Onslaught of Shadows","Hecarim summons spectral riders and charges forward, dealing magic damage in a line. Hecarim creates a shockwave when he finishes his charge, causing nearby enemies to flee in terror."]],"zh":[["刃馬合一","赫克林獲得等同於他額外跑速比率的攻擊傷害。"],["逸騎刃擊","赫克林朝周遭敵人劈斬，造成物理傷害。如果這個技能對至少一位敵人造成傷害，逸騎刃擊的傷害會增加，而後續施放的逸騎刃擊冷卻時間會降低。"],["靈魂恐懼","赫克林獲得物理防禦及魔法防禦。赫克林對周遭敵人造成魔法傷害，並根據那些敵人受到所有傷害的一定比例獲得生命。"],["毀滅衝刺","赫克林在短時間內提高跑速且能在單位間不受阻礙地移動。他的下一次普攻將會擊退目標並造成額外的物理傷害，增加的傷害取決於啟動技能後所移動的距離。"],["暗影的逆襲","赫克林召喚幽靈坐騎並且向前衝刺，對路徑上的敵人造成魔法傷害。赫克林在衝刺結束時會釋放出衝擊波，使周遭敵人感到恐懼而逃跑。"]],"n":[["0",""],["4/4/3/3",""],["16/15/14/13",""],["18/17/16/15",""],["100/85/70",""]]},"10020":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/60e3dca169c7d953ebdc70dc41cabc9b88d340fe-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/4e33e5d5745482505c15bcd037b839de4f0b39cd-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/dc6fba97428f45c9d11a868e5387f1f73f7deda6-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/f28f25053b898ee4e0de6088ec3e46e2eff63bae-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/1f82f439c0c2f8d76c2b68f34baac9d7052dff15-128x128.png"],"ko":[["야옹이 친구","기본 공격과 스킬이 유미에게 주기적으로 보호막을 부여합니다. 유미가 아군에게 밀착 중이거나 몇 초 내로 밀착하면 대상이 동일한 양의 보호막을 얻습니다. 밀착 상태에서 아군이 적 챔피언이나 미니언을 처치할 때마다 우정을 얻습니다. 우정이 가장 깊은 아군은 단짝이 되어, 유미의 스킬을 강화합니다."],["사르르탄","유미가 미사일을 발사해 처음 적중한 대상에게 피해를 입힙니다. 미사일이 1초 이상 날아가면 추가 피해를 입히고 둔화를 적용합니다. 밀착 상태에서는 미사일을 조종할 수 있습니다. 단짝 추가 효과: 미사일이 둔화를 적용하고, 적 챔피언에게 적중하면 밀착한 아군이 대상에게 마법 피해를 추가로 입힙니다."],["너랑 유미랑!","기본 지속 효과: 단짝에게 밀착 중이면 유미의 체력 회복 및 보호막 효과가 증가하고, 밀착한 아군이 체력을 추가로 회복합니다.\\n\\n사용 시: 유미가 대상 아군을 향해 돌진해, 포탑을 제외한 유닛에게 대상 지정 불가 상태가 됩니다."],["슈우우웅","유미가 보호막과 공격 속도를 얻습니다. 보호막이 남아 있는 동안 이동 속도를 추가로 얻습니다. 밀착 상태일 때는 효과가 아군에게 대신 적용됩니다."],["대단원","유미가 지정한 방향으로 파동을 5번 발사합니다. 밀착 상태일 때는 파동을 조종할 수 있으며, 이 효과는 밀착을 해제하면 사라집니다. 파동에 맞은 아군 챔피언은 체력을 회복하고, 단짝은 더 많은 체력을 회복합니다. 초과한 체력 회복량은 보호막으로 전환됩니다. 파동에 맞은 적은 마법 피해를 받고 둔화됩니다. 둔화 효과는 파동에 맞을 때마다 중첩되고 지속시간이 초기화됩니다."]],"en":[["Feline Friendship","Periodically, Yuumi’s Basic Attacks and Abilities will Shield Yuumi. If Yuumi is Attached to an ally or attaches within a few seconds they are Shielded for the same amount. While Attached to an ally, Yuumi grants them Friendship stacks when they kill enemy champions or minions. The ally with the highest Friendship stack becomes Yuumi’s Best Friend, which empowers her abilities towards them."],["Prowling Projectile","Yuumi fires a missile, dealing Magic Damage to the first target hit. It deals bonus damage and Slows if it takes at least 1 second to get to its target. While Attached, the missile can be controlled with your cursor. Best Friend Bonus: Applies Slow on hit, and when hitting an enemy champion, Yuumi’s Attached ally gains bonus Magic Damage toward them."],["You and Me!","Passive: While Yuumi is Attached
