 to her Best Friend, She gains bonus Healing and Shielding, and her Best Friend also receives additional Healing effects. Active: Yuumi dashes to a target ally, becoming untargetable from everything except turrets."],["Zoomies","Yuumi grants herself a Shield and gains Attack Speed. She also gains Move Speed while the Shield is active. If Yuumi is Attached, Zoomies affect her ally."],["Final Chapter","Yuumi launches five waves in the target direction. While Attached Yuumi can steer the direction of the waves. Detaching stops this bonus effect. Allied champions hit by the waves are Healed, with increased Healing for the Best Friend. Excess Healing converts into a Shield. Enemies struck by the waves take Magic Damage and are Slowed. The Slow stacks and refreshes on each hit."]],"zh":[["貓貓摯友","每隔一段時間，悠咪的普攻與技能會賦予其護盾。若悠咪已附著於友軍，或在數秒內附著，該友軍將獲得等值的護盾量。附著於友軍時，每當友軍擊殺敵方英雄或士兵，悠咪會賦予其摯友堆層。摯友堆層最高的友軍將成為悠咪的摯友，強化悠咪對其施放的技能效果。"],["奇幻圖騰","悠咪發射一枚飛彈，對第一位命中的目標造成魔法傷害。如果飛彈在命中目標前至少飛行了1秒的時間，將造成額外傷害與緩速。當悠咪處於附著狀態時，可用滑鼠游標控制飛彈。摯友加成：命中時施加緩速，若命中敵方英雄，悠咪所附著的友方將能對其造成額外魔法傷害。"],["飛撲抱抱！","被動：若悠咪附著於摯友，她將獲得額外治療與護盾量，且摯友也會獲得額外治療效果。主動：悠咪衝向一個目標友軍，且無法被除了防禦塔以外的任何單位指定。"],["蹦蹦衝刺","悠咪賦予自身護盾與攻速。護盾存在時，也會增加跑速。若悠咪為附著狀態，「蹦蹦衝刺」將對該友軍生效。"],["最終篇章","悠咪朝目標方向發射五道衝擊波。悠咪為附著狀態時，可控制衝擊波方向。解除附著狀態將中斷此效果。治療命中的友方英雄，且摯友將獲得額外治療量。超額治療量會轉為護盾。衝擊波會對命中的敵軍造成魔法傷害與緩速效果。緩速效果可累加，且於每次命中時刷新。"]],"n":[["0",""],["5/5/5/5/5",""],["0",""],["9/9/9/9",""],["85/75/65",""]]},"10021":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a02ed9496ecb2abea5a5f6155adad3d364c8d881-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/4dbb7e9d62e639780af93f4fd99860b2caae2658-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/bd950a1381808356e13876f290c1542d2b7d2cf8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/45e02e412c681b26f4a170f022e5f4c4346c782d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ddcc54008d13e59d8d8596395a712f95ecfdc629-96x96.jpg"],"ko":[["뇌진탕 펀치","브라움의 기본 공격은 뇌진탕 펀치를 적용시킵니다. 첫 번째 중첩이 적용된 후에는 아군의 기본 공격 역시 뇌진탕 펀치 중첩을 적용합니다. 중첩이 4번 쌓이면 대상은 기절하며 마법 피해를 입습니다. 다음 몇 초 동안은 중첩이 새로 쌓이지 않는 대신 브라움의 공격으로부터 추가 마법 피해를 입습니다."],["동상","브라움이 방패에서 빙결을 뿜어내 둔화를 적용하고 마법 피해를 입힙니다. 뇌진탕 펀치 중첩이 1회 쌓입니다."],["내가 지킨다","브라움이 대상 아군 챔피언이나 미니언에게 도약합니다. 대상에게 다다르면 브라움과 아군은 몇 초 동안 방어력과 마법 저항력이 오릅니다."],["불굴","브라움이 몇 초 동안 한 방향으로 방패를 들어 올려, 날아오는 투사체를 대신 맞고 파괴합니다. 첫 번째 공격은 아무 피해도 주지 않고, 이후 해당 방향에서 오는 공격은 피해량이 줄어듭니다."],["빙하 균열","브라움이 지면을 내리쳐 부근과 전방 직선상의 적들을 띄워올립니다. 이 직선을 따라 균열이 가며 적들을 둔화시킵니다."]],"en":[["Concussive Blows","Braum's basic attacks apply Concussive Blows. Once the first stack is applied, ally basic attacks also stack Concussive Blows. Upon reaching 4 stacks, the target is stunned and takes magic damage. For the next few seconds they cannot receive new stacks, but take bonus magic damage from Braum's attacks."],["Winter's Bite","Braum propels freezing ice from his shield, slowing and dealing magic damage. Applies a stack of Concussive Blows."],["Stand Behind Me","Braum leaps to a target allied champion or minion. On arrival, Braum and the ally gain Armor and Magic Resist for a few seconds."],["Unbreakable","Braum raises his shield in a direction for several seconds, intercepting all projectiles causing them to hit him and be destroyed. He negates the damage of the first attack completely and reduces the damage of all subsequent attacks from this direction."],["Glacial Fissure","Braum slams the ground, knocking up enemies nearby and in a line in front of him. A fissure is left along the line that slows enemies."]],"zh":[["震盪冰封","布郎姆的普攻將會附加震盪冰封效果。在目標被附上第一層疊加之後， 友軍的普攻也會疊加震盪冰封。疊加 4 層之後，目標將會被暈眩並受到魔法傷害。在接下來的幾秒內該名目標身上無法再被疊加此效果，但受到布郎姆攻擊將會承受額外魔法傷害。"],["凜冬衝擊","布郎姆從重盾中擊發出寒冰，緩速被擊中的敵人並造成魔法傷害。可以附加一層震盪冰封。"],["壁壘守護","布郎姆跳到目標友軍英雄或士兵身旁，落地後，在幾秒鐘內布郎姆與友軍物理防禦與魔法防禦將增加。"],["雄心重盾","布郎姆朝目標方向舉起盾牌數秒，攔截所有朝布郎姆襲來的遠程火力並使其集火在他身上。盾牌可完全阻擋第一個攻擊的傷害，並減少接下來攻擊的傷害。"],["冰河裂隙","布郎姆重擊地面，擊飛鄰近與前方直線上的敵人，並且在地面留下一條緩速的區域，使經過的敵方單位緩速。"]],"n":[["0",""],["9/8/7/6",""],["11/10/9/8",""],["16/14/12/10",""],["75/70/65",""]]},"10022":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e68c9203ae7b25e39a78d9486fbc04f736ef61de-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/30d346e4c5cdadf6ef4c281cae0392aba29d8572-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d18698db86b50fc17aea51d87b9c1ba8b0c2fb89-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/b45ed71cf0afe522207dd31177f9ce3f5a270c57-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a7675d9c1bc90207ebda6a9aeb4a67a2d10e0b8b-96x96.jpg"],"ko":[["속삭임","'속삭임'이라고 불리는 진의 총은 우월한 살상력을 위해 설계된 정밀 기계입니다. 발사 속도는 고정되어 있으며 총탄은 네 발만 장전됩니다. 네 발째 총탄은 진의 어두운 마법에 물들어 항상 치명타를 입히며 잃은 체력에 비례한 피해를 추가로 입힙니다. 속삭임으로 치명타를 발동시키면, 진의 이동 속도가 잠깐 동안 크게 상승합니다."],["춤추는 유탄","진이 마법 폭탄을 적에게 던집니다. 최대 네 명의 대상에게 적중하며, 적을 처치할 때마다 피해량이 증가합니다."],["살상연희","진이 엄청난 사거리를 지닌 한 발의 탄환을 발사합니다. 미니언과 몬스터는 관통하지만 챔피언에 맞으면 정지합니다. 적중한 대상이 좀 전에 연꽃 함정에 걸렸거나 진의 아군 또는 진에게 피해를 입었다면 속박됩니다."],["강제 관람","진이 은신 상태에 있다가 밟으면 작동하는 연꽃 함정을 설치합니다. 함정이 작동하면 주위 적을 둔화시킨 후 날카로운 꽃잎들이 폭발하며 피해를 입힙니다. 진이 적 챔피언을 처치하면 사망한 챔피언 주위에 연꽃 함정이 피어납니다."],["커튼 콜","진이 정신 집중을 해 속삭임을 견착식 저격포로 변신시킵니다. 엄청난 사거리에서 4발의 강력한 탄환을 발사하며, 탄환은 미니언과 몬스터는 관통하지만 챔피언에 맞으면 정지합니다. 적중당한 적은 둔화되며 잃은 체력에 비례한 추가 피해를 입습니다. 특별히 완벽하게 세공된 4번째 탄환은 더욱 강력하여 항상 치명타가 적용됩니다."]],"en":[["Whisper","Jhin's hand cannon, Whisper, is a precise instrument designed to deal superior damage. It fires at a fixed rate and carries only four shots. Jhin imbues the final bullet with dark magics to critically strike and deal bonus execute damage. Whenever Whisper crits, it inspires Jhin with a burst of movement speed."],["Dancing Grenade","Jhin launches a magical cartridge at an enemy. It can hit up to four targets and gains damage each time it kills."],["Deadly Flourish","Jhin fires a single shot with incredible range. It pierces through minions and monsters, but stops on the first champion hit. If the target was recently struck by Jhin's allies, lotus traps, or damaged by Jhin, they are rooted."],["Captive Audience","Jhin places an invisible lotus trap that blooms when walked over. It slows nearby enemies before dealing damage with an explosion of serrated petals. When Jhin kills an enemy champion, a lotus trap will bloom near where they were killed."],["Curtain Call","Jhin channels, transforming Whisper into a shoulder-mounted mega-cannon. It is able to fire 4 super shots at extreme range that pierce through minions and monsters, but stop on the first champion impacted. Whisper cripples enemies hit, which slows them and deals execute damage. The 4th shot is perfectly crafted, epically powerful, and guaranteed to critically strike."]],"zh":[["低語","燼有一把名為「低語」的精密武器，能造成可觀的傷害。它的射速是固定的，且一次只能裝填四發子彈。燼將黑魔法附在最後一發子彈上，以造成暴擊與額外斬殺傷害。低語的每次暴擊都能為燼激發靈感，讓他的跑速在短時間內大幅提升。"],["狂舞手雷","燼對敵人射出一發魔法衝能過的鋼瓶。最多能夠擊中四個敵人，每在彈跳中擊殺目標，下次彈跳造成傷害便會增加。"],["致命伏筆","燼發射出超遠距離的一發子彈。這發子彈能夠穿透士兵和野怪，但會在擊中第一名英雄時停止。如果目標近期曾被燼的友軍、蓮華之罠或燼傷害的話將暫時被定身。"],["魔幻時刻","燼放置一個隱形的蓮華之罠，敵軍走過時會被觸發，緩速鄰近敵人，隨後爆炸放射出鋸齒花瓣造成傷害。當燼擊殺敵方英雄時，蓮華之罠會在他們被擊殺的位置旁綻放。"],["華麗謝幕","燼開始詠唱，將低語變成肩射式超級大砲。它能發射四發射程超遠且能穿透士兵和野怪的子彈。子彈會在擊中第一名英雄時停止。低語能夠致殘擊中的敵人，使他們緩速並造成斬殺傷害。第四發子彈做工精良並經過完美的強化，必定造成暴擊。"]],"n":[["0",""],["6/6/5/5",""],["12/12/12/12",""],["2/2/2/2",""],["80/70/60",""]]},"10023":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3c64f48d9b44cb35ff343db64e86cfe55494250b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/54ade474b3ad02caa99b48919ab43987a07cb86d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/31c2b211a790ded95baf9bc43419c25624fe03b0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9131b8fd371d078d90704b8af6e992c24dc10974-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4d73f0006584c3effbee3a671d040e10028eb31f-96x96.jpg"],"ko":[["우주의 창조자","아우렐리온 솔이 스킬로 적에게 피해를 입히면 각 스킬을 영구히 강화하는 별가루를 획득합니다."],["빛의 숨결","아우렐리온 솔이 용의 숨결을 집중시켜 성운파를 내뿜어 처음 적중하는 적에게 피해를 입히고 주변 적에게는 감소된 광역 피해를 입힙니다. 숨결이 적에게 적중할 때마다 매초 추가 피해를 입힙니다. 추가 피해량은 획득한 별가루 양만큼 증가합니다. 대상이 챔피언이면 별가루를 획득합니다. 아우렐리온 솔은 빛의 숨결을 사용하는 중에도 이동할 수 있습니다."],["별의 비행","아우렐리온 솔이 지정한 방향으로 날아갑니다. 이 상태에서 다른 스킬을 사용할 수 있습니다. 비행 중 빛의 숨결은 재사용 대기시간이나 최대 정신 집중 시간이 없으며 피해량이 증가합니다. 아우렐리온 솔이 피해를 입힌 지 얼마 되지 않은 적 챔피언이 죽을 때마다 별의 비행의 남은 재사용 대기시간이 감소합니다. 별가루는 별의 비행의 최대 사거리를 늘립니다."],["특이점","아우렐리온 솔이 적에게 피해를 입히며 적을 천천히 중심으로 끌어당기는 블랙홀을 소환합니다. 이 스킬은 블랙홀에 있는 적 챔피언 한 명당 매초 별가루를 부여하며 안에 있는 적이 죽을 때도 별가루를 부여합니다. 블랙홀의 중심에 있는 적은 체력이 최대 체력의 일정 비율 밑으로 떨어질 경우 처형됩니다. 별가루는 특이점의 크기와 처형 기준값을 늘립니다."],["유성 / 천상 강림","유성: 아우렐리온 솔이 땅으로 별을 떨어뜨립니다. 이 충격으로 마법 피해를 입히고 적을 기절시키며 적중한 적 챔피언 한 명당 별가루를 획득합니다. 별가루가 어느 정도 모이면 아우렐리온 솔이 다음에 사용한 궁극기가 천상 강림으로 변합니다. 천상 강림: 아우렐리온 솔이 하늘에서 충돌 범위와 피해가 커진 거대한 별을 끌어내 적을 기절시키는 대신 공중에 띄워 올립니다. 이후 충돌 범위 가장자리에서 충격파가 퍼지며 적중한 적에게 피해를 입히고 둔화시킵니다."]],"en":[["Cosmic Creator","Aurelion Sol's damaging abilities break down enemies into permanent stacks of Stardust, which improve each of his abilities."],["Breath of Light","Aurelion Sol channels his dragon breath to exhale a beam of starfire, revealing and damaging the first enemy hit and splashing reduced damage onto nearby enemies. Each second the breath is channeled directly at an enemy will deal bonus damage, which is improved by the amount of Stardust that's been collected. This ability collects Stardust if the target is a champion. Aurelion Sol can move while channeling Breath of Light."],["Astral Flight","Aurelion Sol flies over terrain in a targeted direction. While in this state, he can cast other abilities. Breath of Light no longer has a cooldown or maximum channel duration and deals increased damage while flying. Astral Flight's remaining cooldown is reduced whenever an enemy champion dies after being recently damaged by Aurelion Sol. Stardust increases Astral Flight's maximum range."],["Singularity","Aurelion Sol summons a black hole, damaging enemies and slowly pulling them toward its center. This ability grants Stardust each time an enemy dies within the black hole and for each second an enemy champion is caught inside it. The center of the black hole executes enemies who are below a certain percentage of their maximum health. Stardust increases Singularity's area as well as the execution threshold."],["Falling Star / the Skies Descend","Falling Star: Aurelion Sol calls down a star. The impact deals magic damage and stuns enemies hit while also granting Stardust for each enemy champion hit. Gathering enough Stardust transforms Aurelion Sol's next ult cast into The Skies Descend. The Skies Descend: Aurelion Sol calls a giant star down from the heavens with an increased impact zone and increased damage, knocking up enemies rather than stunning them. A shockwave then spreads from the edge of the impact zone, which damages and slows the enemies it hits."]],"zh":[["宇宙創世","翱銳龍獸的傷害性技能會將敵軍分解為星塵，永久強化他的技能。"],["星光吐息","翱銳龍獸吐出星火龍息，對命中的第一位敵軍造成傷害並揭露其位置，部分傷害會濺射至鄰近敵軍身上。每對敵軍吐息一秒便會造成額外傷害，累積的星塵越多，傷害量也越高。此技能命中英雄可獲得星塵。翱銳龍獸在施放「星光吐息」的期間可以緩慢移動。"],["星界翱翔","翱銳龍獸朝目標方向飛行，在此狀態下可飛越地形物，以及施放其他技能。在飛行期間，星光吐息沒有冷卻時間，吐息時間無上限，造成的傷害也會提升。每當近期受到翱銳龍獸傷害的敵方英雄死亡時，星界翱翔的剩餘冷卻時間便會減少。星塵會提升最大飛行距離。"],["宇宙奇點","翱銳龍獸召喚一個黑洞，對敵軍造成傷害，並將其緩慢拖向中心。敵軍在黑洞內死亡時會賦予星塵；黑洞裡每有一名敵方英雄，每秒也會賦予星塵。黑洞中心會處決最大生命低於一定百分比的敵軍。星塵會擴大宇宙奇點的範圍並增加處決門檻。"],["降世星辰／天界殞落","降世星辰：翱銳龍獸召喚星辰撞擊地表，使敵軍暈眩並造成魔法傷害，且每擊中一名敵方英雄便會賦予星塵。收集足夠星塵後，翱銳龍獸的下一次大絕會變成天界殞落。 天界殞落：翱銳龍獸從天上拽下一顆巨大星辰，產生的衝擊範圍更大，造成更多傷害，並改為擊飛敵軍。撞擊區域外圍會產生衝擊波，對命中的敵軍造成傷害與緩速效果。"]],"n":[["0",""],["3/3/3/3",""],["18/17/16/15",""],["12/12/12/12",""],["85/80/75",""]]},"10024":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8b3a11545161e2ed512ceba4a52eb8f69fb896f7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/22dab9b1867c6edb83ce9fb90e8b8cd7b1a8c143-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7070806481d30c8cf36741229fac0690c64e943e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/8ab5d7bb180d146fef2526fd5a218f6e8684e7f0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/6ce0878fccf8b84daef332d8f9f85bdbf2d11134-96x96.jpg"],"ko":[["초월","신드라가 적에게 스킬 피해를 입히고 스킬 레벨을 올릴 때마다 분노의 조각을 획득합니다. 분노의 조각은 신드라의 스킬을 강화하고 주문력을 증가시키는 데 쓰입니다."],["어둠 구체","신드라가 어둠 구체를 소환해 그 자리에 마법 피해를 입힙니다. 구체는 제자리에 유지되며 신드라의 다른 스킬로 조종할 수 있습니다. 업그레이드: 신드라의 어둠 구체 충전 횟수가 1회 추가됩니다."],["의지의 힘","신드라가 가장 가까운 어둠 구체를 목표 지점으로 날려 범위 내 적에게 마법 피해를 입히고 둔화시킵니다. 업그레이드: 신드라가 추가 고정 피해를 입힙니다."],["적군 와해","신드라가 힘의 파동을 내보내 적에게 마법 피해를 입히고 적과 어둠 구체를 뒤로 밀어냅니다. 어둠 구체에 맞은 적은 기절하며 추가 피해를 입습니다. 업그레이드: 힘의 파동 사거리가 증가합니다."],["풀려난 힘","신드라 주위를 도는 어둠 구체와 적 챔피언 근처에 있는 어둠 구체를 발사해 각 구체마다 마법 피해를 입힙니다. 업그레이드: 어둠 구체가 체력이 낮은 적을 처형합니다. 적을 처치하면 적이 처치된 자리에서 구체가 폭발해 근처 적 챔피언에게 피해를 입힙니다."]],"en":[["Transcendent","Syndra collects Splinters of Wrath by dealing ability damage to enemies and every time she levels up an ability. Splinters of Wrath can be used to upgrade her abilities and increase ability power."],["Dark Sphere","Syndra conjures a Dark Sphere that deals magic damage where it appears. The sphere remains and can be manipulated by her other powers. Upgrade: Syndra gains an additional charge of Dark Sphere."],["Force of Will","Syndra hurls the nearest Dark Sphere at a target location, dealing magic damage and slowing the Move Speed of enemies within the area. Upgrade: Syndra deals bonus true damage."],["Scatter the Weak","Syndra sends out a wave of force, dealing magic damage and knocking back enemies and Dark Spheres. Enemies hit by Dark Spheres are stunned and take additional damage. Upgrade: Syndra increases the range of the wave of force."],["Unleashed Power","Syndra launches the Dark Spheres orbiting her and any nearby at an enemy champion, dealing magic damage for each Sphere. Upgrade: The Dark Spheres execute enemies with low Health. When killing an enemy, the Spheres will explode on the spot and deal damage to nearby enemy champions."]],"zh":[["卓越","星朵拉每次升級技能，或是對敵軍造成技能傷害，就能獲得忿怒碎片。忿怒碎片可以升級技能效果，並提升魔法攻擊。"],["黑暗星體","星朵拉在指定位置召喚黑暗星體，造成魔法傷害。星體會存在一段時間並可以透過其他技能來操作。升級：星朵拉的黑暗星體獲得一個額外充能。"],["意志之力","星朵拉抓住最近的黑暗星體丟向目標位置，對範圍內的敵軍造成魔法傷害，並使其緩速。升級：星朵拉造成額外真實傷害。"],["虛弱潰散","星朵拉在扇形範圍內放出一波能量，擊退敵軍和黑暗星體，造成魔法傷害。敵軍被黑暗星體擊中的話會暈眩並受到額外傷害。升級：星朵拉此技能的攻擊範圍增加。"],["超能解放","星朵拉操控環繞自身以及附近的星體，將全數星體射向一名敵方英雄，並造成魔法傷害，傷害量依星體數量計算。升級：此技能的星體會處決低血量的敵軍。擊殺敵軍時，星體會在原處爆炸，對鄰近敵方英雄造成傷害。"]],"n":[["0",""],["7/6/6/5",""],["12/11/10/9",""],["15",""],["80/70/60",""]]},"10025":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/807306195f80238e63b54751b4bfe2444ae9a6d6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c163a3b85352ceb23de87f2d0705181d80fc362e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/834c04df8f609ee892c47f3892954c690156959d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f6331175153003520f50b26840b2c38f2c2c2f10-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e37efb04b174e0fd2a8195286e4e3f4973fb4269-96x96.jpg"],"ko":[["사기 주사위","트위스티드 페이트는 유닛을 하나 처치할 때마다 '행운'의 주사위를 굴려 골드를 추가로 얻습니다."],["와일드 카드","트위스티드 페이트는 카드 세 장을 던져 지나가는 카드에 맞은 각 적 유닛에게 피해를 입힙니다."],["카드 뽑기","트위스티드 페이트가 카드 더미에서 다음 공격에 쓸 마법 카드를 한 장 골라 기본 공격 시 추가 효과를 부여합니다. 붉은색 카드는 주변 적에게 피해를 입히고 둔화시킵니다. 푸른색 카드는 피해를 입히고 마나를 회복합니다. 황금색 카드는 피해를 입히고 기절시킵니다."],["속임수 덱","4번째 공격마다 트위스티드 페이트가 추가 피해를 입힙니다. 이 스킬을 사용하면 공격 속도가 상승하고 적 챔피언을 공격하면 사기 주사위가 발동됩니다."],["운명","트위스티드 페이트가 적의 미래를 점치면서 모든 적 챔피언의 위치를 탐지해내고, 어디든지 이동할 수 있는 관문 스킬을 1.5초 동안 사용할 수 있게 됩니다."]],"en":[["Loaded Dice","Upon killing a unit, Twisted Fate rolls his 'lucky' dice receiving bonus gold."],["Wild Cards","Twisted Fate throws three cards, dealing damage to each enemy unit they pass through."],["Pick a Card","Twisted Fate chooses a magic card from his deck, and uses that for his next attack, causing bonus effects. Red Cards deal damage in an area and slow, Blue Cards deal damage and restore mana, and Gold Cards deal damage and stun."],["Stacked Deck","Every 4 attacks, Twisted Fate deals bonus damage. Activating this skill increases his Attack Speed, and attacking enemy champions rolls his Loaded Dice."],["Destiny","Twisted Fate predicts the fortunes of his foes, revealing all enemy champions and enabling the use of Gate, which teleports Twisted Fate to any target location in 1.5 seconds."]],"zh":[["灌鉛骰子","每擊殺一個單位，逆命會擲出灌鉛骰子並獲得額外金錢獎勵。"],["萬能牌","逆命丟出三張牌，對所有被卡牌穿透的敵人造成傷害。"],["選牌","逆命挑選魔法卡牌，用於下次普攻，並附加額外效果。紅色卡牌能對目標及其鄰近範圍內的敵人造成傷害並緩速；藍色卡牌能造成傷害並回復自身魔力；金色卡牌能造成傷害並擊暈目標。"],["卡牌騙術","逆命每4次普攻就會造成額外傷害。主動使用此技能能增加攻速，同時對敵方英雄普攻時會擲出灌鉛骰子。"],["命運","逆命預測敵人的命運，揭露所有敵方英雄，並可使用傳送門將逆命在1.5秒內傳送至任何目標位置。"]],"n":[["0",""],["6/6/6/6",""],["7/6/6/5",""],["17/16/15/14",""],["100/90/80",""]]},"10026":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/8e5a628441a54cf36112a519fa2f1a8d804f95ac-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cbeadf202ac7a109004e6d1f36cf95767216ebca-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1b0597ebeabe60f303b2180b28135c1e0703c5c5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/caa3546d3aa43b20cb2313f3053b002426121a57-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3495f169849118d9086b0e7e7ec744911c89fad7-96x96.jpg"],"ko":[["두 번째 피부","카이사는 기본 공격으로 플라즈마 중첩을 쌓아 그에 따른 추가 마법 피해를 입힙니다. 아군의 이동 불가 효과가 적에게 적용됐을 때에도 플라즈마 중첩이 쌓입니다. 또한 카이사가 구입하는 아이템에 따라 카이사의 기본 스킬이 살아있는 무기 효과로 강화됩니다."],["이케시아 폭우","카이사가 근처 적들을 추격하는 미사일 세례를 퍼붓습니다. 살아있는 무기: 이케시아 폭우가 발사하는 미사일 개수가 증가합니다."],["공허추적자","카이사가 장거리 광선을 발사합니다. 광선에 적중한 적은 모습이 드러나며 플라즈마 중첩이 쌓입니다. 살아있는 무기: 공허추적자 적중 시 플라즈마 중첩이 추가로 쌓이며 챔피언에게 적중 시 재사용 대기시간이 감소합니다."],["고속 충전","카이사의 이동 속도가 잠시 동안 증가한 뒤 공격 속도가 증가합니다. 살아있는 무기: 고속 충전을 사용하면 잠시 투명 상태가 됩니다."],["사냥본능","카이사가 플라즈마 표식이 남은 적 챔피언 근처로 돌진하며 잠시 보호막을 얻습니다."]],"en":[["Second Skin","Kai'Sa's basic attacks stack Plasma, dealing increasing bonus magic damage. Allies' immobilizing effects help stack Plasma. Additionally, Kai'Sa's item purchases upgrade her basic spells to have more powerful properties."],["Icathian Rain","Kai'Sa shoots a swarm of missiles that seek out nearby targets. Living Weapon: Icathian Rain is upgraded to shoot more missiles."],["Void Seeker","Kai'Sa shoots a long range missile, revealing and marking enemies with her passive. Living Weapon: Void Seeker is upgraded to apply more Plasma marks and reduce cooldown on champion hit."],["Supercharge","Kai'Sa briefly increases her movement speed, then increases her attack speed. Living Weapon: Supercharge is upgraded to briefly grant Invisibility."],["Killer Instinct","Kai'Sa dashes near an enemy champion marked by Plasma and gains a temporary shield."]],"zh":[["二階蟲甲","凱莎的普攻會疊加電漿印記，造成逐漸增加的額外魔法傷害。友軍的控場技能也會疊加電漿印記。此外，凱莎能透過她購買的道具來進化基礎技能，以獲得更強力的效果。"],["伊卡西亞魔雨","凱莎發射出一大批會追擊鄰近目標的導彈。生物兵器：升級後的伊卡西亞魔雨可射出更多導彈。"],["虛空探索者","凱莎發射出遠程飛彈，揭露敵人並利用被動將其標記。生物兵器：升級後的虛空探索者可疊加更多層電漿印記，且擊中敵方英雄後會減少冷卻時間。"],["極速充能","凱莎暫時提高跑速，接著提升攻速。生物兵器：升級後的極速充能會使凱莎短暫進入潛隱狀態。"],["殺手本能","凱莎衝刺到一名被電漿印記標記的敵方英雄附近，並在短時間內獲得護盾。"]],"n":[["0",""],["9/8/7/6",""],["20/18/16/14",""],["16/14/12/10",""],["80/70/60",""]]},"10027":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a072bb11e54c27122c3211fbca19b89d6936c38d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/87ff34c92bdc6387cb5aab1839e7b55cead6d9f9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a16ab3389e90d3896fcc43fd99f37cdae9aa30e2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ff1ed1d0c945a46be95b052b5fc16b5901b6a28d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/d4f0ed389a873b942617758fefe2ac4574dd103f-96x96.jpg"],"ko":[["영원한 기쁨","미니언에게 최후의 일격을 가하면 경험치를 추가로 획득하며, 주변 아군이 부여하는 체력 회복 및 보호막 효과를 강화하고 공유합니다."],["무형의 검","지정한 방향으로 칼날 채찍을 후려쳐 일직선상에 있는 모든 적에게 피해를 입힙니다. 공격 사거리가 잠깐 동안 증가합니다."],["승리의 장막","자신을 안개로 감싸 이동 속도를 얻고 우아하게 모든 기본 공격을 회피합니다. 안개 지속시간 중 닐라에게 닿은 아군에게도 이 효과가 적용됩니다."],["급류","대상을 향해 맹렬히 돌진해 경로상의 모든 적에게 피해를 입힙니다."],["환희","신나게 칼날 채찍을 휘둘러 주변 모든 적에게 피해를 입히고 가까이 끌어당깁니다."]],"en":[["Joy Unending","Nilah gains increased experience from last-hitting minions along with the ability to enhance and share nearby healing and shielding from her allies."],["Formless Blade","With a snap of her whip-blade, Nilah damages any enemies she hits in a straight line in her chosen direction. This action extends her attack range for a short duration."],["Jubilant Veil","Nilah envelops herself in mist, increasing her movement speed and allowing her to gracefully dodge all incoming attacks. Any allies she touches during the mist's duration will also gain this effect."],["Slipstream","Nilah enthusiastically dashes toward her target, dealing damage to any enemies she passes through on the way."],["Apotheosis","Twirling her whip-blade in joyful exuberance, Nilah deals damage to enemies around her before pulling them closer with her weapon."]],"zh":[["樂無止境","淣菈使用最後一擊擊殺士兵時獲得額外經驗值。除此之外，還能強化並分享來自隊友的治癒和護盾。"],["百變之刃","淣菈朝著指定方向揮舞鞭刃，對直線上所有命中的敵人造成傷害。短暫時間內，淣菈獲得攻擊距離提升。"],["歡躍面紗","淣菈將自身籠罩在水霧中，提升跑速並優雅地閃避所有普通攻擊。技能期間接觸到的友軍也將獲得此效果。"],["湍流淩步","淣菈充滿熱情地向目標衝刺，對途徑中的敵人造成傷害。"],["神之禮讚","淣菈愉快地揮舞手中的鞭刃，對周圍敵人造成傷害後將其拉向自身。"]],"n":[["0",""],["4/4/4/4",""],["21/20/19/18",""],["18/16/14/12",""],["80/70/60/50",""]]},"10028":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/1b89213c4f6991c771b1b3731758aebcc1c3e698-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/acac8defd9bd80a58aa1caae9d69f6c12ae46e35-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d55651a1f1f08e25a85aae7bd2f854e57e905b95-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f90b85e95561042a61cbe60ada573fd0efbf4095-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/14a7205f81d4c340c1f66bac701a685465819ce7-96x96.jpg"],"ko":[["영혼 흡수","모르가나가 적의 영혼을 흡수하여 챔피언, 대형 미니언, 중형 및 대형 정글 몬스터에게 피해를 입힐 때 체력을 회복합니다."],["어둠의 속박","모르가나가 흑마법으로 적을 제자리에 속박하고 적이 유발한 고통을 스스로 느끼게 하여 마법 피해를 입힙니다."],["고통의 그림자","모르가나가 대상 지역에 저주받은 그림자를 펼쳐 검은 원 안에 서 있는 적에게 피해를 입힙니다. 대상은 자신이 잃은 체력에 비례하는 마법 피해를 지속적으로 입습니다."],["칠흑의 방패","모르가나가 아군에게 별의 화염이 깃든 보호막을 칩니다. 보호막은 깨질 때까지 마법 피해와 방해 효과를 흡수합니다."],["영혼의 족쇄","모르가나가 날개를 펼치며 천상의 힘을 완전히 해방하여 땅 위로 날아오르고 주변 적 챔피언에게 검은 고통의 사슬을 날려 해당 적을 향해 이동할 때 이동 속도가 증가합니다. 사슬은 이동 속도를 늦추고 처음에 피해를 입히며 시간이 지난 후에도 사슬을 벗어나지 못하는 적을 기절시킵니다."]],"en":[["Soul Siphon","Morgana drains spirit from her enemies, healing as she deals damage to champions, large minions, and medium and larger jungler monsters."],["Dark Binding","Morgana binds an enemy in place with dark magic, forcing them to feel the pain they've caused and dealing magic damage."],["Tormented Shadow","Morgana casts a cursed shadow on an area, damaging enemies who dare stand in her dark circle. They receive magic damage over time, which increases the lower health they are."],["Black Shield","Morgana anoints an ally with a protective barrier of starfire, which absorbs magical damage and disabling effects until it is broken."],["Soul Shackles","Morgana unleashes the full force of her Celestial power as she unbinds her wings and hovers above the ground. She lashes chains of dark pain onto nearby enemy champions, gaining Move Speed towards them. The chains slow and deal initial damage and, after a delay, stun those who are unable to break them."]],"zh":[["靈魂虹吸","魔甘娜汲取敵人的靈魂，對敵方英雄、大型士兵、中型與大型野怪造成傷害時會回復自身生命。"],["暗影禁錮","魔甘娜釋放黑暗魔法定身一名敵軍，對其造成魔法傷害，強迫其感受自身施加給別人的痛楚。"],["痛苦腐蝕","魔甘娜在一塊區域上施放詛咒暗影，對膽敢踏進這個黑暗圓圈的所有敵軍造成傷害。敵軍將受到持續性魔法傷害，且其生命越低，受到的傷害越高。"],["黑暗之盾","魔甘娜賦予一名友軍星火屏障，屏障在破裂之前會吸收魔法傷害和控場效果。"],["靈魂枷鎖","魔甘娜綻放雙翼並釋放體內的星體之力，用鎖鏈綁縛鄰近的敵方英雄，朝他們移動時加快跑速。鎖鏈會緩速敵軍，且首次接觸敵軍時會造成傷害，在短暫延遲後，將暈眩無法掙脫鎖鏈的敵軍。"]],"n":[["0",""],["9/9/9/9",""],["12/12/12/12",""],["13/12/11/10",""],["75/65/55",""]]},"10029":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/204da58dade31ef684fc76296ae595722b93ce43-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9081503869757523aeed6f99ade96cffe9838ff3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2266643d9f8d3d505df00cf3db0c819ccb0fc71d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/9acd9a4142a208abdc739a988c315fc4cac17720-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/589f01487716aa00da95b8f9236768bec43c8e0f-96x96.jpg"],"ko":[["악의 장막","이블린은 전투에서 벗어나 있을 때 악의 장막에 휩싸입니다. 악의 장막에 싸이면 낮은 체력에서 체력이 회복되며 5레벨부터는 위장 효과도 제공합니다."],["증오의 가시","이블린이 가시를 두 번 발사해 처음 적중한 유닛에게 피해를 줍니다. 그다음 재사용하여 근처 적에게 일직선상의 가시를 다시 발사할 수 있습니다."],["황홀한 저주","이블린이 대상에게 저주를 겁니다. 이 대상에게 공격 또는 스킬을 시전하면 잠시 후 저주에 걸린 시간에 비례해 둔화 또는 매혹 효과가 발동되며 대상의 마법 저항력이 감소합니다."],["채찍유린","이블린이 대상을 가격하여 피해를 줍니다. 이후 짧은 시간 동안 이동 속도가 증가합니다. 악의 장막에서 벗어나면 채찍유린으로 자신을 대상에게 끌어당깁니다."],["최후의 포옹","이블린이 잠시 대상으로 지정할 수 없게 되며 전방 범위 내의 적에게 피해를 준 다음 순간적으로 뒤쪽으로 이동합니다."]],"en":[["Demon Shade","When out of combat, Evelynn enters Demon Shade. Demon Shade heals Evelynn when she is low on health and grants Camouflage after level 5."],["Hate Spike","Evelynn strikes out with her lasher twice, dealing damage to the first unit hit. Then, Evelynn can re-cast to shoot another line of spikes at nearby foes."],["Allure","Evelynn curses her target, causing her next attack or spell after a delay to slow or charm her target, based on time cursed, and reduce their magic resist."],["Whiplash","Evelynn whips her target with her Lasher, dealing damage. She then gains movement speed for a short duration. When exiting Demon Shade, Whiplash pulls Evelynn to her target."],["Last Caress","Evelynn briefly goes untargetable and decimates the area in front of her before warping backwards a long distance."]],"zh":[["魔魅之影","脫離戰鬥後，伊芙琳會被魔魅之影籠罩。若伊芙琳的生命值過低，魔魅之影將會回復其生命。等級5之後，魔魅之影還會賦予伊芙琳偽裝能力。"],["憎恨尖刺","伊芙琳使用背刺攻擊兩次，對第一個命中的敵人造成傷害。接著伊芙琳可以重施技能，對鄰近敵人再次放出一直線的尖刺。"],["咒慾迷塵","伊芙琳詛咒一名目標，根據詛咒的時間長短，在短暫延遲之後，她的下次普攻或技能將使目標受到緩速或魅惑，同時降低其魔法防禦。"],["奪魂鞭索","伊芙琳使用背刺穿刺目標並造成傷害，接著在短時間內增加跑速。伊芙琳脫離魔魅之影狀態時，奪魂鞭索會把她拉向目標。"],["殘戮收割","伊芙琳短暫進入無法被指定的狀態，用背刺橫掃前方所有敵人並向後瞬移一段距離。"]],"n":[["0",""],["4/4/4/4",""],["14/13/12/11",""],["8/8/8/8",""],["90/75/60",""]]},"10030":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/d8edeb2027d59bf58c22269eb9f824751a88762a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1aa0152655dbb4def4028e29012e46b311a090d9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/5e80c2c36a2e0cc0992f920e02883aee50a26bc4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f60778df68cafcc4dbe5ac897bb8d9891c5883aa-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8af60988ad4fef1a9c403c103acbb213d003ce80-96x96.jpg"],"ko":[["필멸자의 의지","기본 공격 또는 스킬을 몇 회 사용할 때마다 다음 스킬이 강화됩니다."],["혜성의 창","판테온이 지정 방향으로 창을 찌르거나 던집니다. 체력이 낮은 적에게는 치명타로 적중합니다. 필멸자의 의지: 추가 피해를 입힙니다."],["방호의 도약","판테온이 대상에게 돌진해 기절시키고 피해를 입힙니다. 필멸자의 의지: 3회에 걸쳐 후속 공격을 가합니다."],["방패 돌격","판테온이 방패를 들어 정면에서 오는 피해에 무적이 되며, 창으로 연달아 공격합니다. 필멸자의 의지: 이동 속도가 증가합니다."],["거대 유성","판테온이 힘을 모아 공중으로 도약한 다음, 지정 위치에 유성이 되어 떨어지며 해당 방향으로 일직선상에 있는 적들에게 피해를 입히고 둔화시킵니다."]],"en":[["Mortal Will","Every few spells or attacks, Pantheon's next spell is empowered."],["Comet Spear","Pantheon either thrusts his spear or throws his spear in the chosen direction. Low health enemies are critically hit. Mortal Will: Deals additional damage."],["Shield Vault","Pantheon dashes to a target, damaging and stunning them. Mortal Will: Follows up with an additional attack that strikes 3 times."],["Aegis Assault","Pantheon sets his shield, becoming invulnerable to damage from the front and striking repeatedly with his spear. Mortal Will: Pantheon gains movement speed."],["Grand Starfall","Pantheon composes himself and then leaps into the air, landing at a chosen location as a comet, slowing and dealing damage in a line pointing to where he lands."]],"zh":[["凡人堅志","在施放數次技能或普攻後，潘森下一次施放技能將得到強化。"],["彗星戰矛","潘森以戰矛突刺或將戰矛往指定方向擲出。生命值低的敵人會遭到暴擊。凡人堅志加成：造成額外傷害。"],["盾之躍擊","潘森衝向一名目標，造成傷害並使目標暈眩。凡人堅志加成：再追加一次連擊三下的額外普攻。"],["聖盾猛襲","潘森架起盾牌，免疫前方來襲的傷害並用戰矛連續發動攻擊。凡人堅志加成：潘森提升跑速。"],["星殞衝擊","潘森凝聚全身力量，接著躍向空中，以彗星之姿落在選定的地點，對一直線上的敵人造成傷害與緩速效果。"]],"n":[["0",""],["8/8/7/7",""],["12/11/10/9",""],["15/14/13/12",""],["90/80/70",""]]},"10031":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/491bce87a1f9bc04bf4754991a79cdde1f01066d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/286a6c42f27ce255ef22f37061b27e5090451575-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ed64a69d9009c479d96e54004b9a7febccda7b74-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/4567127fda739f1e95e1ff32c4285c2be284a438-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3fa9f9b5cf7fd0ea7f33674ec88bd2e3d20bea5d-96x96.jpg"],"ko":[["암살자의 표식","스킬 공격으로 챔피언에게 피해를 입히면 해당 챔피언의 주변에 원이 생깁니다. 이 원의 경계를 넘어가면 다음 기본 공격의 사거리가 길어지고 추가 피해를 입힙니다."],["오연투척검","아칼리가 단검 다섯 개를 던져 추가 공격력과 주문력에 비례하여 피해를 입힙니다. 최대 사거리 적중 시에는 적을 둔화시킵니다."],["황혼의 장막","아칼리가 연막을 퍼뜨린 후 이동 속도가 잠시 상승하고 기력이 회복됩니다. 연막 안에 있는 동안 아칼리는 투명 상태가 됩니다. 아칼리가 공격하거나 스킬을 사용하면 순간적으로 아칼리의 모습이 드러납니다."],["표창곡예","아칼리가 뒤로 공중제비를 돌며 전방으로 표창을 던져 마법 피해를 입힙니다. 처음으로 적중한 적이나 연막에 표식을 남깁니다. 스킬을 재사용하면 표식을 남긴 대상에게 돌진해 추가 피해를 입힙니다."],["무결처형","아칼리가 지정한 방향으로 도약해 공격이 적중한 적들에게 피해를 입힙니다. 스킬을 재사용하면 지정한 방향으로 돌진해 공격이 적중한 모든 적들에게 피해를 입힙니다."]],"en":[["Assassin's Mark","Dealing spell damage to a champion creates a ring of energy around them. Exiting that ring empowers Akali's next autoattack with bonus range and damage."],["Five Point Strike","Akali throws out five kunai, dealing damage based on her bonus Attack Damage and Ability Power and slowing at maximum range."],["Twilight Shroud","Akali drops a cover of smoke and briefly gains Movement Speed and restores Energy. While inside the shroud, Akali becomes invisible. Attacking or using abilities will briefly reveal her."],["Shuriken Flip","Akali flips backward and fires a shuriken forward, dealing magic damage. The first enemy or smoke cloud hit is marked. Re-casting dashes to the marked target, dealing additional damage."],["Perfect Execution","Akali leaps in a direction, damaging enemies she strikes. Re-casting dashes in a direction, executing all enemies she strikes."]],"zh":[["刺客印記","使用技能傷害敵方英雄時會在其周圍創造一個能量環印。穿過環印後，阿卡莉下一次的普攻距離及傷害都會增加。"],["落擲苦無","阿卡莉擲出五支苦無，根據自身的額外物理攻擊和魔法攻擊造成傷害，並緩速於最遠技能範圍被擊中的敵人。"],["暮光朦影","阿卡莉投擲煙霧彈，在短時間內增加跑速，同時回復能量。阿卡莉位於煙霧中時會進入潛隱狀態。普攻或使用技能會使她短暫現形。"],["離群手裡劍","阿卡莉向後跳躍並朝前方投擲手裡劍，造成魔法傷害。第一個被命中的敵人或煙霧會被標記。重施技能時，阿卡莉會衝向被標記的目標，造成額外傷害。"],["無瑕追擊","阿卡莉朝一個方向躍擊，對擊中的敵人造成傷害。重施技能時，阿卡莉會朝一個方向衝刺，斬殺所有擊中的敵人。"]],"n":[["0",""],["1/1/1/1","105/90/75/60"],["18/17/16/15","0/0/0/0"],["15/13/11/9","30/30/30/30"],["85/65/45","0/0/0"]]},"10032":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/670323b63d638d53c6e891d72014a4a4d4343dcb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b08a5e102f4d879f83ed1ce4f283a464ac9d4269-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ee61fa9633bffc65d88847f42a45e51504bb90ba-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/2328754e8658352023701552af128c3320804987-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/77ad61038a528053c137eea65d75e87410ffd694-96x96.jpg"],"ko":[["치명적인 검무","피오라가 근처 적 챔피언에게 도전하여 공격을 선언합니다. 피오라가 공격할 급소를 드러낸 뒤 해당 급소를 가격하면 작은 보너스 효과를 얻고, 새로운 급소를 드러냅니다."],["찌르기","피오라가 한 방향으로 돌진하며 근처 적 하나를 찔러 물리 피해를 입히고 적중 시 효과를 적용합니다."],["응수","피오라가 잠시 동안 받는 모든 공격과 이동 불가 효과를 막아낸 다음 대상이 있는 방향으로 검을 찌릅니다. 이 공격은 처음 맞은 적 챔피언을 둔화시키고, 피오라가 이동 불가 효과를 막아낼 경우 공격한 상대를 기절시킵니다."],["대가의 검술","피오라는 다음 두 번의 공격에 대해 공격 속도가 상승합니다. 첫 번째 공격은 대상을 둔화시키고, 두 번째 공격은 치명타가 됩니다."],["대결투","피오라가 적 챔피언의 급소 네 군데를 모두 드러내고 해당 적 근처에서 이동 속도가 증가합니다. 피오라가 급소 네 군데를 모두 가격하거나 한 군데라도 가격한 후 대상이 죽으면 다음 몇 초 동안 피오라와 주변 지역에 있는 아군이 치유됩니다."]],"en":[["Duelist's Dance","Fiora challenges nearby enemy Champions to dodge her. She calls out a direction from which she will try to strike. If she can complete her own challenge, she receives a small bonus and calls out a new direction."],["Lunge","Fiora lunges in a direction and stabs a nearby enemy, dealing physical damage and applying on-hit effects."],["Riposte","Fiora parries all incoming damage and disables for a short time, then stabs in a direction. This stab slows the first enemy champion hit, or stuns them if Fiora blocked an immobilizing effect with this ability."],["Bladework","Fiora has increased attack speed for the next two attacks. The first attack slows the target, and the second attack will critically strike."],["Grand Challenge","Fiora reveals all four Vitals on an enemy champion and gains movement speed while near them. If Fiora hits all 4 Vitals or if the target dies after she has hit at least one, Fiora and her allies in the area are healed over the next few seconds."]],"zh":[["不屈鬥魂","菲歐拉向鄰近敵方英雄發起挑戰。她決定一個方向進行攻擊。如果完成挑戰，她會得到小量的獎勵，並決定下一個方向。"],["移形之體","菲歐拉往一個方向衝刺並戳刺一名鄰近敵人，造成物理傷害並附加命中效果。"],["斗轉之力","菲歐拉在短時間內格檔所有敵方傷害或控制技能，並接著向一個方向戳刺，對擊中的第一個英雄造成緩速，如果菲歐拉擋下任何控制技能則改為將目標擊暈。"],["迅雷之技","菲歐拉接下來兩次的普攻攻速獲得提升。第一下攻擊會使目標緩速，第二下則必定暴擊。"],["頂尖對決","菲歐拉揭露一位目標敵方英雄的全部四個破綻，並在靠近目標時獲得跑速提升。如果菲歐拉擊中全部4個破綻，或是目標在被擊中至少一個破綻後陣亡，則菲歐拉與區域內的友軍會在接下來的幾秒內得到治療。"]],"n":[["0",""],["12/10/8/6",""],["18/16/14/12",""],["11/9/7/5",""],["70/60/50",""]]},"10033":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/4df4393cd54bcddd5c7944d5caf52ef42eef11ae-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f76239e49408c780ab3a8607acd3dc7124f23765-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9d9aee1c960fc63b0ff813a90d9286c8d6544bc1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c25a81506f06657095434a9d6592c76fa6f0b6bb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/f8bc034f9655eacf2d3972753369b0d782752a3e-96x96.jpg"],"ko":[["마나 보호막","체력이 낮아지면 블리츠크랭크가 마나에 비례하여 보호막을 얻습니다."],["로켓 손","블리츠크랭크가 오른손을 발사하여 앞에 있는 적을 붙잡아 당기면서 피해를 입힙니다."],["폭주","블리츠크랭크가 힘을 충전하여 이동 및 공격 속도를 크게 향상시킵니다. 이 효과가 끝나면 일시적으로 이동 속도가 느려집니다."],["강철 주먹","블리츠크랭크가 주먹에 힘을 모아 다음 기본 공격 시 적에게 치명타를 입히고 적을 공중으로 띄웁니다."],["정전기장","블리츠크랭크의 공격을 받은 적은 표식이 남아 1초 후 번개 피해를 입습니다. 활성화할 경우 주변 적에게 피해를 입히고 잠시 침묵에 걸리게 합니다."]],"en":[["Mana Barrier","Blitzcrank gains a shield based on his mana when dropping to low health."],["Rocket Grab","Blitzcrank fires his right hand to grab an opponent on its path, dealing damage and dragging it back to him."],["Overdrive","Blitzcrank super charges himself to get dramatically increased Movement and Attack Speed. He is temporarily slowed after the effect ends."],["Power Fist","Blitzcrank charges up his fist to make his next attack critically strike and pop his target up in the air."],["Static Field","Enemies attacked by Blitzcrank are marked and take lightning damage after 1 second. Additionally, Blitzcrank can activate this ability to damage nearby enemies, and silence them briefly."]],"zh":[["法力屏障","布里茨在生命值過低時會根據他的魔力獲得護盾。"],["火箭抓取","布里茨發射右手，去抓一位在發射路徑上的對手，對對方造成傷害，並將對方抓到自己身旁。"],["過載運轉","布里茨將自己過度充能，大幅提升跑速及攻速。效果結束後他將會暫時遭到緩速。"],["充能一擊","布里茨為機械手臂充能，下次普攻造成暴擊傷害並擊飛目標。"],["靜電力場","被布里茨攻擊的敵人會被標記，並在1秒後受到電擊傷害。此外，布里茨可以啟動此技能來傷害周圍敵人，並造成短暫的沉默效果。"]],"n":[["50",""],["18/17/16/15",""],["10",""],["8/7/6/5",""],["55/35/15",""]]},"10034":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8531a6b00deaac5ece9290c1614491183a9ef4b0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6e1fbd7f2a3645a9f585c3147d230e1db70adc6b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d2b2838cf760209eaac2475ce35547135a548842-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c9483e9d9486de80408ea7588d8ee1bf56cd4fc6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/20872128eabe45eb7a940a0c656ff2f0f5411659-96x96.jpg"],"ko":[["무대 장악","세 번째마다 사용하는 스킬은 메아리가 되어 한 번 더 사용됩니다. 세라핀의 스킬을 사용하면 주변 아군들에게 음표를 부여합니다. 음표 하나당 세라핀의 다음 기본 공격 사거리와 추가 피해가 증가합니다."],["고음","세라핀이 대상 지역에 피해를 입힙니다. 피해량은 적이 잃은 체력에 비례합니다."],["소리 장막","세라핀이 주변 모든 아군 챔피언에게 보호막을 부여하고 이동 속도를 증가시킵니다. 이미 세라핀에게 보호막이 있을 경우 주변 모든 아군이 해당 아군 수에 비례해 체력을 회복합니다."],["비트 발사","세라핀이 적들에게 피해를 입히고 둔화시킵니다. 이미 둔화된 적은 속박되고, 이미 속박된 적은 기절합니다."],["앙코르","세라핀이 일직선상에 피해를 입혀 적을 매혹하고 둔화시킵니다. 앙코르가 아군 또는 적 챔피언에게 닿으면 사거리가 늘어납니다."]],"en":[["Stage Presence","Every third ability cast will Echo, casting it again. Casting Seraphine's abilities grants a Note to nearby allies. For each Note, Seraphine's next basic attack gains Attack Range and bonus damage."],["High Note","Seraphine deals damage in an area, increased by enemies' missing Health."],["Surround Sound","Seraphine shields all nearly ally champions and grants them Movement Speed. If Seraphine is already shielded, nearby allies are healed, increasing for each ally."],["Beat Drop","Seraphine deals damage and slows enemies. If the enemy is already slowed, they are rooted instead. If they are already rooted, they are stunned instead."],["Encore","Seraphine deals damage in a line, charming and slowing enemies. Encore extends if it touches an ally or enemy champion."]],"zh":[["耀眼星光","瑟菈紛每第三次基礎技能將施放兩次；瑟菈紛施放技能會對鄰近友軍附上音符，每個音符會使瑟菈紛下次普攻的攻擊距離增加，並造成額外傷害。"],["樂音高亢","瑟菈紛對一個區域內的敵人造成傷害，傷害量會隨敵人已損失的生命而增加。"],["繞樑歌聲","瑟菈紛賦予所有鄰近友方英雄護盾，並使他們增加跑速。若瑟菈紛身上已經有護盾，則替所有鄰近友方英雄回復生命，回復量會隨友方英雄數量而增加。"],["迷人節奏","瑟菈紛對敵人造成傷害並使其緩速，已被緩速的敵人則改為被定身，被定身的敵人則改為被擊暈。"],["要不要來首安可曲","瑟菈紛對前方直線上的敵人造成傷害，並施加魅惑與緩速效果。若此技能接觸到友方或敵方英雄，則技能距離會延長。"]],"n":[["0",""],["11/9/7/5",""],["23/22/21/20",""],["12/11/10/9",""],["105/90/75",""]]},"10035":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/6a443232a5b3bfeaada3e2b97b471ee6bdcb1d6e-500x500.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4024e5617a7050c99ca26a559ad149797df30050-500x500.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/abb202d7e8349ee4cc510cedeadfea39c4c0e641-500x500.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/6f63ed5b7adf4ccec30dc3ab713d88b53078b37a-500x500.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bd9db471f6dfe724dd076913861c99b54413fc04-500x500.jpg"],"ko":[["암흑 탄생","모데카이저가 적 챔피언이나 몬스터에게 공격 또는 스킬을 3회 적중시키면 강력한 피해를 입히는 오오라를 얻고 이동 속도가 증가합니다."],["말살","모데카이저가 땅에 철퇴를 내리쳐 적중시킨 적에게 각각 피해를 입힙니다. 단일 대상에게 적중 시 피해량이 증가합니다."],["불멸","모데카이저가 입히거나 받는 피해를 흡수하여 보호막을 충전합니다. 보호막을 소모하여 체력을 회복할 수 있습니다."],["죽음의 손아귀","모데카이저가 일정 지역에 있는 모든 적을 끌어당깁니다."],["죽음의 세계","모데카이저가 대상을 다른 차원으로 끌고 가 능력치의 일부를 훔칩니다. 처치 시 적이 부활할 때까지 훔친 능력치가 유지됩니다."]],"en":[["Darkness Rise","Mordekaiser gains a powerful damage aura and Move Speed after landing 3 attacks or spells against champions or monsters."],["Obliterate","Mordekaiser smashes the ground with his mace dealing damage to each enemy struck. Damage is increased when hitting a single enemy."],["Indestructible","Mordekaiser stores damage he deals and takes to create a shield. He may consume the shield to heal."],["Death's Grasp","Mordekaiser pulls all enemies in an area."],["Realm of Death","Mordekaiser drags his victim to a different dimension with him and steals a portion of their stats. If he kills them, he keeps the stats until the victim respawns."]],"zh":[["暗崛","魔鬥凱薩以普攻或技能命中英雄或野怪3次後，獲得一個強力的傷害靈氣和跑速。"],["泯滅","魔鬥凱薩用他的鐵鎚猛擊地面，對被命中的每位敵軍造成傷害。若只命中單一敵軍，傷害將提高。"],["不滅之軀","魔鬥凱薩儲存他造成和受到的傷害，以其製造一個護盾。他可以消耗這個護盾來治癒自己。"],["死之爪","魔鬥凱薩將區域內所有敵軍往自己拉。"],["死亡領域","魔鬥凱薩把目標和自己拖到一個異次元空間，並偷取目標一部分的屬性。如果他擊殺了目標，那麼會保有這些屬性直到目標復活。"]],"n":[["0",""],["7/6/5/4",""],["12/11/10/9",""],["15/13/11/9",""],["105/90/75",""]]},"10036":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b7f7813fe0367fe34e917b951cca3bc5cb7ca3b8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c908b4808c5ca4af75de794c7274b8646fae4df4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/61abec6d3cc48a6aa4956ef677f6baea0da6b992-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/da1b68e857183f23d146c341318bbb2e3984d6ec-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/610f1b34137a719fa2677c0897fbe46847d2aff1-96x96.jpg"],"ko":[["방화광","애니가 스킬을 4번 사용한 후 다음 공격 스킬에 맞은 적은 기절합니다."],["붕괴","애니가 마나로 가득 찬 화염구를 던져 작은 지역에 피해를 입힙니다. 결정타를 냈을 때 사용한 마나를 되돌려 받고 재사용 대기시간이 절반으로 감소합니다."],["소각","애니가 원뿔 형태의 화염을 내뿜어 해당 지역에 있는 모든 적에게 피해를 입힙니다."],["용암 방패","애니가 자신과 티버에게 보호막을 씌우고 이동 속도를 얻습니다."],["소환: 티버","애니가 지정 구역에 티버를 소환하여 피해를 입힙니다. 티버가 적을 덮치거나 애니가 처치당하면 티버가 분노해 이동 속도와 공격 속도를 얻습니다. 재사용 시: 애니가 티버에게 명령을 내려 대상을 덮치게 합니다. 티버는 착지 시 대상에게 피해를 입히고 공중으로 띄워 올립니다."]],"en":[["Pyromania","After casting 4 spells, Annie's next offensive spell will stun the target."],["Disintegrate","Annie hurls a Mana infused fireball, dealing damage in a small area and refunding the Mana cost and half its cooldown if it destroys the target."],["Incinerate","Annie casts a blazing cone of fire, dealing damage to all enemies in the area."],["Molten Shield","Annie casts a shield over herself and Tibbers and gains move speed."],["Summon: Tibbers","Annie summons Tibbers, dealing damage in the area. Tibbers enrages after pouncing on an enemy or when Annie dies, gaining move and attack speed. Recast: Annie orders Tibbers to pounce on a target. He deals damage and knocks up the target when he lands."]],"zh":[["嗜火","在施展4個技能後，安妮的下一個攻擊性技能會使目標暈眩。"],["瓦解怒焰","安妮對目標施放魔法火球，對小範圍內的敵人造成傷害。如果目標死於瓦解怒焰的話，施展此技能所消耗的魔力會返還給安妮，並使技能冷卻時間減半。"],["烈焰衝擊","安妮發射一股錐形火焰，對區域內所有敵人造成傷害。"],["熔炎護盾","安妮為自身和泰貝爾提供護盾並提升跑速"],["召喚：泰貝爾","安妮召喚泰貝爾，造成範圍傷害。泰貝爾朝目標猛撲後，或是安妮陣亡時會進入暴怒狀態，同時提升跑速和攻速。重施技能：安妮命令泰貝爾撲向敵軍，對目標造成傷害並在落地時將之擊飛。"]],"n":[["0",""],["4/4/4/4",""],["8/8/8/8",""],["14",""],["70/65/60",""]]},"10037":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/bc023cb8d66261ad463de6b359744d94b036cb39-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/52c450a97ae34f72728ae11991a7da732a32de6b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/103009e358b4be4055dca6d444aef16a756458c2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/37d3f831101515480d95915ec92c85ab093e6c46-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b73893eb774be615d51cdd61a2dcdb9f34acfab7-96x96.jpg"],"ko":[["낭인의 길","야스오의 치명타 확률이 두 배가 됩니다. 또한, 야스오는 이동할 때마다 보호막이 충전되며, 챔피언이나 몬스터로부터 피해를 입으면 보호막이 발동됩니다."],["강철 폭풍","전방으로 내질러 일직선 상의 모든 적에게 피해를 입힙니다. 적중 시, 몇 초간 폭풍 구름 효과가 1회 중첩됩니다. 2회 중첩되면 강철 폭풍 스킬이 회오리바람을 발사하여 공중으로 띄워올립니다. 강철 폭풍은 기본 공격으로 간주되어 같은 효과가 적용됩니다."],["바람 장막","4초간 모든 적의 투사체를 막아주는 움직이는 벽을 생성합니다."],["질풍검","대상 적을 뚫고 돌진하여 마법 피해를 입힙니다. 사용할 때마다 다음번 돌진의 기본 피해량이 증가하며 최대치에 도달하면 더 이상 증가하지 않습니다. 몇 초 내에는 동일한 대상에게 재사용할 수 없습니다. 돌진 도중 사용할 경우, 강철 폭풍이 원형으로 타격합니다."],["최후의 숨결","공중에 뜬 적 챔피언에게 점멸하여 물리 피해를 입히고, 해당 지역에서 공중에 떠 있는 모든 적을 공중에 붙들어둡니다. 기류가 최대치로 차는 대신, 폭풍 구름의 중첩이 모두 초기화됩니다. 이후 몇 초 동안 야스오의 치명타에 높은 방어구 관통력이 추가로 적용됩니다."]],"en":[["Way of the Wanderer","Yasuo's Critical Strike Chance is doubled. Additionally, Yasuo builds toward a shield whenever he is moving. The shield triggers when he takes damage from a champion or monster."],["Steel Tempest","Thrusts forward, damaging all enemies in a line. On hit, grants a stack of Gathering Storm for a few seconds. At 2 stacks, Steel Tempest fires a whirlwind that knocks Airborne. Steel Tempest is treated as a basic attack and scales with all the same things."],["Wind Wall","Creates a moving wall that blocks all enemy projectiles for 4 seconds."],["Sweeping Blade","Dashes through target enemy, dealing magic damage. Each cast increases your next dash's base Damage, up to a max amount. Cannot be re-cast on the same enemy for a few seconds. If Steel Tempest is cast while dashing, it will strike as a circle."],["Last Breath","Blinks to an Airborne enemy champion, dealing physical damage and holding all Airborne enemies in the area in the air. Grants maximum Flow but resets all stacks of Gathering Storm. For a moderate time afterwards, Yasuo's critical strikes gain significant Bonus Armor Penetration."]],"zh":[["浪人之道","犽宿的暴擊率加倍。除此之外，犽宿在移動時會累積護盾，被敵人或野怪擊中將觸發護盾。"],["鋼鐵暴雪","向前突刺，傷害前方直線上的所有敵人。命中敵人後，獲得一層天寒地凍疊加效果，持續數秒。達2層時，鋼鐵暴雪會擊出一道旋風，使命中的敵人滯空。鋼鐵暴雪被視為普攻，效果機制全部跟普攻一樣。"],["風牆","製造一道移動牆面阻擋所有敵方火力，持續4秒。"],["刃敵千軍","衝向敵方目標並造成魔法傷害。每次施放都會增加下次衝刺的基礎傷害，直到達到傷害值上限。數秒內無法重複施放在同一個目標上。如果在衝刺期間施放鋼鐵暴雪，其將以圓圈的形式揮砍，攻擊犽宿身邊的敵人。"],["奪命氣息","瞬間移動至滯空的敵方英雄身邊，延長所有目標的滯空>時間。風湧回滿但重置鋼鐵暴雪的疊層。之後一段時間內，犽宿的暴擊獲得顯著的額外物理穿透效果。"]],"n":[["0",""],["4",""],["22/20/18/16",""],["0/0/0/0",""],["50/40/30",""]]},"10038":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e7995a2cb142c475d81e538a5178c29a763659de-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1c89cb84cf5504ccf930611c68a6e077d1a64ecf-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/04bd0ccb6ab36374422ba68ed04a96bb72047773-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/01f4f879d256a69cbdaa7da4a90a0b02bed1f4e1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/89d14ca6cc3e402726d4710f169297aba0e5af3a-96x96.jpg"],"ko":[["정기 흡수","아리의 스킬이 대상에게 적중할 때마다 정기 흡수가 중첩됩니다. 충분한 중첩을 쌓으면 다음 스킬이 적에게 적중할 때 체력을 회복합니다."],["현혹의 구슬","아리가 구슬을 던지고 다시 받습니다. 던질 때는 마법 피해를 주며 돌아올 때는 고정 피해를 줍니다."],["여우불","아리의 이동 속도가 잠시 동안 크게 증가하며 아리가 여우불 세 개를 생성하면, 각각 자동으로 적을 찾아 공격합니다."],["매혹","아리가 입맞춤을 날려 피해를 주며 맞은 적을 홀립니다. 홀린 적은 즉시 이동 스킬을 멈추고 아리 쪽으로 무작정 다가갑니다. 대상은 일시적으로 아리에게 받는 피해가 증가합니다."],["혼령 질주","아리가 전방으로 질주하며 근처 적 챔피언들에게 혼령의 정기를 쏘아냅니다. 최대 3번 사용한 다음 재사용 대기시간이 적용됩니다."]],"en":[["Essence Theft","Whenever Ahri hits a target with a spell, she gains a stack of Essence Theft. When she has enough stacks, her next spell that hits an enemy also heals her."],["Orb of Deception","Ahri sends out and pulls back her orb, dealing magic damage on the way out and true damage on the way back."],["Fox-fire","Ahri gains a brief burst of movement speed and releases three fox-fires, that lock onto and attack nearby enemies."],["Charm","Ahri blows a kiss that damages and charms an enemy it encounters, instantly stopping movement abilities and causing them to walk harmlessly towards her. The target temporarily takes increased damage from Ahri."],["Spirit Rush","Ahri dashes forward and fires essence bolts, damaging nearby enemies. Spirit Rush can be cast up to three times before going on cooldown."]],"zh":[["銷魂","阿璃的技能若命中目標，便會獲得一層銷魂。疊加到足夠的層數後，下次施放的技能命中敵人時，她就會為自身回復生命。"],["幻玉","阿璃發射並收回她的幻玉，擊出時造成魔法傷害，收回時則造成真實傷害。"],["魅火","阿璃短暫增加大量跑速，並釋放出三股狐火，鎖定並攻擊鄰近敵人。"],["傾城","阿璃送出飛吻，對擊中的敵人造成傷害同時魅惑目標，並立即中斷目標的位移技能，讓他們無法控制地走向阿璃。目標所受來自阿璃的傷害會暫時增加。"],["飛仙","阿璃向前衝刺並發射魔法彈，對鄰近敵人造成傷害。飛仙於技能進入冷卻前最多可以施放3次。"]],"n":[["0",""],["7/7/7/7",""],["8/7/6/5",""],["12",""],["75/65/55",""]]},"10039":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/5b3a55746b42e243e3a0485ef9ea92f7aacab046-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c2c7e8cefa2b4e4c5013fc781aa76d2130a284bf-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/80628d13a12fdb7b311c24380f9583ffd519e443-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9b4d439de1acfaab6c5e4bb93c2d29586cefb50b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3d13f92b3513a3b80341b2a951699e9adaa3f5b4-96x96.jpg"],"ko":[["약자 멸시","제드가 체력이 낮은 적을 기본 공격하면 마법 피해를 추가로 입힙니다. 같은 대상에 대해서는 몇 초가 지나야 이 효과가 다시 적용됩니다."],["예리한 표창","제드와 그림자가 표창을 던집니다. 각 표창은 적에게 명중하면 피해를 입힙니다."],["살아있는 그림자","기본 지속 효과: 제드와 그림자가 같은 스킬로 동일한 대상을 공격하면 제드가 기력을 회복합니다. 기력 회복은 스킬 사용 시마다 한 번씩만 가능합니다. 사용 시: 제드의 그림자가 전방으로 질주하여, 몇 초간 그 자리에 유지됩니다. 이 스킬을 다시 사용하면 제드가 그림자와 위치를 바꿉니다."],["그림자 베기","제드와 그림자가 각각 주위 적을 베어 피해를 입힙니다."],["죽음의 표식","제드가 잠시 대상으로 지정할 수 없는 상태가 되어 적 챔피언에게 돌진하며 표식을 남깁니다. 3초가 지나면 표식이 발동되며 표식이 적용된 동안 제드가 대상에게 가한 피해의 일부를 입힙니다."]],"en":[["Contempt for the Weak","Zed's basic attacks against low health targets deals bonus Magic Damage. This effect can only occur once every few seconds on the same target."],["Razor Shuriken","Zed and his shadows throw their shurikens. Each shuriken deals damage to every enemy hit."],["Living Shadow","Passive: Zed gains energy whenever he and his shadows strike an enemy with the same ability. Energy can only be gained once per cast ability. Active: Zed's shadow dashes forward, remaining in place for a few seconds. Reactivating Living Shadow will cause Zed to switch positions with this shadow."],["Shadow Slash","Zed and his shadows slash, dealing damage to nearby enemies."],["Death Mark","Zed becomes untargetable and dashes to an enemy champion, marking them. After a few seconds the mark triggers, repeating a portion of all the damage Zed dealt to the target while they were marked. Zed leaves a shadow behind and can reactive Death Mark to switch places with this shadow."]],"zh":[["強者特權","劫對低生命值的目標進行普攻時將造成額外魔法傷害，此效果在數秒內只能對相同目標作用一次。"],["風魔手裡劍","劫和影分身共同擲出手裡劍。每個手裡劍對每個命中的敵人都會造成傷害。"],["疾風殘影","被動：劫跟他的影分身使用相同技能擊中同個敵人時將會回復能量。每次使用技能都只能回復一次能量。主動：劫的影分身往前衝刺，並在所到位置待命數秒，重施疾風殘影能將劫的位置與影分身互換。"],["影斬","劫和他的影分身同時揮斬，對鄰近敵人造成傷害。"],["死亡印記","劫進入無法被指定的狀態，並衝向一名敵方英雄，同時標記他。3秒後，印記會引爆並再度造成傷害，傷害量等同目標被標記期間所受到來自劫的所有傷害。"]],"n":[["0",""],["6/6/6/6","60/55/50/45"],["17/16/15/14","35/30/25/20"],["5/4/4/3","40/40/40/40"],["85/70/55","0/0/0"]]},"10040":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2b8133159ea071b862df7c9a2a15bdec89fe3778-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/730faac65b0511921c8c7e1b7ecf4fb094a58cb4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/87fbc50e2c1871520327a22781b8eba95b5e3253-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b5bf944216d9154eb78967666700641e0d3f49d7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1012cba4be0d426c6bfc99d531ae00ddc60427f1-96x96.jpg"],"ko":[["가차없는 맹공","잭스가 연속해서 기본 공격을 가하면 공격 속도가 상승합니다."],["도약 공격","잭스가 목표 유닛을 향해 뛰어오릅니다. 대상이 적일 경우 무기로 내려칩니다."],["무기 강화","잭스가 무기에 힘을 모아 다음 번 적을 공격할 때 강력한 추가 피해를 입힙니다."],["반격","잭스가 뛰어난 전투 실력으로 짧은 시간동안 적의 공격을 모두 피할 수 있게 됩니다. 공격을 피한 뒤에는 재빨리 반격해 주변의 적을 모두 기절시킵니다."],["달인의 저력","매 세 번째 연속 공격마다 추가 마법 피해를 줍니다. 또 잭스는 이 스킬을 통해 결의를 다져, 잠깐 동안 방어력과 마법 저항력이 상승합니다."]],"en":[["Relentless Assault","Jax's consecutive basic attacks continuously increase his Attack Speed."],["Leap Strike","Jax leaps toward a unit. If they are an enemy, he strikes them with his weapon."],["Empower","Jax charges his weapon with energy, causing his next attack to deal additional damage."],["Counter Strike","Jax's combat prowess allows him to dodge all incoming attacks for a short duration and then quickly counterattack, stunning all surrounding enemies."],["Grandmaster's Might","Every third consecutive attack deals additional Magic Damage. Additionally, Jax can activate this ability to strengthen his resolve, increasing his Armor and Magic Resist for a short duration."]],"zh":[["無情突擊","賈克斯的連續基本攻擊可以提昇他的攻速。"],["跳斬","賈克斯跳向目標，如果是敵人的話，用手中的武器對目標造成傷害。"],["蓄力一擊","賈克斯以能量充填自己的武器，使自己下一次的攻擊造成額外傷害。"],["反擊風暴","賈克斯的戰鬥能力讓他得以在短時間內迴避所有攻擊，然後迅速反擊，擊暈周圍的所有敵人。"],["武器專精","賈克斯每3次連續普攻，就會造成額外的魔法傷害。除此之外，賈克斯可以發動此技能來釋放身體潛能，短時間內增加他的物理與魔法防禦。"]],"n":[["0",""],["7/7/6/6",""],["6/5/4/3",""],["12/11/9/8",""],["55",""]]},"10041":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/29177357449ce40cbf88d8630e9a49a02b19d8be-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a94d29a7d0f60d3381471890250792a0d7dc40e1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ef3ae82c0a2f311d2526a849b173988cc6bd0ece-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/937d44bdd7c9227e1ab183c1829ab476dd17542e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/6df49ee652057c43fc96bf3a69dd8b0273b3b5fa-96x96.jpg"],"ko":[["거룩한 승천","챔피언 레벨 및 스킬 레벨이 오를수록 케일의 공격이 천상의 힘을 받아 강화됩니다. 케일의 날개가 불타오르면서 점차 공격 속도, 이동 속도, 공격 사거리, 기본 공격 시 화염파 발사 효과를 얻습니다."],["광휘의 일격","케일이 차원문을 열어 적을 관통하는 천상의 검을 소환합니다. 검은 적중한 모든 대상에게 피해를 입히고 이동 속도와 방어력, 마법 저항력을 감소시킵니다."],["천상의 축복","케일과 케일의 가장 가까운 아군이 신의 축복을 받아 체력을 회복하고 이동 속도가 증가합니다."],["화염주문검","기본 지속 효과: 천상의 검 '선의'가 케일이 공격하는 적에게 추가 마법 피해를 입힙니다. 사용 시: 다음 공격 시 천상의 화염으로 대상을 강타하여 대상이 잃은 체력에 비례해 추가 피해를 입힙니다."],["신성한 심판","케일이 아군 한 명을 무적 상태로 만들고 예전 정의의 성위를 불러와 그 힘으로 신성한 검을 비처럼 쏟아부어 해당 챔피언 주변 지역을 정화합니다."]],"en":[["Divine Ascent","Kayle's attacks are empowered by the heavens as she levels up and spends skill points. Her wings are lit aflame as she progressively gains Attack Speed, Movement Speed, Attack Range, and waves of fire on her attacks."],["Radiant Blast","Kayle conjures a portal, summoning a celestial sword that pierces through enemies, slowing, damaging, and reducing the resistances of all hit."],["Celestial Blessing","Blessed by the divine, Kayle heals and grants movement speed to herself and the nearest ally."],["Starfire Spellblade","Passive: Kayle's celestial sword, Virtue, deals bonus magic damage to enemies she attacks. Active: Kayle's next attack smites her target with celestial fire, dealing bonus damage proportionate to their missing health."],["Divine Judgment","Kayle makes an ally invulnerable and calls upon former Aspects of Justice to purify the area around her target with a holy rain of swords."]],"zh":[["聖域之梯","凱爾提升等級和消耗技能點數時，她的普攻將因為天界的祝福而強化。凱爾的雙翼會引燃火焰，她也會逐漸增加攻速、跑速和攻擊距離，普攻還會放出火焰衝擊波。"],["聖光衝擊波","凱爾開啟通往天界的入口，並召喚星體之劍穿透敵軍，對所有命中的敵軍造成傷害及緩速效果，同時降低其物理防禦及魔法防禦。"],["天賜聖典","凱爾透過天界的祝福對自身及最靠近的一名友軍施加治療效果及跑速加成。"],["星火熾刃","被動：凱爾的星體之劍「聖潔」對她攻擊的敵軍會造成額外魔法傷害。主動：凱爾下一次的普攻會在目標身上引爆星體之火，根據目標已損失的生命造成額外傷害。"],["聖劍審判","凱爾使一名友方英雄進入傷害免疫狀態，並呼喚正義星靈用聖劍淨化目標周圍的區域。"]],"n":[["0",""],["11/10/9/8",""],["14/14/14/14",""],["8/7/7/6",""],["100/90/80",""]]},"10042":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/11f13c63b279fcc0248174cd5fc679d298e78113-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/33ff1b85640d2bfa80613288eaf85d92d8af0212-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3ba13c855b2ced1e184035550cb05a3a8c3106dc-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7a96dd37f3c2e9040d0fe78a338690e69e4d5a0d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d677babea85a70b713000e65f98bc0507d9c07f5-96x96.jpg"],"ko":[["빛의 사수","루시안이 스킬을 사용할 때마다 다음 공격이 2연속으로 발사됩니다."],["꿰뚫는 빛","루시안이 대상을 관통하는 빛줄기를 발사합니다."],["타는 불길","루시안이 별 모양으로 폭발하여 적에게 표식을 남기는 미사일을 발사합니다. 미사일에 맞은 적은 잠시 위치가 드러나며 표식이 남아 있는 적을 공격하면 루시안의 이동 속도가 상승합니다."],["끈질긴 추격","루시안이 짧은 거리를 빠르게 돌진합니다. 빛의 사수 스킬로 공격하면 끈질긴 추격의 재사용 대기시간이 감소합니다."],["빛의 심판","루시안의 무기에서 총알이 난사됩니다."]],"en":[["Lightslinger","Whenever Lucian uses an ability, his next attack becomes a double-shot."],["Piercing Light","Lucian shoots a bolt of piercing light through a target."],["Ardent Blaze","Lucian shoots a missile that explodes in a star shape, marking and briefly revealing enemies. Lucian gains Movement Speed for attacking marked enemies."],["Relentless Pursuit","Lucian quickly dashes a short distance. Lightslinger attacks reduce Relentless Pursuit's cooldown."],["The Culling","Lucian unleashes a torrent of shots from his weapons."]],"zh":[["光之獵手","每次使用技能後，路西恩的下次普攻會攻擊2次。"],["鋒芒貫穿","路西恩射出一道光束貫穿目標。"],["烈炎鐵血","路西恩發射一枚導彈，爆炸時會迸發星形火花，在短時間內揭露並標記敵軍。路西恩擊中被標記的敵軍會增加跑速。"],["冷酷進擊","路西恩向前衝刺一小段距離。光之獵手的攻擊將減少冷酷進擊的冷卻時間。"],["赤色屠戮","路西恩使用雙槍連續射出大量子彈。"]],"n":[["0",""],["9/8/6/5",""],["13/11/10/8",""],["20/18/15/13",""],["70/65/60",""]]},"10044":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/d0f2105e9fbdfdb8003b55c595b3e2c49d7ab0ce-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a554b61b9ab3b2118d8e0be68a96abc63d1e916b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/bd144a6487d249ced5f12400028429195d250bc6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f879f7352d905daec1c4a189ee25a2701f2e0855-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b3377baff2a2495573c7da1bf2262a1d44ec8428-96x96.jpg"],"ko":[["햇빛","스킬로 적에게 피해를 입히면 햇빛 효과를 적용합니다. 아군 챔피언이 해당 적을 공격하면 햇빛 효과를 소모해 추가 마법 피해를 입힙니다."],["여명의 방패","레오나가 다음 기본 공격 시 방패를 사용해 추가 마법 피해를 입히고 대상을 기절시킵니다."],["일식","레오나가 방패를 들어 방어력과 마법 저항력을 얻습니다. 효과가 끝날 때 주변에 적이 있으면 마법 피해를 입히고 지속시간을 연장합니다."],["천공의 검","레오나가 태양의 힘으로 검의 형상을 날려 일직선상에 있는 모든 적에게 마법 피해를 입힙니다. 형상이 사라질 때 마지막으로 맞은 챔피언은 잠시 속박되고 레오나가 해당 적을 향해 돌진합니다."],["흑점 폭발","레오나가 태양 에너지 광선을 소환하여 범위 피해를 입힙니다. 피해 범위의 중앙에 있는 적은 기절하고, 외곽에 있는 적은 둔화됩니다."]],"en":[["Sunlight","Damaging spells afflict enemies with Sunlight. When allied Champions deal damage to those targets, they consume the Sunlight to deal additional magic damage."],["Shield of Daybreak","Leona uses her shield to perform her next basic attack, dealing bonus magic damage and stunning the target."],["Eclipse","Leona raises her shield to gain Armor, and Magic Resist. When the duration first ends, if there are nearby enemies, she will deal magic damage to them and prolong the duration of the effect."],["Zenith Blade","Leona projects a solar image of her sword, dealing magic damage to all enemies in a line. When the image fades, the last enemy champion struck will be briefly rooted and Leona will dash to them."],["Solar Flare","Leona calls down a beam of solar energy, dealing damage to enemies in an area. Enemies in the center of the area are stunned, while enemies on the outside are slowed."]],"zh":[["烈陽之力","雷歐娜的傷害性技能可在敵軍身上附加太陽之力。當友方英雄對這些目標造成傷害時，會消耗其身上的太陽之力，造成額外魔法傷害。"],["拂曉盾擊","雷歐娜於下次普攻時使用盾牌衝撞，造成額外魔法傷害並暈眩敵人。"],["日蝕","雷歐娜舉起盾牌，強化物理防禦與魔法防禦。當技能時間第一次結束時，如果周圍還有敵人，則對敵人造成魔法傷害，且延長護盾持續時間。"],["太陽聖劍","雷歐娜射出太陽劍氣，對路徑上所有敵人造成魔法傷害。當劍氣淡去後，最後一個被擊中的敵方英雄會被暫時定身，雷歐娜則會衝向該目標。"],["日輪聖芒","雷歐娜呼喚擁有太陽力量的光炮，對範圍內敵人造成傷害。位於範圍正中心的敵人會被暈眩，而範圍外圈的敵人會被緩速。"]],"n":[["0",""],["5/5/5/5",""],["13/12/11/10",""],["12/10/8/6",""],["55/45/35",""]]},"10045":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/4768e6596e22f2e54c49249fca68e7031646e2f4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/700bdd0071110700a15a936f9ff9b2d521b728f4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/749d8fcbeb137e8f1d95bcbb8d1f289469a16839-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8ab5705c2288373c2339ea3836dc57faa9445b46-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7f573fd6e565856371b488f733445a20df269413-96x96.jpg"],"ko":[["정조준","레벨이 오를수록 트리스타나의 공격 사거리가 증가하고 폭발 화약과 대구경 탄환이 강화됩니다."],["속사","트리스타나의 공격 속도가 짧은 시간 동안 증가합니다."],["로켓 점프","트리스타나가 땅에 대포를 쏴 추진력을 얻어 먼 곳으로 날아갑니다. 착륙한 지점 주변에 있는 적 유닛에게 피해를 입히고 잠시 둔화시킵니다. 적 챔피언에게 폭발 화약 중첩을 최대로 쌓거나 처치에 관여하면 재사용 대기시간이 초기화됩니다."],["폭발 화약","트리스타나가 적을 처치하면 대포알이 터지면서 파편이 주변 적에게 피해를 입힙니다. 사용 시 대상 적 또는 포탑에 폭탄을 부착하며, 폭탄은 잠시 후 터져서 주위 유닛들에게 피해를 입힙니다."],["대구경 탄환","트리스타나가 거대한 대포알을 장전한 후 적에게 발사해 대상에게 마법 피해를 입히고 뒤로 밀어냅니다."]],"en":[["Draw a Bead","Increases Tristana's range for her attacks, Explosive Charge, and Buster Shot as she levels."],["Rapid Fire","Tristana increases her Attack Speed for a short time."],["Rocket Jump","Tristana fires at the ground to propel her to a distant location, dealing damage and slowing surrounding units for a brief period where she lands. Takedowns and fully stacked Explosive Charge detonations on champions reset Rocket Jump's cooldown."],["Explosive Charge","When Tristana kills a unit, her cannonballs burst into shrapnel, dealing damage to surrounding enemies. Can be activated to place a bomb on a target enemy or turret that explodes after a short duration dealing damage to surrounding units."],["Buster Shot","Tristana loads a massive cannonball into her weapon and fires it at an enemy unit. This deals Magic Damage and knocks the target back."]],"zh":[["校準射擊","崔絲塔娜的普攻、爆炸射擊、毀滅射擊的射程會隨等級增加。"],["急速射擊","崔絲塔娜急速射擊，短時間內提升攻速。"],["火箭跳躍","崔絲塔娜朝地面開火，靠反作用力跳躍至目標地點，落地時造成傷害並短暫緩速附近敵人。取得擊殺或助攻，以及疊滿的爆炸射擊在敵方英雄身上爆炸時，將重置火箭跳躍的冷卻時間。"],["爆炸射擊","被動：擊殺單位時，崔絲塔娜的炮彈會爆出破片，對周圍的敵人造成傷害。主動：崔絲塔娜放置一個炸彈在敵方英雄或防禦塔身上，炸彈不久後會爆炸，對該單位及附近敵人造成傷害。"],["毀滅射擊","崔絲塔娜裝填一顆巨型加農炮彈，並發射出去攻擊敵方單位，造成魔法傷害並擊退目標。"]],"n":[["0",""],["17/16/15/14",""],["20/18/16/14",""],["16/15/14/13",""],["70/65/60",""]]},"10046":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/84a469fb026b7b30437f75dd2d29c09293edc245-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/eb3e64721db4e2771ccab36f20e6c5f7fa545cc2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ea2cb35a418c5338e656f9c3f97e186b58a4830e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f32ffd6ca3b6f869ef7abf1e52d98336295d300e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/86013087251c458e056b1eaeb21c1beda539873c-96x96.jpg"],"ko":[["맹독 다트","티모의 기본 공격이 지속적으로 추가 마법 피해를 입힙니다."],["실명 다트","티모가 적을 실명시키는 다트를 발사합니다. 잠시 대상의 기본 공격이 아무 피해도 입히지 못합니다."],["신속한 이동","티모가 날쌔게 움직여서 포탑이나 적 챔피언에게 공격받기 전까지 이동 속도가 증가합니다. 스킬을 사용하면 티모가 앞으로 짧게 구른 다음 몇 초 동안 질주합니다. 이때 기본 지속 효과의 이동 속도 상승량이 두 배로 증가하고, 피해를 입어도 효과가 사라지지 않습니다."],["유격 전투","잠시 후 티모가 위장 상태가 되며, 근처에 적 챔피언이나 포탑이 없으면 모습이 드러나지 않습니다. 위장 상태에서 벗어나면 티모의 공격 속도가 증가합니다."],["유독성 함정","티모가 가방에 있는 버섯으로 만들어진 폭발성 독 함정을 던집니다. 적이 함정을 밟으면 독 구름이 퍼져 나와 적의 이동 속도를 늦추고 지속 피해를 입힙니다. 버섯 위에 새 버섯을 던져서 튕기면 더 멀리까지 함정을 설치할 수 있습니다."]],"en":[["Toxic Shot","Teemo's attacks deal bonus magic damage over time."],["Blinding Dart","Teemo fires a dart that blinds its target, causing its attacks to deal no damage for a brief period."],["Move Quick","Teemo scampers around, passively increasing his Movement Speed until he is struck by an enemy champion or turret. Activating Move Quick causes Teemo to roll forward a short distance, sprinting for a few seconds. During this time, Move Quick's passive speed is doubled, and cannot be removed by damage."],["Guerilla Warfare","After a delay, Teemo becomes camouflaged, unable to be seen unless near an enemy champion or turret. After exiting camouflage, Teemo gains Attack Speed."],["Noxious Trap","Teemo throws an explosive poisonous trap using one of the mushrooms stored in his pack. If an enemy steps on the trap, it will release a poisonous puddle, slowing enemies and damaging them over time. If Teemo throws a mushroom onto another mushroom it will bounce, gaining additional range."]],"zh":[["劇毒射擊","提摩的普攻會額外造成持續性魔法傷害。"],["致盲吹箭","提摩射出一支劇毒吹箭，對目標造成致盲效果，使其普攻在短時間內無法造成傷害。"],["衝刺","被動：增加跑速，遭到敵方英雄或防禦塔攻擊後解除。主動：提摩向前翻滾一小段距離並衝刺數秒，被動跑速加成於此期間加倍，且不會因為受到傷害而解除。"],["約德爾游擊隊","提摩會在一段時間後進入偽裝狀態，只有靠近敵方英雄或防禦塔時才會現形。脫離偽裝狀態後，提摩的攻速會提高。"],["毒性陷阱","提摩丟出儲存在背包中的蘑菇，做成會爆炸的劇毒陷阱，敵軍踩到時會爆裂成一灘毒泥坑，緩速敵軍並造成持續性傷害。如果蘑菇被丟到另一個蘑菇上，則會向前彈跳後才落地。"]],"n":[["0",""],["8/8/8/8",""],["17/16/15/14",""],["25/23/21/19",""],["1/1/1",""]]},"10047":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7e52dfb8a130ad06948717decbafa02599686979-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/738af7b5914e01e554545c8492d9c7a9cc20f19e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/567b420b26e3b99c32b7601f71b75833c113be65-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/021f6518254f8c65902a506128f916170a35b09c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/bd3c54c2e782f14be6fa8d2240fca3158966c4da-96x96.jpg"],"ko":[["파워 코드","소나가 스킬을 3번 사용하면 다음 기본 공격이 추가 마법 피해를 입히고 적을 기절시킵니다."],["용맹의 찬가","소나가 용맹의 찬가를 연주하여 강렬한 선율을 발사하여 주변에 있는 두 명의 적에게 마법 피해를 입힙니다. 이때 챔피언과 몬스터를 우선 공격합니다. 또한 이 스킬을 사용하면 잠시 동안 오오라가 생겨서 효과 범위 안에 있는 아군이 다음번 적 공격 시 추가 피해를 입힙니다."],["인내의 아리아","소나가 인내의 아리아를 연주하여 보호의 음률을 내보내 근처 부상 당한 아군 1명과 자신의 체력을 회복합니다. 또한 이 스킬을 사용하면 잠시 동안 오오라가 생겨서 효과 범위 안의 모든 아군에게 일시적으로 보호막을 씌워줍니다."],["기민함의 노래","소나가 기민함의 노래를 연주하여 주변 아군의 이동 속도를 증가시키고 잠시 동안 오오라를 생성합니다. 오오라에 닿은 아군 챔피언은 추가 이동 속도를 얻습니다."],["크레센도","기본 지속 효과: 소나의 후광이 강화되어 더 강력한 버프를 제공합니다. 소나의 궁극의 선율이 대상 지점을 향해 천천히 나아가면서 경로상의 모든 적에게 피해를 입힙니다. 모든 적은 첫 적중 시 기절합니다."]],"en":[["Power Chord","After 3 spell casts, Sona's next attack will deal bonus magic damage and stun the target."],["Hymn of Valor","Sona plays the Hymn of Valor, sends out bolts of sound, dealing magic damage to two nearby enemies, prioritizing champions and monsters. Sona gains a temporary aura that grants allies tagged by the zone bonus damage on their next attack against enemies."],["Aria of Perseverance","Sona plays the Aria of Perseverance, sending out protective melodies, healing Sona and a nearby wounded ally. Sona gains a temporary aura that grants allies tagged by the zone a temporary shield."],["Song of Celerity","Sona plays the Song of Celerity, granting nearby allies bonus Movement Speed. Sona gains a temporary aura that grants allied champions tagged by the zone bonus Movement Speed."],["Crescendo","Passive: Sona’s halo strengthens, providing higher buffs. Sona’s ultimate chord advances slowly to the target point, dealing damage on its way. Every enemy hit for the first time is stunned."]],"zh":[["力量和弦","施放3次技能後，索娜的下一次普攻會造成額外魔法傷害，並暈眩目標。"],["英勇讚美詩","索娜演奏英勇讚美詩，發出強大的音波對最近的兩名敵人造成魔法傷害，以英雄與野怪為優先攻擊順序。索娜暫時獲得靈氣，使身邊的友軍下次攻擊獲得額外傷害。"],["堅毅詠嘆調","索娜彈奏起堅毅詠嘆調，奏出守護的旋律，治癒索娜以及周圍受傷的友軍。索娜將暫時獲得靈氣，讓靈氣周圍的友軍短暫獲得護盾。"],["迅捷奏鳴曲","索娜演奏迅捷奏鳴曲，使鄰近友軍增加跑速。索娜同時獲暫時靈氣，使範圍內的友軍增加跑速。"],["狂舞終樂章","被動：索娜強化音樂光環，增益效果提升。索娜釋出終極和弦，朝目標處緩慢前進，對路徑上的目標造成傷害。敵軍首次受到技能傷害後會遭到暈眩。"]],"n":[["0",""],["8/8/8/8",""],["10/10/10/10",""],["14/14/14/14",""],["80/75/70",""]]},"10048":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/affa8a832f986546437e90aab1b2e4fe19637af5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/599fc3fd16fb4b6bdfa68292335e551a6be6feea-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b1cda90078113a5ca219d29555fdcf620ed955ea-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/04691a85d70982200321fd44dd191cf959899e7c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4f5e1ca4c0e4836727c5618695575542ea42afc0-96x96.jpg"],"ko":[["요정 친구 픽스","픽스는 현재 따라다니는 챔피언이 적 유닛을 공격할 때마다 함께 마법 광선을 발사합니다. 이 마법 광선은 목표를 추적하지만, 다른 유닛이 막아서 대신 맞을 수 있습니다."],["반짝반짝 창","픽스와 룰루가 각각 마법 화살을 하나씩 발사하여 맞는 적 모두를 대폭 둔화시킵니다."],["변덕쟁이","아군에게 사용하면 잠깐 대상의 공격 속도와 이동 속도가 상승합니다. 적에게 사용하면 대상이 기본 공격이나 스킬 사용이 불가능한 귀여운 생물로 변합니다."],["도와줘, 픽스!","아군에게 사용하면 픽스가 대상에게 날아가 보호막을 씌워줍니다. 그다음 대상을 따라다니며 공격을 돕습니다. 적에게 사용하면 픽스가 대상에게 날아가 피해를 입힙니다. 그다음 대상을 따라다니며 시야를 드러내 줍니다."],["급성장","룰루가 아군 또는 자신의 몸집을 키워서 주변 적들을 공중으로 띄워 올립니다. 대상의 체력이 대폭 상승하고, 몇 초 동안 주변 적들을 둔화시키는 오오라를 얻습니다."]],"en":[["Pix, Faerie Companion","Pix fires magical bolts of energy whenever the champion he's following attacks another enemy unit. These bolts are homing, but can be intercepted by other units."],["Glitterlance","Pix and Lulu each fire a bolt of magical energy that heavily slows all enemies it hits."],["Whimsy","If cast on an ally, grants them Attack Speed and Movement Speed for a short time. If cast on an enemy, turns them into an adorable critter that can't attack or cast spells."],["Help, Pix!","If cast on an ally, commands Pix to jump to an ally and shield them. He then follows them and aids their attacks. If cast on an enemy, commands Pix to jump to an enemy and damage them. He then follows them and grants you vision of that enemy."],["Wild Growth","Lulu enlarges an ally (or herself), knocking nearby enemies into the air and granting the ally a large amount of bonus health. For the next few seconds, that ally gains an aura that slows nearby enemies."]],"zh":[["皮克斯，守護妖精","皮克斯可附身到英雄身上，用魔法彈進行火力支援；這些魔法彈擁有自動導向功能，但會被其他單位所阻擋。"],["閃耀雙重奏","皮克斯與露璐各自發射出一發魔法彈，對所有命中的敵人造成傷害與大幅緩速。"],["幻想曲","對友軍施放時，可為目標暫時增加攻速與跑速；對敵軍施放時，會把目標變成可愛的動物，使其無法普攻與使用技能。"],["帥啊小皮！","對友軍施放時，皮克斯會飛到友軍身上並賦予護盾，且會跟隨他們並協助攻擊；對敵軍施放時，皮克斯會飛到敵軍身上造成傷害，並跟隨目標，獲得敵人的視野。"],["究極鍊化","露璐使一位友軍（或自己）巨大化，將周圍的敵人擊飛至空中，同時使該名友軍增加大量生命。接下來數秒內，該友軍周圍的靈氣可以緩速鄰近敵軍。"]],"n":[["0",""],["7/7/7/7",""],["17/16/15/14",""],["10/10/10/10",""],["80/70/60",""]]},"10049":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ba2de7940d4f05eb3225317e9fefa9eea126d37d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cb597bf3e5189864061e54d2c58a37599553b792-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/822b41a001e5bef94e961d2836b0b7fc09b3e2f4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/91fb272a3f7b3710a4201b7443b32daa7f87b713-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a8bd73b9d7f2b6715142318fe7e68477a46e3bb1-96x96.jpg"],"ko":[["용족의 분노","쉬바나가 대형 및 에픽 몬스터와 챔피언을 처치하면 중첩을 얻습니다. 드래곤 처치 시 중첩이 추가로 쌓입니다. 중첩을 100회 쌓을 때마다 쉬바나의 스킬 하나가 강화됩니다."],["두 번 물어뜯기","쉬바나는 다음 공격 시 두 번 공격합니다. 기본 공격 시 두 번 물어뜯기의 재사용 대기시간이 감소합니다. 용 형상: 두 번 물어뜯기를 사용하면 쉬바나 앞에 있는 모든 유닛을 베어 가릅니다. 대지의 드래곤을 처치하면 용 형상일 때 두 번 물어뜯기가 적을 둔화시킵니다."],["연소","쉬바나가 화염으로 몸을 감싸 3초간 주위 적에게 매 초당 마법 피해를 주며 추가 이동 속도를 얻습니다. 이동 속도는 시간이 지날수록 점차 느려집니다. 기본 공격 시 연소의 지속시간이 늘어납니다. 용 형상: 연소의 크기가 커집니다. 바람의 드래곤을 처치하면 용 형상일 때 25%의 추가 이동 속도를 얻습니다."],["화염 숨결","쉬바나가 화염구를 던져 맞은 적 모두에게 피해를 가하며 맞은 적에게 5초간 불타는 재 표식을 남깁니다. 표식이 남은 대상에게 쉬바나의 기본 공격이 적중하면 대상의 최대 체력의 일정 비율에 해당하는 피해를 입힙니다. 용 형상: 화염 숨결이 대상에게 닿거나 목표 지점에 도달하면 폭발하며 추가 피해를 입히고 잠깐 동안 땅을 불태웁니다. 화염의 드래곤을 처치하면 용 형상일 때 표식이 남은 대상에게 입히는 피해가 고정 피해로 전환됩니다."],["용의 강림","쉬바나가 용으로 변신해 목표 지점으로 날아갑니다. 비행 중 쉬바나와 부딪힌 적들은 피해를 입으며 목표 지점 쪽으로 밀려납니다. 쉬바나는 기본 지속 효과로 매 초 분노가 오르며, 기본 공격 시 분노가 2씩 오릅니다."]],"en":[["Fury of the Dragonborn","Shyvana gains stacks when slaying large and epic monsters, as well as champions. Dragons grant extra stacks. Every 100 stack enhances one of Shyvana's abilities."],["Twin Bite","Shyvana strikes twice on her next attack. Basic attacks reduce the cooldown of Twin Bite. Dragon Form: Twin Bite cleaves all units in front of Shyvana. Slaying Mountain Drake causes Twin Bite to slow enemies while in Dragon Form."],["Burnout","Shyvana surrounds herself in fire, dealing magic damage per second to nearby enemies and moving faster for 3 seconds. The Movement Speed reduces over the duration of the spell. Basic attacks extend the duration of Burnout. Dragon Form: Burnout grows in size. Slaying Cloud Drake gives Shyvana 25% extra Movement Speed while in Dragon Form."],["Flame Breath","Shyvana unleashes a fireball that deals damage to all enemies it encounters and leaves cinders on the target, marking them for 5 seconds. Shyvana's basic attacks on marked targets deal a percentage of their maximum Health as damage on-hit. Dragon Form: Flame Breath explodes on impact or at target location, dealing bonus damage and scorching the earth for a short duration. Slaying Infernal Drake converts damage dealt to marked enemies to true damage while in Dragon Form."],["Dragon's Descent","Shyvana transforms into a dragon and takes flight to a target location. Enemies along her path take damage and are knocked toward her target location. Shyvana passively gains Fury per second and gains 2 Fury on basic attack."]],"zh":[["龍裔之怒","希瓦娜擊殺大型野怪、史詩級野怪與英雄時可獲得堆層。擊殺飛龍會賦予額外的堆層。每得到100層，希瓦娜的其中一項技能會獲得強化。"],["雙龍聚首","希瓦娜的下次普攻會攻擊兩次；普攻能減少雙龍聚首的冷卻時間。聖龍型態：雙龍聚首將劈擊所有在希瓦娜面前的單位。擊殺裂地飛龍會使聖龍型態下的雙龍聚首附加緩速效果。"],["聖龍怒火","希瓦娜使用火焰環繞自身，每秒對鄰近敵人造成魔法傷害，並在3秒內增加自身跑速。跑速加成隨著時間而減少。普攻能延長聖龍怒火的持續時間。聖龍型態：擴大地面燃燒範圍。擊殺疾風飛龍會使聖龍型態下的希瓦娜跑速增加25%。"],["龍之吐息","希瓦娜放出火球，對所有擊中之敵人造成傷害並且留下龍之吐息標記，持續5秒。希瓦娜普攻被標記的目標時，會對其造成帶命中效果的固定最大生命百分比的傷害。聖龍型態：龍之吐息擊中敵人或是命中目標區域時會爆炸，造成額外傷害並使地面短暫燃燒。擊殺赤燄飛龍，會使聖龍型態下的希瓦娜對標記目標造成的傷害轉為真實傷害。"],["真龍轉生","希瓦娜化為聖龍，並飛躍至指定地點。路徑上的敵人會受到傷害，並朝指定地點被擊退。希瓦娜每秒會被動獲得怒氣，普攻時則獲得2點怒氣。"]],"n":[["0",""],["7/6/6/5",""],["12/11/10/9",""],["10/9/8/7",""],["1/1/1","100/100/100"]]},"10050":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/bf1d2befd59d40514ea64e1739c0e309739a490e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/182b204bbfca0be1fe480fbfe0b2fd923cd87b8f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/0fb4751e8fe0b5d3ca8bbc34afefd6406af6efd1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7330a72f7fdc8f04a07de37bfec0a7e4e9eb0fb8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8d6c285e075928129c29a0c1cec99c7b6fd06419-96x96.jpg"],"ko":[["찌그러뜨리기","같은 적을 3회 공격할 때마다 해당 적 최대 체력의 일정 비율만큼 피해를 입히고 방어력을 감소시키며, 바이의 공격 속도가 증가합니다."],["금고 부수기","바이가 건틀릿을 충전하여, 두꺼운 금고도 뚫을 위력의 타격을 가하며 전방으로 돌진합니다. 부딪힌 적들은 뒤로 밀려나고, 찌그러뜨리기가 중첩됩니다."],["폭발 보호막","바이가 기본 공격이나 스킬로 적을 공격하면 폭발 보호막 중첩이 쌓입니다. 폭발 보호막을 사용하면 피해를 흡수하는 보호막을 생성합니다. 최대 중첩 상태에서 바이의 이동 속도가 증가합니다."],["끈질긴 힘","바이의 다음 공격이 대상을 관통하여 뒤에 있는 적들에게 피해를 가합니다."],["정지 명령","바이가 적을 추격하며 중간에 걸리는 유닛들을 옆으로 밀어냅니다. 대상에 다다르면 공중으로 띄워올리고 뒤따라 점프하여, 바닥으로 쿵 찍어누릅니다."]],"en":[["Denting Blows","Every third attack on the same enemy deals a percentage of their maximum Health, reduces their Armor, and grants Vi Attack Speed."],["Vault Breaker","Vi charges her gauntlets and unleashes a vault shattering punch, carrying her forward. Enemies she hits are knocked back and receive a stack of Denting Blows."],["Blast Shield","Vi gains stacks of Blast Shield when hitting an enemy with an attack or ability. Activating Blast Shield generates a shield that absorbs damage. At maximum stacks, Vi also gains Movement Speed."],["Relentless Force","Vi's next attack blasts through her target, dealing damage to enemies behind it."],["Cease and Desist","Vi runs down an enemy, knocking aside anyone in the way. When she reaches her target she knocks it into the air, jumps after it, and slams it back into the ground."]],"zh":[["三重極限","對同一目標的每3次普攻將造成額外物理傷害，傷害值相當於百分比的目標最大生命，並減少其物理防禦，同時提高菲艾的攻速。"],["蓄能衝擊","菲艾替拳套充能，然後使出全力一擊並向前衝刺，被她擊中的敵人會遭到擊退，並被附加一層三重極限。"],["爆破武裝","菲艾普攻或技能命中敵人時會獲得一層爆破武裝，啟動爆破武裝會生成一個可吸收傷害的護盾。在達到最大疊層時啟動，則菲艾還能增加跑速。"],["粉碎震波","菲艾下一次普攻會穿透目標，對目標及後方的敵人造成傷害。"],["火瀑連擊","菲艾衝向一名指定的敵人，並撞開路線上的所有人。接觸目標時，將其擊飛至空中，菲艾接著騰空揮出重擊，將目標再次重摔回地面。"]],"n":[["0",""],["9/8/7/6",""],["10/9/8/7",""],["1/1/1/1",""],["80/70/60",""]]},"10051":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/1115328c45a907f27e2a3dc0ffea2cbcadd0f032-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/4aedad53ae76eebe922a916ad54565f3f5557545-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c2bc1f84aa3abe91b0333b8c44e8a6699a074f45-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/29fe7c22facc66deb6d859522239295dad06dab0-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/de3906f82a93ebaeceb99128977f161fd34fc0fd-96x96.jpg"],"ko":[["관통상","스킬 사용 후 다음 기본 공격이 경로에 있는 적을 모두 관통하고 깃털을 남깁니다. 연인의 귀환: 자야는 라칸이 귀환할 때 함께할 수 있습니다."],["깃털 연타","자야가 일렬로 두 개의 깃털을 던집니다. 깃털은 마지막에 땅에 떨어지며 나중에 다시 불러들일 수 있습니다."],["죽음의 깃","자야가 깃털 칼날 폭풍을 일으켜 기본 공격의 피해량과 공격 속도가 상승합니다. 적 챔피언을 공격하면 이동 속도가 증가합니다. 아군 라칸이 근처에 있으면 함께 죽음의 깃 효과를 받습니다."],["깃부르미","자야가 모든 깃털을 불러들여 경로에 있는 적에게 피해를 입히고 3개 이상의 깃털에 맞은 적은 속박합니다."],["저항의 비상","자야가 공중으로 도약해 잠시 동안 대상으로 지정할 수 없게 되고, 잠시 후 원뿔 모양으로 깃털을 발사합니다. 깃털은 마지막에 땅에 떨어지며 나중에 다시 불러들일 수 있습니다."]],"en":[["Clean Cuts","After using an ability, Xayah's next basic attacks will hit all targets along their path and leave a Feather. Lover's Leap: Xayah can join Rakan's recall."],["Double Daggers","Xayah throws two damaging daggers that also drop Feathers she can recall."],["Deadly Plumage","Xayah creates a storm of blades that increase her basic attack speed and damage while granting her movement speed if she attacks a champion. If an ally Rakan is nearby, he also gains the effects of this ability."],["Bladecaller","Xayah calls back all her dropped Feathers dealing damage and rooting enemies if hit with 3 or more."],["Featherstorm","Xayah leaps into the air becoming untargetable and throwing out a fan of daggers, dropping Feathers she can recall."]],"zh":[["一翦兩斷","剎雅施放技能後，接下來的次普攻具有穿透性，傷害路徑上的所有目標，並留下羽刃。 鴛鴦展翅：剎雅可以加入銳空的回城召喚。"],["赤落連匕","剎雅擲出兩把具傷害性的匕首，並留下可召回的羽刃。"],["奪命疾翼","剎雅召喚羽刃風暴，期間獲得基礎攻速與傷害加成，擊中敵方英雄可增加跑速。 若友方銳空在附近，他也會獲得相同增益效果。"],["漫天血刃","剎雅一次召回所有羽刃，對造成敵人傷害，3根或更多羽刃命中時，能使敵軍定身。"],["驟羽暴風","剎雅飛躍至空中，進入無法被指定的狀態，朝扇形區域密集射出匕首，留下一排可召回的羽刃。"]],"n":[["0",""],["10/9/8/7",""],["17/16/15/14",""],["11/10/9/8",""],["80/70/60",""]]},"10052":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/953fed441cc67ba0bdc1f6dbb2ace3b6907ea715-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3b61a7b2c87985b49c2bda3a8653d4c9d4c8b1b4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9b7824514914097282dd2423e16ac61f65c346b3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/927167ecd7b9d5512852779ac45b249828acb13e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0227cd44f70802f5c0143eaf30a755a49ffcb4b0-96x96.jpg"],"ko":[["요술 망토","\"라칸에게 주기적으로 보호막이 생성됩니다. 연인의 귀환: 라칸은 자야가 귀환할 때 함께할 수 있습니다.\""],["빛나는 깃털","마법이 깃든 깃털을 던져 마법 피해를 입힙니다. 챔피언이나 에픽 몬스터에게 깃털을 맞히면 라칸 주변 아군의 체력을 회복시킬 수 있습니다."],["화려한 등장","목표 지점으로 도약해 착지 시 근처의 적을 모두 공중으로 띄워 올립니다."],["전쟁무도","\"아군 챔피언에게 도약해 보호막을 씌웁니다. 몇 초 안에 소모값 없이 다시 사용할 수 있습니다. 자야에게 사용할 경우 보호막 흡수량이 증가하고 재사용 대기시간이 감소합니다.\""],["매혹의 질주","이동 속도가 증가하며 닿은 적을 모두 매혹하고 마법 피해를 입힙니다."]],"en":[["Fey Feathers","Rakan periodically gains a shield. Lover's Leap: Rakan can join Xayah's recall."],["Gleaming Quill","Flings a magical feather that deals magic damage. Striking a champion or epic monster enables Rakan to heal his allies."],["Grand Entrance","Dashes to a location, knocking up nearby enemies on arrival."],["Battle Dance","Flies to an allied champion granting them a shield. Can be re-cast for free for a short duration. When cast on Xayah, the shield amount is doubled and the cooldown is reduced."],["The Quickness","Gains movement speed, charming and dealing magic damage to enemies touched."]],"zh":[["奇異羽篷","「銳空可以定期獲得護盾。 鴛鴦展翅：銳空可以加入剎雅的回城召喚。」"],["癒光飛翎","射出魔法羽毛，造成魔法傷害。命中敵方英雄或史詩級野怪後，銳空將治癒友軍生命。"],["盛大登場","衝向指定地點，抵達時把鄰近敵人擊飛。"],["戰鬥舞踊","舞躍至友方英雄身邊，賦予其護盾。短時間內可再次重施技能，無須消耗魔力。 目標為剎雅時，護盾效果加倍，且冷卻時間減半。"],["迷心迅步","銳空增加跑速，被他觸身的敵人將被迷惑，並受到魔法傷害。"]],"n":[["0",""],["10/9/8/7",""],["16/14/12/10",""],["18/16/14/12",""],["80/70/60",""]]},"10053":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d075a7841bc9f4a92cf466db39092fcadb46673d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4ceec8b7ec8fdec497d2fa19ef75976a46f44849-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/e83894e52caacac80f3db5a5e56142685fe41059-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/342b76bba6990b0ac7871e2511e0fcb408b55040-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/fe53e784a146aafad8afcc39ceb3eb5a27ad730e-96x96.jpg"],"ko":[["맹독","트위치의 기본 공격은 대상을 중독시켜 초당 고정 피해를 입힙니다."],["매복","트위치의 이동 속도가 빨라지고 짧은 시간 동안 위장 상태가 됩니다. 위장 효과가 끝나면 잠시 공격 속도가 증가합니다. 맹독에 걸린 적 챔피언이 죽으면 매복의 재사용 대기시간이 초기화됩니다."],["독약 병","트위치가 명중하면 폭발하는 독약 병을 던져, 범위 내 대상들에게 둔화 효과를 부여하고 맹독을 적용합니다."],["오염","트위치가 역병을 퍼뜨려 중독된 적들에게 더 큰 피해를 줍니다."],["무차별 난사","트위치가 석궁의 위력을 최대한으로 끌어올려 멀리 관통 화살들을 발사하며, 경로에 있는 모든 적을 꿰뚫습니다."]],"en":[["Deadly Venom","Twitch's basic attacks infect the target, dealing true damage each second."],["Ambush","Twitch becomes Camouflaged for a short duration and gains Move Speed. When leaving Camouflage, Twitch gains Attack Speed for a short duration. When an enemy champion with Deadly Venom dies, Ambush's cooldown is reset."],["Venom Cask","Twitch hurls a cask of venom that explodes in an area, slowing targets and applying deadly venom to the target."],["Contaminate","Twitch wreaks further havoc on poisoned enemies with a blast of his vile diseases."],["Spray and Pray","Twitch unleashes the full power of his crossbow, shooting bolts over a great distance that pierce all enemies caught in their path."]],"zh":[["死亡毒液","圖奇的普攻會感染目標，每秒造成真實傷害。"],["潛伏","圖奇在短時間內進入偽裝狀態，並增加跑速。脫離偽裝狀態後，短時間內圖奇的攻速會提升。當受到「死亡毒液」感染的敵方英雄死亡時，潛伏的冷卻時間會重置。"],["虛弱之毒","圖奇投擲一瓶毒液在目標區域爆炸，緩速敵人並附加死亡毒液的效果。"],["毒性爆發","圖奇瘋狂散播惡疾對中毒的敵人進行猛烈攻擊。"],["噴射，然後祈禱吧！","圖奇全力釋放十字弓的威力，射出箭矢到極遠處，穿透一直線上的所有敵人。"]],"n":[["0",""],["15",""],["12/11/10/9",""],["16/15/14/13",""],["75/70/65",""]]},"10054":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/302ffb4029c54364ac227e123438f7e2859d173a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1c36ac7936a4ab01d3f3a1ed259d92f0de84cb62-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/549641995240d8657cbe60b5972c48fb72bda6bf-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6f28ad05427d9530556b04f22d7cde2a3e994a56-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/d3630543bf9ccd8588a5218434eb4e3da1996727-96x96.jpg"],"ko":[["가위 난도질","그웬의 기본 공격이 대상의 체력에 비례해 추가 마법 피해를 입힙니다. 챔피언을 상대로 기본 공격 시 해당 피해의 일부만큼 체력을 회복합니다."],["싹둑싹둑!","그웬이 최대 6회까지 가위질하여 원뿔 범위에 마법 피해를 입힙니다. 중앙에 있는 유닛에게는 고정 피해를 입히고 적중할 때마다 기본 지속 효과를 적용합니다."],["신성한 안개","그웬이 안개를 소환하여 안개 밖에 있는 적으로부터 자신을 보호합니다. 안개에 들어오는 적만이 그웬을 대상으로 지정할 수 있습니다."],["돌격가위","짧은 거리를 돌진한 후 몇 초 동안 그웬의 공격 속도, 공격 사거리, 적중 시 마법 피해가 증가합니다. 이때 적에게 공격을 적중시키면 이 스킬의 재사용 대기시간을 일부 돌려받습니다."],["바느질","그웬이 바늘을 던져 적중한 적에게 마법 피해를 입히고 둔화시킵니다. 챔피언에게 적중 시 가위 난도질을 적용합니다. 이 스킬은 최대 2회 더 사용할 수 있으며, 재사용할 때마다 추가 바늘을 던져 더 많은 피해를 입힙니다."]],"en":[["Thousand Cuts","Gwen's attacks deal bonus magic damage based on the target's health. She h
