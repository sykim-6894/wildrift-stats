eals for a portion of the damage dealt to champions by this effect."],["Snip Snip!","Gwen snips her scissors in a cone up to 6 times dealing magic damage. Gwen deals true damage to units in the center and applies her passive to them on each snip."],["Hallowed Mist","Gwen summons mist that protects her from enemies outside of it. She can only be targeted by enemies who enter the mist."],["Skip 'n Slash","Gwen dashes a short distance then gains Attack Speed, attack range, and magic damage on-hit for a few seconds. If she hits an enemy during that time, this ability's cooldown is partially refunded."],["Needlework","Gwen hurls a needle that slows enemies hit, deals magic damage, and applies A Thousand Cuts to champions hit. This ability can be cast up to two more times, with each cast throwing additional needles and dealing more damage."]],"zh":[["千刀萬剮","關的普攻會根據目標生命造成額外魔法傷害；若目標為敵方英雄，她同時會回復自身生命，回復量等同於此效果所造成的部分傷害量。"],["剪剪！","關在錐形範圍內進行最多6次剪擊造成魔法傷害，並對位處中央的單位造成真實傷害，且每次剪擊都會觸發被動效果。"],["聖霧絲縷","關召喚聖霧保護自身不受聖霧外的敵軍攻擊，進入聖霧的敵軍則能以她為攻擊目標。"],["剪步如飛","關進行短距離衝刺，接著增加攻速、攻擊距離和附加魔法傷害的命中效果，持續數秒。若在此期間命中敵軍，則會返還部分此技能的冷卻時間。"],["飛針走線","關向前發射縫針，緩速命中的敵軍、造成魔法傷害，並對命中的英雄觸發「千刀萬剮」被動效果。此技能可額外多施放2次，每次都會發射更多縫針，造成更多傷害。"]],"n":[["0",""],["6/5/4/3",""],["17/16/15/14",""],["13/12/10/9",""],["75/65/55",""]]},"10055":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b51cc6aaacdd38ee84079be50413dbe0b9f67c57-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/3ef87839c3a4e01f2df0a47cf1d5969c1768a307-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7594e00d2aebe3a0952e8e550530cc7c02f96c79-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/728dc4a57ae6279ed0f3f9660912e57ea2415663-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b52799e214bf49b2cacd9cc09dc1a5f06eeb335d-96x96.jpg"],"ko":[["적응형 방어 체계","챔피언에게 기본 공격 시 잠시 동안 카밀 최대 체력의 20%에 해당하는 피해를 흡수하는 보호막이 생깁니다. 적 챔피언이 어떤 피해를 주는지에 따라 물리 혹은 마법 보호막 중 하나만 생성됩니다."],["정확성 프로토콜","카밀이 다음 기본 공격 시 추가 피해를 입히고 이동 속도가 증가합니다. 이 스킬은 사용 후 일정 시간 동안 재사용할 수 있으며, 잠시 기다렸다가 재사용하면 추가 피해량이 크게 증가합니다."],["전술적 휩쓸기","카밀이 잠시 후 전방을 원뿔형으로 휩쓸어 피해를 입힙니다. 원뿔의 바깥쪽 절반에 있는 적은 이동 속도가 느려지고 추가 피해를 입으며, 카밀의 체력을 회복시킵니다."],["갈고리 발사","카밀이 벽으로 자신을 끌어당겼다가 다시 도약해 착지 시 적 챔피언들을 기절시킵니다."],["마법공학 최후통첩","카밀이 대상 챔피언에게 돌진해 일정 지역 내에 가두고 다른 적을 밀어냅니다."]],"en":[["Adaptive Defenses","Basic attacks on champions grant a shield equal to 20% of Camille's maximum health against their damage type (Physical or Magic) for a brief duration."],["Precision Protocol","Camille's next attack deals bonus damage and grants bonus movement speed. This spell can be recast for a short period of time, doing significantly increased bonus damage if Camille delays a period of time between the two attacks."],["Tactical Sweep","Camille blasts in a cone after a delay, dealing damage. Enemies in the outer half are slowed and take extra damage, while also healing Camille."],["Hookshot","Camille pulls herself to a wall, leaping off and knocking up enemy champions upon landing."],["The Hextech Ultimatum","Camille dashes to target champion, anchoring them to the area, and knocking away other enemies."]],"zh":[["適性防禦","卡蜜兒普攻敵方英雄時獲得一個相當於自身 20% 最大生命的護盾，持續一段時間。護盾類型取決於敵方英雄主要的傷害形式（物理傷害或是魔法傷害）。"],["精密解剖","卡蜜兒的下次普攻造成額外傷害並獲得額外跑速。此技能可於一段時間之後重啟，若兩次技能間的時間達一定長度，卡蜜兒第二次技能造成的額外傷害將大幅提升。"],["刀光掠影","卡蜜兒經過短暫延遲後向前方錐形範圍發射一道衝擊波，造成傷害。刀光掠影會大幅緩速位於技能範圍後半部的敵人，並造成額外傷害，且治療卡蜜兒。"],["鋼鐵鉤射","卡蜜兒用鉤子將自己拉往地形物，接著躍向指定位置，並在落地時擊飛敵方英雄。"],["海克斯晶體結界","卡蜜兒跳向目標敵方英雄將其禁錮在結界內，並同時將其他敵人擊退。"]],"n":[["0",""],["9/8/7/6",""],["15/13/11/9",""],["22/20/18/16",""],["90/80/70",""]]},"10056":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e24dbf99fd6f81bb48e84081fff46ebeb2b83943-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c071cb5323b90fe8697afe0d0229bf30c13e9f2e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3b5d4389afaa2caf8fe52e66b3c057afd8ddf24d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/450b75c357e0db316ece274694989f52d28447f2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ee63b6658f44354ed8ec5f0176e5026c67ac577a-96x96.jpg"],"ko":[["전장의 군가","자르반 4세의 첫 기본 공격이 적의 현재 체력에 비례하여 추가 물리 피해를 입힙니다. 이 효과에 이미 당한 적은 몇 초 동안 이 효과로 인한 피해를 다시 받지 않습니다."],["용의 일격","자르반 4세가 창을 길게 늘여 창에 맞는 적에게 물리 피해를 입히고 방어력을 낮춥니다. 또한 이 스킬을 데마시아의 깃발에게 사용하면 자르반이 깃발 쪽으로 이동하며, 그 과정에서 부딪히는 적들을 모두 공중에 띄웁니다."],["황금빛 방패","자르반 4세가 데마시아의 고대 왕들의 힘을 빌려 피해를 흡수하는 보호막을 소환하고 주변 적의 이동 속도를 늦춥니다."],["데마시아의 깃발","데마시아의 긍지를 품은 자르반 4세의 공격 속도가 상승합니다. 데마시아의 깃발을 사용하면 자르반 4세가 데마시아의 깃발을 꽂아 마법 피해를 가하며, 주변 아군 챔피언의 공격 속도를 올려 줍니다. 다시 사용하면 자동으로 깃발을 향해 용의 일격을 사용합니다."],["대격변","자르반 4세가 적을 향해 엄청난 기세로 뛰어들어 주변 지역을 투기장으로 만들어버립니다. 착지하는 순간 주위 적들에게 피해를 입힙니다."]],"en":[["Martial Cadence","Jarvan's first basic attack on an enemy deals bonus physical damage based on their current Health. This effect cannot occur again on the same enemy for a few seconds."],["Dragon Strike","Jarvan IV extends his lance, dealing physical damage and lowering the Armor of enemies in its path. Additionally, this will pull Jarvan to his Demacian Standard, knocking up enemies in his path."],["Golden Aegis","Jarvan IV calls upon the ancient kings of Demacia to shield him from harm and slow surrounding enemies."],["Demacian Standard","Jarvan IV carries the pride of Demacia, passively granting him bonus Attack Speed. Activating Demacian Standard allows Jarvan IV to place a Demacian flag that deals magic damage on impact and grants Attack Speed to nearby allied champions. Cast again to automatically cast Dragon Strike to the flag."],["Cataclysm","Jarvan IV heroically leaps into battle at a target with such force that he terraforms the surrounding area to create an arena around them. Nearby enemies are damaged at the moment of impact."]],"zh":[["戰爭律動","嘉文四世對敵人發動的第一次普攻會造成額外物理傷害，傷害量依目標當前生命值而定。此效果在數秒內，無法對相同敵人再次使用。"],["滅龍一擊","嘉文四世伸長長槍造成物理傷害，並降低路徑上敵人的物理防禦。如果長槍碰到戰旗，則會將嘉文四世拉向戰旗，並擊飛路徑上的敵人。"],["光盾庇護","嘉文四世呼喚蒂瑪西亞諸王之魂，使自己獲得護盾，並緩速周遭敵人。"],["帝國戰旗","嘉文四世背負著象徵蒂瑪西亞的驕傲，被動的效果讓他獲得額外攻速，主動的效果讓他可以把戰旗豎立於地，對命中的目標造成魔法傷害，同時提高周圍友方英雄的攻速。再次使用技能便會自動施放「滅龍一擊」將自己拉向戰旗。"],["浩劫降臨","嘉文四世英勇跳向一個目標，其強大力量使附近地形改變成了競技場。所有被衝擊的鄰近敵人都會受到傷害。"]],"n":[["0",""],["9/8/7/6",""],["10",""],["11/10/10/9",""],["70/65/60",""]]},"10057":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b8f7f3d99331fc10fcdbb0e025aa1d4bba2001b0-64x64.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/713f726d2e4919f1947f2137484b3b603b6ec7cf-65x65.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/72a48b1a29fe8275c4c1cf1e8e7fb7576a04b37c-65x65.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/a451588ae7e8d381a480d0213d54b48bbb188e36-64x64.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/abe11e5c8f70824e6f2c13c32c663da1960398cc-64x64.jpg"],"ko":[["군주의 지배","비에고 앞에서 쓰러지는 적은 망령이 됩니다. 망령을 공격하면 비에고가 일시적으로 죽은 적의 몸을 지배하며 대상 최대 체력의 일부만큼 체력을 회복하고 대상의 기본 스킬과 아이템을 사용할 수 있습니다. 적의 궁극기는 제외되는 대신 자신의 궁극기를 비용 소모 없이 한 번 사용할 수 있습니다."],["몰락한 왕의 검","비에고의 유령 칼날이 적중 시 현재 체력에 비례한 추가 피해를 입히고 최근 비에고의 스킬에 적중당한 적들을 두 번 공격하여 체력을 훔칩니다. 비에고는 이 스킬을 사용해 양손검을 찔러 전방의 적을 꿰뚫을 수 있습니다."],["망령의 나락","비에고가 충전한 다음 전방으로 돌진하여 응축된 검은 안개 구체를 발사하고 처음으로 적중한 적을 기절시킵니다."],["안개의 길","비에고가 명령을 내려 검은 안개가 지형을 맴돕니다. 비에고가 망령이 되어 안개 속에 숨고 위장 효과, 이동 속도, 공격 속도를 얻습니다."],["심장 파괴자","비에고가 근처로 순간이동하여 적 챔피언에게 다다르면 심장을 공격하고 파괴적인 충격파를 일으켜 대상 주변의 적을 밀어냅니다."]],"en":[["Sovereign's Domination","Enemies who fall before Viego become wraiths. By attacking a wraith, Viego temporarily seizes control of the dead enemy's body, healing for a percentage of his target's max health and gaining access to their basic abilities and items. He replaces their Ultimate with a free cast of his own."],["Blade of the Ruined King","Viego's spectral blade passively deals bonus percent current Health damage On-Hit and strikes twice vs. enemies he recently hit with an Ability, stealing Health. Viego can activate this Ability to thrust his zweihander forward, impaling enemies in front of him."],["Spectral Maw","Viego charges up before dashing forward, releasing a ball of concentrated Black Mist that stuns the first enemy hit."],["Harrowed Path","Viego commands the Black Mist to haunt and surround a piece of terrain. Viego can hide in the Mist as a wraith, gaining camouflage, Move Speed, and Attack Speed."],["Heartbreaker","Viego teleports to a nearby location and executes an enemy champion on arrival, piercing their heart and causing a destructive shockwave around them that knocks away their allies."]],"zh":[["王權統御","倒在維爾戈面前的敵方英雄會成為幽魂。透過攻擊幽魂，維爾戈可以暫時奪取該英雄軀體的控制權，獲得目標最大生命一定比例的治癒效果，並獲得該英雄的基礎技能和道具的使用權。他會將其大絕替換為自己的大絕，並能免費施放一次。"],["殞落王者之劍","維爾戈的幽冥之劍在命中時，額外造成當前生命百分比的被動傷害，並對短時間內被他用技能命中的敵人進行兩次打擊，同時竊取生命。維爾戈可以發動這項技能將雙手巨劍向前戳刺，穿刺前方所有敵人。"],["冥魂之噬","維爾戈蓄力然後向前衝刺，並釋放一顆濃縮的黯霧之球，暈眩第一位命中的敵人。"],["幽影之徑","維爾戈號令黯霧去縈繞並籠罩一塊地形。維爾戈可以如幽魂一般隱藏在於黯霧中，獲得偽裝狀態、跑速和攻速。"],["破心者","維爾戈傳送到一個附近的地點並在抵達時處決一名敵方英雄，刺穿其心臟並在其周圍引發一陣毀滅性的衝擊波來擊退其友軍。"]],"n":[["0",""],["4/4/3/3",""],["7",""],["12/10/8/6",""],["90/75/60/0",""]]},"10058":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/5e1e2446c9dc697dd5d7c538f8bd779e6f923f66-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/7febe52e611c29c35b7d80fb29c3dadf85ff3358-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d54d88bd843372e17b005b04b08be9f9451eaebc-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/5622bbd71b290ba4717da7f9b27a049ec4b24f14-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/68d7df543f0778a59a35265cd958eba87db943c0-96x96.jpg"],"ko":[["무자비한 폭풍","볼리베어가 기본 공격을 하거나 스킬을 사용하면 공격 속도가 증가하며 최대 중첩 상태에서 공격 시 주변 적들에게 추가 마법 피해를 입힙니다."],["번개 강타","볼리베어가 적을 향해 이동할 때 이동 속도가 증가하며 처음으로 기본 공격하는 대상을 기절시키고 피해를 입힙니다."],["광란의 상처","볼리베어가 적에게 피해를 입혀 적중 시 효과를 적용하고 표식을 얻습니다. 같은 대상에게 다시 이 스킬을 사용하면 표식을 소모해 추가 피해를 입히고 체력을 회복합니다."],["천공 분열","볼리베어가 지정한 위치에 번개를 소환해 적에게 피해를 입히고 둔화시킵니다. 볼리베어가 폭발 반경 안에 있으면 보호막을 얻습니다."],["폭풍을 부르는 자","볼리베어가 지정한 위치로 도약하여 아래에 있는 적을 둔화시키고 피해를 입히며 추가 체력을 얻습니다. 볼리베어가 착지한 곳 근처에 있는 포탑은 일시적으로 비활성화됩니다."]],"en":[["The Relentless Storm","Volibear's Attacks and abilities grant Attack Speed, and eventually cause his Attacks to deal bonus magic damage to nearby enemies."],["Thundering Smash","Volibear gains speed towards enemies, Stunning and damaging the first one he Attacks."],["Frenzied Maul","Volibear damages an enemy, applying on-hit effects and gaining a mark. Casting this ability again on the same target consumes the mark to deal bonus damage and heal Volibear."],["Sky Splitter","Volibear summons a lightning bolt at a location, dealing damage and Slowing enemies while granting Volibear a shield if he's inside the blast radius."],["Stormbringer","Volibear leaps to a target location, Slowing and damaging enemies beneath him while gaining bonus Health. Enemy towers near his landing location become temporarily disabled."]],"zh":[["無情風暴","弗力貝爾使出普攻和技能時會增加攻速，最終讓他的普攻可以對附近的敵人造成額外魔法傷害。"],["雷霆貫擊","弗力貝爾向敵人移動時會增加跑速，對第一個攻擊的敵人造成傷害與暈眩。"],["狂熊撕咬","弗力貝爾傷害一名敵人，附加命中效果並獲得一個標記。再次對同一個目標施展這個技能會消耗標記，對目標造成額外傷害並回復弗力貝爾的生命。"],["蒼穹裂隙","弗力貝爾在目標地點召喚一道閃電，對敵人造成傷害和緩速；如果弗力貝爾身處爆炸範圍內，還會獲得一個護盾。"],["風暴使者","弗力貝爾躍向指定地點，對身下的敵人造成傷害與緩速，同時增加自身額外生命。在他降落點附近的敵方防禦塔將暫時被封鎖。"]],"n":[["0",""],["13/12/11/10",""],["5/5/5/5",""],["13/13/13/13",""],["90/80/70",""]]},"10059":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/d054deda664ef785931ed10873e76909866ee1ba-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9394488507d896bf008bd2aa52c570e9d26d3b51-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/884543307c6ae8a8113c682ca32c42dec89b05b8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/df423dd91f36e9ee792e167126705344585e8fd3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8dfc7b2d51b5d53d6fb400fc38d8ef17da229877-96x96.jpg"],"ko":[["질풍격","리 신이 스킬을 사용하면 다음 두 번의 기본 공격 속도가 증가하며 기력을 회복합니다."],["음파 / 공명의 일격","음파: 리 신이 음파를 발사하여 적의 위치를 파악하며, 음파에 맞은 적에게 물리 피해를 입힙니다. 적이 음파에 명중하면 다음 3초 안에 공명의 일격을 시전할 수 있습니다. 공명의 일격: 리 신이 음파에 맞은 적에게 돌격해 적이 잃은 체력에 비례한 물리 피해를 입힙니다."],["방호 / 강철의 의지","리 신이 지정한 위치로 돌격합니다. 도착 지점 근처에 적 챔피언이나 몬스터가 있으면 자신에게 피해를 흡수하는 보호막을 생성합니다. 방호를 사용하고 난 뒤 다음 몇 초 동안 강철의 의지를 시전할 수 있습니다. 강철의 의지: 리 신의 다음 공격이 추가 마법 피해를 입히고 리 신이 체력을 회복합니다."],["폭풍/무력화","폭풍: 리 신이 바닥을 내리쳐 마법 피해를 입히고 은신한 유닛을 드러내는 충격파를 발생시킵니다. 폭풍이 적에게 명중하면 다음 3초 안에 무력화를 시전할 수 있습니다. 무력화: 리 신이 폭풍에 피해를 입은 적을 4초 동안 약화시키며 이동 속도를 낮춥니다. 저하된 이동 속도는 시간이 지남에 따라 점차 회복됩니다."],["용의 분노","리 신이 강력한 돌려차기로 적 챔피언을 뒤로 밀어내고 공격 대상과 대상과 부딪히는 모든 적에게 물리 피해를 입힙니다. 공격 대상과 부딪힌 적은 짧은 시간 공중에 떠오릅니다."]],"en":[["Flurry","After Lee Sin uses an ability, his next 2 basic attacks gain Attack Speed and return Energy."],["Sonic Wave / Resonating Strike","Sonic Wave: Lee Sin projects a discordant wave of sound to locate his enemies, dealing physical damage to the first enemy it encounters. If Sonic Wave hits, Lee Sin can cast Resonating Strike for the next 3 seconds. Resonating Strike: Lee Sin dashes to the enemy hit by Sonic Wave, dealing physical damage based on the target's missing Health."],["Safeguard / Iron Will","Lee Sin rushes to target position, shielding himself from damage if an enemy champion or monster is near the landing point. After using Safeguard, Lee Sin can cast Iron Will for the next few seconds. Iron Will: Lee Sin's next attack deals bonus magic damage and has omnivamp."],["Tempest / Cripple","Tempest: Lee Sin smashes the ground, sending out a shockwave that deals magic damage and reveals enemy units hit. If Tempest hits an enemy, Lee Sin can cast cripple for the next 3 seconds. Cripple: Lee Sin cripples nearby enemies damaged by Tempest, reducing their Movement Speed for 4 seconds. Movement Speed recovers gradually over the duration."],["Dragon's Rage","Lee Sin performs a powerful roundhouse kick launching his target back, dealing physical damage to the target and any enemies they collide with. Enemies the target collides with are knocked into the air for a short duration."]],"zh":[["無雙亂舞","李星使用技能後，再來的兩次普攻攻速將獲得額外提升並回復能量。"],["虎嘯龍吟 ／ 震驚百里","虎嘯龍吟：李星發射一陣紊亂音波以找出敵人，對第一個擊中的敵人造成物理傷害。如果虎嘯龍吟擊中敵人，李星可以在接下來 3 秒內使出震驚百里。震驚百里：李星衝向被音波擊中的敵人，根據目標已損失的生命造成物理傷害。"],["鐵璧金身 ／ 易筋洗髓","李星衝向指定位置，落地時若附近有敵方英雄或野怪，可賦予自身護盾。使用鐵壁金身後，李星可以在接下來數秒內接著使出易筋洗髓。易筋洗髓：下次普攻造成額外魔法傷害，並附帶吸血效果。"],["狂風暴雨 ／ 分筋錯骨","狂風暴雨：李星重擊地面，放出衝擊波，對擊中的敵人造成魔法傷害，並揭露其位置。如果狂風暴雨擊中敵人，李星可以在接下來3秒內施展分筋錯骨。分筋錯骨：李星對受到狂風暴雨攻擊的鄰近敵人施展分筋錯骨，降低其跑速4秒。跑速會在效果持續期間逐漸回復。"],["神龍擺尾","李星使出強力迴旋踢，將目標擊退並對目標及目標碰撞到的敵人造成物理傷害。所有被撞擊到的敵軍會在短時間內被擊飛。"]],"n":[["0",""],["8/7/6/5","50/50/50/50"],["15/14/14/13","50/50/50/50"],["8","50"],["70/60/50",""]]},"10060":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d09485518c31e0d585787136ad28c9d60a8498c5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/af69511c411057a1243622198ab68b2d61130fe1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b40c6c22d5a2f0f2b90b0056e4629ca8503daa94-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1c0f3cd441f305f77ba211595a796db7cab3e990-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1ed44a286e69cccbea36d38fd19fa24c6d077768-96x96.jpg"],"ko":[["마법공학 탄약","코르키의 기본 공격 피해량의 일부가 마법 피해로 전환됩니다. 코르키는 이따금 기지에서 폭탄 꾸러미를 회수합니다. 폭탄 꾸러미를 집으면 이동 속도가 상승하고 발키리가 업그레이드됩니다."],["인광탄","코르키가 지정한 위치에 인광탄을 던져 대상 지역의 적들에게 마법 피해를 입힙니다. 일정 시간 동안 해당 지역 내 유닛들의 모습을 드러냅니다."],["발키리","코르키가 짧은 거리를 비행하며 폭탄을 투하해 불길을 남기고 그 위에 있는 적들에게 피해를 입힙니다. 특급 폭탄 배송: 코르키가 폭탄 꾸러미를 가지고 있으면 비행 거리가 길어지고 적을 옆으로 밀쳐내며 불길이 적에게 피해를 입히고 둔화시킵니다."],["개틀링 건","코르키가 현재 대상을 향해 원뿔 형태로 개틀링 건을 속사하여 적의 방어력과 마법 저항력을 낮추고 피해를 입힙니다."],["미사일 폭격","코르키가 대상 지점에 충돌 시 폭발하는 미사일을 발사하여 해당 지역에 있는 적들에게 피해를 입힙니다. 코르키는 시간이 지날수록 미사일을 저장하여 최대치까지 장전해둘 수 있습니다. 3번째 발사하는 미사일은 강화된 미사일으로, 추가 피해를 입힙니다."]],"en":[["Hextech Munitions","A percentage of Corki's basic attack damage is converted into magic damage. Corki can occasionally retrieve The Package inside his base, granting him movement speed and an empowered cast of Valkyrie."],["Phosphorus Bomb","Corki fires a flash bomb at a target location, dealing magic damage to enemies in the area. This attack additionally reveals units in the area for a duration."],["Valkyrie","Corki flies a short distance, dropping bombs that create a trail of fire that damages opponents who remain in it. Special Delivery: If Corki has The Package, the flight is longer, enemies are knocked aside and the zone slows and deals damage."],["Gatling Gun","Corki's gatling gun rapidly fires in a cone towards his current target, dealing damage and reducing enemy Armor and Magic Resist."],["Missile Barrage","Corki fires a missile toward his target location that explodes on impact, dealing damage to enemies in an area. Corki stores missiles over time, up to a maximum. Every third missile fired will be a Big One, dealing extra damage."]],"zh":[["海克斯軍火","庫奇的普攻傷害有一定比例會轉化為魔法傷害。炸彈包裹每隔一段時間會出現在基地，庫奇撿起後可增加跑速並可施放一次強化版的女武神特攻「炸彈快遞」。"],["磷光炸彈","庫奇發射一枚閃光彈到目標區域，對區域內敵人造成魔法傷害，並在一段持續時間內獲得該區視野。"],["女武神特攻","庫奇飛行一小段距離並丟下炸彈，留下一條燃燒的路徑，在路徑上的敵人會受到傷害。 炸彈快遞：如果庫奇身上帶著炸彈包裹，飛行距離會加長並能將敵人往側邊擊退，且燃燒路徑除傷害外還可造成緩速。"],["格林機槍","庫奇使用格林機槍掃射他面前錐形範圍內的敵人，造成傷害並降低敵人的物理和魔法防禦。"],["火箭轟擊","庫奇朝著目標地點發射飛彈，擊中後會爆炸並對範圍內的敵人造成傷害。每隔一段時間會裝入一枚導彈，直到達到存彈量最大值。每發射2枚導彈後，下一發會是超級導彈，可造成額外傷害。"]],"n":[["0",""],["9/8/7/6",""],["18/16/14/12",""],["12/12/12/12",""],["2/2/2",""]]},"10061":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/fdb6d6b214a1b33ca15fd569affc8631f3755bbd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e5c92766223e78bb091ba4d5162107faa14492a9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e5bc1042245d4b46a8173410db98f91e09a902d2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7844a8ee4ae59f8528b2e839dcd4b571592396b2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3cb5d96bac4732b727dd551b16c7add786f1096e-96x96.jpg"],"ko":[["폭풍의 표식","케넨의 스킬에 3번 적중당한 적은 기절합니다."],["천둥의 표창","표창을 던져 처음 적중한 적에게 마법 피해를 입힙니다."],["전류 방출","케넨이 기본 지속 효과로 몇 번의 기본 공격마다 추가 피해를 입히고 대상에게 폭풍의 표식을 남깁니다. 스킬 사용 시 표식이 있는 대상에게 피해를 입히고 폭풍의 표식을 하나 더 남깁니다."],["번개 질주","케넨이 번개 형태로 변신하여 기본 공격을 할 수 없는 상태가 됩니다. 변신하면 이동 속도가 증가하며, 원래 모습으로 돌아오면 공격 속도가 증가합니다."],["날카로운 소용돌이","케넨이 번개 폭풍을 소환하여 주변 적 챔피언을 공격하고 마법 피해를 입힙니다."]],"en":[["Mark of the Storm","Kennen stuns enemies he hits 3 times with his abilities."],["Thundering Shuriken","Throws a shuriken, dealing magic damage to the first enemy hit."],["Electrical Surge","Kennen passively deals extra damage and adds a Mark of the Storm to his target every few attacks, and he can activate this ability to damage and add another Mark of the Storm to targets who are already marked."],["Lightning Rush","Kennen morphs into a lightning form, becoming unable to attack. Kennen gains movement speed when entering this form, and attack speed when leaving it."],["Slicing Maelstrom","Kennen summons a storm that strikes at nearby enemy champions for magical damage."]],"zh":[["風暴印記","凱能使用技能命中同一個敵人3次時，會使目標暈眩。"],["雷電手裡劍","射出手裡劍，對第一個命中的敵人造成魔法傷害。"],["電能釋放","被動：每數次普攻可造成額外傷害，並附加一層風暴印記。主動：電擊所有帶有風暴印記的敵人造成傷害，並再附加一層風暴印記。"],["閃電衝擊","凱能化身為球形閃電，期間無法普攻，但會增加跑速；脫離此狀態後則會暫時增加攻速。"],["雷霆風暴","凱能召喚出一團雷暴，對周圍的敵方英雄造成魔法傷害。"]],"n":[["0",""],["7/6/5/4","60/55/50/45"],["12/10/8/6","40/40/40/40"],["7/7/6/6","100/95/90/85"],["80/75/70","0/0/0"]]},"10062":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b0dd4fe2be33bdd3e7af378707126731de0c8c0e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/091e76cc15032518451cc6a8434da7b559e205a8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/136b1e2f54efa5cc1c43ab209aba192c050da3de-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dea04d33b2f28efba5752bc0b16f31cd835ebd4d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c3aac306cd79a33ffe3b30703d4e9c081e362223-96x96.jpg"],"ko":[["가고 싶은 데로 간다","문도 박사가 처음으로 적중하는 이동 불가 효과에 저항하며, 체력을 잃고 근처에 화학 물질이 든 통을 떨어뜨립니다. 통 위로 이동하면 통을 주워 체력을 회복하고 이 스킬의 재사용 대기시간을 줄입니다. 또한 문도 박사의 체력 재생이 크게 증가합니다."],["오염된 뼈톱","문도 박사가 오염된 뼈톱을 던져 처음 맞는 적에게 적 현재 체력에 비례한 피해를 입히고 둔화 효과를 적용합니다."],["심장 전기 충격","문도 박사가 스스로를 감전시켜 주변 적에게 지속 피해를 입히고 자신이 입는 피해의 일부를 저장합니다. 지속시간이 끝나거나 다시 사용하면 주변 적에게 큰 피해를 입힙니다. 적에게 적중 시 저장한 피해의 일부를 체력으로 회복합니다."],["둔기에 의한 외상","기본 지속 효과 - 문도 박사가 잃은 체력에 비례하여 추가 공격력을 얻습니다. 사용 시 - 문도 박사가 적에게 왕진 가방을 내리쳐 자신이 잃은 체력에 비례한 추가 피해를 입힙니다. 이때 처치된 적은 밀려나며 지나치는 적에게 피해를 입힙니다."],["최대 투여량","문도 박사가 화학 물질을 투여하여 잃은 체력의 일부를 즉시 회복합니다. 이후 추가 공격력과 이동 속도를 얻고, 긴 지속시간에 걸쳐 최대 체력의 일부만큼 체력을 회복합니다."]],"en":[["Goes Where He Pleases","Dr. Mundo resists the first Immobilizing effect that hits him, instead losing Health and dropping a chemical cannister nearby. Dr. Mundo can pick it up by walking over it, restoring Health and reducing this Ability's Cooldown. Dr. Mundo also has significantly increased Health regeneration."],["Infected Bonesaw","Dr. Mundo throws an infected bonesaw, dealing damage to the first enemy hit based on their current health and slowing them."],["Heart Zapper","Dr. Mundo electrocutes himself, dealing persistent damage to nearby enemies and storing a portion of damage he takes. At the end of the duration or on Recast, Dr. Mundo deals a burst of damage to nearby enemies. If the burst hit an enemy, he heals a percentage of the stored damage."],["Blunt Force Trauma","Passive - Dr. Mundo gains bonus Attack Damage, increasing based on his missing Health. Active - Dr. Mundo slams his “medical” bag into an enemy, dealing additional damage based on his missing Health. If the enemy dies they are swatted away, dealing damage to enemies they pass through."],["Maximum Dosage","Dr. Mundo pumps himself with chemicals, instantly healing a percent of his missing Health. He then gains bonus Attack Damage and Move Speed, and regenerates a portion of his maximum Health over a long duration."]],"zh":[["想去哪就去哪","蒙多醫生會抵銷下一個命中他的硬控場效果，轉而損失生命並在附近丟下一罐化學藥劑；移動到藥劑上可回復生命並減少此技能的冷卻時間。另外蒙多醫生的生命回復非常快。"],["病毒骨鋸","蒙多醫生丟出一把病毒骨鋸，對第一個命中的敵軍造成傷害與緩速，傷害量高低取決於目標當前生命。"],["心臟電擊器","蒙多醫生使自己通電，對鄰近敵軍持續造成傷害，並將其所承受的一部分傷害轉化為灰色生命條。通電結束或重施技能時，會對鄰近敵軍造成大量傷害，若該波傷害命中敵人，則蒙多醫生自己會回復灰色生命條一定比例的生命。"],["鈍擊創傷","被動：蒙多醫生根據自身已損失生命增加物攻。主動：蒙多醫生拿「醫藥箱」朝敵人猛砸，根據自身已損失生命造成額外傷害。目標被擊殺的話會被擊飛，對路徑上的敵軍造成傷害。"],["最大劑量","蒙多醫生為自己灌注大量化學藥劑，立刻回復部分已損失生命，接著會在一段長時間內增加物攻與跑速，並回復一定比例的最大生命。"]],"n":[["0",""],["4",""],["13/12/11/10",""],["8/7/7/6",""],["70/65/60",""]]},"10063":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a70c126505cb5ae0b82e0f09657a093b50bd91c8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/18b4b95cda0c2f9b44a6f78b3d5c8946c9bbc1dc-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/9cf84134d32d87a462c28ccfedd80ca15c6f4d49-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1b06869777426fb1946924d154ff3beb33332a60-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/07d45db9dca335fe0f579b1ab08f007fb51ead28-96x96.jpg"],"ko":[["가시 정원","자이라가 적에게 휘감는 뿌리를 맞히면 가시 발사 꽃이 자라나 전투를 돕습니다. 스킬이 빗나간 경우에는 뿌리가 마지막으로 닿는 위치에 소환됩니다. 가시 발사 꽃은 자이라의 공격 대상을 자동으로 공격해 마법 피해를 입힙니다. 치명적인 가시 및 올가미 덩굴은 맞힌 적 챔피언, 대형 몬스터, 에픽 몬스터의 수만큼 가시 발사 꽃을 추가로 소환합니다."],["치명적인 가시","굵은 가시덤불이 지면을 뚫고 나와 폭발하며 해당 지역 안에 있는 적에게 마법 피해를 입힙니다. 또한, 가시 발사 꽃이 자라나 적에게 피해를 입힙니다. 가시 발사 꽃은 가시덤불에 적중된 적의 수만큼 늘어납니다."],["맹렬한 성장","자이라가 주변의 모든 가시 발사 꽃을 격분시킵니다. 격분한 가시 발사 꽃은 지속시간이 초기화되고 체력과 공격력을 얻습니다."],["휘감는 뿌리","자이라가 지면을 통해 전방으로 가시 덩굴을 내보내, 경로상의 적에게 마법 피해를 입히고 속박합니다. 덩굴이 적을 처음 맞히거나 스킬이 종료되면 가시 발사 꽃이 자라납니다."],["올가미 덩굴","자이라가 지정한 위치에 거대한 덩굴손을 소환합니다. 덩굴손은 뻗어 나가며 주변에 피해를 입히고, 수축하며 적을 공중에 띄웁니다. 적 챔피언을 맞히면 가시 발사 꽃이 자라납니다."]],"en":[["Garden of Thorns","When hitting enemies with Grasping Roots, Zyra spawns Thorn Spitters who fight for her. If it misses, a Thorn Spitter will spawn at the end of the root’s travel path instead. Thorn Spitters automatically attack Zyra’s target, dealing Magic Damage. Deadly Spines or Stranglethorns spawn additional Thorn Spitters for each extra enemy champion, large monster, or epic monster hit."],["Deadly Spines","Thick vines spread through the ground and explode into spines, dealing magic damage to enemies within the area. Zyra will also spawn a Thorn Spitter, dealing damage. For each enemy hit the number of Thorn Spitters will increase."],["Rampant Growth","Zyra enrages all Thorn Spitters near her. Enraged Thorn Spitters’ duration get reset and they gain bonus Health and bonus Attack Damage."],["Grasping Roots","Zyra sends forth vines through the ground to ensnare her target, dealing Magic Damage and rooting enemies they come across. Zyra spawns a Thorn Spitter when the vines hit the first enemy, or after the skill is cast if no enemy is hit."],["Stranglethorns","Zyra summons a massive thicket at a target location, dealing Magic Damage to enemies as it expands and knocking them airborne as it contracts. When enemy champions are hit, a Thorn Spitter will spawn."]],"zh":[["荊棘花園","枷蘿用「索命棘蔓」命中敵軍時，會生成棘刺噴吐草加入戰鬥。若未命中，則在棘蔓移動路徑的末端生成一株棘刺噴吐草。它會自動攻擊枷蘿的目標，造成魔法傷害。每多命中一位敵方英雄、大型野怪或是史詩級野怪，「致死棘刺」或「致命綻放」會多生成一株棘刺噴吐草。"],["致死棘刺","枷蘿在目標地點召喚一簇荊棘。在短暫的延遲後，產生爆炸，對範圍內的敵軍造成魔法傷害。同時長出一株棘刺噴吐草，對敵人造成傷害。技能擊中的敵軍越多，就會長出越多棘刺噴吐草。"],["狂暴蔓延","枷蘿使鄰近的棘刺噴吐草進入狂暴狀態。進入狂暴狀態時，重置剩餘持續時間，並獲得額外生命及物攻。"],["索命棘蔓","枷蘿從地上射出藤蔓來綑縛目標，造成魔法傷害並定身接觸到的敵軍。枷蘿在第一位命中的敵軍位置生成棘刺噴吐草。若未命中，則在技能施放結束後生成。"],["致命綻放","枷蘿在目標位置召喚一簇巨大灌木叢，蔓延時對敵軍造成魔法傷害，並在收縮時將其擊飛。命中敵方英雄時，生成一株棘刺噴吐草"]],"n":[["0",""],["8/7/7/6",""],["18/16/14/12",""],["12/12/12/12",""],["80/70/60",""]]},"10064":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/91179f301d3d2a83fbd4af5282333ad26d80efb5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/aed09390efd288db10df1f3bdcb3387cf576187f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/083cf8d1bb9e619da9be78399b3dee81df51620c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/7e0d8339c0baef55cc295431bd4d76650c474b8f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/67db2a2460a34e5c5f0c0e411da0e40ab9bd1cf0-96x96.jpg"],"ko":[["구르는 아르마딜로","람머스가 비전투 상태에서 몸을 말아 이동 속도를 얻습니다. 전투에 들어가면 이 효과가 일시적으로 비활성화됩니다."],["대회전","람머스가 공 모양으로 몸을 만 후 적에게 돌진해 충돌 시 주변 적에게 피해를 입히고 둔화시킵니다."],["몸 말아 웅크리기","람머스가 몸을 방어적으로 웅크립니다. 방어력과 마법 저항력이 크게 증가하고 가시박힌 껍질의 피해량이 늘어나며, 적에게 기본 공격을 받으면 피해를 돌려주지만, 지속시간 동안 이동 속도가 느려집니다."],["광란의 도발","람머스가 적 챔피언이나 몬스터를 도발해 자신을 무모하게 공격하도록 만듭니다. 또한 공격 속도가 잠시 증가합니다."],["지진 폭격","람머스가 공중으로 뛰어오른 뒤 지면을 내리쳐 피해를 입히고, 적을 둔화시키는 여진을 일으킵니다. 뛰어오를 때 사거리는 대회전의 현재 속도에 비례합니다."]],"en":[["Rolling Armordillo","Rammus starts rolling while out of combat, gaining movement speed. Entering battle will temporarily disable this effect."],["Powerball","Rammus accelerates in a ball towards his enemies, dealing damage and slowing targets affected by the impact."],["Defensive Ball Curl","Rammus goes into a defensive formation, vastly increasing his Armor and Magic Resistance, amplifying Spiked Shells' damage, and returning damage to enemies that basic attack him, but he is also slowed during this time."],["Frenzying Taunt","Rammus taunts an enemy champion or monster into a reckless assault against him. Additionally, he gains increased Attack Speed for a short time."],["Soaring Slam","Rammus hops into the air and slams down, dealing damage and creating aftershocks. Aftershocks slow enemies. The hopping distance increases based upon Powerball's current speed."]],"zh":[["披甲龍龜","拉姆斯脫離戰鬥時開始滾動並增加跑速。進入戰鬥時會中斷此技能。"],["動力衝刺","拉姆斯縮成球狀衝擊目標，造成傷害並使受到衝擊的目標緩速。"],["尖刺防禦","拉姆斯進入防禦狀態，大幅提升物理防禦和魔法防禦，強化錐刺甲殼的傷害，並反彈敵方對他的普攻傷害。但是這段期間他的跑速會降低。"],["披甲怒嘲","拉姆斯嘲諷一名敵方英雄或野怪，強制其攻擊自己。此外他的攻速會提升，持續一小段時間。"],["飛天動地","拉姆斯跳到空中後向地面重擊，造成傷害，且餘震會使敵人緩速。跳躍距離取決於動力衝刺當下的速度。"]],"n":[["0",""],["12/10/8/6",""],["7/7/7/7",""],["13/13/12/12",""],["70/60/50",""]]},"10065":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ea571ee7e0ca9b8618bd9aa770790c7a4f92bbde-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/054f17f0aadce296246bfde1f7d7c7535c25c72a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/3d030d28176797f406f51da4bdb46cdb39fdabe1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ab7fea4e9a691fada2568c290494bc603ec644f6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8ea0ca2ccea0bd448dc12269b6ce417c0d606125-96x96.jpg"],"ko":[["영혼의 포식자","추가 생명력 흡수를 얻습니다."],["흡수의 일격","나서스가 적을 공격하여 피해를 입힙니다. 흡수의 일격으로 대상을 처치할 경우 흡수의 일격 스킬이 강화됩니다."],["쇠약","나서스가 적 챔피언의 노화를 촉진시켜 이동 속도와 공격 속도를 점진적으로 늦춥니다."],["영혼의 불길","나서스가 영혼의 불꽃을 일으켜 해당 지역에 서 있는 적에게 피해를 입히고 방어력을 낮춥니다."],["사막의 분노","나서스가 강력한 모래 폭풍을 소환하여 주변의 적을 강타합니다. 나서스는 폭풍이 부는 동안 체력과 공격 범위가 증가하며, 주변의 적에게 피해를 입히고, 흡수의 일격 재사용 대기시간이 감소하며, 추가 방어력과 마법 저항력을 얻습니다."]],"en":[["Soul Eater","Gains bonus physical vamp."],["Siphoning Strike","Nasus strikes his foe, dealing damage and increasing the power of his future Siphoning Strikes if he slays his target."],["Wither","Nasus ages an enemy champion, decelerating their Movement and Attack Speeds over time."],["Spirit Fire","Nasus unleashes a spirit flame at a location, dealing damage and reducing the Armor of enemies who stand on it."],["Fury of the Sands","Nasus unleashes a mighty sandstorm that batters nearby enemies. While the storm rages, he gains increased Health, Attack Range, damages nearby enemies, has a reduced cooldown on Siphoning Strike, and gains bonus Armor and Magic Resistance for the duration."]],"zh":[["食魂者","獲得額外普攻吸血。"],["虹吸打擊","納瑟斯打擊敵人造成傷害，若擊殺單位則虹吸打擊的傷害會永久提高。"],["枯萎","納瑟斯使一位敵方英雄老化，隨時間降低其跑速與攻速。"],["靈魂烈焰","納瑟斯對一個地點釋放出靈魂烈焰，對站在火焰上的敵人造成傷害，並降低其物防。"],["死神降臨","納瑟斯釋放出強大的沙塵暴，攻擊鄰近敵人。在風暴期間，他會提升生命值、攻擊距離、傷害鄰近敵人、降低虹吸打擊的冷卻時間，並在持續時間內獲得額外物防及魔防。"]],"n":[["0",""],["7/6/5/4",""],["14/13/12/11",""],["12/12/12/12",""],["90/80/70",""]]},"10066":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f742630f390586c3f9336a63674f4a5b1ae6699c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a5545d2400dc4cf4f5e7386013b7ea48d39a68f1-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/30f86fe40b11934974fe24b67161f38504d74905-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b72564fd01759862bf34ad46f7ffd7df547cfa00-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d4d9e564880bee9ef9208743f72a65d7eca82149-96x96.jpg"],"ko":[["사랑의 한 방","미스 포츈은 새로운 대상에게 기본 공격을 가할 때마다 추가 물리 피해를 입힙니다."],["한 발에 두 놈","미스 포츈이 하나의 대상에게 총알을 발사해 적에게 피해를 입히고 대상 뒤에 있는 적을 치명타로 적중합니다. 적중 시 효과가 적용됩니다."],["활보","미스 포츈은 얼마 동안 피해를 입지 않으면 이동 속도가 점점 올라갑니다. 이 스킬을 활성화하면 잠깐 동안 미스 포츈의 공격 속도가 높아집니다. 재사용 대기 중일 때는 사랑의 한 방을 활용해 활보의 재사용 대기시간을 줄일 수 있습니다."],["총알은 비를 타고","미스 포츈이 총알을 퍼부어 지정 지역의 시야를 밝힙니다. 해당 위치에 있는 적은 여러 차례 피해를 입고 이동 속도가 느려집니다."],["쌍권총 난사","미스 포츈이 정면에 원뿔 형태로 수백 발의 총알을 난사해 적에게 대량의 피해를 입힙니다. 쌍권총 난사는 매회 발사 시 각각 치명타가 적용될 수 있습니다."]],"en":[["Love Tap","Miss Fortune deals bonus physical damage whenever she basic attacks a new target."],["Double Up","Miss Fortune fires a bullet, damaging an enemy and critically striking a target behind them. Applies on-hit effects."],["Strut","Miss Fortune passively gains Movement Speed when not attacked. This ability can be activated to grant bonus Attack Speed for a short duration. While it's on cooldown, Love Taps reduce the remaining cooldown of Strut."],["Make It Rain","Miss Fortune reveals an area with a flurry of bullets, dealing waves of damage to opponents and slowing them."],["Bullet Time","Miss Fortune channels a barrage of bullets into a cone in front of her, dealing large amounts of damage to enemies. Each wave of Bullet Time can critically strike"]],"zh":[["愛的拍拍","好運姐在以普攻命中新目標時，將造成額外物理傷害。"],["彈射","好運姐發射子彈，對第一個命中的目標造成傷害，並對其後方的另一個目標造成暴擊。技能附帶命中效果。"],["趾高氣揚","好運姐在未受攻擊時會被動增加跑速。主動使用此技能，可在短時間內增加攻速。進入冷卻時，愛的拍拍能夠減少此技能冷卻時間。"],["槍林彈雨","好運姐發射一陣彈雨，對敵人造成幾波傷害，並使其緩速。"],["彈幕","好運姐向她前方的錐形區域掃射強力彈幕，對敵人造成大量傷害，每波彈幕都可以暴擊。"]],"n":[["0",""],["6/5/4/3",""],["12/12/12/12",""],["14/13/11/10",""],["70/65/60",""]]},"10067":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ae2ee36768555f3c9a6ba35b1abc7d110e6ef2a7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ddc82f059214d82338a4c39561dc13545e621e3c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/85fa4709f7b287261c7f4247b3862e5195a7002b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/82343bfc9f5670ed5c926c46ef0ffc8a4b6fea1f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f56d8327ca38ea2015244678275176b55b10664b-96x96.jpg"],"ko":[["살아있는 배터리","제리가 보호막을 받을 때마다 이동 속도가 증가합니다. 제리가 적 보호막에 피해를 입히면 그 에너지를 흡수해 자신에게 보호막을 씌웁니다."],["집중 사격","제리가 단숨에 여러 발을 발사해 처음 적중하는 적에게 물리 피해를 입힙니다. 공격 속도에는 상한이 있고 추가 공격 속도는 공격력으로 전환됩니다. 스킬을 사용하면 전기 볼트를 발사해 마법 피해를 입히고 둔화시킵니다."],["초강력 레이저","제리가 전기 파동을 발사해 처음 적중하는 적을 둔화시키고 피해를 입힙니다. 파동이 벽에 맞으면 장거리 레이저로 확산됩니다."],["스파크 돌진","제리가 짧은 거리를 돌진하며 맞닥트리는 지형을 모두 뛰어넘습니다. 집중 사격의 다음 3발이 충전되어 적을 꿰뚫습니다."],["번개 방출","제리가 전류를 방출하고 자신을 과충전해, 피해량과 이동 속도가 증가합니다. 제리가 적 챔피언을 맞힐 때마다 이동 속도 증가 효과가 중첩되고 지속시간이 회복됩니다. 과충전된 동안 집중 사격이 더욱 빠른 3연발 사격으로 바뀌며, 대상 주변 적에게 번개가 연쇄적으로 튑니다."]],"en":[["Living Battery","Zeri gains Move Speed whenever she receives a shield. When she damages an enemy shield she absorbs its energy, shielding herself."],["Burst Fire","Zeri fires a burst of rounds that deals physical damage to the first enemy hit. There is a cap on the Attack Speed and bonus Attack Speed will be converted into Attack Damage; when actively cast, a lightning bolt will be fired, dealing magic damage and a slow."],["Ultrashock Laser","Zeri fires an electric pulse that slows and damages the first enemy hit. If the pulse hits a wall it expands into a long range laser."],["Spark Surge","Zeri dashes a short distance and energizes her next 3 shots of Burst Fire, causing them to pierce through enemies. She will vault and grind over any terrain she touches."],["Lightning Crash","Zeri discharges a nova of electricity and overcharges herself, gaining increased damage and stacking Move Speed that refreshes and gets stronger every time she hits an enemy champion. While overcharged, Burst fire becomes a faster triple shot that chains lightning between enemies."]],"zh":[["人體蓄電池","每當婕莉獲得護盾，就會提升跑速。她對敵人的護盾造成傷害時，會吸收其能量做為自己的護盾。"],["激電連彈","婕莉連發雷電彈，對第一位命中的敵軍造成物理傷害。雷電彈的攻速有上限，而額外攻速會被轉化為物攻。主動：發射一道電光，造成魔法傷害與緩速。"],["超激爆電磁炮","婕莉射出一道電力脈衝，對第一個命中的敵人造成造成緩速和傷害。若脈衝擊中牆壁，則會增長為一道長距離的雷射。"],["電光石火","婕莉向前衝刺一小段距離，為接下來3發激電連彈供給能量，使其能夠射穿敵人。不管遇到任何地形，她都能滑行或穿越過去。"],["雷霆萬鈞","婕莉釋放出一陣雷電衝擊，並使自己超載，藉此提升傷害和累加跑速，而且每次擊中敵方英雄都會重新進入此狀態且變得更強。超載期間，激電連彈會變成更快的三連射，並在敵人之間產生連鎖閃電。"]],"n":[["0",""],["7/6/4/3",""],["12/11/10/9",""],["22/19/17/14",""],["70/65/60",""]]},"10068":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/32652f94db46ab7a1eddff988d61eee37ecfdacb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f727e31b443df4141c5cbf24aa7599d023bdc179-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d21845fd4118aaf4b1a43a9dcc53c123d7a0cb10-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5a8035d70241c46e81ae70da7b32f4a29debc67e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/01ce3997c16fabdac710e2cc6bed5d6180c9bfc9-96x96.jpg"],"ko":[["투기장의 투지","세트는 기본 공격 시 양 주먹을 번갈아 사용합니다. 오른쪽 주먹이 약간 더 강하고 빠릅니다. 또한 세트는 불굴의 의지로 잃은 체력에 비례해 추가로 체력을 회복합니다."],["주먹다짐","세트의 다음 두 번의 공격이 대상 최대 체력에 비례해 추가 피해를 입힙니다. 또한 세트는 적 챔피언을 향해 이동할 때 이동 속도가 올라갑니다."],["강펀치","세트가 받은 피해를 기본 지속 효과를 통해 투지로 저장합니다. 스킬 사용 시 저장한 모든 투지를 소모하여 보호막을 얻고 지정한 방향으로 펀치를 날려 중심선에 있는 적들에게 고정 피해를 입히고 중심선 밖에 있는 적들에게 물리 피해를 입힙니다."],["안면 강타","세트가 양옆에 있는 모든 적을 끌어당겨 피해를 입히고 기절시킵니다. 한쪽에만 적이 있는 경우 기절시키는 대신 둔화시킵니다."],["대미 장식","세트가 적 하나를 붙잡아 공중으로 도약한 후 바닥에 내리꽂아 피해를 입히고 착지 지점 근처에 있는 모든 적을 둔화시킵니다."]],"en":[["Pit Grit","Sett's basic attacks alternate between left and right punch. Right punch is slightly stronger and faster. Sett also hates losing, gaining additional health regeneration based off of his missing health."],["Knuckle Down","Sett's next two attacks deal additional damage based off of the target's max health. Sett also gains movement speed while moving towards enemy champions."],["Haymaker","Sett passively stores damage he takes as Grit. On cast, Sett expends all stored Grit to gain a shield and punch an area, dealing true damage in the center and physical damage on the sides."],["Facebreaker","Sett pulls in all enemies on opposite sides of him, dealing damage and stunning them. If enemies were only on one side, they are slowed instead of stunned."],["The Show Stopper","Sett carries an enemy champion through the air and slams them into the ground, dealing damage and slowing all enemies near where they land."]],"zh":[["恆毅之泉","賽特的普攻會左右交替出拳攻擊，右拳的攻速和造成的傷害都比左拳高一點。而且賽特很怕輸，因此會根據已損失的生命獲得額外生命回復。"],["懾人猛拳","賽特的下兩次普攻將根據目標的最大生命造成額外傷害，且朝向敵方英雄移動時會增加跑速。"],["獸魂轟拳","賽特被動地將所受的傷害儲存為拳皇恆毅。施放技能時，賽特會消耗所有已儲存的拳皇恆毅，以獲得一個護盾並且對一個區域揮出重拳，在中線上造成真實傷害，並在邊緣造成物理傷害。"],["碎顱猛擊","賽特將他兩側的敵軍拉向自己，使其相撞，造成傷害並暈眩目標。若敵軍僅位於一側，則會受到緩速而非暈眩效果。"],["嘆為觀止","賽特將一名敵方英雄扛到空中，接著將其猛摔在地面上，並對落地點附近的所有敵軍造成傷害與緩速效果。"]],"n":[["0",""],["9/8/6/5",""],["16/14/13/11",""],["13/11/10/8",""],["70/65/60",""]]},"10069":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1001c9a986072a7b3068d89041ebcb8866105529-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9dacef8906ecaf947565e253a07a0b0c9cba08e3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6ea22a3de8d677a4ad4e9c7b819f1a12ec794dea-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/73b30a17ff9aeb330e30768e537b343f9ce76b2f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/742a75e2ef6eb9366d316d6e3d23da4be87eb183-96x96.jpg"],"ko":[["사냥꾼의 길","요네가 두 번째 공격을 할 때마다 마법 피해를 입힙니다. 또한 요네의 치명타 확률이 증가합니다."],["필멸의 검","전방으로 검을 내질러 일직선상의 모든 적에게 피해를 입힙니다. 적중 시, 몇 초간 폭풍 구름 효과가 1회 중첩됩니다. 2회 중첩되면 전방으로 돌진하며 돌풍을 날려 적을 공중으로 띄워 올립니다. 필멸의 검은 기본 공격으로 간주되어 같은 효과가 적용됩니다."],["영혼 가르기","전방 원뿔 범위 내 모든 적을 가르며 보호막을 획득합니다. 적중한 챔피언 수만큼 보호막 흡수량이 증가합니다. 영혼 가르기의 재사용 대기시간과 시전 시간은 공격 속도에 비례합니다."],["영혼해방","요네의 영혼이 육신을 떠나 이동 속도가 증가합니다. 지속시간이 끝나면 요네의 영혼은 다시 육신으로 돌아오며 영혼 상태에서 입힌 피해량의 일부를 다시 입힙니다."],["운명봉인","요네가 강력한 일격을 날리며 경로에 있는 마지막 챔피언 뒤로 순간적으로 이동하고 적중한 모든 적을 자신 쪽으로 끌어당깁니다."]],"en":[["Way of the Hunter","Yone deals magic damage with every second Attack. In addition, his critical strike chance is increased."],["Mortal Steel","Thrusts forward, damaging all enemies in a line. On hit, grants a stack of Gathering Storm for a few seconds. At 2 stacks, Mortal Steel causes Yone to dash forward with a gust of wind, knocking enemies Airborne. Mortal Steel is treated as a basic Attack and scales with all the same things."],["Spirit Cleave","Cleaves forward, damaging all enemies in a cone. Grants a shield to Yone. The shield's value is increased by the number of champions hit. Spirit Cleave's cooldown and cast time scale with Attack Speed."],["Soul Unbound","Yone's spirit leaves his body behind, gaining Move Speed. When this skill ends, Yone's spirit is forced back to his body and he repeats a portion of the damage he dealt as a spirit."],["Fate Sealed","Yone blinks behind the last champion in a line with a slash so powerful it pulls all enemies hit towards him."]],"zh":[["獵人之道","犽凝的每第二下普攻會造成魔法傷害。另外，他本身的暴擊率也較高。"],["鋼鐵凡志","向前突刺，對一直線上的所有敵軍造成傷害。命中敵軍時會獲得一層天寒地凍，持續數秒；累加至2層後，施放此技能時犽凝會捲起一陣風向前衝刺，使敵軍滯空。此技能視同普攻，效果機制與普攻完全相同。"],["滅魂斬","向前橫劈，對錐形範圍內的所有敵軍造成傷害，同時賦予犽凝自身護盾，該斬擊命中越多敵方英雄，護盾可吸收的傷害量就越高。攻速越高，此技能的冷卻時間便越短，施放速度也越快。"],["釋魂之刃","犽凝的靈魂脫離身體並增加跑速。此技能結束時，犽凝的靈魂會回到身體，並再次造成靈魂出竅期間造成的部分傷害量。"],["二刀流奧義 ─ 封‧命‧斬","犽凝瞬間衝刺到最後一名英雄身後，同時進行斬擊，隨後將所有命中的敵軍拉向他。"]],"n":[["0",""],["4",""],["14",""],["20/17/14/11",""],["80/70/60",""]]},"10070":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/91bf53294513d45bdfe562698d13afa117d1916a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/be69f33da86dc9196f37b179a6ecc597eda9846b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ec8e23d4a69e7bfb47bc91abb493d0dafcd019a5-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5504824fb10d63628c08193f9a4cdd9c20f578f4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3b62831c3de9489edaf0d675c0c691e1395acffb-96x96.jpg"],"ko":[["2연속 공격","마스터 이는 몇 차례 연속으로 기본 공격을 한 이후에 2번 연속 공격합니다."],["일격 필살","마스터 이가 전장을 순식간에 가로질러 여러 명의 적 유닛에게 물리 피해를 입히며, 그동안 대상으로 지정할 수 없는 상태가 됩니다. 일격 필살은 치명타가 발동하며 몬스터에게 추가 물리 피해를 입힐 수 있습니다. 기본 공격을 하면 일격 필살의 재사용 대기시간이 감소합니다."],["명상","마스터 이가 정신을 집중하며 체력을 회복해, 짧은 시간 동안 받는 피해량이 감소합니다."],["우주류 검술","기본 공격에 추가 고정 피해가 적용됩니다."],["최후의 전사","마스터 이가 엄청난 속도로 이동하며 순간적으로 자신의 이동과 공격 속도를 높이고 모든 둔화 효과에 대해 면역이 됩니다. 스킬이 활성화된 동안 적 챔피언을 처치하거나 어시스트를 올리면 최후의 전사 지속 시간이 늘어납니다. 적 챔피언을 처치하거나 어시스트를 올리면 기본 지속 효과로 다른 스킬들의 재사용 대기시간이 감소합니다."]],"en":[["Double Strike","Every few consecutive basic attacks, Master Yi strikes twice."],["Alpha Strike","Master Yi teleports across the battlefield with blinding speed, dealing physical damage to multiple units in his path, while simultaneously becoming untargetable. Alpha Strike can critically strike and deals bonus physical damage to monsters. Basic attacks reduce Alpha Strike's cooldown."],["Meditate","Master Yi rejuvenates his body by focus of mind, restoring Health and taking reduced damage for a short time."],["Wuju Style","Grants bonus true damage on basic attacks."],["Highlander","Master Yi moves with unparalleled agility, temporarily increasing his Movement and Attack Speeds as well as making him immune to all slowing effects. While active, Champion kills or assists extend Highlander's duration. Passively reduces cooldown for his other abilities on a kill or assist."]],"zh":[["雙重打擊","易大師每幾次連續普攻，就會同時對目標進行2次打擊。"],["先聲奪人","易大師快速穿越戰場對敵人造成傷害，對路徑上多個目標造成物理傷害，同時變得無法被標記。先聲奪人可以造成暴擊和並對野怪造成額外物理傷害。普攻可以減少先聲奪人的冷卻時間。"],["冥想","易大師進入冥想狀態，持續回復生命，同時短暫獲得減傷效果。"],["無極劍道","使普通攻擊得到額外真實傷害。"],["高原血統","易大師以靈巧的步伐進行移動，短暫提高跑速和攻速，同時免疫全部的緩速效果。主動使用技能時，擊殺英雄或助攻可以延長高原血統的作用時間。處於被動時，擊殺或助攻可以減少易大師其他技能的冷卻時間。"]],"n":[["0",""],["17/16/15/14",""],["25",""],["17/16/15/14",""],["70/65/60",""]]},"10071":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/269560c41111ef1c8af80713e311d295a0f936a2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/330afd292d27e0292d00436f070e91b3fe47c251-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/51f4e334929de95f79d1c6642a6e2773abde0c3f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/cd279d88756f7525b2cc6ef82a12a22a5cc0d629-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/23d9a7331e9019364dc22163676e858206a8fb18-96x96.jpg"],"ko":[["과다출혈","다리우스의 기본 공격과 스킬 공격이 적에게 출혈을 일으켜 지속 물리 피해를 입힙니다. 최대 중첩을 쌓으면 몇 초간 녹서스의 힘 효과를 받아 공격력이 증가하고 기본 공격 시 대상에게 과다출혈 중첩을 최대로 적용합니다."],["학살","다리우스가 도끼를 큰 원의 형태로 휘두릅니다. 도끼날에 맞은 적은 도낏자루에 맞은 적보다 더 큰 피해를 입고 과다출혈 중첩을 얻습니다. 다리우스는 도끼날에 맞은 적 챔피언 수에 비례하여 체력을 회복합니다."],["마비의 일격","다리우스가 다음 기본 공격을 강화해 대상에게 추가 피해를 입히고 대폭 둔화시킵니다."],["포획","다리우스가 도끼날을 세워 물리 피해를 입힐 때 대상의 방어력을 일정 비율 무시합니다. 사용 시 다리우스가 도끼의 갈고리 부분으로 적들을 휘감아 끌어당깁니다."],["녹서스의 단두대","다리우스가 적 챔피언에게 뛰어올라 치명적인 타격을 가해 고정 피해를 입힙니다. 대상의 과다출혈 중첩 수에 비례해 피해량이 증가합니다. 녹서스의 단두대로 적을 처치하면 재사용 대기시간이 초기화되고 녹서스의 힘 효과를 얻으며 주변 미니언과 몬스터가 도망칩니다."]],"en":[["Hemorrhage","Darius's attacks and damaging abilities cause enemies to bleed for physical damage over time, stacking up to a cap. Upon reaching full stacks, Darius gains Noxian Might for a few seconds, gaining Attack Damage and applying full stacks of Hemorrhage instead of 1."],["Decimate","Darius winds up and swings his axe in a wide circle. Enemies struck by the blade take more damage than those struck by the handle. Darius heals based on enemy champions hit by the blade, and applies Hemorrhage."],["Crippling Strike","Darius empowers his next attack to deal additional damage with a large slow."],["Apprehend","Darius hones his axe, passively causing his physical damage to ignore a percentage of his target's Armor. When activated, Darius sweeps up his enemies with his axe's hook and pulls them to him."],["Noxian Guillotine","Darius leaps to an enemy champion and strikes a lethal blow, dealing true damage. This damage is increased for each stack of Hemorrhage on the target. If Noxian Guillotine is a killing blow, its cooldown is refreshed, granting Noxian Might and causing nearby minions and monsters to flee."]],"zh":[["絞喉","達瑞斯的普攻與傷害性技能會使敵人流血，造成持續性物理傷害；此效果可以疊加。疊層達到上限時，達瑞斯獲得數秒的諾克薩斯之力，期間增加物理攻擊，同時每次造成的絞喉疊層數由原本的一層改為最大疊層數。"],["毀滅風暴","達瑞斯揮舞斧頭造成致命旋風。受到斧刃攻擊的敵人將會比被斧柄攻擊受到更多的傷害。此技能可對敵軍附加絞喉，並可治癒達瑞斯生命，擊中越多敵方英雄，治癒量越多。"],["殘廢打擊","達瑞斯強化下一次普攻，造成額外傷害與大幅緩速效果。"],["索魂奪命","被動：達瑞斯把斧頭磨利，造成的物理傷害可以無視目標一定比例的物理防禦。主動：達瑞斯用斧頭將敵人拉到他的身邊。"],["諾克薩斯斷頭台","達瑞斯跳躍至敵方英雄的身上，給予目標致命的一擊，造成真實傷害。目標身上每累加一層絞喉效果，可以再造成額外的傷害。如果目標遭到諾克薩斯斷頭台擊殺的話，冷卻時間會刷新，此時達瑞斯獲得諾克薩斯之力，並導致周圍的士兵與野怪落荒而逃。"]],"n":[["0",""],["9/8/6/5",""],["5",""],["18/16/14/12",""],["70/65/60",""]]},"10072":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b6a550d5daf4a43b8f803fb6a7bae8b4ef883b8c-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/27618aaf3e5ba62b149c9f66d2d621d770b3f6fa-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/e6010147d97a8ff41af6681aa2631ccab9fac40e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d76a41808c113ba489cf5493172c11c215800889-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2818f2873c12f695685441cf641b3a101994919b-96x96.jpg"],"ko":[["새로운 운명","그레이브즈의 산탄총에는 몇 가지 특징이 있습니다. 총탄이 떨어지면 총을 새로 장전해야 합니다. 공격 시 4개의 탄환이 발사되며 유닛을 관통해서 공격할 수 없습니다. 챔피언이 아닌 유닛이 탄환을 여러 개 맞으면 뒤로 밀려납니다."],["화약 역류","그레이브즈가 탄환을 발사합니다. 탄환은 발사 1.5초 뒤, 지형에 충돌 시 0.25초 뒤 폭발합니다."],["연막탄","그레이브즈가 목표 지점에 연막탄을 발사하여 시야를 좁히는 연기 구름을 만들어냅니다. 처음으로 연막탄에 맞은 적은 마법 피해를 입고 잠시 동안 이동 속도가 감소합니다."],["빨리 뽑기","그레이브즈가 전방으로 돌진하여 몇 초 동안 방어력이 상승하며, 적 챔피언을 향해 돌진할 경우에는 진정한 용기가 두 번 중첩됩니다. 기본 공격으로 적을 명중시키면 스킬 재사용 대기시간이 감소하고 추가 방어력 및 마법 저항력 지속시간이 초기화됩니다."],["무고한 희생자","그레이브즈가 폭발성 탄환을 발사하여 처음 맞은 챔피언에게 큰 피해를 입히고 그레이브즈가 반동으로 밀려납니다. 탄환은 챔피언을 맞히거나 사거리 끝까지 날아간 다음 폭발하여 원뿔 형태의 범위에 피해를 줍니다."]],"en":[["New Destiny","Graves' shotgun has some unique properties. He must reload when he runs out of ammo. Attacks fire 4 bullets, which cannot pass through units. Non-champions struck by multiple bullets are knocked back."],["End of the Line","Graves fires an explosive shell that detonates after 1.5 seconds, or 0.25 seconds if it strikes terrain."],["Smoke Screen","Graves fires a smoke canister at the target area creating a cloud of smoke that reduces sight range. Enemies caught in the initial impact are dealt magic damage and have their movement speed reduced briefly."],["Quickdraw","Graves dashes forward gaining an Armor boost for several seconds. If Graves dashes towards an enemy champion, gain two stacks of True Grit instead. Hitting enemies with basic attacks lowers the cooldown of this skill and refreshes the resistance boost."],["Collateral Damage","Graves fires an explosive shell dealing heavy damage to the first champion it hits, and pushing Graves back from recoil. After hitting a champion or reaching the end of its range, the shell explodes dealing damage in a cone."]],"zh":[["命運","葛雷夫的散彈槍具備一些特性。當他用完彈藥時就必須重新裝填。攻擊時會發射四顆子彈，子彈無法穿透單位。會擊退被多顆子彈擊中的非英雄單位。"],["人在江湖","葛雷夫發射一枚會在1.5秒後爆炸的彈藥，如果命中地形則在0.25秒後爆炸。"],["隻手遮天","葛雷夫朝目標區發射一個煙霧彈，形成一片降低視野範圍的煙霧。受到煙霧彈落地沖擊的敵人會受到魔法傷害，並且短暫降低跑速。"],["猛龍過江","葛雷夫往前衝刺，並在數秒內獲得物理防禦加成。如果葛雷夫衝向敵方英雄，則改為獲得兩層梟雄本色。以普攻擊中敵人可以降低此技能的冷卻時間，並刷新防禦加成。"],["龍爭虎鬥","發射爆裂彈，對第一個命中的敵人造成物理傷害，葛雷夫則會因後座力而後退。當爆裂彈打到敵人或飛行距離到達極限時，爆裂彈會散射出破片，對錐形範圍內的敵人傷害。"]],"n":[["0",""],["10/9/8/7",""],["20/18/16/14",""],["13/13/13/13",""],["75/60/45",""]]},"10073":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c0c168bf39bd9e6900b07f8e8f60cdb2c4f2cfe3-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f890567b4319283ca0db57f8224bce89324981fe-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/8a2e2a821d8b2a70a0d8c6f91b7e0bb9efc8f3bc-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9b1dfa4707e51e013e8f7aaa04d83cc7282b240b-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/27edb7a95f1f2cd67f7b9a48a08a12a7cfe22280-100x100.jpg"],"ko":[["킨드레드의 표식","킨드레드는 사냥감에게 표식을 남길 수 있습니다. 사냥에 성공하면 영구적으로 킨드레드의 기본 스킬이 강화됩니다. 사냥에 4회 성공하면 킨드레드의 기본 공격 사거리가 증가합니다."],["화살 세례","킨드레드가 구르며 근처의 대상들에게 최대 세 발의 화살을 발사합니다."],["늑대의 광기","늑대가 분노하여 주변의 적들을 공격합니다. 양이 기본 지속 효과로 움직이고 공격하여 중첩을 얻습니다. 완전히 충전되면 양이 다음 번 공격할 때 체력을 회복합니다."],["차오르는 공포","양이 신중하게 화살을 발사해 대상의 속도를 늦춥니다. 양이 대상을 두 번 더 공격하면 세 번째 공격 시 늑대가 적을 덮치게 만들어, 흉포한 공격으로 큰 피해를 입힙니다."],["양의 안식처","양은 안식처 영역 안에 있는 모든 생명체를 죽음으로부터 지켜줍니다. 효과가 끝날 때까지는 아무도 죽지 않습니다. 효과가 끝나면 유닛들이 치유됩니다."]],"en":[["Mark of the Kindred","Kindred can mark targets to Hunt. Successfully completing a Hunt permanently empowers Kindred's basic abilities. Every 4 hunts completed also increases Kindred's basic attack range."],["Dance of Arrows","Kindred tumbles and shoots up to three arrows at nearby targets."],["Wolf's Frenzy","Wolf enrages and attacks enemies around him. Lamb passively gains stacks by moving and attacking. When fully charged, Lamb's next attack restores health."],["Mounting Dread","Lamb fires a carefully placed shot, slowing the target. If Lamb attacks the target two more times, her third attack instead directs Wolf to pounce on the enemy, savaging them for massive damage."],["Lamb's Respite","Lamb grants all living things inside a zone a respite from death. Until the effect ends, nothing can die. At the end, units are healed."]],"zh":[["鏡爪印記","鏡爪標記敵方並開始追獵。成功完成追獵能夠永久增強鏡爪的基礎技能，每完成4次追獵，鏡爪的普攻距離會增加。"],["舞動箭矢","鏡爪翻滾並對附近目標發射最多三支箭矢。"],["魔狼狂熱","魔狼發怒並攻擊附近的敵人，神羊則是可以透過移動和攻擊累積堆層，達最大層數後，神羊下一次攻擊將回復鏡爪的生命。"],["恐懼蔓延","神羊發射一發箭矢，緩速目標。如神羊再攻擊此目標兩次，她的第三次攻擊會轉由魔狼發動，對目標造成巨大傷害。"],["神羊喘息","鏡爪讓範圍內所有生物獲得不死效果。效果結束前，任何物體都無法死亡。效果結束時，所有單位會受到治療。"]],"n":[["0",""],["9/9/9/9",""],["17/16/15/14",""],["13/12/11/10",""],["105/90/75",""]]},"10074":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/163cccfcace22f88bd8b98d968795eb5426164d5-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4209549d1a759cf019881bea7472e10de25433b0-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1229dc8ea14ddcaef25b843c15103da6cc05d9f7-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/36b807ee7b8560c834750774bbd159c6211b8e5b-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/b25608e1fdeca2bbf14df9d0a139eb365b97dafe-256x256.png"],"ko":[["마법 흡수","마오카이는 기본 지속 효과로 기본 공격 시 체력을 회복하고 추가 피해를 입힙니다. 적 스킬에 맞거나 직접 스킬을 사용하면 기본 지속 효과의 재사용 대기시간이 감소합니다."],["덤불 주먹","마오카이가 충격파를 일으켜 근처의 적을 뒤로 날려버리고 마법 피해를 입히며 둔화시킵니다."],["뒤틀린 전진","마오카이가 움직이는 뿌리 덩어리로 변신해 대상에게 도약해 속박합니다. 이때 마오카이는 대상으로 지정할 수 없습니다."],["묘목 던지기","마오카이가 묘목을 던져 해당 지역을 감시하게 합니다. 수풀에서는 효과가 향상됩니다."],["대자연의 마수","마오카이가 나뭇가지와 가시로 된 거대 벽을 소환합니다. 벽은 천천히 전진하며 벽에 닿은 적에게 피해를 입히고 속박합니다."]],"en":[["Sap Magic","Maokai's basic attack also heals him and deals additional damage on a moderate cooldown. Each time Maokai casts a spell or is struck by an enemy's spell, this cooldown is reduced."],["Bramble Smash","Maokai knocks back nearby enemies with a shockwave, dealing magic damage and slowing them."],["Twisted Advance","Maokai contorts into a mass of moving roots, becoming untargetable and dashing to the target. Upon arrival, he roots the target."],["Sapling Toss","Maokai flings a sapling to the target area to stand guard. More effective in brush."],["Nature's Grasp","Maokai summons a colossal wall of brambles and thorns that slowly advances forwards, damaging and rooting any enemies in the path."]],"zh":[["魔法樹液","茂凱的普攻也會治療自身並造成額外傷害，此效果有適度的冷卻時間。每當茂凱施放技能或被敵方技能擊中，此效果的冷卻時間會減少。"],["荊棘摧殘","茂凱透過衝擊波擊退鄰近敵軍，緩速他們並造成魔法傷害。"],["飛葉遁影","茂凱變為大量移動的樹根，變得無法被指定並衝向目標，抵達後定身目標。"],["扭曲樹精","茂凱朝目標區域擲出小樹精，小樹精會協助茂凱監視目標區域。在草叢中更有效。"],["詭林之握","茂凱召喚出一道佈滿荊棘的樹牆，樹牆會緩緩朝著前方前進，定身路徑上的敵軍並造成傷害。"]],"n":[["0",""],["8/7/6/5",""],["14/13/12/11",""],["14/14/14/14",""],["80/75/70",""]]},"10075":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/061869532af51bade4078584b3c19338347c83c9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e2600241a8a3589be4223e09a2c25ff6e73143ee-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4a1d7fd7580f2fed8c63ed1b8f4a5b1ff145ad90-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b01a77fe51a90602694c9d53e012fdba86c4dc2b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/134b2f9f318e45cd6e3f8afe9b1a1c2185eb00c2-96x96.jpg"],"ko":[["순풍","기본 지속 효과로 잔나의 이동 속도가 증가하며 근처 아군 챔피언도 같은 효과를 받습니다."],["울부짖는 돌풍","잔나가 강력한 회오리바람을 소환해 경로에 있는 적에게 피해를 입히고 공중으로 띄워 올립니다."],["서풍","잔나의 이동 속도가 증가합니다. 바람의 정령이 범위 내의 가장 가까운 챔피언 2명을 찾아 아군에게는 이동 속도를 부여하고 적에게는 피해를 입힙니다."],["폭풍의 눈","잔나가 방어용 광풍을 만들어 자신, 아군 챔피언 또는 포탑이 범위 내에 있을 경우 포탑을 보호합니다. 이 보호막은 공격력도 부여합니다."],["계절풍","잔나가 강력한 구원의 바람을 소환해 주변의 적을 밀어내고 근처 아군의 체력을 회복시킵니다."]],"en":[["Tailwind","Janna passively gains move speed and gives nearby allied champions the same bonus."],["Howling Gale","Janna summons a powerful whirlwind, dealing damage and knocking up enemies in its path."],["Zephyr","Janna gains move speed. The wind spirit affects the two closest champions in range, granting move speed to allies and damaging enemies."],["Eye of the Storm","Janna conjures a defensive gale that shields herself, an ally, or a turret if one is in range. This shield also grants attack damage."],["Monsoon","Janna calls forth mighty winds of salvation, knocking back surrounding enemies and healing nearby allies."]],"zh":[["順風而行","珍娜被動增加跑速，附近友軍英雄也會獲得此跑速加成。"],["颶風呼嘯","珍娜召喚一道強力旋風，造成傷害並擊飛路徑上的敵軍。"],["和風守護","珍娜增加跑速。風靈會影響範圍內最靠近的兩名英雄，使友軍增加跑速並傷害敵軍。"],["風暴之眼","珍娜召喚強大的復甦之風，擊退周遭敵軍，且幫鄰近友軍回復生命。"],["復甦季風","珍娜呼喚魔法風暴環繞自己，並將敵人擊退。風暴平息後，在技能保持啟動的情況下，和風會持續治療鄰近友軍。"]],"n":[["0",""],["1",""],["9/8/8/7",""],["16/14/12/10",""],["80/75/70",""]]},"10076":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c281b1897574bb81fdc0ad763140c81d0699db75-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d424d808d8f0bca2795d9ac312f8db8221153c1b-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e8f9cb32a27898071f4523e8a68aab58963d97e2-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7f4baf69cf41e550f0e04b3da83b5e676d0df0d8-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c0914102996462a76c3032c9eddcdf03e6650a30-128x128.png"],"ko":[["강철의 외교관","뽀삐가 던진 방패가 대상을 맞히고 튕겨나갑니다. 뽀삐는 방패를 다시 주워 일시적인 보호막 효과를 얻을 수 있습니다."],["망치 강타","뽀삐가 망치를 휘둘러 피해를 입히고 적의 움직임을 느리게 만드는 지대를 생성합니다. 지대는 잠시 후 폭발합니다."],["굳건한 태세","기본 지속 효과로 뽀삐가 추가 방어력과 마법 저항력을 얻습니다. 뽀삐의 체력이 낮아지면 이 효과가 더 커집니다. 사용 시에는 뽀삐의 이동 속도가 증가하며 주변에서 돌진하는 적을 막습니다. 뽀삐에게 막힌 적은 느려지고 이동 스킬을 사용할 수 없습니다."],["용감한 돌진","뽀삐가 돌진해 대상을 밀어냅니다. 대상이 지형에 부딪힐 경우 기절합니다."],["수호자의 심판","뽀삐가 잠시 정신을 집중한 뒤 망치를 휘둘러 피해를 입히고 적을 굉장히 멀리 날려버립니다."]],"en":[["Iron Ambassador","Poppy throws her buckler that bounces off the target. Poppy can pick it up to gain a temporary shield."],["Hammer Shock","Poppy swings her hammer, dealing damage and creating a zone that will slow enemies and explode after a delay."],["Steadfast Presence","Poppy passively gains Armor and Magic Resist. This bonus increases when she is low on Health. Poppy can activate Steadfast Presence to gain Move Speed and stop enemy dashes around her. If a dash is stopped, the enemy is slowed and grounded."],["Heroic Charge","Poppy dashes to the target and pushes it back. If the target is pushed into a wall, it is stunned."],["Keeper's Verdict","Poppy channels a hammer strike that knocks enemies very far away."]],"zh":[["鋼鐵使者","波比對目標彈射她的圓盾。波比能夠將圓盾拾起並獲得一個暫時的護盾。"],["戰鎚衝擊","波比甩動她的戰鎚，在區域內造成傷害且會緩速敵方，並在短暫後爆炸。"],["堅定不移","波比被動提升物防與魔防。此加成在她生命值低落時效果增強。波比可以施展「堅定不移」獲得跑速，並阻止周圍敵軍的衝刺。如果成功阻止敵軍衝刺，敵軍會受到減速與束縛。"],["英勇衝鋒","波比朝目標衝刺並將敵方往後推擠。如果目標被推擠到牆上則會被擊暈。"],["守護者裁決","波比施放一個槌擊，能夠將敵方擊飛到很遠的地方。"]],"n":[["0",""],["7/6/5/4",""],["19/16/14/11",""],["13/12/11/10",""],["90/80/70",""]]},"10077":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e7103b14b366e5e0f58a59107e820e8148eaf9c6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5c9d5f18922fa553e748d9311685f46613805611-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7abde75366de2cc1742acea6432f3abf41697b19-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7d13c4f940541575b69cb22a06d461f0af96ea43-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9a8400e05e90632cfb60df06188fa731ee2ebc8f-96x96.jpg"],"ko":[["드레이븐의 리그","드레이븐이 회전 도끼를 받아내거나 미니언 또는 몬스터를 처치하거나 포탑을 철거하면 팬들의 환호를 받습니다. 적 챔피언을 처치하면 지금까지 얻은 팬들의 환호에 비례해 추가 골드를 획득합니다."],["회전 도끼","드레이븐의 다음 공격이 추가 물리 피해를 입힙니다. 이 도끼는 대상에게 맞고 튕겨 나가 공중에 뜹니다. 공중에 뜬 도끼를 잡으면 자동으로 회전 도끼를 재사용할 수 있게 됩니다. 드레이븐은 한 번에 2개의 도끼를 사용할 수 있습니다."],["광기의 피","드레이븐의 이동 속도와 공격 속도가 증가합니다. 이동 속도 증가 효과는 시간이 지날수록 급격하게 감소합니다. 드레이븐이 회전 도끼를 잡으면 광기의 피 재사용 대기시간이 초기화됩니다."],["비켜서라","드레이븐이 도끼를 던져 물리 피해를 입히며 도끼에 맞은 적들을 옆으로 밀어냅니다. 적중당한 적은 이동 속도가 감소합니다."],["죽음의 소용돌이","드레이븐이 두 개의 거대한 도끼를 던져 맞은 적 모두에게 물리 피해를 입힙니다. 죽음의 소용돌이는 적 챔피언을 하나 맞힌 다음 서서히 방향을 바꿔 드레이븐에게 돌아옵니다. 도끼가 날아가는 동안 스킬을 재사용하면 더 빠르게 회수할 수 있습니다. 유닛 하나를 관통할 때마다 피해량이 줄어들지만, 되돌아올 때는 피해량이 최대로 회복됩니다."]],"en":[["League of Draven","Draven gains his fans' Adoration when he catches a Spinning Axe or kills a minion, monster, or tower. Killing enemy champions grants Draven bonus gold based on how much Adoration he has."],["Spinning Axe","Draven's next attack will deal bonus physical damage. This axe will ricochet off the target high up into the air. If Draven catches it, he automatically readies another Spinning Axe. Draven can have two Spinning Axes at once."],["Blood Rush","Draven gains increased Movement Speed and Attack Speed. The Movement Speed bonus decreases rapidly over its duration. Catching a Spinning Axe will refresh the cooldown of Blood Rush."],["Stand Aside","Draven throws his axes, dealing physical damage to targets hit and knocking them aside. Targets hit are slowed."],["Whirling Death","Draven hurls two massive axes to deal physical damage to each unit struck. Whirling Death slowly reverses direction and returns to Draven after striking an enemy champion. Draven may also activate this ability while the axes are in flight to cause it to return early. Deals less damage for each unit hit and resets when the axes reverse direction."]],"zh":[["瑞文聯盟","達瑞文接住迴旋飛斧、擊殺士兵和野怪或破壞防禦塔時，將會累積粉絲的偶像崇拜；擊殺敵方英雄時，達瑞文會根據累積的偶像崇拜疊層而獲得額外金幣。"],["迴旋飛斧","達瑞文的下一次普攻可造成額外的物理傷害。這把斧頭會在擊中目標後高高反彈至空中，如果達瑞文接到它的話，就可以重獲迴旋飛斧。達瑞文可以同時持有兩把迴旋飛斧。"],["好戲上場","達瑞文增加跑速與攻速，跑速加成會隨時間快速遞減。如果接到迴旋飛斧，好戲上場的冷卻時間會刷新。"],["給我閃！","達瑞文擲出斧頭，造成物理傷害、將目標往側邊擊退，並附加緩速效果。"],["迴轉死神","達瑞文猛力擲出兩把巨大的斧頭，對每一個擊中的單位造成物理傷害。擊中敵方英雄後斧頭會迴轉，返回達瑞文的位置，也可主動重施技能提早收回斧頭。隨著擊中單位增加，傷害會遞減；但回程時會重置傷害遞減效果。"]],"n":[["0",""],["10/9/8/7",""],["10/10/10/10",""],["15/14/13/12",""],["70/65/60",""]]},"10078":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/780f09821c45e23b9098fa8780b5d4338fb9b633-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d3180c6ae7decd93190653c7ada7cc89eae97e10-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/862ff235e9023f526d2579c1259653a4d09a5ef5-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d18caee7df90516fbd872c89b245f9dc88b3508a-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/84d5e92de7d9f434bdbb8ca35ded2d85a4ca00ed-128x128.png"],"ko":[["분노 유전자","나르가 피해를 입히거나 받을 때 분노를 생성합니다. 분노가 최고치에 도달하면 다음번 스킬을 사용할 때 메가 나르로 변신하여 체력, 방어력, 마법 저항력, 공격력이 증가합니다. 미니 나르 형태로 돌아가면 이동 속도, 공격 속도, 사거리가 증가합니다."],["부메랑 던지기 / 돌덩이 던지기","나르가 부메랑을 던지면 맞힌 적에게 피해를 입히고 속도를 늦춘 다음 나르에게 돌아옵니다. 나르가 부메랑을 받으면 재사용 대기시간이 감소합니다. 메가 나르는 돌덩어리를 던져 주위 모두에게 피해를 입히고 속도를 늦춥니다. 던져진 돌덩어리는 적에게 맞으면 그 자리에 멈추며, 메가 나르가 다시 집어 들면 재사용 대기시간이 감소합니다."],["슝슝 / 쿵쾅","나르는 기본 공격과 스킬 공격을 하면 신이 나서 추가 피해를 입히며 이동 속도가 상승합니다. 메가 나르는 너무 분노해 있어서, 뒷발로 일어나서 전방을 꽝 내리치며 일정 범위 안의 적들을 기절시킵니다."],["폴짝 / 우지끈","나르가 대상 지점으로 폴짝 뛰며, 유닛의 머리 위에 착지하는 경우에는 튕겨서 더 멀리 날아갑니다. 메가 나르는 튕겨가기에는 너무 커서, 대신 착지한 지면에 균열을 일으키고 주위 일정 반경에 피해를 입힙니다."],["나르!","메가 나르가 선택한 방향으로 주위 모두를 집어던져 피해를 입히고 속도를 늦춥니다. 벽에 부딪힌 적은 기절하며 추가 피해를 입습니다."]],"en":[["Rage Gene","Gnar generates Rage when dealing and receiving damage. At maximum Rage his next ability will transform him into Mega Gnar, granting increased health, armor, magic resistance, and attack. Back in his Mini Gnar form he will still gain move speed and attack speed and range."],["Boomerang Throw / Boulder Toss","Gnar throws a boomerang that damages and slows enemies it hits before returning to him. If he catches the boomerang its cooldown is reduced. Mega Gnar instead throws a boulder that stops on the first unit hit, damaging and slowing everything nearby. It can then be picked up to reduce the cooldown."],["Hyper / Wallop","Gnar's attacks and spells hype him up, dealing bonus damage and granting him Move Speed. Mega Gnar is too enraged to be hyper and instead can rear up on his hind legs and smash down on the area in front of him, stunning enemies in an area."],["Hop / Crunch","Gnar leaps to a location and bounces off the head of any unit he lands on, traveling further. Mega Gnar is too large to bounce and instead lands with earth-shattering force, dealing damage in an area around him."],["Gnar!","Mega Gnar throws everything around him in a chosen direction, dealing damage and slowing them. Any enemy that hits a wall is stunned and takes bonus damage."]],"zh":[["狂怒基因","吶兒造成或受到傷害時會產生怒氣。怒氣值全滿時，下一個技能會將他變身為狂暴吶兒，獲得額外生命、物理防禦、魔法防禦和普攻。恢復小不點吶兒型態後，仍會繼續獲得跑速、攻速及攻擊距離。"],["骨頭迴力鏢／巨岩拋擲","吶兒丟出骨頭迴力鏢，在迴力鏢回到自己身上前造成傷害並緩速敵軍。如果他接到迴力鏢的話，該技能冷卻時間將會減少。狂暴吶兒會丟出巨大岩石，巨石命中第一個目標後就會停住，緩速周圍所有敵方單位。可以把巨石撿起來，減少該技能冷卻時間。"],["野獸本能／原始衝撞","吶兒的普攻與技能會激怒他，造成額外傷害與獲得額外跑速。狂暴吶兒已經呈現暴怒狀態，無法再次被激怒，但他能立起後腿並且推擊前方的區域，暈眩範圍內的敵軍。"],["吶兒跳跳／重磅輾壓","吶兒奮力一跳到指定地點並且蹦蹦跳跳地從任何單位頭上翻過。狂暴吶兒太巨大了，無法從頭上越過任何單位，反之，他會用一股粉碎地面的重力狠狠砸向目標，在範圍內造成傷害。"],["狂嘯猛擊！","狂暴吶兒將會把身邊的一切都丟往指定方向，造成傷害並緩速附近敵方單位。任何因此撞到牆上的敵軍都會暈眩，受到額外傷害。"]],"n":[["0",""],["16/16/16/16",""],["20/19/18/17",""],["21/18/15/12",""],["60/45/30",""]]},"10079":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/23a3eff436b2ec32b2a79fe1b75221e2836ac8fb-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b3c24bd3116da83096509ee2b9dfcda6a3d7c087-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/19bd4b4200fec32c68be3a5f8513fbcc877c1efe-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/b3ee4b3f79a6b343907957f75470b9002a05dc19-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/df785a4db250f45a6fb0e003926eb487d721ddb1-96x96.jpg"],"ko":[["서리 화살","애쉬의 공격을 받은 대상이 느려지며, 이 대상에 대한 애쉬의 공격력이 상승합니다. 애쉬의 치명타는 추가 피해를 가하지 않는 대신, 대상에게 더 강력한 둔화를 적용합니다."],["궁사의 집중","애쉬는 공격을 계속하면 집중이 오릅니다. 집중 중첩이 최대치에 이르면 이를 모두 소모해 애쉬가 궁사의 집중을 사용할 수 있으며, 이 때 애쉬의 공격 속도가 잠시 동안 증가하고 그 동안 기본 공격이 강력한 다발 공격으로 변합니다."],["일제 사격","애쉬가 화살을 원뿔 모양으로 9개의 화살을 발사하여 더 큰 피해를 입힙니다. 이 때 서리 화살의 효과도 적용됩니다."],["매 날리기","애쉬가 매의 혼을 맵 어느 위치든 날려보내 정찰을 시킵니다."],["마법의 수정화살","애쉬가 조종할 수 있는 얼음으로 된 화살을 발사합니다. 화살이 적 챔피언에 맞을 경우 피해를 입히고 화살 발사 거리에 따라 더 오랜 시간 기절시킵니다. 또한 주변 적 유닛 역시 피해를 받고 속도가 느려집니다."]],"en":[["Frost Shot","Ashe's attacks slow their target, causing her to deal increased damage to these targets. Ashe's critical strikes deal no bonus damage but apply an empowered slow to the target."],["Ranger's Focus","Ashe builds up Focus by attacking. At maximum Focus, Ashe can cast Ranger's Focus to consume all stacks of Focus, temporarily increasing her Attack Speed and transforming her basic attack into a powerful flurry attack for the duration."],["Volley","Ashe fires 9 arrows in a cone for increased damage. Also applies Frost Shot."],["Hawkshot","Ashe sends her Hawk Spirit on a scouting mission anywhere on the map."],["Enchanted Crystal Arrow","Ashe fires a missile of ice which she can steer in the air. If the arrow collides with an enemy Champion, it deals damage and stuns the Champion, stunning for longer the farther arrow has traveled. In addition, surrounding enemy units take damage and are slowed."]],"zh":[["冰霜射擊","艾希的攻擊會使目標緩速，使她對這些目標造成的傷害增加。艾希的暴擊無法造成額外傷害，但會強化對目標造成的緩速效果。"],["專注射擊","艾希藉由攻擊疊加專注力。 達到最大專注力時，艾希可以消耗所有專注力發動專注射擊，暫時提升自己的攻速，並將自己的普攻轉化為一連串的強力攻擊。"],["萬箭齊發","艾希向前方的錐形範圍射出 9 支箭，造成額外的傷害。該技能會觸發冰霜射擊的效果。"],["鷹擊長空","艾希釋放獵鷹之靈進行偵察，範圍可達全地圖。"],["魔法水晶箭","艾希射出一支可操控方向的魔法水晶箭，擊中敵方英雄時對該英雄造成傷害並暈眩目標。飛行距離越遠，暈眩時間越長，同時對該英雄周遭的敵人造成傷害並減速。"]],"n":[["0",""],["0/0/0/0",""],["15/12/9/6",""],["45/40/35/30",""],["80/70/60",""]]},"10080":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fcca69f985c939b5b4101b88e9bb5994f515c64f-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/acada10b489da07a03c502c0602199aee5d60d09-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c9188c4fdaaae309f3af77d4d48cd74e122fd258-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b09072b22165707688354ab119e6ea575587ab08-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1bf01227f5880f522897bef496c9703bd02aea19-256x256.png"],"ko":[["시간의 유리병","질리언은 시간을 경험치의 형태로 보존하여 아군에게 줄 수 있습니다. 가장 가까운 아군의 레벨을 올려줄 수 있을 만큼 경험치가 모이면 건네줄 수 있습니다. 이때 질리언 역시 동일한 양의 경험치를 얻습니다."],["시한 폭탄","대상 위치로 가까이 오는 유닛(챔피언과 이미 폭탄이 있는 적 우선)에게 들러붙는 폭탄을 던집니다. 폭탄은 터지면서 대상과 주변 적에게 마법 피해를 입힙니다. 다른 시한 폭탄 때문에 일찍 폭발하면 적을 기절시킵니다. 최대 2회 충전됩니다."],["뒤틀린 시간 흐름","시간의 흐름을 가속하여 자신에게 찰나의 시간을 적용하고 피해를 흡수하는 보호막을 얻습니다. 질리언과 가장 가까운 아군 챔피언에게도 찰나의 시간을 적용하고 동일한 양의 피해를 흡수하는 보호막을 부여합니다. 찰나의 시간은 투사체와 챔피언에게 추가 속도를 제공하며, 질리언의 스킬 가속을 증가시킵니다."],["시간의 신기루","대상 위치에 시간을 왜곡하는 역장을 생성합니다. 역장 내의 적 챔피언과 투사체는 둔화됩니다."],["시간 역행","자신 또는 아군 챔피언에게 보호용 시간 룬을 부여합니다. 룬을 부여받은 대상이 지속시간 동안 치명적인 피해를 받으면 시간을 되돌려 대상으로 지정할 수 없는 상태로 만든 후 부활시키고 체력을 회복시킵니다. 대상이 룬의 부활 효과를 발동시키지 않으면 재사용 대기시간을 일부 돌려받습니다."]],"en":[["Time in a Bottle","Zilean stores time as Experience and can grant it to his allies. Zilean can impart this Experience on the nearest allied champion when he has enough to complete their next level up. Zilean receives as much Experience as he gives."],["Time Bomb","Tosses a bomb to target area that sticks to units that come near it, prioritizing champions and units already carrying a bomb. When it detonates it deals magic damage to the target and nearby enemies. If a Time Bomb is detonated early by another Time Bomb, it also stuns enemies. The Time Bomb can be recharged 2 times."],["Twisted Timeflow","Makes time flow faster for himself, applying Fleeting Time to himself and gaining a damage absorbing shield. Zilean also grants Fleeting Time and identical shield to his nearest ally champion. Fleeting Time increases projectile speeds and grants move speed. Fleeting Time also increases Zilean’s ability haste."],["Temporal Mirage","Creates a time-bending force field at target location. Within the force field enemy champions and projectiles are slowed."],["Chronoshift","Places a protective time rune on Zilean or an allied champion. If the rune bearer takes lethal damage during this time, they teleport back in time and become untargetable before they are revived and healed. If the rune bearer does not trigger the rune's revival effect, a part of Chronoshift's cooldown will be refunded."]],"zh":[["時光之瓶","極靈會將時間存為經驗值並能將其提供給友軍。當他有足夠的經驗值讓最靠近的友軍英雄升級，他可以傳授經驗給對方，而極靈也會獲得相同的經驗值。"],["定時炸彈","朝目標地點拋擲炸彈，附著於附近單位，炸彈會優先選擇英雄和已經攜帶炸彈的單位。炸彈引爆時會對目標和鄰近敵軍造成魔法傷害。若「定時炸彈」由另一枚「定時炸彈」提前引爆，則還會暈眩敵軍。「定時炸彈」可充能兩次。"],["扭曲時光","讓自己的時間流動加快，對自身施加「光陰似箭」效果並獲得可吸收傷害的護盾。極靈也會賦予最靠近的友方英雄「光陰似箭」效果和相同的護盾。「光陰似箭」會加快投射物的速度並賦予跑速，同時提升極靈的技能加速。"],["時空幻境","在目標位置創造一個時間扭曲力場。力場內的敵方英雄和投射物會遭到緩速。"],["時光倒流","在自已或友方英雄身上放置保護性時間符文。如果符文持有者在這段時間內受到致命傷害，他們會回到過去並變得無法被指定，之後會復活並回復生命。如果符文持有者沒有觸發符文的復活效果，會返還部份的「時光倒流」冷卻時間。"]],"n":[["0",""],["0/0/0/0",""],["14/13/12/11",""],["25/25/25/25",""],["110/95/80",""]]},"10081":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2a233067fb7679958f9e9eee2c5a9088c05c63e2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/74f01210c43ec2e508c7c37986015a015209d8e4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f7ea40d65e43ad9c9c454342c444943c2d1bd1ac-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c8d7240e6038834060ae3d9f0ff78b5373698fa3-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/a8ebcb93ec42ca17735c5acdce29d07d1291728f-96x96.jpg"],"ko":[["승리의 포효","근처에서 적이 죽거나, 알리스타가 적 챔피언을 기절 혹은 이동시킬 때마다 포효를 중첩시킵니다. 최대치까지 중첩되면 근처의 모든 아군 챔피언과 자신의 체력을 회복시킵니다."],["분쇄","알리스타가 땅을 내리쳐 주변의 적에게 피해를 입히고 공중에 띄웁니다."],["박치기","알리스타가 적에게 박치기를 하여 피해를 입히고 적을 밀어냅니다. 포탑에 사용 시 추가 피해를 입힙니다."],["짓밟기","알리스타가 근처의 적 유닛을 짓밟아 적 챔피언에게 피해를 입힐 경우 중첩을 얻고, 유닛을 통과해서 다닐 수 있게 됩니다. 최대치까지 중첩되면 알리스타의 적 챔피언에 대한 다음 기본 공격이 강화되어 추가 마법 피해를 입히고 기절시킵니다."],["꺾을 수 없는 의지","알리스타가 거친 함성을 지르며 자신에게 걸린 모든 방해 효과를 제거하고 일정 시간 동안 적의 물리 및 마법 피해를 감소시킵니다."]],"en":[["Triumphant Roar","Alistar charges his roar by stunning or displacing enemy champions or when nearby enemies die. When fully charged he heals himself all nearby allied champions."],["Pulverize","Alistar smashes the ground, dealing damage to nearby enemies and tossing them into the air."],["Headbutt","Alistar rams a target with his head, dealing damage and knocking the target back. May also target turrets to deal bonus damage."],["Trample","Alistar tramples nearby enemy units, ignoring unit collision and gaining stacks if he damages an enemy champion. At full stacks Alistar's next basic attack against an enemy champion deals additional magic damage and stuns them."],["Unbreakable Will","Alistar lets out a wild roar, removing all crowd control effects on himself, and reducing incoming physical and magical damage for the duration."]],"zh":[["勝利怒吼","亞歷斯塔會在使敵方英雄暈眩或位移，以及鄰近敵人死亡時充能怒吼。充能完畢後，他會治療自己與所有鄰近的友軍英雄。"],["大地粉碎","亞歷斯塔猛擊地面，對鄰近敵人造成傷害，並把他們擊飛到空中。"],["野蠻衝撞","亞歷斯塔用頭衝撞目標，造成傷害並擊退目標，若目標是防禦塔則能夠造成額外傷害。"],["蠻牛之力","亞歷斯塔踐踏鄰近敵方單位，忽略單位碰撞，如果傷害到敵方英雄，則可以獲得疊層。疊層累積滿後，亞歷斯塔下一次對敵方英雄的普攻會造成額外魔法傷害，並使其暈眩。"],["堅定意志","亞歷斯塔發出野蠻怒吼，移除自身受到的所有控場效果，並在效果持續期間降低受到的物理與魔法傷害。"]],"n":[["40",""],["13/12/10/9",""],["13/12/10/9",""],["11/11/10/10",""],["75/65/55",""]]},"10082":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/12cafbd0f4399269f558fe93bccd8a94a755c382-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/bdb86a3969c80c0eb1dde89126968165f583a9a4-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/66a518f54a41b14a7d8bc0efea4a8f48a5192506-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/1cd0bddd824b53da43c80ccf8cea3f6100299691-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/42d558821aab18ebc8b78c2a0468c400a17eb0f7-512x512.png"],"ko":[["용사냥개의 발걸음","스킬을 사용하는 동안 기본 공격 또는 이동 명령을 하면 암베사가 스킬을 사용한 후 짧은 거리를 돌진하며 다음 기본 공격의 사거리, 피해량, 공격 속도가 증가하고 기력을 돌려받습니다."],["교활한 휩쓸기 / 파멸의 일격","암베사가 쌍둥이 용사냥개로 전방 반원을 휩쓸어 날에 적중한 적에게 추가 피해를 입힙니다. 적을 타격하면 다음에 이 스킬을 사용할 때 짧은 시간 동안 스킬이 변하며 암베사가 전방에 일직선상으로 쌍둥이 용사냥개를 내리쳐 처음 적중한 적에게 추가 피해를 입힙니다."],["배척","암베사가 보호막을 얻고 짧게 준비한 후 지면을 내리쳐 주변 적에게 피해를 입힙니다. 준비하는 동안 미니언이 아닌 대상으로부터 피해를 막았다면 이 스킬로 입히는 피해량이 증가합니다."],["찢어 가르기","암베사가 주변으로 쌍둥이 용사냥개를 휘둘러 피해를 입히고 주변 적을 둔화시킵니다. 이 스킬로 용사냥개의 발걸음이 개시되면 돌진이 끝나고 암베사가 한 번 더 일격을 가합니다."],["공개 처형","암베사가 선택한 일직선상에서 가장 멀리 있는 적 챔피언에게 순간 이동한 후 제압합니다. 이후 해당 적 챔피언을 지면에 내리쳐 피해를 입히고 기절시킵니다."]],"en":[["Drakehound's Step","Entering an attack or movement command while casting an ability will cause Ambessa to dash a short distance once the ability is cast, granting her next attack bonus range, damage, and attack speed, and refunding energy."],["Cunning Sweep / Sundering Slam","Ambessa sweeps her twin drakehounds in a semicircle in front of her, dealing bonus damage to enemies hit by the blades. Striking an enemy will transform the next cast of this ability for a short period of time, causing her to slam her twin drakehounds down in a line in front of her, dealing bonus damage to the first enemy hit."],["Repudiation","Ambessa gains a shield, briefly braces herself, and then slams the ground to damage nearby enemies. If she blocked any non-minion damage while bracing herself, this ability will deal increased damage."],["Lacerate","Ambessa whips her twin drakehounds around herself, damaging and slowing nearby enemies. Initiating Drakehound's Step from this ability causes her to strike a second time at the end of its dash."],["Public Execution","Ambessa blinks to the farthest enemy champion in a line of her choosing and suppresses them upon her arrival. She then slams the enemy into the ground where they take damage and are stunned."]],"zh":[["龍犬詭步","在安比薩施放技能時輸入普攻或移動指令，她會在施展技能後衝刺一小段距離，擴大下一次普攻的範圍、提升傷害與攻速，以及返還能量。"],["暗襲/裂斬","安比薩向前方半圓揮動她的龍犬雙刃，對雙刃擊中的敵人造成額外傷害。此技能命中敵人會短暫改變下次施放的方式，改為猛力揮砍龍犬雙刃，對前方直線區域造成傷害，且第一位命中的敵軍會受到額外傷害。"],["鐵令","安比薩獲得護盾，短暫擺出防禦架式，然後重擊地面，對鄰近敵軍造成傷害。若她在防禦期間擋住任何非士兵單位造成的傷害，此技能造成的傷害會提升。"],["血戮","安比薩向周圍揮動她的龍犬雙刃，對鄰近敵軍造成傷害與緩速效果。若以此技能觸發龍犬詭步，衝刺結束後會再次施放此技能。"],["殛刑","安比薩閃現至所選方向上距離最遠的敵方英雄處，並壓制對方。接著將該名敵軍重摔到地上，造成傷害和暈眩"]],"n":[["0",""],["12/11/10/9","70/70/70/70"],["17/16/15/14","70/70/70/70"],["12/11/10/9","70/70/70/70"],["80/70/60",""]]},"10083":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e91dc58fadccfba5d58809141220e533096c8cdd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4ab3350c224b9ee23ab180eef8e348ab7fb7ba40-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f97f4c5499058532ef900a742f47b5acfc5fcf8f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/64f5c5dacc57a665ebfaf6bf6f64051863b40a6e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/7c1d88cdfa246cc355177211576045acd754acc4-96x96.jpg"],"ko":[["화강암 방패","말파이트는 여러 겹의 돌로 감싸여 있어 자신의 최대 체력 10%만큼의 피해를 흡수할 수 있습니다. 말파이트가 8초 동안 공격 받지 않으면 보호막이 재생성됩니다."],["지진의 파편","말파이트가 원초적인 원소 에너지를 사용하여 땅을 통해 대지의 조각을 날려 피해를 입히며 3초 동안 이동 속도를 훔칩니다."],["천둥소리","말파이트는 기본 지속 효과로 추가 방어력을 얻습니다. 말파이트가 천둥소리를 사용하면 막강한 힘으로 굉음을 내며 공격합니다. 이후 수 초 동안 말파이트의 기본 공격이 전방에 여진을 일으킵니다."],["지면 강타","말파이트가 땅을 내리쳐 충격파를 만들어 냅니다. 충격파는 말파이트 방어력의 일부에 해당하는 마법 피해를 입히며, 이에 맞은 적은 잠시 동안 공격 속도가 감소합니다."],["멈출 수 없는 힘","말파이트가 목표 위치로 난폭하게 돌진하여 적에게 피해를 입히고 공중으로 띄워 올립니다."]],"en":[["Granite Shield","Malphite is shielded by a layer of rock which absorbs damage up to 10% of his maximum Health. If Malphite has not been hit for 8 seconds, this effect recharges."],["Seismic Shard","Using his primal elemental magic, Malphite sends a shard of the earth through the ground at his foe, dealing damage upon impact and stealing Movement Speed for 3 seconds."],["Thunderclap","Malphite passively gains armor. When Malphite activates Thunderclap, he attacks with such force that it creates a sonic boom. For the next few seconds, his attacks create aftershocks in front of him."],["Ground Slam","Malphite slams the ground, sending out a shockwave that deals magic damage based on his Armor as damage and reduces the Attack Speed of enemies for a short duration."],["Unstoppable Force","Malphite ferociously charges to a location, damaging enemies and knocking them into the air."]],"zh":[["花崗岩護盾","墨菲特被岩石護盾保護，最多吸收最大生命 10% 的傷害，若 8 秒內未受到攻擊，護盾將重置。"],["地震碎片","墨菲特利用原始的元素魔法，將一塊岩石碎片從地下射向敵人，對其造成傷害並偷取其跑速3秒。"],["震雷之擊","墨菲特能被動獲得物防。墨菲特使出震雷之擊時，會產生音爆的力量來進行普攻。在接下來的幾秒內，他的普攻會在前方擊出震波。"],["大地震顫","墨菲特重擊地面，放出衝擊波，對敵人造成魔法傷害（此傷害高低取決於墨菲特的物防），並在短時間內降低敵人攻速。"],["勢不可擋","墨菲特猛力衝向一個指定地點，造成傷害並把敵軍擊飛至空中。"]],"n":[["0",""],["8/8/8/8",""],["10/9/8/7",""],["7/7/7/7",""],["85/80/75",""]]},"10084":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b35d69ee96123c008b442d4acb2aa05c4cd00b55-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8f64c5277ff50e5f66314b2911597603264ee46f-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e5c888c843e4bd8355348a848bc113e08a571e61-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/01df99fb71aa6e66e03fedf2a506cbfb995b9508-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c77c11417c28ac0b9216aca20ca454da69bfe6bb-128x128.png"],"ko":[["수풀 배회","수풀을 통과하면 니달리가 이동 속도를 얻습니다. 이 효과는 적 쪽으로 움직일 때 증가합니다. 챔피언이나 몬스터에게 창 투척 또는 매복 덫을 맞히면 사냥이 발동되며 잠시 대상에 대한 절대 시야를 얻습니다. 그동안 니달리는 이동 속도를 얻고(대상 쪽으로 움직일 때 추가로 증가), 숨통 끊기와 급습이 사냥 대상에게 입히는 피해가 증가합니다."],["창 투척 / 숨통 끊기","인간 형태일 때는 니달리가 대상에게 창을 던져 날아간 거리에 비례하는 마법 피해를 입힙니다. 쿠거 형태일 때는 니달리의 다음 기본 공격이 강화되어, 대상에게 상처를 입혀 잃은 체력에 비례하는 피해를 입힙니다."],["매복 덫 / 급습","인간 형태일 때는 니달리가 투명한 덫을 설치합니다. 덫을 밟은 적은 마법 피해를 받고 위치가 드러납니다. 쿠거 형태일 때는 니달리가 지정한 위치로 도약하여 주변 적에게 마법 피해를 입힙니다."],["태고의 생명력 / 할퀴기","인간 형태일 때는 니달리가 대상의 체력을 회복시키고 잠시 공격 속도를 부여합니다. 쿠거 형태일 때는 니달리가 지정한 방향을 발톱으로 공격해 다수의 적에게 마법 피해를 입힙니다."],["쿠거의 상","기본 지속 효과: 인간 형태일 때는 대상에게 사냥을 적용하면 쿠거의 상 재사용 대기시간이 초기화됩니다. 사용 시: 니달리가 쿠거 또는 인간 형태로 변신하고 스킬이 변경됩니다."]],"en":[["Prowl","Moving through brush increases Nidalee's Move Speed, increasing when moving towards an enemy. Hitting champions or monsters with Javelin Toss or Bushwhack triggers a Hunt, granting brief True Sight of them. During this time, Nidalee gains Move Speed (increased when moving towards the Hunted target) and her Takedown and Pounce are enhanced against them."],["Javelin Toss / Takedown","In human form, Nidalee throws a javelin at her target dealing Magic Damage, that gains damage as it flies. In cougar form, her next attack will wound her target, dealing more damage the lower their health is."],["Bushwhack / Pounce","In human form, Nidalee lays a stealthed trap, dealing Magic Damage and revealing its target when sprung. In cougar form, she leaps in a target location, dealing Magic Damage to nearby enemies."],["Primal Surge / Swipe","In human form, Nidalee heals the target and imbues Attack Speed for a short duration. In cougar form, she claws in a target direction, dealing Magic Damage to enemies hit."],["Aspect of the Cougar","Passive: While in Human Form, marking enemies as hunted will reset Aspect of the Cougar’s cooldown. Active: Nidalee transforms between cougar and human, gaining new abilities."]],"n":[["0",""],["5/5/5/5",""],["12/11/10/9",""],["12/12/12/12",""],["3",""]]},"10085":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/db12ec662ba9f6ee9cc707bfea650f593c5ab2cd-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/364c220b7fda1a5c5ce47520568091d1b3a45341-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/e965f40fb2abb2f74909c8630df09ba91e37718e-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0a17f5902000b2a6d84a63cd1add8ad1eb24e402-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/bc3de3a4b16af67f81ae5f957d3d9a9fd5160ad6-512x512.png"],"ko":[["영혼 방호술","오로라가 스킬 또는 기본 공격으로 피해를 입힌 적의 영혼을 제령합니다. 풀려난 영혼은 오로라 주위를 따라다니며 체력을 회복시킵니다."],["이중 저주","오로라가 에너지를 발사해 맞은 적에게 저주를 내립니다. 재사용하면 적용된 저주를 불러들여 적중한 경로상의 적에게 피해를 입힙니다."],["장막 너머로","오로라가 지정한 방향으로 뛰어오른 뒤 착지하며 영혼 세계에 진입해, 짧은 시간 동안 투명 상태가 되고 이동 속도를 얻습니다. 적 챔피언 처치에 관여하면 이 스킬의 재사용 대기시간이 초기화됩니다."],["마법의 문","오로라가 두 세계를 합치며 영혼 마법을 발사해, 적에게 피해를 입히고 둔화시킨 다음 안전한 뒤쪽으로 도약합니다."],["세계의 경계","오로라가 지정한 방향으로 뛰어올라 적중한 적에게 피해를 입히고 둔화시키는 충격파를 방출합니다. 이후 융합 영역을 생성해, 내부의 적을 둔화시키고 영역 한쪽에서 반대쪽으로 순간이동하는 능력을 얻습니다."]],"en":[["Spirit Abjuration","Aurora's spells and attacks exorcise spirits from the enemies she damages. Exorcised spirits follow Aurora around and heal her."],["Twofold Hex","Aurora sends out a missile that curses any enemies it hits. She can then recast the ability to draw active curses back toward herself, damaging foes who are hit along the way."],["Across the Veil","Aurora leaps in a direction of her choosing, entering the spirit realm upon landing, becoming invisible, and gaining Move Speed for a short duration of time. Taking down an enemy champion resets this ability's cooldown."],["The Weirding","Aurora converges the realms, sending out a blast of spirit magic that damages and slows enemies before Aurora hops backward to safety."],["Between Worlds","Aurora leaps in a direction of her choosing, releasing a shockwave that damages and slows any enemies it hits. Afterward, she creates an area that slows enemies within it and allows Aurora to teleport from one side of the area to the other."]],"n":[["0",""],["8/7/7/6",""],["21/20/19/18",""],["13/12/11/10",""],["100/90/80",""]]},"10086":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9a6abbe76fc8ded3f349649e04751e216f976313-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a405bc875edd56a7faa7b6dec3f0143ce95236a9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c9f260d44a280e70
