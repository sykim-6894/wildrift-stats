84cddfbc15a2d-96x96.jpg"],"ko":[["가라앉은 자들의 축복","파이크가 적에게 보이지 않는 상태가 되면 최근 적 챔피언에게 잃었던 체력의 일부를 빠르게 회복합니다. 또한, 어떤 방법으로든 파이크가 획득한 추가 최대 체력은 모두 추가 공격력으로 전환됩니다."],["뼈 작살","파이크가 앞에 있는 적을 공격하거나 끌어당깁니다."],["유령 잠수","파이크가 위장 상태가 되며 이동 속도가 크게 증가합니다. 이동 속도는 시간이 지남에 따라 원래대로 감소합니다."],["망자의 물살","파이크가 돌진하며 원래 있던 자리에 유령을 남깁니다. 이 유령은 파이크에게 돌아오면서 경로상의 모든 적 챔피언을 기절시킵니다."],["깊은 바다의 처형","파이크가 체력이 낮은 적에게 순간적으로 이동하여 처형하고 스킬을 다시 사용할 수 있게 됩니다. 또한 처치에 관여한 아군에게 추가 골드를 줍니다."]],"en":[["Gift of the Drowned Ones","When Pyke is hidden from enemies, he regenerates damage that he has recently taken from champions. Pyke also cannot gain extra Maximum Health from any source, and instead gains Bonus AD."],["Bone Skewer","Pyke either stabs an enemy in front of him or pulls an enemy towards him."],["Ghostwater Dive","Pyke enters Camouflage and gains significant movement speed that decays over time."],["Phantom Undertow","Pyke dashes and leaves behind a phantom that will return to him, stunning enemy champions along its path."],["Death From Below","Pyke blinks to and executes low health enemies, allowing him to cast this spell again and granting additional gold to an ally who assists."]],"zh":[["血港淹禮","當派克脫離敵方視野時，他將回復近期來自敵方英雄的傷害。此外，派克無法從任何來源增加自己的額外最大生命，但是會轉換為額外物理攻擊。"],["刺骨串叉","派克串刺前方的一名敵軍，或將一名敵軍拉向他。"],["幽海深潛","派克進入偽裝狀態並獲得大量隨時間遞減的跑速。"],["溺流鬼影","派克向前衝擊，並在身後留下一個幻影。幻影會回到派克的位置，對路徑上的敵方英雄造成暈眩效果。"],["汪洋死域","派克瞬移到生命值低的敵軍旁並處決之，讓他能夠重施技能，並給予一名助攻的友軍額外金幣。"]],"n":[["0",""],["10/9/8/7",""],["10/10/9/9",""],["11/10/10/9",""],["80/70/60",""]]},"10125":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b620dc72097afe1c659fc451c7fc0f5c7cc2b67d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/865eeddbd371dcece2ef7b03b815724b32dfbe04-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/736f67e5527ee32bea4abc3c22813fa3b363fb11-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5738dc0c9408dcf458ce65805f958978cc71899e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c838fcde2c785be0c4a81e879e0001bf40a0550c-96x96.jpg"],"ko":[["영광스러운 죽음","사이온은 사망한 이후 잠시 되살아나지만 체력이 급속히 떨어집니다. 이 동안 사이온은 매우 빠르게 공격하며 체력을 회복합니다. 공격 적중 시 대상 최대 체력에 비례해 추가 피해를 입힙니다."],["대량 학살 강타","사이온이 강력한 한 방을 충전하여 전방의 적들에게 피해를 입힙니다. 충분한 시간 동안 충전하면, 이 타격에 맞은 적들을 공중으로 띄우고 기절시킵니다."],["영혼의 용광로","사이온이 자기 자신에게 보호막을 씌우고 3초 후에 재시전하면 주변 적들에게 마법 피해를 입힙니다. 사이온이 적을 처치하면 기본 지속 효과로 최대 체력을 얻습니다."],["학살자의 포효","사이온이 단거리 충격파를 발사해 첫 번째로 맞는 적에게 피해를 입히고 속도를 늦추며, 방어력을 낮춥니다. 충격파가 미니언이나 몬스터를 맞히면 뒤로 밀려나며 피해를 입고 둔화되며 관통하는 모든 적의 방어력을 낮춥니다."],["멈출 수 없는 맹공","사이온이 한 방향으로 돌진하며 점차 속도가 상승합니다. 돌진 방향은 커서 위치로 약간 조종할 수 있습니다. 적과 충돌하면 돌진한 거리에 비례하여 피해를 입히고 띄워올립니다."]],"en":[["Glory in Death","After being killed, Sion will temporarily reanimate with rapidly decaying Health. His attacks become very rapid, heal him, and deal bonus damage based on his target's maximum Health."],["Decimating Smash","Sion charges a powerful swing in an area in front of himself that will deal damage to enemies when released. If he charges for enough time, enemies hit by the swing will also be knocked up and stunned."],["Soul Furnace","Sion shields himself and can reactivate after 3 seconds to deal Magic Damage to enemies nearby. When Sion kills enemies, he passively gains maximum Health."],["Roar of the Slayer","Sion fires a short range shockwave that damages and slows and reduces the Armor of the first enemy hit. If the shockwave hits a minion or monster, it will be knocked back, damaging, slowing, and reducing the Armor of all enemies that it passes through."],["Unstoppable Onslaught","Sion charges in a direction, ramping up speed over time. He can steer his charge slightly with the mouse cursor location. When he collides with an enemy he deals damage and knocks them up based on the distance he has charged."]],"zh":[["光榮戰死","受到擊殺後，賽恩可以重新驅動自己的屍體一小段時間，但生命將會急速衰減。他的攻速會大幅增加，治療自身，並根據目標的最大生命造成額外傷害。"],["巨幅毀滅","賽恩蓄力並進行強力攻擊，在自己前方的區域砸下武器對敵軍造成傷害。如果蓄力夠久，被命中的敵軍將會被擊飛和暈眩。"],["魂魄熔爐","賽恩使用護盾保護自己，並且可以在3秒後重施技能，對周圍的敵軍造成魔法傷害。賽恩擊殺敵軍時可提升最大生命。"],["殺戮怒吼","賽恩發射一個短程衝擊波，對第一個命中的敵軍造成傷害與緩速，並減少其物理防禦。如果衝擊波命中了士兵或是野怪，目標將會被擊退，而所有被賽恩擊退的目標打到的敵軍，將會被緩速、受到傷害及減少物理防禦。"],["猛烈狂擊","賽恩朝任一方向衝刺，隨時間加速，可以稍微轉向。衝撞到敵軍時會造成傷害，並且根據衝刺距離來擊飛目標。"]],"n":[["0",""],["9/8/7/6",""],["14/13/12/11",""],["11/10/9/8",""],["90/70/50",""]]},"10126":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/eb1adbdc116bb9eb9ca089219aafc43ea6af0726-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/fa98600b9fb687b3eda3643ebb0e61dd1bb1d43a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6f9b9d97a51c8ed732056e3244826652da55703f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f8f19abf5115d2913230cc4d5a2063dfa995b0d8-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/abb38b0db16286903e4b12742d95e6698339c93d-96x96.jpg"],"ko":[["굶주린 새떼","스웨인이 까마귀로 영혼 조각을 수집해, 주문력에 비례하여 체력을 회복하고 영구적으로 최대 체력을 얻습니다."],["죽음의 손길","스웨인이 섬뜩한 힘을 지닌 번개를 여러 갈래 방출합니다. 적중당한 적이 죽으면 번개가 해당 유닛을 관통합니다. 적중한 번개의 수에 따라 피해량도 증가합니다."],["제국의 눈","스웨인이 악마의 눈을 소환해 적에게 피해를 입히고 둔화시킵니다. 챔피언이 적중당하면 모습이 드러나고 스웨인은 영혼 조각을 얻습니다."],["속박명령","스웨인이 전방으로 악마의 파동을 방출합니다. 파동은 다시 스웨인에게 돌아오며 부딪힌 적을 모두 속박합니다. 이후 속박한 챔피언을 모두 가까이 끌어당길 수 있습니다."],["악의 승천","스웨인이 악마로 변신하여 주변의 적 챔피언, 미니언, 중립 몬스터로부터 체력을 흡수하고 악의 불길을 잠금 해제합니다. 악의 불길은 지속시간 동안 여러 차례 사용할 수 있으며, 발동하면 영혼의 불길을 터뜨려 근처의 적을 둔화시킵니다. 이 형태는 스웨인이 적 챔피언에게서 체력을 흡수하는 한 무한히 지속됩니다."]],"en":[["Ravenous Flock","Swain's ravens collect Soul Fragments that heal him and permanently increase his maximum health and scaling with Ability Power."],["Death's Hand","Swain unleashes several bolts of eldritch power that pierce through enemies. Enemies hit take more damage for each bolt they are struck by."],["Vision of Empire","Swain opens a demon eye that deals damage and slows enemies. Champions hit are revealed and also grant Swain a Soul Fragment."],["Nevermove","Swain launches a wave of demonic power forward. It then returns to Swain and roots enemies it hits. Swain can then choose to pull all rooted champions closer."],["Demonic Ascension","Swain transforms into a demon and drains health from nearby enemy champions, minions, and neutral monsters. Swain can cast Demonflare to decimate multiple times and slow nearby enemies with a nova of soulfire. This form is indefinite as long as Swain drains enemy champions."]],"zh":[["群鴉盛宴","斯溫的渡鴉會蒐集靈魂碎片，為他提供治療效果，並永久提升他的最大生命，且增幅會隨魔攻增加。"],["靈魂拷問","斯溫釋放數發蘊含黑暗力量的閃電，擊殺敵方單位時將穿透敵軍。同一名敵軍可被多發閃電攻擊，且每發均會使目標受到的傷害提升。"],["真知魔眼","斯溫開啟惡魔之眼，對敵軍造成傷害及緩速效果。英雄被命中時將被揭露，且每擊中一名敵方英雄都會賦予斯溫一塊靈魂碎片。"],["影之爪","斯溫朝前方釋放蘊含惡魔之力的能量波，返回時定身被命中的敵軍。這時斯溫可選擇將所有被定身的英雄拉向自己。"],["魔君降生","斯溫化身為惡魔，並從鄰近敵方英雄、士兵和中立野怪身上汲取生命。斯溫可施放「魔燄」，對鄰近敵軍造成多次大量傷害和緩速效果。只要斯溫持續汲取敵方英雄的生命，此型態便可永久維持。"]],"n":[["0",""],["6/5/4/3",""],["21/20/19/18",""],["10",""],["75/65/55",""]]},"10127":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/54ba6a436e6d23a0ef69cb8f9d00e065e24eeb86-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b4a989e45a5f85a909bc78e98e1f64d5b4f8b166-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/68a59d272e7e267b9eb67bf38b4ce9a72b807199-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d399be64c3d6fe833038842e70f18bcfd16dfcc8-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ecdd57ea2714a6d37d60b36894d50796ccf4d07c-256x256.png"],"ko":[["마법공학 전문가","아군 포탑이나 하이머딩거가 설치한 포탑 주변에서 이동 속도가 증가합니다."],["H-28 G 진화형 포탑","하이머딩거가 관통 광선 공격이 추가된 속사포 포탑을 설치합니다. (하이머딩거의 포탑은 적 포탑에 절반의 피해만 줍니다.)"],["마법공학 초소형 로켓","하이머딩거가 마우스 커서 위치로 모이는 초소형 로켓들을 발사합니다."],["CH-2 전자폭풍 수류탄","하이머딩거가 목표 위치에 수류탄을 던져 적에게 피해를 입힙니다. 수류탄에 직격당한 적은 기절하며, 빗겨맞은 유닛은 느려집니다."],["업그레이드!!!","하이머딩거가 업그레이드를 개발하여, 다음 스킬의 효과가 증가합니다."]],"en":[["Hextech Affinity","Gain Move Speed while near allied towers and turrets deployed by Heimerdinger."],["H-28 G Evolution Turret","Heimerdinger lays down a rapid-fire cannon turret equipped with a secondary pass-through beam attack (turrets deal half damage to towers)."],["Hextech Micro-rockets","Heimerdinger fires long-range rockets that converge on his cursor."],["Ch-2 Electron Storm Grenade","Heimerdinger fires long-range rockets that converge on his cursor."],["Upgrade!!!","Heimerdinger invents an upgrade, causing his next spell to have increased effects."]],"zh":[["海克斯親合性","漢默丁格在友方防禦塔及炮臺附近時獲得額外跑速。"],["H-28 G進化砲臺","漢默丁格放置一個微型機槍炮臺攻擊敵人，配備了光束炮攻擊（炮臺對防禦塔造成的傷害減半）。"],["高科技微型火箭","漢默丁格朝游標的方向發射密集的長程火箭。"],["CH-2暴風手雷","漢默丁格向目標區域投擲暴風手雷，對敵方單位造成傷害，暈眩直接命中的目標，並緩速周圍單位。"],["升級！！！","漢默丁格升級了他的技能，使其下次施放時獲得強大的效果。"]],"n":[["0",""],["1/1/1/1",""],["10/9/8/7",""],["11",""],["80/70/60",""]]},"10128":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8f6773f770de4b73bb319ef6aba99080bed479f2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/63b8e93ffe5ce66cc11d03b7b97c8f2b44541b4d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d5e5bf17767be08f54f37ba64585c7721575617e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/208ed82bb7ef98fc51416bcf6dfa478961cc479e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/1b7bf6e1615eb09d9cb7494a8ed3101b6ff577ba-96x96.jpg"],"ko":[["검의 최후","탈론이 챔피언이나 대형 몬스터에게 스킬을 사용하면 최대 3회까지 중첩되는 상처가 남습니다. 상처가 3회 중첩된 챔피언에게 기본 공격을 가하면 출혈을 일으켜 일정 시간 동안 큰 피해를 입힙니다."],["녹서스식 외교","탈론이 대상 유닛을 찌릅니다. 근접 공격이 가능한 거리에서 사용하면 치명타가 적용됩니다. 근접 공격이 불가능한 거리에서 사용하면 대상에게 도약해서 찌릅니다. 이 스킬로 대상을 처치하면 체력을 약간 회복하고 재사용 대기시간을 일부 돌려받습니다."],["갈퀴손","탈론이 부메랑 단검을 여러 개 던져 명중하는 적에게 물리 피해를 줍니다. 단검이 다시 돌아올 때 맞은 적은 추가 피해를 입고 둔화됩니다."],["암살자의 길","탈론이 구조물이나 지형 위로 일정 거리를 도약해 넘습니다. 이 스킬 자체는 재사용 대기시간이 짧지만 한 번 넘은 지형은 상당 시간 동안 다시 넘을 수 없습니다."],["그림자 공격","탈론이 사방에 검을 던지면서 투명 상태가 되며 추가 이동 속도를 얻습니다. 투명 상태가 풀리면 검이 다시 탈론이 있는 곳으로 모여듭니다. 검이 움직일 때마다, 한 개 이상의 검에 맞은 적은 그림자 공격으로 물리 피해를 입습니다."]],"en":[["Blade's End","Talon's spells Wound champions and large monsters, stacking up to 3 times. When Talon attacks a champion with 3 stacks of Wound, they bleed for heavy damage over time."],["Noxian Diplomacy","Talon stabs the target unit. If they are within melee range, this attack deals critical damage. If they are outside melee range, Talon will leap at his target before stabbing them. Talon refunds some health and cooldown if this ability kills the target."],["Rake","Talon sends out a volley of daggers that then return back to him, dealing physical damage every time it passes through an enemy. The returning blades deal bonus damage and slow units hit."],["Assassin's Path","Talon vaults over any terrain or structure, up to a max distance. This ability has a low cooldown, but puts the used terrain on a long cooldown."],["Shadow Assault","Talon disperses a ring of blades and becomes Invisible while gaining additional Move Speed. When Talon emerges from Invisibility, the blades converge on his location. Each time the blades move, Shadow Assault deals physical damage to enemies hit by at least one blade."]],"zh":[["終焉殘刃","塔隆的技能會對命中的敵方英雄及大型野怪附加裂傷，最高累加3層。當塔隆攻擊堆滿3層裂傷的英雄時，他們會受到越來越嚴重的流血傷害。"],["諾城王道","塔隆刺擊目標。如果他們在近戰範圍內，會造成暴擊傷害。如果他們處於近戰範圍外，塔隆會躍擊目標，再刺殺他們。如果此技擊殺目標，會返還塔隆冷卻時間及回復部分生命。"],["迴力匕首","塔隆射出一波迴力匕首並收回，對經過敵軍造成物理傷害。收回的匕首會對擊中單位造成額外傷害並緩速。"],["刺客身法","塔隆在最大距離的限制內，可翻越任何地形或建物。這個技能的冷卻時間很短，但不能在短時間內翻越同個區域。"],["暗影突襲","塔隆散射出環狀刀刃，進入潛隱狀態，獲得額外跑速。當塔隆從潛隱中現身，刀刃會飛回他的所在位置。每當刀刃劃過時，暗影突襲會對敵人造成物理傷害，敵人至少會被一個刀刃擊中。"]],"n":[["0",""],["7/6/6/5",""],["8/7/7/6",""],["1/1/1/1",""],["65/55/45",""]]},"10129":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/44779c39dd2de75f7d7574bb0a9d562c60684045-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/48a81cec0b6ff6ad180ec53907b245d31c1e3504-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/b9eaa4db859b94bc5cadec17cea252e545dc304e-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c9028236ab551ec1553cfd1293a309e5bf758c98-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/7d1fbc9407f2529f12d0c0a3a8d3aaf6cf4773dd-128x128.png"],"ko":[["유기물 분해","벨코즈가 스킬을 적중시키면 대상에게 유기물 분해 중첩이 쌓입니다. 3회 중첩 시 대상은 큰 고정 피해를 입습니다."],["플라즈마 분열","벨코즈가 플라즈마 광선을 발사하고 나서 스킬을 재사용하거나 적에게 맞으면 광선이 둘로 갈라집니다. 이 광선은 적중 시 둔화를 적용하고 피해를 입힙니다."],["공허 균열","벨코즈가 공허로 통하는 균열을 열어 최초 피해를 입힌 다음, 잠시 시간이 지난 후 두 번째 폭발로 피해를 가합니다.\\n"],["지각 붕괴","벨코즈가 대상 위치에 폭발하는 이상 현상을 생성해 적을 공중에 띄우고 가까이 있는 적은 약간 뒤로 밀어냅니다. 이상 현상이 벨코즈와 가까울수록 더 멀리 밀어냅니다.\\n"],["생물 분해 광선","기본 지속 효과: 분해가 3회 중첩된 적 챔피언을 7초 동안 연구 완료 상태로 표시합니다.\\n사용 시: 벨코즈가 정신을 집중하고 지정한 방향으로 조종할 수 있는 광선을 발사해 적중한 적에게 마법 피해를 입히고 둔화시킵니다. 연구 완료 상태인 적 챔피언은 마법 피해 대신 고정 피해를 입습니다."]],"en":[["Organic Deconstruction","Vel'Koz's abilities apply Organic Deconstruction to enemies on hit. If 3 stacks are accumulated, the enemy will take a burst of true damage."],["Plasma Fission","Vel'Koz shoots a bolt of plasma that splits in two on reactivation or upon hitting an enemy. The bolt slows and damages on hit."],["Void Rift","Vel'Koz opens a rift to the void that deals an initial burst of damage, then explodes for a second burst of damage after a delay."],["Tectonic Disruption","Vel'Koz causes an explosive anomaly at target location, knocking up enemies and knocking close enemies slightly away. The closer the anomaly is to Vel’Koz the stronger the knockback effect."],["Life Form Disintegration Ray","Passive: Apply 3 Deconstruction stacks to an enemy champion marking them as Researched for 7 seconds. Active: Vel'Koz unleashes a channelled beam that he can steer in a target direction to deal magic damage and slow enemies hit. Researched enemy champions take true damage instead."]],"n":[["0",""],["7/7/7/7",""],["1/1/1/1",""],["13/12/11/10",""],["80/70/60",""]]},"10130":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7ef2abddfecb6e4da55a4b514a84661a63a9c4b4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/53df783e03f30f74bf28e4910acbdb29af507ab7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/795afe86761e5d232d2bfb957d41bc0b7670a90d-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4328042c9e525904d9edca591cc96a21fd5ee7f9-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/c3b8968a42859fdecfa4742fb5511648d09083b2-96x96.jpg"],"ko":[["지옥살이","쓰레쉬는 근처에서 처치된 적의 영혼을 포획해 방어력과 주문력을 영구적으로 올릴 수 있습니다."],["사형 선고","쓰레쉬가 쇠사슬로 적을 묶어 자신 쪽으로 당겨옵니다. 스킬을 다시 사용하면 쓰레쉬가 적 쪽으로 당겨집니다."],["어둠의 통로","쓰레쉬가 지정한 위치에 랜턴을 던집니다. 아군이 랜턴을 클릭하면 쓰레쉬가 아군을 자기 쪽으로 끌어당깁니다."],["사슬 채찍","쓰레쉬가 공격하기 위한 힘을 모아, 다음 공격까지 대기시간이 길수록 더 큰 피해를 가합니다. 활성화하면 쇠사슬을 휘둘러 맞은 적들을 휘두른 방향으로 밀어냅니다."],["영혼 감옥","벽으로 된 감옥이 부서지면 둔화를 일으키며 피해를 입힙니다."]],"en":[["Damnation","Thresh can harvest the souls of enemies that die near him, permanently granting him Armor and Ability Power."],["Death Sentence","Thresh binds an enemy in chains and pulls them toward him. Activating this ability a second time pulls Thresh to the enemy."],["Dark Passage","Throws a Lantern to a target location. If an ally collects it Thresh will pull the ally to him."],["Flay","Thresh's attacks wind up, dealing more damage the longer he waits between attacks. When activated, Thresh sweeps his chain, knocking all enemies hit in the direction of the blow."],["The Box","A prison of walls that slow and deal damage if broken."]],"zh":[["靈魂饗宴","瑟雷西可以採集周圍陣亡敵軍的靈魂，永久增加物理防禦和魔法攻擊。"],["死亡宣告","瑟雷西用鎖鏈綁縛一名敵軍，並將其拖向自己。重施技能可以讓瑟雷西飛向目標。"],["鬼影燈籠","向目標區域投擲燈籠，若有友軍拾起燈籠，瑟雷西會將其拉向自己。"],["懾魂掃蕩","瑟雷西越久沒發動攻擊，造成的傷害就越高。施放技能時，瑟雷西拋出鎖鏈，依揮舞方向將敵軍拉近或擊退。"],["惡靈領域","在周圍豎立起圍牆牢籠，對衝破牆壁的敵人造成傷害與緩速。"]],"n":[["0",""],["18/15/12/9",""],["21/19/17/15",""],["12/11/10/9",""],["85/80/75",""]]},"10131":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/28a4e239c4de34c4773d6bdee6c16ea26bcf6b47-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7e73fada4059a4654ec2a3e7b077f532011d216b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/5fcbde3a0ae9cc88362cba2e51260801858296e4-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4b8605b3cc0524b3fc44d7d50961aaadec78d1e7-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/7b5e3608177a4a811ef6bcbe9d409e03cb0621c3-96x96.jpg"],"ko":[["끝없는 허기","워윅이 기본 공격 시 추가 마법 피해를 입힙니다. 워윅의 체력이 50% 아래로 내려가면 추가 피해량만큼 체력을 회복합니다."],["야수의 송곳니","워윅이 앞으로 도약해 대상을 물고 대상 최대 체력에 비례한 피해를 입힙니다. 이때 워윅은 입힌 피해량만큼 체력을 회복합니다."],["피의 사냥","체력이 50% 미만인 적을 감지합니다. 이 대상에게 이동할 때는 워윅의 이동 속도가 증가하고 대상에 대한 공격 속도도 증가합니다. 적의 체력이 20% 아래로 내려가면 워윅이 광분하며 추가 효과가 세 배로 증가합니다."],["원시의 포효","2.5초 동안 워윅이 입는 피해가 감소합니다. 지속시간이 종료되거나 스킬을 재사용하면 워윅이 포효하며 근처의 모든 적을 1초 동안 도망치게 합니다."],["무한의 구속","워윅이 지정한 방향으로 도약해 (도약 거리는 추가 이동 속도에 비례) 첫 번째로 부딪힌 챔피언을 1.5초 동안 제압합니다."]],"en":[["Eternal Hunger","Warwick's basic attacks deal bonus magic damage. If Warwick is below 50% health, he heals for the same amount."],["Jaws of the Beast","Warwick lunges forward and bites his target, dealing damage based on their maximum health and healing for damage dealt."],["Bloodhunt","Warwick senses enemies below 50% health, gaining Move Speed toward and Attack Speed against them. When they fall below 20% health, he frenzies and these bonuses triple."],["Primal Howl","Warwick gains damage reduction for 2.5 seconds. At the end, or if re-activated, he howls, causing nearby enemies to flee for 1 second."],["Infinite Duress","Warwick leaps in a direction (scaling with his bonus Move Speed), suppressing the first champion he collides with for 1.5 seconds."]],"zh":[["永恆飢渴","沃維克的普攻會造成額外魔法傷害；如果沃維克的生命低於50%，還會治療自身相當於額外傷害量的生命。"],["猛獸狂顎","沃維克向前撲擊撕咬目標，根據目標最大生命造成傷害並回復等量生命。"],["血跡獵蹤","沃維克會察覺生命低於50%的敵軍，朝他們移動時增加跑速，且攻擊目標時增加攻速。當敵軍的生命低於20%，沃維克會進入狂暴狀態，這些增益效果增為三倍。"],["本能怒嚎","沃維克在2.5秒內受到的傷害降低。持續時間結束或是重施技能時，他會嚎叫，使鄰近敵軍奔逃1秒。"],["無盡束縛","沃維克撲向目標方向（飛撲距離隨額外跑速增加），壓制他撞上的第一位英雄1.5秒。"]],"n":[["0",""],["6/6/6/6",""],["70/60/50/40",""],["14/13/12/11",""],["100/90/80",""]]},"10132":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4d69aeeb436d31c6afed6fd0c1988fa7c93c7465-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/81bdea7f8da620d3329b7c69bdbc6f11151f7ef2-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9e083e98b9fbe48a27de0bcc28c3b06c72931577-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/62b883022dde80b7e7444fef3373e65d67f70836-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5e9575b001d05ea1d2aab5b80caeb1bd40fef637-96x96.jpg"],"ko":[["강력한 일격","노틸러스가 대상에 대한 첫 기본 공격 시 추가 물리 피해를 입히고 잠시 속박합니다."],["닻줄 견인","노틸러스가 전방으로 닻을 던집니다. 닻이 적을 맞히면 노틸러스와 대상이 가까이 당겨지며 대상에게 마법 피해를 입힙니다. 닻이 지형을 맞히면 노틸러스가 지형 쪽으로 끌려갑니다."],["타이탄의 분노","노틸러스가 잠시 보호막을 얻습니다. 보호막이 지속되는 동안 노틸러스의 기본 공격은 대상과 대상 주위의 적에게 지속 피해를 입힙니다."],["역조","노틸러스가 주위에 세 번의 폭발을 일으킵니다. 폭발할 때마다 적에게 피해를 입히고 둔화시킵니다."],["폭뢰","지면에 충격파를 발사하면 상대방을 추적해 갑니다. 충격파는 위의 지면을 찢으며 적들을 공중으로 띄웁니다. 충격파가 상대방에게 닿으면 폭발하여 대상을 공중으로 띄우고 기절시킵니다."]],"en":[["Staggering Blow","Nautilus' first Attack against a target deals increased physical damage and roots them briefly."],["Dredge Line","Nautilus hurls his anchor forward. Colliding with an enemy pulls them and Nautilus together, dealing magic damage. Colliding with terrain pulls Nautilus towards it."],["Titan's Wrath","Nautilus gains a temporary Shield. While it persists, his Attacks deal damage over time to his target and surrounding enemies."],["Riptide","Nautilus creates three exploding waves around himself. Each explosion damages and slows enemies."],["Depth Charge","Nautilus fires a shockwave into the earth that chases an opponent. This shockwave rips up the earth above it, knocking enemies into the air. When it reaches the opponent, the shockwave erupts, knocking his target into the air and stunning them."]],"zh":[["沉重打擊","納帝魯斯對目標造成的第一次普攻會造成額外物理傷害，並短暫定身目標。"],["深淵鐵錨","納帝魯斯把手中的錨向前擲出，若擊中敵軍，會將其與納帝魯斯拉向彼此，並造成魔法傷害。如果錨擊中地形物，納帝魯斯會把自己拉向該地形物。"],["巨人之怒","納帝魯斯獲得一個可短暫吸收傷害的護盾。在此期間，他的普攻會對目標及鄰近敵軍造成持續傷害。"],["鋼鐵怒濤","納帝魯斯在身邊製造三道爆炸的湧浪，每道爆炸的湧浪都會造成傷害並使敵軍緩速。"],["潛航衝擊","納帝魯斯朝地下發出一道衝擊波追擊敵方目標。此衝擊波會撕裂地面，並將路徑上的敵軍擊飛至空中。抵達目標時，衝擊波會爆發，將目標擊飛至空中並暈眩之。"]],"n":[["0",""],["12/11/10/9",""],["11",""],["6/6/5/5",""],["70/60/50",""]]},"10133":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/6dac9830dd7bf34eb5bc4e84be5a797b87cd1358-512x512.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1dc7ce0dead322408e8f8845ff1063620f1f6b5f-512x512.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/573a40d34b9cc23b8d30b2479f6d7503addb7e00-512x512.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/ea791ca077627e148df36589c627501b7609503a-512x512.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f9abcf2ad25eb471295e8dadd2f13554443b5272-512x512.jpg"],"ko":[["무해한 허수아비","챔피언 처치에 관여하면 피들스틱이 움직이는 허수아비를 남깁니다. 허수아비는 가장 가까운 적 챔피언을 추적하며, 처치되거나 몇 초가 지나면 폭발하여 공포를 적용합니다."],["공포","기본 지속 효과: 피들스틱이 전투에서 벗어나 한동안 적의 시야에 보이지 않을 때나, 잠시 가만히 서 있을 때 다음에 사용하는 스킬이 대상을 공포에 빠뜨립니다. 피들스틱이 대상에게 까마귀를 날려 마법 피해를 입히고 공포를 적용합니다. 최근 공포에 빠졌던 대상은 추가 피해를 받습니다."],["풍작","피들스틱이 주변 적의 체력을 흡수합니다. 지속시간이 끝날 때 대상의 잃은 체력에 비례하는 피해를 추가로 입힙니다. 피들스틱은 정신을 집중하는 동안 둔화되며, 다른 스킬을 사용할 수 없습니다."],["수확","피들스틱이 넓은 범위를 낫으로 베어 적중한 모든 적을 둔화시키고 가운데에 있는 적을 침묵시킵니다."],["까마귀 폭풍","피들스틱 주변을 까마귀 떼가 헤집고 다니며 매초 해당 지역에 있는 모든 적 유닛에게 피해를 입힙니다."]],"en":[["A Harmless Scarecrow","When participating in a takedown Fiddlesticks leaves behind a movable scarecrow. The scarecrow will move toward the nearest enemy champion and explode when killed or after several seconds, causing fear."],["Terrify","Passive: When Fiddlesticks is out of combat for a longer time period and is invisible to enemy units, or has been stationary for a short period, its next skill will fear the target. Fiddlesticks launches a raven at a target, dealing magic damage and fear. The raven deals bonus damage if the unit has been terrified recently."],["Bountiful Harvest","Fiddlesticks drains health from nearby enemies, dealing bonus execute damage at the end of the duration. During channeling, Fiddlestick is slowed and cannot cast any other abilities."],["Reap","Fiddlesticks slashes an area with its scythe, slowing all enemies hit and silencing enemies hit in the center of the slash."],["Crowstorm","A murder of crows flock wildly around Fiddlesticks, dealing damage per second to all enemy units in the area."]],"zh":[["無害稻草人","費德提克參與擊殺後，會留下一個可移動的稻草人。稻草人會朝最近的敵方英雄移動，並在被擊殺或數秒後爆炸，施加恐懼效果。"],["恐懼","被動：費德提克若長時間脫離戰鬥且未被敵軍看見，或是短時間靜止不動，下次施放技能會使目標陷入恐懼。 費德提克朝目標放出一隻烏鴉，造成魔法傷害及恐懼效果。若目標最近曾受恐懼侵襲，烏鴉將造成額外傷害。"],["豐收之魘","費德提克從鄰近敵軍身上汲取生命，在持續時間的最後會造成額外斬殺傷害。詠唱期間費德提克會減速，且無法施放其他技能。"],["駭懼收割","費德提克用它的鐮刀切割一塊區域。對所有命中敵人造成緩速並使中心命中的敵人沉默。"],["群鴉風暴","一群烏鴉聚集到費德提克身邊，對範圍內敵人每秒造成傷害。"]],"n":[["0",""],["13/13/12/12",""],["11/10/9/8",""],["9/8/7/6",""],["100/80/60",""]]},"10134":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/f1701e112fb52ef14291bd6eb55af578e0179a05-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3aa0e888fa1ca9712f4a4337bab6d91a2f6092f7-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/e5e63eb7386094d56b12def46cd8a2952edbc2b2-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/617efb12640afbb3db27a1e67bfa05379a589c49-256x256.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/daee36366c2a407d053908c0984082406aa509dd-256x256.jpg"],"ko":[["전투 태세","칼리스타가 기본 공격이나 꿰뚫는 창의 준비 동작을 하는 동안 이동 명령을 하면, 칼리스타가 기본 공격과 함께 해당 위치로 도약합니다."],["꿰뚫는 창","칼리스타가 빠르게 날아가는 창을 던집니다. 적이 처치될 경우 관통해 날아갑니다."],["감시하는 혼","칼리스타와 계약을 맺은 아군이 같은 대상을 공격하면 추가 피해를 입힙니다. 사용 시 혼이 일정한 경로를 순찰하며 자기 앞의 지역을 드러냅니다."],["뽑아 찢기","공격 시 대상을 창으로 꿰뚫습니다. 재시전하면 대상에 박힌 창을 뜯어내서 둔화시키며, 주는 피해량이 증가합니다."],["운명의 부름","칼리스타가 계약을 맺은 아군을 자신에게로 순간 이동시킵니다. 계약자는 지정한 위치로 돌진하여 적 챔피언을 뒤로 밀어내는 스킬을 사용할 수 있습니다."]],"en":[["Martial Poise","Enter a movement command while winding up Kalista's basic attack or Pierce to lunge a short distance when she launches her attack."],["Pierce","Throw a fast moving spear that passes through enemies it kills."],["Sentinel","Gain bonus damage when Kalista and her Oathsworn strike the same target. Activate to send a soul to scout out the path, revealing the area in front of it."],["Rend","Attacks impale their targets with spears. Activate to rip the spears out, slowing and dealing escalating damage."],["Fate's Call","Kalista teleports the Oathsworn ally to herself. They gain the ability to dash toward a position, knocking enemy champions back."]],"zh":[["好戰突進","當克黎思妲在使用赦罪穿刺或進行普攻的途中獲得移動指令，她往該方向衝刺。"],["赦罪穿刺","拋出一個快速移動的飛矢並射穿它殺死的敵軍。"],["憎靈守衛","克黎思妲和她的血誓同盟攻擊相同目標時造成額外傷害。啟動來派出亡魂守衛偵察指定路徑，並獲得鬼魂前方的視野。"],["痛苦撕扯","克黎思妲的長矛將會貫穿目標並停留在該處，發動技能將長矛扯出，造成緩速與逐漸增加的傷害。"],["命運呼喚","克黎思妲將血誓同盟的友軍傳送到自己身邊。他們可以衝到指定地點並且擊退敵方英雄。"]],"n":[["0",""],["8/7/7/6",""],["20/20/20/20",""],["10/9/8/7",""],["60/55/50",""]]},"10135":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/bd7244df76f95238f9f6ec781e1fbf249c9dd43b-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/f3a762746fec467b0ebaa7c9bf2a7f57d84812dd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/60be50808fa385ca3663c3a4ce47e87d62075fa6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/2ae87e42678bac86eec9856613156e5041a69e44-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/93cc161152c99c252c5486b7585c2e89c173c40e-96x96.jpg"],"ko":[["꿈나무 지팡이","챔피언 또는 몬스터에게 스킬이 적중하면 지속시간 동안 최대 체력에 비례한 피해를 추가로 입힙니다."],["뾰로롱 강타","기본 지속 효과로 스킬이 적에게 적중하면 릴리아의 이동 속도가 중첩되어 증가합니다. 사용 시 근처 적에게 마법 피해를 입히고 가장자리에 있는 적에게 추가 고정 피해를 입힙니다."],["이익! 쿵!","릴리아가 근처 적에게 피해를 입힙니다. 중심에 있는 적에게는 더 큰 피해를 입힙니다."],["데굴데굴 씨앗","릴리아가 씨앗을 던져 적중한 적에게 피해를 입히고 둔화시킵니다. 씨앗은 벽 또는 대상에 부딪힐 때까지 굴러갑니다."],["감미로운 자장가","릴리아가 꿈가루가 묻은 적을 전부 졸음 상태에 빠뜨린 뒤 잠들게 합니다. 피해를 입어 깨어난 적은 추가 피해를 입습니다."]],"en":[["Dream-laden Bough","Hitting a champion or monster with a skill will deal additional max Health damage over time."],["Blooming Blows","Passively, Lillia gains stacking Move Speed when hitting enemies with spells. She can activate this to deal magic damage to nearby enemies, dealing extra true damage on the edge."],["Watch Out! Eep!","Lillia deals damage in a nearby area, dealing heavy damage in the center."],["Swirlseed","Lillia hurls a seed that damages and slows those it lands on. If it doesn't hit anything, it will continue rolling until it hits a wall or target."],["Lilting Lullaby","Lillia causes all enemies with Dream Dust on them to become Drowsy before falling asleep. Those enemies will take extra damage on being forcibly woken up."]],"zh":[["夢沉枝枒","以技能命中英雄或野怪時，將在一段時間內對他們造成一部分最大生命的額外傷害。"],["盛綻之舞","莉莉亞用技能命中敵軍時，會獲得可以累加的跑速。她也可以主動開啟這個技能，對鄰近敵軍造成魔法傷害，對外圈的敵軍造成額外真實傷害。"],["拽柯之擊","莉莉亞對附近區域造成傷害，對該區域正中心的敵軍造成大量傷害。"],["飛旋種籽","莉莉亞擲出一顆種籽，對命中的敵軍造成傷害與緩速。如果種籽錯失目標，它將持續滾動，直至觸及牆體或是目標。"],["柔沉夢謠","莉莉亞使所有附有夢境之塵的敵軍變得疲倦，接著陷入沉睡。這些敵軍會被攻擊驚醒，並受到額外傷害。"]],"n":[["0",""],["5/5/4/4",""],["14/13/12/11",""],["15",""],["100/85/70",""]]},"10136":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/732f4bb6fee38e4fc2997555c291b4d48a540dcd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/f04d0dd7cd2a3c3e0891dcfda3e69025719e6947-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/b30d82913017fa89e1981a4e636952eedc09ba3e-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b85691454f99e873273a76d9835fc55de13210de-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/be54ec007415ee6a2524d75f8e587eb9606b1df5-96x96.jpg"],"ko":[["간이 대장간","오른이 추가 방어력과 마법 저항력을 얻습니다. 오른은 어디에서든 골드를 써서 소모품을 제외한 아이템을 제작할 수 있습니다. 또한 오른이 일정 레벨에 도달했을 때 아이템을 제작하면 가까이 있는 아군에게 맵 어디에서든 아이템 하나를 구매할 수 있는 능력을 부여합니다. 이 능력은 일정 레벨마다 발동됩니다."],["용암 균열","오른이 지면을 내려쳐 적에게 물리 피해를 입히고 둔화시키는 균열을 만들어냅니다. 잠시 후 목표 지점에 용암 기둥이 생성됩니다."],["불꽃 풀무질","오른이 전진하며 불꽃을 뿜습니다. 마지막 불꽃에 맞은 적은 불안정 상태가 됩니다."],["화염 돌진","오른이 돌진하며 통과한 적에게 피해를 입힙니다. 오른이 돌진 중 지형지물에 충돌하면, 그 충돌로 인해 충격파가 발생해 적에게 피해를 입히고 공중으로 띄웁니다."],["대장장이 신의 부름","오른이 목표 위치에 거대한 불의 정령을 소환합니다. 불의 정령은 오른에게로 다가오며 점점 이동 속도가 빨라집니다. 정령이 밟고 지나간 적은 피해를 입고 둔화되며 불안정 상태가 됩니다. 오른이 대장장이 신의 부름을 재시전하면 정령 쪽으로 돌진합니다. 오른이 돌진해 정령에 부딪히면 정령의 진행 방향이 바뀝니다. 진행 방향이 바뀐 정령은 부딪힌 모든 적을 공중으로 띄우며 전과 동일한 피해를 입히고 다시 불안정 상태로 만듭니다."]],"en":[["Living Forge","Ornn gains additional bonus Armor and Magic Resistance from all sources. Ornn can spend gold to forge non-consumable items anywhere. Additionally, when Ornn reaches a certain level, forging items will grant a nearby ally the ability to buy one item from anywhere on the map. This will trigger every few levels."],["Volcanic Rupture","Ornn slams the ground, sending out a fissure dealing damage and slowing enemies hit. After a small delay, a magma pillar forms at the end location."],["Bellows Breath","Ornn advances, breathing fire. Enemies hit by the final gout of flame become Brittle."],["Searing Charge","Ornn charges, dealing damage to enemies he passes through. If Ornn collides with terrain while charging, the impact creates a shockwave around him which deals damage and knocks up enemies."],["Call of the Forge God","Ornn summons a massive elemental at a location which travels toward him with increasing speed. Enemies run over by the elemental take damage, are slowed and are made Brittle. Ornn can recast the ability to charge into the elemental, redirecting it in the direction he hits it, causing the elemental to affect any enemies it runs over to be knocked up, dealing the same damage and re-applying Brittle."]],"zh":[["活火爐","鄂爾從所有來源獲得的物理與魔法防禦都會進一步提升。鄂爾可在地圖任一處花費金幣打造非消耗性道具；另外，鄂爾達到特定等級後，打造道具時可以讓一名附近友軍能夠在地圖任一處購買一項道具，此效果每升幾個等級就會觸發一次。"],["火山脈動","鄂爾重擊地面，敲出一道裂隙對敵人造成物理傷害與緩速。短暫延遲後，裂隙尾端會隆起一根岩漿柱。"],["熾焰吹息","鄂爾向前衝刺並吐出火焰。被最後一波炎風命中的敵人會被焦化。"],["熔岩俯衝","鄂爾向前衝刺，對經過敵人造成傷害。如果鄂爾在途中撞到地形物，會在身周產生衝擊波，對敵人造成傷害與擊飛。"],["鑄火者的呼喚","鄂爾召喚一隻巨大的火元素衝向自己，越跑越快速。被火元素撞到的敵人會受到傷害且被緩速及焦化。鄂爾可以重施技能往前撞向火元素，令其轉向撞擊的方向。轉向的火元素會擊飛所有被擊中的敵人，造成跟之前一樣的傷害並再次附加焦化效果。"]],"n":[["0",""],["9/8/8/7",""],["11/11/10/10",""],["13/12/11/10",""],["90/80/70",""]]},"10137":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dcaae946c2ff618d130d45a9868324532ee7aef6-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0ff76e7e489a84e8f7a983c2a091242d91dfdbc7-521x521.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8c4409b084422321d7b7828cab5838ea0a802efa-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6042e5eea881985c2d357ab542db540a5e66e357-800x800.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1cb06298227eb4dd2a9dd8c64588ac664ca0badf-800x800.png"],"ko":[["비전 연마","라이즈의 스킬이 추가 마나에 따라 추가 피해를 입히고, 최대 마나가 주문력에 비례해 증가합니다."],["과부하","기본 지속 효과로 라이즈가 다른 기본 스킬을 사용하면 과부하의 재사용 대기시간이 초기화되고 룬 하나를 충전합니다. 룬이 2개 충전된 상태에서 과부하를 사용하면 이동 속도가 잠시 대폭 증가합니다. 사용 시 라이즈가 순수한 에너지를 일직선으로 발사해 첫 번째 맞는 적에게 피해를 입힙니다. 대상에게 전이 표식이 있으면 과부하가 추가 피해를 입히고 전이 표식이 있는 주변 적에게 튕깁니다."],["룬 감옥","라이즈가 대상을 룬 감옥에 가두고 피해를 입히며 이동 속도를 늦춥니다. 대상에게 전이 표식이 있으면 이동 속도를 늦추는 대신 속박합니다."],["주문 전이","라이즈가 순수한 마법의 구체를 던져 적에게 피해를 입히고 주변 모든 적에게 표식을 남깁니다. 표식이 남은 적에게 라이즈가 스킬을 사용하면 추가 효과가 적용됩니다."],["공간 왜곡","기본 지속 효과로 과부하가 전이 표식이 있는 적에게 더 큰 피해를 입힙니다. 사용 시 라이즈가 근처에 차원문을 생성합니다. 몇 초 후, 차원문 주변의 모든 아군이 대상 지점으로 순간이동합니다."]],"en":[["Arcane Mastery","Ryze's spells deal extra damage based on his Bonus Mana, and he gains a percentage increase to his maximum Mana based on his Ability Power."],["Overload","Passively, Ryze's other basic abilities reset the cooldown of Overload and charge a rune. When Ryze casts Overload with 2 runes charged, he gains a brief burst of Move Speed. On cast, Ryze throws a charge of pure energy in a line, dealing damage to the first enemy struck. If the target has Flux on it, Overload deals extra damage and bounces to nearby enemies with Flux."],["Rune Prison","Ryze traps a target in a cage of runes, damaging them and slowing their movement. If the target has Flux on it, they are instead rooted."],["Spell Flux","Ryze releases an orb of pure magical power that damages an enemy and debuffs all nearby enemies. Ryze's spells have additional effects against the debuffed enemy."],["Realm Warp","Passively, Overload deals even more damage against targets with Flux. On cast, Ryze creates a portal to a nearby location. After a few seconds, allies standing near the portal are teleported to the target location."]],"zh":[["奧術專精","雷茲的技能會根據自身的額外魔力對敵方造成額外傷害，且他的魔攻會提升一定百分比的最大魔力。"],["超負荷","雷茲的其他基礎技能會被動重置「超負荷」的冷卻時間並充能1層符文。雷茲在有2層符文的狀態下施放「超負荷」時，會獲得短暫的爆發性跑速加成。施放時，雷茲朝一直線丟擲一團純淨的能量體，對首位擊中的敵軍造成傷害。若目標身上有「法術湧動」效果，則「超負荷」會造成額外傷害，並跳到有「法術湧動」的鄰近敵軍身上。"],["符文禁錮","雷茲使用符文禁錮目標，傷害並緩速對方。如果目標身上帶有「法術湧動」效果，則緩速效果會改為定身效果。"],["法術湧動","雷茲釋放一顆精純魔法能量匯聚的光球，傷害一名敵軍，並對所有鄰近敵軍造成減益效果。雷茲的技能對受減益影響的敵軍有額外附加效果。"],["扭轉之境","「超負荷」的被動效果會對帶有「法術湧動」的目標造成更大的傷害。施放時，雷茲會在附近創造傳送門。幾秒之後，所有站在傳送門附近的友軍將會瞬間傳送到目標位置。"]],"n":[["0",""],["5/5/5/5",""],["10/9/8/7",""],["3/3/2/2",""],["110/95/80",""]]},"10138":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/bd99a83f831ff02bb0a43ad9a548aaa921342cdc-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/99582dd343b2833485c2b9fab1fda6aab6d2c0a6-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/50cba9719ad8cf7d30d5e56f8593fdf3e6f237db-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/9a4d780c2faa097cad4b3f6779655390df9b3d44-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/883c0867e6183e90565b1b8e251843b390981ddb-512x512.png"],"ko":[["용 훈련","챔피언에게 스킬을 맞히거나 초강력 화염 숨결로 적을 처치하면 용 훈련 중첩을 1회 얻습니다. 중첩 횟수에 따라 기본 스킬의 피해량이 증가합니다."],["초강력 화염 숨결","스몰더가 불꽃을 내뿜어 적에게 물리 및 마법 피해를 입힙니다. 대상이 사망하면 마나를 돌려받습니다. 이 스킬은 용 훈련 중첩 수에 비례해 위력이 증가합니다. 기본 지속 효과: 1단계에서는 대상 주변의 모든 적에게 피해를 입힙니다. 2단계에서는 대상 너머로 폭발을 일으킵니다. 3단계에서는 대상을 불태워 고정 피해를 입히고 체력이 낮은 적 챔피언을 처형합니다."],["에취!","스몰더가 적 챔피언을 맞히면 폭발하는 앙증맞은 불꽃 재채기를 내뿜습니다. 추가로 발생하는 폭발은 감소한 피해를 입힙니다. 기본 지속 효과: 폭발이 마법 피해를 추가로 입힙니다."],["펄럭펄럭","스몰더가 지형을 무시하고 날며 주변에서 체력이 가장 낮은 적을 폭격합니다. 비행 중에는 시야가 확장됩니다. 기본 지속 효과: 폭격 횟수가 증가하고 각 폭격이 마법 피해를 추가로 입힙니다."],["엄마아아아!","스몰더의 부름에 어미가 나타나 위에서 불을 내뿜습니다. 범위의 중심에 있는 적은 추가 피해를 받고 둔화됩니다. 스몰더가 불길에 맞으면 체력을 회복합니다."]],"en":[["Dragon Practice","Hitting champions with abilities and killing enemies with Super Scorcher Breath grants a stack of Dragon Practice. Stacks increase the damage of Smolder’s basic abilities."],["Super Scorcher Breath","Smolder breathes fire on an enemy, dealing both physical and magic damage. If the target is killed Smolder refunds mana. As he gains more stacks, this ability becomes more powerful. Passive: Level 1 stacks–ability deals damage to all enemies in the area. Level 2 stacks–ability triggers explosions behind the target. Level 3 stacks–abilitiy burns target for true damage, executing low-health enemy champions."],["Achooo!","Smolder lets out an adorable flaming sneeze that explodes when hitting enemy champions. Subsequent explosions deal smaller amounts of damage. Passive: the explosion deals bonus magic damage."],["Flap, Flap, Flap","Smolder takes flight ignoring terrain and bombarding the lowest health enemy. In flight Smolder’s vision range is increased. Passive: deal bonus magic damage for each hit and gain extra bolts."],["Mmooommmm!","Smolder calls his mom to breathe fire from above, dealing extra damage and slowing enemies in the center of her fire. Getting hit by the fire himself, Smolder gains health."]],"zh":[["龍性精通","施展技能命中英雄，或是施展「激灼龍息」擊殺敵軍後，會獲得一層「龍性精通」。堆層會提升史矛德的基礎技能傷害。"],["激灼龍息","史矛德對敵軍吐出龍焰，造成物理與魔法傷害。若目標死亡，史矛德獲得返還的魔力。堆層越高，此技能越強大。被動：堆層數達等級1：技能對區域內的所有敵軍造成傷害堆層數達等級2：技能在目標後方引發爆炸堆層數達等級3：技能會燃燒目標，造成真實傷害；處決低生命的敵方英雄。"],["悶燃黏嚏","史矛德可愛地打噴嚏，命中敵方英雄時會爆炸。後續爆炸的殺傷力較小。被動：爆炸造成額外魔法傷害。"],["振翼高飛","史矛德高高飛起，無視地形移動，並對生命最低的敵軍進行轟炸。飛行過程中，史矛德的視野擴大。 被動：每次命中造成額外魔法傷害，並發射更多火焰彈。"],["媽媽幫我！","史矛德呼喚母親，她在空中噴出烈焰吐息，烈焰路徑中央的敵軍會受到額外傷害與緩速。史矛德被母親的烈焰擊中時會回復生命。"]],"n":[["0",""],["5/5/4/4",""],["12/11/10/9",""],["18/16/14/12",""],["80/70/60",""]]},"10139":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/ea168c49ff42cb1cc514f4666df5212b30625641-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/1b93ac9d9e73577ddb3b221d346c3bc0a7bd07ad-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/cf9c585b9f02ef016c5f1f184b1b7ac812a6210e-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/d5eaece2463903b32e31f94921ca466277d4c838-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c126dc1035c002e003877699d961f790c65ba6a3-512x512.png"],"ko":[["이글거리는 광휘","멜이 스킬을 사용할 때마다 다음 기본 공격 시 투사체가 3개 추가됩니다. (최대 9개) 스킬 또는 기본 공격으로 피해를 입히면 대상에게 무한히 중첩할 수 있는 압도 효과를 적용합니다. 압도 피해가 충분히 쌓인 적에게 멜이 공격을 맞히면 중첩을 소모하여 대상을 처형합니다."],["빛의 세례","멜이 대상 지점 주위에 폭발하는 투사체를 퍼부어 해당 지역 안에 있는 적에게 반복해서 피해를 입힙니다."],["반박","멜이 자신을 방어막으로 감싸 적 투사체를 공격자에게 반사하고 자신이 받는 피해를 막으며 이동 속도를 얻습니다."],["태양 올가미","멜이 전방으로 천란한 구체를 발사하여 범위 내의 적에게 피해를 입히고 둔화시킵니다. 구체 중앙에 닿은 적은 속박됩니다."],["황금 일식","멜이 압도 중첩이 적용된 모든 적을 거리와 상관없이 공격하여 중첩 횟수에 비례하는 추가 피해를 입힙니다. 황금 일식의 레벨이 높을수록 압도의 피해가 커집니다."]],"en":[["Searing Brilliance","Whenever Mel uses an ability, she gains three bonus projectiles (up to nine maximum) on her next attack. When Mel deals damage through an ability or attack, she applies Overwhelm, which can stack infinitely. If the enemy is hit by Mel with enough Overwhelm damage, the stacks are consumed to execute the target."],["Radiant Volley","Mel fires a barrage of projectiles that explode around a target location, dealing damage repeatedly to enemies within the area."],["Rebuttal","Mel forms a barrier around herself that reflects enemy projectiles back at the attacker, prevents her from taking damage, and grants her movement speed."],["Solar Snare","Mel fires a radiant orb forward, dealing damage and slowing enemies within range, while rooting those at its center."],["Golden Eclipse","Mel strikes all enemies marked with Overwhelm regardless of their distance from her, dealing additional damage for each stack of Overwhelm. Ranks of Golden Eclipse increase Overwhelm's damage."]],"zh":[["炙灼耀輝","每當梅爾使用技能，下次普攻會額外射出三發射彈，最多可累積九發。梅爾使用技能或普攻造成傷害後，會附加奪目堆層，可無限累積。梅爾對敵人造成的奪目傷害足夠，便會消耗堆層處決敵人。"],["絢輝彈幕","梅爾射出會在目標位置周圍爆炸的彈幕，對範圍內的敵人多次造成傷害。"],["叱返金身","梅爾在自身周圍生成屏障，能反彈射彈避免傷害，並增加跑速。"],["烈陽羅網","梅爾向前方射出光球，對範圍內的目標造成傷害和緩速效果，並定身位於中心的敵人。"],["無垠天照","梅爾無視距離，打擊所有身上有奪目標記的敵人，奪目層數越高，造成的傷害越高。「無垠天照」等級提升後，會增加奪目的傷害。"]],"n":[["0",""],["9/8/7/6",""],["38/36/34/32",""],["11/11/10/10",""],["95/80/65",""]]},"10140":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c6f4daa024f674a93c90f73db21f39cadaf18fbc-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/68f86990502d606d55d12dc03b4573f0ba9e6c65-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/a0ec32260e272f2bd0838a8dd6d41b0b80084ea0-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/44167a211d40021a73edc4655ba41aa5deb9ad70-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/07f2333ec63ae9346f3b7e6bc5bbda5555b0a145-128x128.png"],"ko":[["고철장 거인","럼블은 스킬을 사용할 때마다 열기를 얻습니다 열기가 50에 달하면 럼블은 위험 상태에 들어갑니다. 위험 상태가 되면 럼블의 모든 스킬은 추가 효과를 얻습니다. 열기가 150에 달하면 과열 상태가 되어 공격 속도가 증가하고 기본 공격에 마법 피해가 추가되며 몇 초간 스킬을 사용할 수 없게 됩니다."],["화염방사기","럼블이 3초 동안 정면을 향해 원뿔 형태의 공격을 가하며 적에게 불을 붙이고 마법 피해를 입힙니다. 위험 상태일 경우 피해가 증가합니다."],["고철 방패","럼블이 방어막을 전개하여 피해를 입지 않도록 자신을 보호하고 순간적으로 이동 속도를 높입니다. 위험 상태에서는 방어막의 내구력과 럼블의 이동 속도 증가량이 증가합니다."],["전기 작살","럼블이 작살을 발사하여 대상을 감전시키고 마법 피해를 입히면서 이동 속도와 마법 저항력을 감소시킵니다. 럼블은 최대 2개의 작살을 보유할 수 있습니다. 위험 상태일 경우 피해량과 적 둔화율이 증가합니다."],["이퀄라이저 미사일","럼블이 로켓을 한꺼번에 발사하여 화염의 벽을 만들면, 해당 지점을 지나는 적은 피해를 입고 속도가 느려집니다."]],"en":[["Junkyard Titan","Every spell Rumble casts grants him Heat. When he reaches 50 Heat he enters the Danger Zone, granting all his basic abilities bonus effects. When he reaches 150 Heat, he starts Overheating, gaining bonus Attack Speed and granting his basic attacks bonus damage, but making him unable to cast spells for a few seconds."],["Flamespitter","Rumble torches opponents in front of him, dealing magic damage in a cone for 3 seconds. While in Danger Zone this damage is increased."],["Scrap Shield","Rumble pulls up a shield, protecting him from damage and granting him a quick burst of speed. While in Danger Zone, the shield strength and speed bonus is increased."],["Electro Harpoon","Rumble launches a harpoon, electrocuting his target with magic damage, slowing their Move Speed, and reducing their Magic Resist. Rumble can carry 2 harpoons at a time. While in Danger Zone the damage and slow percentage is increased."],["The Equalizer","Rumble fires off a group of rockets, creating a wall of flames that damages and slows enemies."]],"zh":[["泰坦熱能","藍寶使用技能時會產生熱能。當熱能達到50，他會啟動危險禁區，賦予所有基礎技能加成效果。當熱能達到150，他會啟動系統過熱，獲得額外攻速並提升普攻的殺傷力，但他會有幾秒無法施放技能。"],["火焰噴射器","藍寶對面前的敵人使用火焰噴射器，在扇形範圍內造成魔法傷害，持續3秒。危險禁區啟動時傷害增加。"],["鐵屑電磁盾","藍寶展開電磁護盾，保護自己免於受傷同時獲得緊急加速。危險禁區啟動時，提升護盾的強度與速度加成。"],["高壓電魚叉","藍寶發射高壓電魚叉，電擊目標造成魔法傷害及緩速，並削弱他們的魔法防禦。藍寶可以同時攜帶兩隻魚叉。危險禁區啟動時，提升傷害及緩速的百分比。"],["等離子飛彈","藍寶發射一連串等離子飛彈，並產生火牆使敵軍受到傷害和緩速效果。"]],"n":[["0",""],["8/7/6/5",""],["5/5/5/5",""],["0/0/0/0",""],["80/70/60",""]]},"10141":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/44148ffcd6778a14fb4149bfb43ad17b1381dcfd-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/dd962f63c1a426139b74818cf90148019ed067c6-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0acc142e9a3739f8b4944ebdb18cf8e4fcd5112f-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/117f24c3ddc0d548e614e2c6a08ef1f4857fa49a-96x96.jpg","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6468741b8f42f29b929201655b6206c3f139cf33-96x96.jpg"],"ko":[["파멸과 우울","벡스가 주기적으로 강화 상태가 되어 다음 기본 스킬로 적 챔피언을 공포에 빠뜨리고 돌진을 방해합니다. 주변 적이 돌진할 때마다 벡스가 적에게 표식을 남깁니다. 표식을 소모해 추가 피해를 입힐 수 있으며 강화 상태의 재사용 대기시간이 감소합니다."],["안개 화살","피해를 입히는 화살을 발사합니다. 화살은 날아가는 동안 속도가 빨라집니다."],["거리 두기","보호막을 얻고 주변 적에게 피해를 입힙니다."],["커지는 어둠","피해를 입히고 둔화시키는 영역을 소환하며 적에게 우울을 적용합니다."],["그림자 파동","적 챔피언에게 표식을 남기는 발사체를 날립니다. 재사용하면 벡스가 대상에게 돌진하여 피해를 입힙니다."]],"en":[["Doom 'n Gloom","Vex periodically becomes empowered, causing her next basic Ability to fear enemies and interrupt dashes. Whenever a nearby enemy dashes, Vex applies a mark that can be consumed for bonus damage that also reduces the cooldown of her empowered state."],["Mistral Bolt","Launch a damaging missile that accelerates mid-flight."],["Personal Space","Gain a shield and damage nearby enemies."],["Looming Darkness","Summon a damaging and slowing zone that applies Gloom to enemies."],["Shadow Surge","Fire a missile that marks an enemy champion. Recast to dash to them and deal damage."]],"zh":[["無望厄障","每隔一段時間，薇可絲會獲得強化，使她的下一次基礎技能中斷衝刺，並使敵軍陷入恐懼。鄰近敵軍衝刺時，薇可絲可對其附加標記。消耗此標記會造成額外傷害，並減少強化狀態的冷卻時間。"],["冷酷暗箭","釋放一道會在飛行途中加速的闇波，造成傷害。"],["個人舒適圈","獲得一個護盾，並對鄰近敵軍造成傷害。"],["闇黑迫近","召喚黯影造成範圍傷害和緩速，並對命中的敵軍附加無望標記。"],["飛影急襲","發射黯影標記敵方英雄。重施技能可向該目標衝刺並造成傷害。"]],"n":[["0",""],["7",""],["18",""],["13",""],["80/80/80",""]]},"10144":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/80dced5fdda48e695cad1f4ed6bea81402722cc2-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f46864d3d37cc5d4fe9d0e49dbbd1ecf2f5618b9-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data/f9bcbe5e372a1148373eba3d69c82c0e334a042b-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/c75e53bd7c0355a8012a9f805657693e039010db-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4c52e831e383e7047ee63460823751877e20a7b6-512x512.png"],"ko":[["영광스러운 진화","빅토르가 적을 처치할 때마다 마공학 파편을 얻습니다. 마공학 파편을 100개 획득할 때마다 빅토르의 사용 스킬이 영구적으로 증강됩니다. 기본 스킬을 모두 업그레이드한 후에는 마공학 파편을 100개 모아 궁극기를 증강할 수 있습니다."],["힘의 흡수","빅토르가 적 유닛에 폭발을 일으켜 마법 피해를 입히며 보호막을 얻고 다음번 기본 공격이 강화됩니다. 증강: 스킬 사용 시 빅토르의 이동 속도가 빨라지고 힘의 흡수 보호막 흡수량이 60% 증가합니다."],["중력장","빅토르가 강력한 중력장을 생성해 해당 지역 안에 들어온 적들을 느리게 만듭니다. 중력장에 오래 머무르는 적은 기절합니다. 증강: 빅토르의 스킬이 적을 둔화시킵니다."],["마법공학 광선","빅토르가 생체기계 팔을 사용해 땅을 일직선으로 가르는 마법공학 광선을 쏘아 경로상의 적 모두에게 피해를 입힙니다. 증강: 마법공학 광선 파동에 이어 폭발이 일어나 마법 피해를 입힙니다."],["아케인 폭풍","빅토르가 목표 위치에 아케인 폭풍을 일으켜 대상 지역에 있는 적에게 마법 피해를 입히며 적의 정신 집중을 끊습니다. 폭풍은 주위 적에게 주기적으로 마법 피해를 주고 빅토르가 진행 방향을 바꿀 수 있습니다. 증강: 아케인 폭풍이 25% 빠르게 이동하고 챔피언이 폭풍으로부터 피해를 입은 후 죽을 때마다 폭풍의 크기가 커지고 지속시간이 증가합니다."]],"en":[["Glorious Evolution","Viktor can augment his basic abilities when he gets kills on enemies."],["Siphon Power","Viktor blasts an enemy unit dealing magic damage, gaining a shield and empowering his next basic attack. Augment: Siphon Power's shield is increased by 60% and Viktor gains bonus Move Speed after casting."],["Gravity Field","Viktor conjures a heavy gravitational field that slows enemies in its radius. Enemies who stay within the device for too long are stunned. Augment: Viktor's non-periodic spells apply a slow to enemies."],["Hextech Ray","Viktor uses his robotic arm to fire a chaos beam that cuts across the field in a line, dealing damage to all enemies in its path. Augment: An explosion follows the Death Ray's wake, dealing magic damage."],["Arcane Storm","Viktor conjures a singularity on the field which deals magic damage and interrupts enemy channels. The singularity then periodically does magic damage to all nearby enemies."]],"zh":[["榮光進化","維克特擊殺敵軍後，即可倍化增強他的基本技能。"],["能量守恆","維克特引爆一名敵軍造成魔法傷害，獲得護盾並增強下一次普攻傷害。倍化增強：能量守恆護盾值提升60%，且維克特施放後會獲得額外跑速。"],["萬有引力產生裝置","維克特在地圖中製造引力場，緩速所有在此範圍內的敵軍。如果敵軍在引力場內停留太久則會造成暈眩效果。倍化增強：維克特的持續性技能會對敵軍附加緩速。"],["海克斯科技射線","維克特使用他的機械手臂發射死亡射線，對所有路徑中的敵人造成傷害。倍化增強：死亡射線經過的路徑會引發爆炸，造成魔法傷害。"],["奧術風暴","維克特製造一個微型黑洞，中斷敵軍施法並造成魔法傷害。微型黑洞會間歇性地對所有鄰近敵軍造成魔法傷害。"]],"n":[["0",""],["8/7/6/5",""],["13/12/11/10",""],["10/9/8/7",""],["75/65/55",""]]},"10146":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/2aa6cbe71e60bc3cf879f21f9ce1f24be5cc3f5f-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/ca4e1f0f2480b17723ca84014626fd3de5eb30b6-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/bdb0ed908613d0ad12113fee39f96aeb414477e0-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/e89929c23626fe4d0f46d3a91e384770407cd262-128x128.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/69fd6704e3575f30acbde478f5d531d2da38fb43-128x128.png"],"ko":[["바위타기","탈리야는 전투에서 벗어나 있을 때 벽 근처에 있으면 이동 속도를 얻습니다."],["파편 난사","탈리야가 지정한 방향으로 바위 조각 여러 개를 던져, 처음 맞힌 적에게 각각 마법 피해를 입히고 주변에 다져진 땅을 생성합니다. 다져진 땅 위에서 파편 난사를 사용하면 이를 소모하여 적에게 더 큰 피해를 입히고 둔화를 적용하는 바위를 던집니다."],["지각변동","탈리야가 지면의 특정 구역을 솟구치게 만들어 지정한 방향으로 적을 띄워 올립니다."],["대지의 파동","탈리야가 적을 둔화시키는 바위 밭을 생성합니다. 적이 그 위로 돌진하거나 밀려나면 바위가 폭발해 대상에게 피해를 입히고 기절시킵니다."],["바위술사의 벽","탈리야가 거대한 벽을 세웁니다. 스킬을 즉시 재사용하면 움직이는 벽에 올라타 이동합니다. 벽은 적을 뒤로 밀어내며, 완전히 세워진 뒤에 스킬을 재사용하면 일찍 파괴할 수 있습니다."]],"en":[["Rock Surfing","When not in combat, Taliyah gains Move Speed near walls."],["Threaded Volley","Taliyah throws a volley of rocks in a target direction, each rock dealing magic damage to the first enemy hit and creating a quarry in the area around them. If Taliyah casts Threaded Volley in a quarry, she consumes the ground to throw a stronger boulder that damages and slows enemies."],["Seismic Shove","Taliyah causes an area of ground to erupt and throws enemies within it in a direction of her choosing."],["Unraveled Earth","Taliyah creates a slowing minefield. If enemies dash through it or are knocked through it, the mines explode, damaging and slowing them."],["Weaver's Wall","Taliyah summons a massive wall. If she immediately casts it again, she steps on and surfs along it. The wall knocks back enemies. Once it’s fully formed, Taliyah can cast again to destroy it early."]],"zh":[["馭石之術","塔莉雅在脫戰狀態下，靠近牆壁會增加跑速。"],["旋舞飛岩","塔莉雅朝目標方向接連投擲岩石，每塊岩石對首位命中的敵軍造成魔法傷害，並在其周圍創造一座採石場。 如果塔莉雅在採石場內施放「旋舞飛岩」，她會將地面化為更強力的巨石投擲出去，傷害並緩速敵軍。"],["震地之擊","塔莉雅使一塊地表突起，將敵軍拋至指定方向。"],["碎裂地表","塔莉雅造出一片帶有緩速的巨石陷阱。如果敵軍從石塊上衝刺穿過或是被推擊而過，將引爆石塊並受到傷害及緩速。"],["編織者之牆","塔莉雅召喚出一道巨大的石牆。若立刻再次施放，塔莉雅可以踩上去乘著石牆前進。 石牆會擊退敵軍。石牆完全成形後，塔莉雅可以再次施放此技能以提早摧毀石牆。"]],"n":[["0",""],["6/5/4/3",""],["14/12/10/8",""],["13/13/13/13",""],["100/90/80",""]]},"10147":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/52e66b4b6326bf330913b0293c230c22ac2b9139-650x650.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/d06e045810edd5dfe365a61834da83dab2267baf-650x650.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/ff240447e932c37fc4549eb821d31418e5210a27-650x650.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/dbe6a82a9cb269a918f9558fa47f1a3710762382-650x650.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/f6562e76ee86e0cc66d8f219915a95b0d73975d8-650x650.png"],"ko":[["몽상가의 서명","흐웨이는 적 챔피언에게 스킬로 피해를 입히면 서명 마무리를 준비합니다. 다시 한번 스킬을 맞히면 서명이 완성되며, 잠시 후 폭발이 일어나 범위 내의 적에게 마법 피해를 입힙니다."],["주제: 참사","흐웨이가 스킬의 효과를 피해 위주로 변경합니다. 파멸의 화염 - 불타는 투사체를 날립니다. 절단의 번개 - 사거리가 긴 번개를 내리칩니다. 녹아내린 균열 - 용암을 내뿜는 폭발 지대를 생성합니다."],["주제: 평온","흐웨이가 스킬의 효과를 보조 버프 위주로 변경합니다. 쏜살같은 물살 - 이동 속도를 부여합니다. 반사의 웅덩이 - 보호막을 부여하는 웅덩이를 생성합니다. 요동치는 빛 - 다음 공격 시 마나를 회복하고 추가 피해를 입힙니다."],["주제: 고통","흐웨이가 스킬의 효과를 군중 제어 위주로 변경합니다. 암울한 형상 - 적을 공포에 빠뜨립니다. 심연의 응시 - 절대 시야를 적용하는 유도 투사체를 날립니다. 파괴의 아귀 - 적을 끌어당겨 피해를 입히고 둔화시킵니다."],["절망의 소용돌이","흐웨이가 적 챔피언을 점점 커지는 영역 내에 가둬 피해를 입히고 둔화시킵니다. 영역은 최대 크기에 도달하거나 대상이 사망하면 폭발합니다."]],"en":[["Signature of the Visionary","Hwei damages enemy champions, priming them for his signature finisher. The second hit completes his signature, which detonates after a delay, dealing magic damage to enemies in range."],["Subject: Disaster","Hwei replaces his abilities with damaging powers: Devastating Fire – fires a flaming projectile. Severing Bolt – casts a long range lightning strike. Molten Fissure – shoot a fiery path that keeps erupting."],["Subject: Serenity","Hwei replaces abilities with utility buffs: Fleeting Current – increases move speed. Pool of Reflection – creates water shields. Stirring Lights – restores mana and inflicts bonus damage."],["Subject: Torment","Hwei replaces abilities with crowd control powers: Grim Visage – fears and slows. Gaze of the Abyss – sends homing missile eye with True Sight. Crushing Maw – draws in foes to damage and slow."],["Spiraling Despair","Hwei captures enemy champions in an expanding field that slows and damages, exploding upon reaching maximum size, or the champion’s demise."]],"zh":[["筆仙真跡","赫威對敵方英雄造成傷害，準備完成筆跡。筆跡在第二次命中時完成，並在短暫延遲後爆炸，對範圍內敵軍造成魔法傷害。"],["主題：厄禍筆法","赫威以大量傷害取代技能： 壞滅熾燄：發射燃燒射彈。 震顫轟雷：施放遠距離電擊。 熔岩裂隙：生成不斷噴火的火焰路徑。"],["主題：靜謐筆法","赫威以通用增益取代技能： 川流湍急：獲得跑速。 明鏡止水：生成水護盾。 迴旋光暈：恢復魔力並造成額外傷害。"],["主題：苦惱筆法","赫威以控場力量取代技能 死神面影：造成恐懼和緩速。 深淵凝視：發射帶有真視視野的追蹤魔眼。 碎骨大顎：拉近敵軍，造成傷害和緩速。"],["絕望螺旋","赫威將敵方英雄困在不斷擴大的領域中，該領域會緩速並造成傷害，並在達到最大範圍或英雄陣亡時爆炸。"]],"n":[["0",""],["9/8/7/6",""],["17/16/16/15",""],["13/12/11/10",""],["70/60/50",""]]},"10148":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/61725ced401ffafd8c3553054e463c45ade2104e-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4225de98294eca92c9d4218b83825814039709dd-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/9b4f79983424cf447e59c51745a5b0db67f7ce1c-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/56df3a666ad10d9bee4f1d5cc3aaaa069c531345-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/7dde88fac7a755597b10fe18a2315a2174bf8983-512x512.png"],"ko":[["최초의 땅의 맹세","유나라의 치명타가 마법 피해를 추가로 입힙니다."],["영혼 단련","유나라의 기본 공격이 강화되어 공격 속도를 얻고, 적중 시 추가 피해를 입히며, 주변 적에게 피해가 확산됩니다."],["심판의 궤적 | 파멸의 궤적","유나라가 회전하는 기도의 구슬을 던져 적에게 피해를 입히고 둔화시킵니다. 초월 상태에서는 유나라가 빛줄기를 발사해 적에게 피해를 입히고 둔화시킵니다."],["칸메이의 발자취 | 닿지 않는 그림자","유나라가 이동 속도를 얻고 유체화 상태가 됩니다. 초월 상태에서는 유나라가 지정한 방향으로 돌진합니다."],["자기 초월","유나라가 초월 상태에 돌입해 기본 스킬을 강화합니다."]],"en":[["Vow of the First Lands","Yunara's Critical Strikes deal bonus magic damage."],["Cultivation of Spirit","Yunara gains Attack Speed, bonus damage On-Hit, and her Attacks spread to nearby enemies."],["Arc of Judgment | Arc of Ruin","Yunara fires a spinning prayer bead that deals damage and slows enemies. While in her Transcendent State she instead fires off a laser that deals damage and slows enemies."],["Kanmei's Steps | Untouchable Shadow","Yunara gains Move Speed and becomes Ghosted. While in her Transcendent State she instead dashes in a direction."],["Transcend One's Self","Yunara enters a Transcendent State that upgrades her basic Abilities."]],"zh":[["淨土之誓","尤娜拉暴擊時會造成額外魔法傷害。"],["靈心修真","尤娜拉增加攻速、額外命中傷害，而且她的普攻可擴散至鄰近敵軍。"],["審判靈珠 | 毀滅弧光","尤娜拉發射迴旋念珠，對敵軍造成傷害和緩速效果。尤娜拉在超凡狀態時，改為朝指定方向發射靈力光束，並對敵軍造成緩速效果。"],["感銘迅步 | 追風躡影","尤娜拉獲得跑速，並進入鬼步狀態。若她進入超凡狀態，則改為朝指定方向衝刺。"],["超逸絕塵","尤娜拉進入「超凡狀態」，升級她的基礎技能。"]],"n":[["0",""],["0",""],["10/10/10/10",""],["9",""],["70/65/60",""]]},"10151":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/c1a4425d2f2149c5b96e1417b64360a62c9b4fd2-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b74f5ca63bd27b4e53d5a7fcb66e158a522608b3-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/8bc13c5453326b5bf1a589c61f626cefb706d17a-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/aa575f463cba60382e395a1af55fbc1c30916e09-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/16b159ca0e703ce615826b2805999712abfb4f72-256x256.png"],"ko":[["그림자 칼날","몇 초마다 녹턴의 기본 공격이 주변 적에게 추가 물리 피해를 입히고 녹턴의 체력을 회복시킵니다. 녹턴이 기본 공격 시 이 효과의 재사용 대기시간이 감소합니다."],["황혼의 인도자","녹턴이 그림자 칼날을 던져 피해를 입히고 황혼의 궤적을 남깁니다. 황혼의 칼날에 적중당한 적 챔피언들 또한 황혼의 궤적을 남깁니다. 궤적에 있는 동안 녹턴은 다른 유닛을 통과할 수 있게 되며 이동 속도 및 공격력이 증가합니다."],["어둠의 장막","기본 지속 효과로 녹턴이 자신의 검을 강화하여 추가 공격 속도를 얻습니다. 스킬 사용 시 녹턴이 그림자 속으로 몸을 숨겨 적의 스킬을 한 번 막아주는 보호막을 생성합니다. 성공적으로 적의 스킬을 막았을 경우 추가 공격 속도가 2배로 올라갑니다."],["말할 수 없는 공포","녹턴이 대상의 정신에 악몽을 심어 매초 피해를 가하며 지속시간이 끝날 때까지 스킬의 사거리 밖으로 벗어나지 않을 경우 공포 효과를 적용합니다."],["피해망상","녹턴이 모든 적 챔피언의 시야 반경을 줄이고 적 챔피언들 사이의 시야 공유를 중단합니다. 스킬 사용 후 적 챔피언을 대상으로 설정할 경우 그 챔피언에게 날아가 공격합니다."]],"en":[["Umbra Blades","Every few seconds, Nocturne's next attack strikes surrounding enemies for bonus physical damage and heals himself. Nocturne's basic attacks reduce this cooldown."],["Duskbringer","Nocturne throws a shadow blade that deals damage, leaves a Dusk Trail, and causes champions to leave a Dusk Trail. While on the trail, Nocturne can move through units and has increased Move Speed and Attack Damage."],["Shroud of Darkness","Nocturne empowers his blades, passively gaining Attack Speed. Activating Shroud of Darkness allows Nocturne to fade into the shadows, creating a magical barrier which blocks a single enemy ability and doubles his passive Attack Speed if successful."],["Unspeakable Horror","Nocturne plants a nightmare into his target's mind, dealing damage each second and applying fear to the target if they do not get out of range by the end of the duration."],["Paranoia","Nocturne reduces the sight radius of all enemy champions and removes their ally vision in the process. He can then launch himself at a nearby enemy champion."]],"zh":[["闇影幽刃","每過數秒，夜曲的下次普攻會襲擊周遭敵軍，造成額外物理傷害，並回復自身生命。夜曲的普攻會縮短其冷卻時間。"],["黃昏渠道","夜曲擲出影之刃造成傷害，同時於地面留下暗影軌跡，遭到影之刃擊中的英雄也會留下相同的軌跡。行於軌跡上面時，夜曲可穿過任何單位，同時提高跑速和物攻。"],["夜幕庇護","夜曲強化他的雙刃，被動獲得攻速。發動「夜幕庇護」後，夜曲會融入影子之中，建立一層魔法護盾。此護盾可抵擋單次敵方技能，若成功阻擋敵方攻擊，其被動攻速會加倍。"],["深宵斷魂","夜曲將噩夢植入目標心中，每秒造成傷害。若目標沒有在技能發動期間離開範圍，則會被進一步恐懼。"],["無盡夢魘","夜曲遮蔽所有敵方英雄的視野，並在過程中切斷所有敵方之間的視野分享。接著，他可以衝向附近的敵方英雄。"]],"n":[["12",""],["7/7/7/7",""],["18/16/14/12",""],["14/13/12/11",""],["120/100/80",""]]},"10152":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/89738e4f1a418a2abe780849077b92e661315aa4-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/38a40e5e53893d15e5ea7bd5d000f92e1720673e-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/87e393f8026c31d6beb1cf9260ab497ecb3810f3-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/5311f274db1465351c376494bf2a6a83cd25e58c-256x256.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3a022550213addb4aab8bc69f7dd79adb53d128d-256x256.png"],"ko":[["불굴의 본능","크산테의 공격 스킬이 적중한 대상에게 표식을 남겨, 다음 공격 시 추가 피해를 받게 합니다. 총공세 상태에서는 크산테의 기본 공격, 스킬, 기본 지속 효과의 피해량이 증가합니다."],["엔토포 타격","크산테가 무기를 내리쳐 일직선상의 적에게 물리 피해를 입히고 둔화시킵니다. 적중 시 엔토포 타격 중첩을 1회 얻습니다. 2회 중첩 시 충격파를 발사해 적을 끌어당기고 기절시킵니다. 총공세 상태에서는 재사용 대기시간이 감소합니다."],["길을 여는 자","크산테가 힘을 모으며 강제 이동 효과에 면역이 되고 받는 피해가 감소합니다. 이후 돌진하여 적중한 적을 뒤로 밀어내고, 기절시키며, 피해를 입힙니다. 총공세 상태에서는 추가 피해를 입히고 재사용 대기시간이 초기화됩니다. 피해 감소량과 돌진 속도도 증가하지만, 적을 뒤로 밀어내거나 기절시키지 않습니다."],["발놀림","크산테가 돌진하며 보호막을 얻습니다. 아군을 대상으로 돌진하면 이동 거리가 증가하고 해당 아군에게도 보호막을 부여합니다. 총공세 상태에서는 재사용 대기시간이 감소하고 돌진 속도가 증가합니다."],["총공세","크산테가 저지 불가 상태로 무기를 부수며 적 챔피언을 뒤로 밀어냅니다. 적은 벽에 부딪히면 이를 뚫고 밀려나며 추가 피해를 받습니다. 이후 크산테가 대상 뒤편으로 돌진하여 총공세 상태에 돌입합니다. 총공세 상태에서는 크산테의 기본 스킬이 강화됩니다. 또한 공격 속도, 방어구 관통력, 모든 피해 흡혈이 증가하는 대신 최대 체력, 방어력, 마법 저항력이 감소합니다."]],"en":[["Dauntless Instinct","K’Sante’s damage dealing abilities mark enemies to take more damage on his next hit. When All Out, K’Sante’s attacks, abilities, and passive deal more damage."],["Ntofo Strikes","K’sante slams his weapon, dealing physical damage and slowing enemies in a line. On hit, grants a stack of Ntofo Strikes. At 2 stacks, K’Sante instead fires a shockwave that stuns and pulls enemies. When All Out, the cooldown is reduced."],["Path Maker","K’Sante charges up, gaining displacement immunity and reduced damage. He then dashes forward, dealing damage, knocking back and stunning enemies. When All Out, cooldown is refreshed, deals additional damage, no longer knocks back or stuns, but also grants increased damage reduction and dash speed."],["Footwork","K’Sante dashes and gains a shield. If he dashes to an ally, the dash distance is increased and both gain a shield. When All Out, cooldown is reduced and dash speed is increased."],["All Out","K’Sante becomes unstoppable and splits his ntofos to know back an enemy. If the enemy collides with terrain, they are knocked through, taking additional damage. K’Sante, then dashes behind them and enters All Out. While All Out, K’Sante’s abilities are upgraded. He also gains Attack Speed, Armor Penetration, and Omnivamp, while losing some maximum Health, Armor, and Magic Resist."]],"zh":[["無畏本能","卡桑帝的傷害性技能會標記敵軍，使他的下一次普攻對其造成更多傷害。 處於拼死一搏狀態時，卡桑帝的普攻、技能和被動會造成更多傷害。"],["恩屠浮強擊","卡桑帝以武器砸擊，對直線上的敵軍造成物理傷害與緩速效果。若技能命中，會獲得恩屠浮強擊堆層。累加至2層時，卡桑帝改為打出一道衝擊波，暈眩並拉曳敵軍。 處於拼死一搏狀態時，冷卻時間會縮短。"],["開山闢路","卡桑帝蓄力時，獲得位移控場免疫並降低受到的傷害接著他會向前衝刺，對敵軍造成傷害、擊退並使其暈眩。 處於拼死一搏狀態時，冷卻時間會重置，造成額外傷害，不再擊退或對暈眩敵人，但獲得更高的傷害減免和衝刺速度。"],["精熟腳步","卡桑帝進行衝刺並獲得一道護盾。如果他衝刺到友軍身上，衝刺距離會增加，兩人都會獲得護盾。 處於拼死一搏狀態時，冷卻時間會縮短且衝刺速度提升。"],["拼死一搏","卡桑帝變得無人能擋，並擊碎他的恩屠浮，將一名敵軍擊退。如果敵軍撞上地形物，將會被撞穿，並承受額外傷害。卡桑帝接著將衝到他們身後，進入拼死一搏狀態。在拼死一搏時，卡桑帝的技能會升級。他同時獲得攻速、物理穿透和全能吸血效果，但會失去部分最大生命、物防和魔防。"]],"n":[["0",""],["0/0/0/0",""],["13/12/11/10",""],["11/10/9/8",""],["80/70/60",""]]},"10166":{"i":["https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0401ca45fd76ab4f86346e040562ec04b0881f5c-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e158dca2ed7aa12a58a47ab48455fc16f16cf42c-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/572ca309e885bdb5503b9310e30f6519e44aa335-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/fe338abd6834c71b5b59404f765ae39de22fdb5d-512x512.png","https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b7cfcb0f9773a775d4830e0f44643bfbc93c3c54-512x512.png"],"ko":[["소중한 장신구","노라가 다음에 사용하는 스킬이 전장에 장신구를 남깁니다. 장신구는 적과 접촉하면 활성화되어 대상에게 투사체를 발사합니다. 적 챔피언에게 스킬을 맞히면 이 효과의 재사용 대기시간이 감소합니다."],["밀려드는 기억","노라가 충전한 뒤 지정한 방향으로 마법 탄환을 발사합니다. 충전 중에는 이동 속도가 감소합니다. 마법 탄환은 적 챔피언을 처음 맞히면 멈추며, 대상과 주변 적에게 마법 피해를 입힙니다. 실타래 표식이 남은 적은 추가 마법 피해를 받습니다. 완전히 충전하면 주변의 모든 장신구를 활성화하여 탄환에 맞은 대상을 공격하게 합니다."],["미지로의 여정","노라가 지정한 위치에 원형의 차원문을 생성해, 범위 내의 모든 적 챔피언에게 마법 피해를 입히고 다른 차원으로 이동시킵니다. 다른 차원에 있는 적은 대상 지정 불가 상태가 되며, 둔화되고 스킬을 사용할 수 없게 됩니다."],["귀향의 실타래","기본 지속 효과: 장신구가 피해를 입힌 대상에게 실타래 표식을 남깁니다. 노라가 지정한 범위의 양쪽 끝에 차원문을 소환합니다. 두 차원문은 서로를 향해 마법의 실타래를 발사해, 경로상의 모든 적에게 마법 피해를 입히고 실타래 표식을 적용합니다. 실타래 표식은 대상을 둔화시키고 피격 판정 범위를 키웁니다."],["차원문 대소동!","노라가 범위 내의 모든 유닛을 에워싸는 거대한 차원문을 소환합니다. 이후 마법 투사체를 4회 발사해, 경로상의 모든 적에게 마법 피해를 입힙니다. 투사체의 발사 경로는 화면을 밀어서 지정할 수 있습니다. 마지막 투사체는 추가 피해를 입힙니다."]],"en":[["Beloved Trinkets","Norra’s next ability leaves Trinkets on the battlefield. When an enemy touches a Trinket, it activates and fires a projectile at the triggering enemy. When Norra’s abilities hit enemy champions, the ability’s cooldown is reduced."],["Memory Surge","Norra charges and fires a bolt of magical energy in target direction. She’s slowed while charging. The energy bolt stops upon hitting the first enemy champion, dealing magic damage to the target and nearby enemies. Enemies marked with Thread Sigils take bonus magic damage. At full charge, all Trinkets within the area are activated and the hit target is treated as Trinket-activated."],["Journey to Nowhere","Norra reveals a mystical portal in a target circular area, dealing magic damage to all enemy champions within the area and banishing them to an alternate realm. Banished enemies are untargetable, slowed, and can’t cast."],["Threads of Homecoming","Passive: Damage dealing Trinkets apply a Thread Sigil to their targets. Norra summons portals on both sides of a target area. The portals fire magical threads between each other, dealing magic damage to all enemies in the area and applying Thread Sigils. Thread Sigils slow their targets and increase their collision size."],["Portalpalooza!","Norra conjures a huge portal enveloping all units within the area. Magical projectiles will fire four times, dealing magic damage to all enemies along their path. The projectile direction is determined by swiping. The last projectile deals bonus damage."]],"zh":[["心愛飾品","諾拉的下一次技能會在戰場上留下飾品。敵軍觸碰飾品時，飾品會啟動並朝該敵軍發射魔彈。諾拉的技能命中敵方英雄時，會縮短該技能的冷卻時間。"],["記憶湧現","諾拉蓄力並朝目標方向發射能量魔彈。蓄力時跑速變慢。能量魔彈會在命中首位敵方英雄後停止，對目標及鄰近敵軍造成魔法傷害。受絲線印記標記的敵軍會受到額外魔法傷害。 \\n蓄滿力後，啟動範圍內所有飾品，並將命中的目標視為觸發者。"],["茫然旅程","諾拉於指定圓形區域開啟神祕傳送門，對範圍內所有敵方英雄造成魔法傷害，並將其驅逐至另一個次元。被驅逐的敵軍無法被指定並受到緩速，也無法施放技能。 \\n"],["返家絲線","被動：造成傷害的飾品會對目標施加絲線印記。\\n諾拉於目標區域兩側召喚傳送門。傳送門將朝彼此發射魔法絲線，對區域內所有敵軍造成魔法傷害，並施加絲線印記。絲線印記會使目標緩速，並增加其碰撞範圍。"],["傳送門嘉年華！","諾拉召喚巨大傳送門，壟罩範圍內所有單位。隨後發射四次魔彈，對路徑上所有敵軍造成魔法傷害。魔彈的方向可由滑動手勢來決定。最後一枚魔彈會造成額外傷害。"]],"n":[["0",""],["7/6/5/4",""],["23/22/21/20",""],["12/10/9/7",""],["105/95/85",""]]}}}</script>
