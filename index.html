<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와일드리프트 정보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 좁은 한 칸짜리 순위표. 위에 포지션 탭과 티어 선택이 붙어 있고, 행을 누르면 상세 시트가 올라온다. */
:root {
  color-scheme: dark;
  --ink: #0b1a24;
  --panel: #12283a;
  --panel-2: #183247;
  --line: #24465f;
  --text: #e6eef2;
  --mute: #8fa7b6;
  --gold: #d9b45f;
  --up: #4fc3a1;
  --down: #e0736a;
  --font-display: "Do Hyeon", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

header.top { padding: 20px 0 12px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.15;
  margin: 0;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
h1 span { color: var(--gold); }
.meta { color: var(--mute); font-size: 13px; margin: 6px 0 0; }

.views { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.views button {
  background: none; border: 0; border-bottom: 3px solid transparent;
  padding: 8px 2px; margin-bottom: -1px;
  font-family: var(--font-display); font-size: 19px; color: var(--mute);
}
.views button[aria-current="page"] { color: var(--text); border-bottom-color: var(--gold); }
[hidden] { display: none !important; }

/* 패치 노트 */
#view-patch { padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.pnote { font-size: 12px; color: var(--mute); margin: 0; }
details.patch { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
details.patch > summary {
  list-style: none; cursor: pointer; padding: 12px 14px;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
details.patch > summary::-webkit-details-marker, details.sec > summary::-webkit-details-marker { display: none; }
.pver { font-family: var(--font-display); font-size: 24px; color: var(--gold); line-height: 1; }
.pdate { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.pcount { font-size: 12px; color: var(--mute); margin-left: auto; }
details.patch > summary::after { content: "펼치기"; font-size: 12px; color: var(--mute); }
details.patch[open] > summary::after { content: "접기"; }
.pbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.pdesc { margin: 0; font-size: 14px; }
.glance { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.glance h3, .pbody h3 { margin: 0; font-size: 13px; color: var(--mute); font-weight: 700; }
.grow { display: flex; flex-direction: column; gap: 6px; }
.grow .gt { font-size: 12px; color: var(--gold); font-weight: 700; }
.grow .names { font-size: 13px; overflow-wrap: anywhere; }
.champs { display: flex; flex-wrap: wrap; gap: 6px; }
.champ {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 10px 2px 2px; font-size: 13px;
}
.champ .ava { width: 26px; height: 26px; border-radius: 50%; font-size: 13px; }
details.sec { border-top: 1px solid var(--line); }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 10px 0;
  display: flex; justify-content: space-between; gap: 8px; font-weight: 700;
}
details.sec > summary .n { color: var(--mute); font-weight: 400; font-size: 12px; white-space: nowrap; }
details.sec > summary .n::after { content: " ▾"; }
details.sec[open] > summary .n::after { content: " ▴"; }
.secbody { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
.pg { display: flex; flex-direction: column; gap: 4px; }
.pg .gn { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.pg .gn .ava { width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }
.pg.sub .gn { color: var(--gold); font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.pg .ct { font-size: 12px; color: var(--mute); margin-top: 2px; }
.pg ul { margin: 0; padding-left: 16px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.pg li { overflow-wrap: anywhere; }
.pg li .to { color: var(--gold); font-weight: 500; }
.pg .cut { font-size: 12px; color: var(--mute); }
a.orig { align-self: flex-start; color: var(--gold); font-size: 13px; }

.controls {
  position: sticky; top: 0; z-index: 5;
  background: var(--ink);
  padding: 10px 0;
  display: flex; flex-direction: column; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tabs button {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 0;
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--mute);
}
.tabs button[aria-selected="true"] {
  background: var(--gold); border-color: var(--gold); color: #1c1503;
}
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiers { display: flex; gap: 6px; flex-wrap: wrap; }
.tiers button {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--mute);
}
.tiers button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
#q {
  flex: 1 1 140px; min-width: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
}
#q::placeholder { color: var(--mute); }

.grid {
  display: grid;
  grid-template-columns: 26px 40px minmax(0, 1fr) 96px 52px 52px;
  align-items: center;
  column-gap: 8px;
}
.head {
  padding: 10px 8px 6px;
  color: var(--mute);
  font-size: 12px;
}
.head button {
  background: none; border: 0; padding: 4px 0;
  color: var(--mute); font-size: 12px; text-align: right;
}
.head button[aria-sort="descending"] { color: var(--gold); }
.head button[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }

ol#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#list button.rowbtn {
  width: 100%;
  background: var(--panel);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 7px 8px;
  text-align: left;
}
#list button.rowbtn:hover { border-color: var(--line); background: var(--panel-2); }
.rank { color: var(--mute); font-variant-numeric: tabular-nums; font-size: 13px; text-align: center; }
.top3 .rank { color: var(--gold); font-weight: 700; }
.ava {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-size: 18px; color: var(--gold);
}
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.25; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--mute); }
.win { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.win b { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; }
.up { color: var(--up); }
.down { color: var(--down); }
/* 50%를 가운데에 둔 막대: 오른쪽이 50% 초과, 왼쪽이 미만 */
.bar { position: relative; width: 100%; height: 4px; background: var(--line); border-radius: 2px; }
.bar::before { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 8px; background: var(--mute); }
.bar i { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.bar i.up { left: 50%; background: var(--up); }
.bar i.down { right: 50%; background: var(--down); }
.empty { color: var(--mute); padding: 24px 8px; text-align: center; }

footer { color: var(--mute); font-size: 12px; margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
footer a, .sheet a { color: var(--gold); }

/* 상세 시트 */
.scrim { position: fixed; inset: 0; background: rgba(4, 12, 18, 0.72); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 16px 16px 24px;
  display: flex; flex-direction: column; gap: 16px;
}
@media (min-width: 640px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 16px; }
}
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet-head .ava { width: 56px; height: 56px; font-size: 24px; flex: none; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.2; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.close { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; flex: none; }
.sheet h3 { font-size: 13px; font-weight: 700; color: var(--mute); margin: 0 0 8px; }
.posgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.poscard {
  background: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; text-align: left;
  display: flex; flex-direction: column; gap: 2px;
}
.poscard[aria-pressed="true"] { border-color: var(--gold); }
.poscard .p { font-family: var(--font-display); font-size: 16px; color: var(--gold); }
.poscard .w { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.poscard .s { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mute); font-weight: 500; font-size: 12px; }
tr.cur td:first-child { color: var(--gold); }
.build { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.build p { margin: 0; font-size: 13px; color: var(--mute); }
.bgroup { display: flex; flex-direction: column; gap: 5px; }
.blabel { font-size: 12px; color: var(--gold); font-weight: 700; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.bhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bpicked { font-size: 13px; color: var(--text); }
.chip {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; font-size: 13px; min-height: 44px;
}
.icon {
  position: relative; display: block;
  width: 44px; height: 44px; padding: 0;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
}
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 7px; }
.icon.round, .icon.round img { border-radius: 50%; }
.icon.on, .chip.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.icon .no {
  position: absolute; left: -4px; top: -4px;
  min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--ink); border: 1px solid var(--line);
  color: var(--gold); font-size: 10px; line-height: 14px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.build a.go {
  align-self: flex-start;
  background: var(--gold); color: #1c1503; text-decoration: none;
  border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 14px;
}
@media (max-width: 400px) {
  .grid { grid-template-columns: 22px 36px minmax(0, 1fr) 84px 44px 44px; column-gap: 6px; }
  .ava { width: 36px; height: 36px; }
  h1 { font-size: 24px; }
}
/* 언어 선택 */
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.langs { display: flex; gap: 4px; padding-top: 4px; }
.langs button {
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 8px; font-size: 12px; color: var(--mute);
}
.langs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
details.patch > summary::after { content: var(--t-open, "펼치기"); }
details.patch[open] > summary::after { content: var(--t-close, "접기"); }
html:lang(zh) {
  --font-display: "Do Hyeon", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  --font-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Noto Sans KR", sans-serif;
}
/* 영어 이름처럼 긴 이름이 단어 중간에서 끊기지 않게 */
.name { overflow-wrap: break-word; }
@media (max-width: 400px) {
  .grid { grid-template-columns: 20px 34px minmax(0, 1fr) 70px 44px 44px; }
  .name { font-size: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span id="h1a" style="color:inherit">와일드리프트</span> <span id="h1b">정보</span></h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko" lang="ko">한국어</button>
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="zh" lang="zh">中文</button>
    </div>
  </header>

  <nav class="views" id="views">
    <button type="button" data-view="stats"></button>
    <button type="button" data-view="patch"></button>
  </nav>

  <div id="view-patch" hidden></div>

  <div id="view-stats">
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="row2">
      <div class="tiers" id="tiers"></div>
      <input id="q" type="search" autocomplete="off">
    </div>
  </div>

  <div class="grid head" id="head">
    <span style="text-align:center">#</span><span></span><span id="col-champ"></span>
    <button type="button" data-sort="1"></button>
    <button type="button" data-sort="2"></button>
    <button type="button" data-sort="3"></button>
  </div>
  <ol id="list"></ol>

  <footer>
    <span id="foot1"></span>
    <span id="foot2"></span>
  </footer>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>

15","이동 속도: 5% → 0"]}]},{"n":"황혼과 새벽","lv":4,"c":[{"t":"","l":["주문력: 70 → 60","최대 체력: 350 → 300","공격 속도: 25% → 20%"],"x":1}]},{"n":"내셔의 이빨","lv":4,"c":[{"t":"","l":["아이템 조합식: 내셔의 발톱 (800골드) + 곡궁 (1,400골드) + 600골드 → 곡궁 (900골드) + 방출의 마법봉 (800골드) + 악마의 마법서 (900골드) + 300골드","가격: 2,800골드 → 2,900골드","공격 속도: 45% → 50%","[신규] 주문력: 80","스킬 가속: 20 → 15","기본 공격 적중 시 대상에게 15 + 추가 주문력의 20%에 해당하는 마법 피해를 입힙니다.","[삭제]"]}]},{"n":"루덴의 메아리","lv":4,"c":[{"t":"","l":[],"x":1}]},{"n":"태양불꽃 방패","lv":4,"c":[{"t":"","l":["[삭제]","치명타 발동에 필요한 체력 기준치: 35% → 40%","[신규] 강인함: 20%","강인함이 삭제됩니다."],"x":1}]},{"n":"여신의 눈물","lv":4,"c":[{"t":"","l":["가격: 500골드 → 400골드","[삭제] 스킬 가속: 5"]}]},{"n":"삭제된 아이템","lv":4,"c":[{"t":"","l":["타오르는 불꽃과 마찬가지로, 새롭게 바뀐 환경에서는 더 이상 정글용 태양불꽃 방패가 필요하지 않기에 삭제됩니다.","화염 왕관","밀려오는 비늘은 늘 정체성이 명확하지 않은 아이템이었습니다. 능력치와 효과 모두 쇠사슬 조끼와 차별화하기에는 턱없이 부족한 수준이기에 이제는 보내 주려 합니다.","밀려오는 비늘","쐐기검 또한 마지막 사용자를 잃었으므로 일단은 삭제됩니다.","쐐기검","위 내용을 참고해 주세요.","화염 왕관"]}]}]},{"t":"룬 조정 사항","k":"etc","g":[{"n":"치명적 속도","lv":3,"c":[{"t":"","l":[],"x":1}]},{"n":"정복자","lv":3,"c":[{"t":"","l":["중첩당 얻는 능력치: 3~5의 추가 공격력/4~8의 주문력 (1.25~1.6배) → 3~5의 추가 공격력/5~8.33의 주문력 (1.667배로 통일)"]}]},{"n":"전설: 가속","lv":3,"c":[{"t":"","l":["전설: 강인함을 대체합니다.","적 처치에 관여하거나 몬스터 또는 미니언을 처치하면 1.5의 중첩되는 스킬 가속을 얻습니다. 이 효과로 최대 15의 스킬 가속을 얻을 수 있습니다."]}]},{"n":"철거","lv":4,"c":[{"t":"","l":["삭제된 아이템","삭제된 아이템"],"x":1}]}]},{"t":"전장 조정 사항","k":"etc","g":[{"n":"정글 조정","lv":3,"c":[]},{"n":"강타 조정","lv":3,"c":[{"t":"","l":["[삭제] 강타를 보유한 챔피언은 기본 공격과 스킬로 몬스터에게 추가 피해를 입힙니다.","[신규] 에픽 몬스터 외의 몬스터가 강타를 보유한 챔피언에게 50%의 피해만을 입힙니다.","[삭제] 강타 사용 시 체력을 회복합니다.","[신규] 대형 몬스터를 처치한 챔피언은 100~260의 체력을 회복합니다. (몬스터 레벨에 비례, 9레벨에 최대치)"],"x":1}]},{"n":"정글 골드 흐름 조정","lv":3,"c":[{"t":"","l":["강타를 보유한 챔피언은 20초마다 1회의 적립 중첩을 얻습니다. 정글 캠프를 처치할 때마다 중첩 1회를 소모해 45골드를 추가로 획득합니다. (최대 3회 중첩)","강타를 보유한 챔피언은 공격로에서 30~100%의 경험치를 얻습니다. 이 수치는 분 단위로 상승하며, 게임 시간 15분에 100%가 됩니다.","강타를 보유하지 않은 챔피언은 몬스터로부터 50~80%의 경험치만을 얻습니다. 이 수치는 분 단위로 상승하며, 게임 시간 12분에 80%가 됩니다."],"x":1}]},{"n":"강타 업그레이드 규칙","lv":3,"c":[{"t":"","l":["최초 피해량: 600의 고정 피해","적립 중첩을 소모하면 강타가 업그레이드됩니다.","중첩 8회 소모:","1,000의 고정 피해를 입히도록 업그레이드됩니다.","중첩 20회 소모:","1,400의 고정 피해를 입히도록 업그레이드됩니다.","이후 30초마다 적립 중첩을 1회씩 얻습니다.","정글과 강가에서 5%의 추가 이동 속도를 얻습니다. (비전투 시 10%로 증가)","각 정글 캠프에서 20골드를 추가로 획득합니다."]}]},{"n":"정글 몬스터 규칙","lv":3,"c":[{"t":"","l":["원소 드래곤 (5~15레벨):","체력 4,900~10,900, 공격력 70, 방어력 59~119, 마법 저항력 41~81","협곡의 전령 (5~15레벨):","체력 7,100~11,100, 공격력 100~200, 방어력 79~139, 마법 저항력 52~82","소환된 협곡의 전령 (5~15레벨):","체력 5,300~7,300, 공격력 80~130, 방어력 54~114, 마법 저항력 32~62","소환된 협곡의 전령 돌진 시 지급하는 골드: 200골드 → 50골드","내셔 남작 (9~15레벨):","체력 14,000~18,500, 공격력 280~490, 방어력 96~168, 마법 저항력 56~98","에너지 쇄도 공격력 계수: 60% → 30%"],"x":1}]},{"n":"전장 체계 조정","lv":3,"c":[]},{"n":"포탑","lv":3,"c":[]},{"n":"수정 과잉성장","lv":3,"c":[{"t":"","l":["이제 공격을 가할 수 있는 모든 공격로 포탑에 수정 과잉성장이 적용됩니다.","포탑에는 시간이 지남에 따라 점차 수정이 자라며, 챔피언에게 처음으로 기본 공격을 받으면 자란 수정이 모두 폭발해 고정 피해를 받습니다.","포탑을 공격하는 팀의 평균 레벨이 높을수록 수정 폭발의 피해량도 증가합니다.","재사용 대기시간: 수정 과잉성장은 포탑이 생성된 직후 50초간 재사용 대기에 들어갑니다. 50초가 지나고 나면 수정이 자라기 시작합니다.","최소 피해량: 포탑 최대 체력의 2~8.7% (공격하는 팀의 레벨에 비례)","최대 피해량: 포탑 최대 체력의 3.3~18.9% (공격하는 팀의 레벨에 비례)","외곽 포탑이 아직 남아 있을 때는 내부 포탑과 억제기 포탑에 수정 과잉성장이 적용되지 않으며, 외곽 포탑이 파괴된 뒤부터 수정이 자라기 시작합니다.","포탑의 공격 사거리 내에 미니언이 없고 포탑이 받는 피해가 감소한 상태일 때는 수정을 폭발시킬 수 없습니다."],"x":1}]},{"n":"포탑 체계 조정","lv":3,"c":[]},{"n":"포탑 조정","lv":4,"c":[{"t":"","l":["모든 포탑","[신규] 모든 포탑은 근접 챔피언으로부터 20% 증가한 피해를 받습니다.","포탑 방패 적용 대상: 외곽 포탑, 내부 포탑, 억제기 포탑","이제 포탑 방패가 영구적으로 유지됩니다.","포탑 방패는 포탑의 체력이 90/75/55/30/0%에 도달할 때마다 하나씩 파괴됩니다.","[삭제] 이제 외곽/내부 포탑이 파괴되어도 해당 공격로의 내부/억제기 포탑이 30초간 보호막을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 2분 동안 내셔 남작 공격로와 중단 공격로의 포탑이 50의 추가 방어력 및 마법 저항력을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 6분 동안 외곽 포탑이 남은 체력에 비례하는 추가 방어력 및 마법 저항력을 얻지 않습니다.","[삭제] 이제 게임 시작 후 첫 5분 동안 공격 사거리 내에 다수의 적 챔피언이 있어도 포탑이 추가 능력치를 얻지 않습니다.","[신규] 게임 시간 5분부터 외곽 포탑의 방어력, 마법 저항력, 포탑 방패 골드가 4회에 걸쳐 감소하기 시작합니다."],"x":1}]},{"n":"게임 흐름 조정","lv":3,"c":[{"t":"","l":["근접 미니언:","챔피언으로부터 받는 피해 감소량: 50~70% (게임 시간 11~25분)","미니언으로부터 받는 피해 감소량: 80%","공격력 증가량: 10","포탑으로부터 받는 피해 감소량: 25%","원거리 미니언:","챔피언으로부터 받는 피해 감소량: 50~70% (게임 시간 11~25분)","미니언으로부터 받는 피해 감소량: 20%","공격력 증가량: 30","포탑으로부터 받는 피해 감소량: 25%"],"x":1}]},{"n":"미니언","lv":3,"c":[]},{"n":"슈퍼 미니언 오라","lv":3,"c":[{"t":"","l":["포탑 1개 파괴:","방어력 35, 마법 저항력 35","포탑 2개 파괴:","방어력 35, 마법 저항력 35","공격력 15%","포탑 3개 파괴:","방어력 35, 마법 저항력 35","공격력 40%"]}]},{"n":"미니언 능력치","lv":3,"c":[{"t":"","l":["기본 체력: 800 → 1,100","구조물 대상 피해량: 게임 시간 23분에 최대치인 100% 도달 → 84%로 고정","[신규] 모든 미니언은 챔피언에게 60%의 피해를 입힙니다.","[신규] 미니언이 게임 시간 5분 30초부터 150초가 지날 때마다 25의 이동 속도를 얻습니다. (최대 6회 중첩)","[삭제] 이제 미니언이 게임 시간 11분부터 분당 10%의 비전투 시 이동 속도를 얻지 않습니다.","미니언 경험치 획득 거리: 8 → 10"]}]},{"n":"미니언 공격로 압박 버프","lv":3,"c":[{"t":"","l":["[신규] 미니언 대상 추가 피해량: (5% + (공격로 내 포탑 우위의 5%)) × 팀 평균 레벨 우위","[신규] 미니언 대상 피해 감소량: 1 + (공격로 내 포탑 우위 × 팀 평균 레벨 우위)"]}]},{"n":"생명력 흡수","lv":3,"c":[{"t":"","l":[],"x":1}]}]},{"t":"기타 게임 내 요소 조정","k":"etc","g":[{"n":"훈련 캠프","lv":3,"c":[{"t":"","l":["이제 연습 모드에서 어디서든 상점을 사용할 수 있습니다. 아이템 구매, 구매 취소, 판매 등이 가능합니다."]}]},{"n":"사용자 설정 모드","lv":3,"c":[{"t":"","l":["새로운 사용자 설정 모드인 대결 사용자 설정이 추가됩니다. 두 플레이어가 칼바람 나락 맵에서 1대1 대결을 펼치는 모드입니다."]}]},{"n":"소환사의 협곡","lv":3,"c":[{"t":"","l":["이제 플레이어가 기지 내에서 아이템을 구매할 수 있는 위치에 있으면 골드 표시가 강조됩니다.","이제 기지 내에 있을 때 아이템 가격 차가 표시됩니다.","원소 드래곤이 생성 대기 중일 때 둥지 위를 맴도는 그림자가 표시됩니다."]}]},{"n":"게임 내 핵심 아이템 추천","lv":3,"c":[]}]},{"t":"모험 모드","k":"etc","g":[{"n":"전투 축제 S7","lv":3,"c":[]},{"n":"무무무작위 총력전","lv":3,"c":[]},{"n":"테마 증강","lv":3,"c":[]},{"n":"HEARTSTEEL","lv":4,"c":[]},{"n":"True Damage","lv":4,"c":[]},{"n":"펜타킬 강림","lv":4,"c":[]},{"n":"음파 시즌 테마","lv":3,"c":[]},{"n":"신규 아이템","lv":3,"c":[]},{"n":"끝없는 갈망","lv":4,"c":[]},{"n":"불경한 히드라","lv":4,"c":[]},{"n":"강철의 영약","lv":4,"c":[]},{"n":"마법의 영약","lv":4,"c":[]},{"n":"분노의 영약","lv":4,"c":[]},{"n":"증강 목록 조정","lv":3,"c":[]},{"n":"증강 조정","lv":3,"c":[]}]},{"t":"시스템","k":"etc","g":[{"n":"신규 시스템","lv":3,"c":[]},{"n":"신규 시즌 시작","lv":3,"c":[{"t":"","l":["S 등급보다 높은 전설 S 등급이 추가됩니다. 이 등급을 달성한 플레이어는 랭크 불굴 포인트를 추가로 받습니다.","랭크 및 전설 랭크 게임의 종료 후 평가 인터페이스가 업데이트되어 플레이어의 성적을 더 명확하게, 종합적으로 확인할 수 있게 됩니다.","이번 평가 시스템 변경 사항은 랭크 및 전설 랭크 게임에만 적용됩니다."],"x":1}]},{"n":"전설 랭크","lv":3,"c":[{"t":"","l":["전설의 시험 이벤트가 추가됩니다. 이제 우수한 성적으로 주어진 도전을 완료하면 즉시 전설의 마스터로 승급할 수 있습니다.","지역별 전설 랭크 순위표가 추가됩니다. 능력만 된다면 이제 자신의 실력을 과시하며 더욱 치열한 경쟁으로 영광을 누릴 수 있습니다.","챔피언별로 전설 랭크 지수의 한도를 잠금 해제하는 기능이 추가됩니다. 해당하는 챔피언으로 순수 승리 횟수를 쌓으면 그 전설 랭크 지수의 상한이 점차 증가합니다.","이제 게임에서 패배해도 챔피언 점수가 차감되지 않습니다. 규정을 위반한 경우를 제외하면 챔피언 점수는 계속해서 오르기만 합니다.","챔피언 게임 성적 점수가 랭크 성적 점수로 대체됩니다. 이제 이 점수는 랭크 게임을 통해서만 획득할 수 있습니다.","전설의 도전에 관련된 변수와 값 또한 최적화됩니다.","지난 시즌 성과에 대한 점수 보너스가 삭제되고, 새로운 다재다능한 달인 점수 보너스가 추가됩니다.","우선순위 포지션 보상은 플래티넘부터 챌린저까지의 랭크 게임에 적용됩니다.","우선순위 포지션 보상으로 획득한 추가 점수는 주간 성적 점수 한도에 포함됩니다.","이제 포지션 상관없음을 선호 포지션으로 둬도 포지션 채우기 보상을 받을 수 없습니다. 랭크 게임에서는 우선순위 포지션 보상 시스템이 대신 적용됩니다."],"x":1}]},{"n":"챔피언 금지 규칙 조정","lv":3,"c":[{"t":"","l":["플래티넘~다이아몬드 티어의 랭크 게임에서 사용할 수 있는 챔피언 금지 슬롯이 팀당 3개에서 5개로 증가합니다."],"x":1}]},{"n":"팀원 증강 추천 기능","lv":3,"c":[]}]},{"t":"부록","k":"etc","g":[{"n":"챔피언 내구력 조정 목록","lv":3,"c":[]},{"n":"가렌","lv":4,"c":[{"t":"","l":["기본 체력: 660 → 690","기본 방어력: 52 → 44","레벨당 방어력 증가량: 5.8 → 5"]}]},{"n":"아트록스","lv":4,"c":[{"t":"","l":["레벨당 방어력 증가량: 4.5 → 5","기본 마법 저항력: 40 → 36"]}]},{"n":"렝가","lv":4,"c":[{"t":"","l":["기본 체력: 660 → 630","레벨당 체력 증가량: 128 → 136"]}]},{"n":"아무무","lv":4,"c":[{"t":"","l":["레벨당 체력 증가량: 104 → 114"]}]},{"n":"누누와 윌럼프","lv":4,"c":[{"t":"","l":["기본 체력: 690 → 630","레벨당 체력 증가량: 120 → 124"]}]},{"n":"에코","lv":4,"c":[{"t":"","l":["기본 체력: 630 → 650","레벨당 체력 증가량: 120 → 126"]}]},{"n":"카직스","lv":4,"c":[{"t":"","l":["기본 체력: 630 → 640","레벨당 체력 증가량: 120 → 128"]}]},{"n":"신 짜오","lv":4,"c":[{"t":"","l":["기본 체력: 690 → 650","레벨당 방어력 증가량: 4.3 → 4.7","레벨당 체력 증가량: 120 → 130"]}]},{"n":"헤카림","lv":4,"c":[{"t":"","l":["기본 방어력: 46 → 42","레벨당 방어력 증가량: 5 → 5.4","레벨당 체력 증가량: 120 → 130"]}]},{"n":"브라움","lv":4,"c":[{"t":"","l":["기본 체력: 690 → 630","기본 방어력: 52 → 46","레벨당 체력 증가량: 120 → 136"]}]},{"n":"진","lv":4,"c":[{"t":"","l":["기본 체력: 600 → 630"]}]},{"n":"이블린","lv":4,"c":[{"t":"","l":[ 00 → 50","Baron Nashor (levels 9 - 15):","Health 14000 - 18500, Attack Damage 280 - 490, Armor 96 - 168, Magic Resistance 56 - 98","Energy Surge Attack Damage ratio: 60% → 30%"],"x":1}]},{"n":"Battlefield system Adjustments","lv":3,"c":[]},{"n":"Turrets","lv":4,"c":[]},{"n":"Crystalline Overgrowth","lv":4,"c":[{"t":"","l":["All attackable lane turrets are now affected by Crystalline Overgrowth.","Turrets crystallize over time. A champion's first basic attack detonates all accumulated crystals, dealing True Damage.","The higher the average level of the attacking team, the higher the crystal detonation damage.","Cooldown: After a turret spawns, Crystalline Overgrowth has a 50-second cooldown. Once the cooldown ends, crystals begin to accumulate.","Minimum damage: 2%–8.7% of the turret's maximum Health (based on the attacking team's level)","Maximum damage: 3.3%–18.9% of the turret's maximum Health (based on the attacking team's level)","When no minions are within turret range and the turret's damage reduction is active, the crystals cannot be detonated."],"x":1}]},{"n":"Turret Related Adjustments","lv":4,"c":[]},{"n":"Turret Adjustments","lv":5,"c":[{"t":"","l":["All Turrets","[New] All turrets take 20% increased damage from melee champions.","Turret plating distribution: Outer turrets, inner turrets, and inhibitor turrets.","Turret plating now persists permanently.","Turret plates are tied to Health thresholds. A turret loses 1 plate whenever its Health falls below 90%, 75%, 55%, 30%, and 0%.","[Removed] When an outer/inner turret is destroyed, the corresponding inner/inhibitor turret no longer gains a 30-second shield.","[Removed] During the first 2 minutes of the game, Baron Lane and Mid Lane turrets no longer gain 50 bonus Armor and Magic Resist.","[Removed] During the first 6 minutes of the game, outer turrets no longer gain Armor and Magic Resist based on their remaining Health.","[Removed] During the first 5 minutes of the game, turrets no longer gain bonus stats when multiple enemy champions are within their attack range.","[New] Starting at 5:00, outer turret Armor, Magic Resistance, and turret plate Gold rewards begin to decay, up to 4 times."],"x":1}]},{"n":"Battlefield Tempo Adjustments","lv":3,"c":[{"t":"","l":["Melee Minions:","Reduced damage from champions: 50% - 70% (11:00 - 25:00)","Reduced damage from minions: 80%","Attack Damage increase: 10","Reduced damage from turrets: 25%","Caster Minion:","Reduced damage from champions: 50% - 70% (11:00 - 25:00)","Reduced damage from minions: 20%","Attack Damage increase: 30","Reduced damage from turrets: 25%"],"x":1}]},{"n":"Minions","lv":4,"c":[]},{"n":"Super Minion Aura","lv":4,"c":[{"t":"","l":["1 Turret:","35 Armor, 35 Magic Resistance","2 Turrets:","35 Armor, 35 Magic Resistance","Attack Damage: 15%","3 Turrets:","35 Armor, 35 Magic Resistance","Attack Damage: 40%"]}]},{"n":"Minion Stats","lv":4,"c":[{"t":"","l":["Base Health: 800 → 1100","Damage to structures: Reaches a maximum of 100% at 23:00 → Fixed at 84%","[New] All minions deal 60% damage to champions.","[New] Starting at 5:30, minions gain 25 Movement Speed every 150 seconds, up to 6 times.","[Removed] Starting at 11:00, minions no longer gain 10% out-of-combat Movement Speed per minute.","Minion experience range: 8 → 10"]}]},{"n":"Minion Push Buffs","lv":4,"c":[{"t":"","l":["[New] Bonus damage to minions: (5% + (5% × turret advantage in the lane)) × team average level advantage","[New] Damage reduction against minions: 1 + (turret advantage in the lane × team average level advantage)"]}]},{"n":"Lifesteal","lv":3,"c":[{"t":"","l":[],"x":1}]},{"n":"OTHER IN-GAME ADJUSTMENTS","lv":3,"c":[]},{"n":"Training Camp","lv":3,"c":[{"t":"","l":["You can now interact with the shop from anywhere in Practice Mode, including buying items, undoing purchases, and selling items."]}]},{"n":"Custom Mode","lv":3,"c":[{"t":"","l":["Added a new custom game mode: Rift Trials, where two players face off in a 1v1 on the Baron Lane of 、魔防52–82","召喚的預示者（5–15級）：","生命5300–7300、物攻80–130、物防54–114、魔防32–62","召喚的預示者衝鋒時獲得的金錢：200 → 50","巴龍納什（9–15級）：","生命14000–18500、物攻280–490、物防96–168、魔防法穿透56–98","「能量衝擊」物攻係數：60% → 30%"],"x":1}]},{"n":"戰場系統調整","lv":3,"c":[]},{"n":"防禦塔","lv":4,"c":[]},{"n":"結晶激增","lv":4,"c":[{"t":"","l":["所有可以攻擊的路線防禦塔現在都會受到「結晶激增」的影響。","防禦塔會逐漸結晶化。英雄的首次普攻會引爆所有累積的水晶，造成真實傷害。","攻擊方隊伍的平均等級越高，水晶引爆傷害就越高。","冷卻時間：防禦塔生成後，「結晶激增」有50秒冷卻時間。冷卻時間結束後，水晶就會開始累積。","「結晶激增」的傷害會在30秒內維持在最低點，接著在160秒內線性提升，直到達到最大傷害，之後會無限期維持最大傷害。","最低傷害：相當於防禦塔最大生命的2%–8.7%（依攻擊方隊伍等級而定）。","最大傷害：相當於防禦塔最大生命的3.3%–18.9%（依攻擊方隊伍等級而定）。","只要外塔還在，內塔和水晶防禦塔就不會結晶化。外塔一旦遭到摧毀，內防禦塔就會開始結晶化。","如果防禦塔攻擊範圍內沒有士兵，且防禦塔的傷害減免效果為啟動狀態，就無法引爆水晶。"],"x":1}]},{"n":"防禦塔相關調整","lv":4,"c":[]},{"n":"防禦塔調整","lv":5,"c":[{"t":"","l":["所有防禦塔","[新增] 近戰英雄對所有防禦塔的傷害增加20%。","防禦塔護甲分布：外塔、內塔與水晶防禦塔。","防禦塔護甲現在會永久保留。","防禦塔護甲狀態與各階段生命門檻綁定。防禦塔的生命在低於90%、75%、55%、30%和0%時各會失去一層護甲。","[移除] 外塔或內塔遭到摧毀時，對應的內塔或水晶防禦塔將不再獲得30秒護盾。","[移除] 在對戰前2分鐘，巴龍路和中路防禦塔不再獲得50點額外物防和魔防。","[移除] 在對戰前6分鐘，外塔不再根據剩餘生命獲得物防和魔防。","[移除] 在對戰前5分鐘，防禦塔不再因多名敵方英雄進入攻擊範圍而獲得額外能力值。","[新增] 從5:00開始，外塔的物防、魔防和防禦塔護甲金錢獎勵會開始衰減，最多衰減4次。"],"x":1}]},{"n":"戰場節奏調整","lv":3,"c":[{"t":"","l":["近戰士兵：","來自英雄的傷害減免：50%–70%（11:00–25:00）","來自士兵的傷害減免：80%","物攻提升：10","來自防禦塔的傷害減免：25%","遠程士兵：","來自英雄的傷害減免：50%–70%（11:00–25:00）","來自士兵的傷害減免：20%","物攻提升：30","來自防禦塔的傷害減免：25%"],"x":1}]},{"n":"士兵","lv":4,"c":[]},{"n":"超級士兵靈氣","lv":4,"c":[{"t":"","l":["1座防禦塔：","35物防、35魔防","2座防禦塔：","35物防、35魔防","物攻：15%","3座防禦塔：","35物防、35魔防","物攻：40%"]}]},{"n":"士兵能力值","lv":4,"c":[{"t":"","l":["基礎生命：800 → 1100","對建築傷害：23:00時達到最高100% → 固定為84%","[新增] 所有士兵對英雄造成60%傷害。","[新增] 從5:30開始，士兵每150秒會獲得25跑速，最多可疊加6次。","[移除] 從11:00開始，士兵不再每分鐘獲得10%脫戰跑速。","士兵經驗值獲取範圍：8 → 10"]}]},{"n":"士兵推線增益","lv":4,"c":[{"t":"","l":["[新增] 對士兵造成的額外傷害：（5% +（5% × 路線上的防禦塔優勢））× 戰隊平均等級優勢","[新增] 對士兵的傷害減免：1 +（該路線防禦塔優勢 × 隊伍平均等級優勢）"]}]},{"n":"普攻吸血","lv":3,"c":[{"t":"","l":["這項屬性已取代以下道具先前的吸血效果。詳情請參閱「道具」部分：水星彎刀、吸血鬼權杖、嗜血者、殞落王者之劍、槍銅護脛。"]}]},{"n":"其他遊戲內調整","lv":3,"c":[]},{"n":"訓練營","lv":3,"c":[{"t":"","l":["你現在可以在練習模式的任何地方與商店互動，包括購買道具、撤銷購買和販售道具。"]}]},{"n":"自訂對戰模式","lv":3,"c":[{"t":"","l":["新增自訂對戰模式：峽谷試煉，兩位玩家將在召喚峽谷的巴龍路進行1v1對決。"]}]},{"n":"召喚峽谷","lv":3,"c":[{"t":"","l":["玩家在基地的道具購買區域時，金錢現在會以醒目方式標示出來。","現在在基地內可以看到道具的價差。","元素飛龍即將現蹤時，可以看到牠的影子在現蹤地點上方盤旋。"]}]},{"n":"遊戲內關鍵道具推薦","lv":3,"c":[]}]},{"t":"冒險模式","k":"etc","g":[{"n":"S7戰紀","lv":3,"c":[]},{"n":"符文大亂鬥","lv":3,"c":[]},{"n":"主題增幅裝置","lv":4,"c":[]},{"n":"心鋼之聲","lv":5,"c":[]},{"n":"True Damage","lv":5,"c":[]},{"n":"搖滾殺五社","lv":5,"c":[]},{"n":"音浪賽季主題","lv":4,"c":[]},{"n":"新道具","lv":4,"c":[]},{"n":"無盡飢渴","lv":5,"c":[]},{"n":"瀆神九頭蛇","lv":5,"c":[]},{"n":"抗擊藥劑","lv":5,"c":[]},{"n":"巫魔藥劑","lv":5,"c":[]},{"n":"憤怒藥劑","lv":5,"c":[]},{"n":"增幅裝置池調整","lv":4,"c":[]},{"n":"增幅裝置調整","lv":4,"c":[]}]},{"t":"系統","k":"etc","g":[{"n":"新系統","lv":3,"c":[]},{"n":"新賽季開打","lv":3,"c":[{"t":"","l":["改良MVP選拔演算法，更全面評估不同角色定位的責任與貢獻，讓MVP結果能更真實反映玩家的實際表現。","新增一個比S級更高的評分等級：傳說S級。獲得傳說S級評分的玩家會獲得額外積分韌性。","更新積分對戰與傳奇積分對戰的賽後評分介面，讓玩家能更清楚、全面地總覽對戰表現。","以上評分系統改動僅適用於積分對戰和傳奇積分對戰。"],"x":1}]},{"n":"傳奇積分對戰","lv":3,"c":[]},{"n":"我們將更新傳奇積分對戰，鼓勵更多技術高強的玩家加入競爭，並幫助你更快達到最能展現實力的層級。我們會調整進入條件、晉升流程和積分系統，讓登上巔峰的過程更加順暢且更有成就感。","lv":3,"c":[{"t":"","l":["降低參賽門檻：本賽季達到大師的玩家，或是上賽季達到宗師以上的玩家，都能夠參加傳奇積分對戰。","新增了傳奇試煉活動。表現出色並完成指定挑戰，即可直接晉升至傳奇大師。","新增地區傳奇積分排行榜，讓技巧高超的玩家有更多機會展現實力並爭取榮耀。","調整較高牌階的積分系統。當玩家達到更高牌階時，必須維持更高的勝率才能繼續爬分，進一步提升高牌階的競爭價值。","已移除傳奇積分表現分數，但保留傳奇積分加成。你的傳奇積分牌階越高，加成也會越高。傳奇積分加成數值也大幅提升。","為傳奇積分加成加上了英雄解鎖機制。玩家必須用某位英雄累積淨勝場數，才能逐步解鎖該英雄的傳奇積分加成。","英雄戰績分數將不再因落敗而降低。除非涉及違規情形，否則英雄戰績分數只會增加。","英雄表現分數已更名為積分對戰表現評分。在這次調整後，此評分只能透過積分對戰獲得。","傳奇積分挑戰的對應加成和數值已重新調整改善。","移除了上一賽季傳承分數加成，新增了多樣專精分數加成。"],"x":1}]},{"n":"禁角系統規則調整","lv":3,"c":[{"t":"","l":["在白金到鑽石的積分對戰中，戰隊的禁用英雄數量將從每隊三個增加到每隊五個。"],"x":1}]},{"n":"隊友增幅裝置推薦","lv":4,"c":[]}]},{"t":"附錄","k":"etc","g":[{"n":"英雄續戰力調整詳細列表","lv":3,"c":[]},{"n":"蓋倫","lv":4,"c":[{"t":"","l":["基礎生命：660 → 690","基礎物防：52 → 44","每級物防：5.8 → 5"]}]},{"n":"厄薩斯","lv":4,"c":[{"t":"","l":["每級物防：4.5 → 5","基礎魔防：40 → 36"]}]},{"n":"雷葛爾","lv":4,"c":[{"t":"","l":["基礎生命：660 → 630","每級生命成長：128 → 136"]}]},{"n":"阿姆姆","lv":4,"c":[{"t":"","l":["每級生命成長：104 →   function pct(v) { return v.toFixed(2) + '%'; }
  function avatar(id) {
    var h = D.heroes[id], box = el('span', 'ava');
    var img = new Image();
    img.alt = ''; img.loading = 'lazy';
    img.onerror = function () { box.textContent = nm(h.n).charAt(0); };
    img.src = h.a;
    box.appendChild(img);
    return box;
  }
  function winBar(w) {
    var bar = el('span', 'bar'), i = el('i', w >= 50 ? 'up' : 'down');
    i.style.width = Math.min(Math.abs(w - 50) / 8, 1) * 50 + '%';
    bar.appendChild(i);
    return bar;
  }
  function sorted(tier, pos, col) {
    return (D.stats[tier][pos] || []).slice().sort(function (a, b) { return b[col] - a[col]; });
  }

  // 컨트롤
  var tabs = $('tabs');
  POS.forEach(function (p) {
    var b = el('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.pos = p;
    b.onclick = function () { state.pos = p; save(); render(); };
    tabs.appendChild(b);
  });
  var tiers = $('tiers');
  TIER.forEach(function (tr) {
    var b = el('button');
    b.type = 'button'; b.dataset.tier = tr;
    b.onclick = function () { state.tier = tr; save(); render(); };
    tiers.appendChild(b);
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value.trim(); renderList(); });
  each(document.querySelectorAll('#head button'), function (b) {
    b.onclick = function () { state.sort = +b.dataset.sort; render(); };
  });
  each($('langs').children, function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      try { localStorage.setItem('wr-lang', lang); } catch (e) {}
      applyLang();
    };
  });

  // 고정 문구를 현재 언어로 바꾸고 화면을 다시 그린다
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.documentElement.style.setProperty('--t-open', JSON.stringify(t('open')));
    document.documentElement.style.setProperty('--t-close', JSON.stringify(t('shut')));
    $('h1a').textContent = t('h1a'); $('h1b').textContent = t('h1b');
    $('meta').textContent = t('meta', { d: D.date });
    each($('langs').children, function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    each($('views').children, function (b) { b.textContent = t(b.dataset.view === 'stats' ? 'vStats' : 'vPatch'); });
    tabs.setAttribute('aria-label', t('posLabel'));
    tiers.setAttribute('aria-label', t('tierLabel'));
    each(tabs.children, function (b) { b.textContent = T[lang].pos[b.dataset.pos]; });
    each(tiers.children, function (b) { b.textContent = T[lang].tier[b.dataset.tier]; });
    $('q').placeholder = t('search'); $('q').setAttribute('aria-label', t('search'));
    $('col-champ').textContent = t('champ');
    var cols = { 1: 'win', 2: 'pick', 3: 'ban' };
    each(document.querySelectorAll('#head button'), function (b) { b.textContent = t(cols[b.dataset.sort]); });
    $('foot1').textContent = t('foot1'); $('foot2').textContent = t('foot2');
    render();
    if (state.hero) renderSheet();
    if (patchBuilt) buildPatches();
  }

  function render() {
    each(tabs.children, function (b) {
      b.setAttribute('aria-selected', b.dataset.pos === state.pos ? 'true' : 'false');
    });
    each(tiers.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.tier === state.tier ? 'true' : 'false');
    });
    each(document.querySelectorAll('#head button'), function (b) {
      if (+b.dataset.sort === state.sort) b.setAttribute('aria-sort', 'descending');
      else b.removeAttribute('aria-sort');
    });
    renderList();
  }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    var rows = sorted(state.tier, state.pos, state.sort);
    var q = state.q.toLowerCase(), shown = 0;
    rows.forEach(function (r, idx) {
      var h = D.heroes[r[0]], name = nm(h.n);
      // 검색은 어느 언어 이름으로든 된다
      if (q && h.n.join('\n').toLowerCase().indexOf(q) === -1) return;
      shown++;
      var li = el('li', idx < 3 ? 'top3' : '');
      var b = el('button', 'rowbtn grid');
      b.type = 'button';
      b.setAttribute('aria-label', t('detail', { n: name }));
      b.appendChild(el('span', 'rank', idx + 1));
      b.appendChild(avatar(r[0]));
      b.appendChild(el('span', 'name', name));
      var win = el('span', 'win');
      win.appendChild(el('b', r[1] >= 50 ? 'up' : 'down', pct(r[1])));
      win.appendChild(winBar(r[1]));
      b.appendChild(win);
      b.appendChild(el('span', 'num', pct(r[2])));
      b.appendChild(el('span', 'num', pct(r[3])));
      b.onclick = function () { openHero(r[0], state.pos); };
      li.appendChild(b);
      list.appendChild(li);
    });
    if (!shown) list.appendChild(el('li', 'empty', q ? t('noResult', { q: state.q }) : t('noStats')));
  }

  // 상세 시트
  var scrim = $('scrim'), sheet = $('sheet');
  function find(tier, pos, id) {
    var rows = sorted(tier, pos, 1);
    for (var i = 0; i < rows.length; i++) if (rows[i][0] === id) return { row: rows[i], rank: i + 1, total: rows.length };
    return null;
  }
  function openHero(id, pos) {
    state.hero = id; state.hpos = pos;
    renderSheet();
    scrim.classList.add('open');
    sheet.scrollTop = 0;
    sheet.focus();
    try { if (location.hash !== '#c-' + id) location.hash = 'c-' + id; } catch (e) {}
  }
  function closeHero() {
    state.hero = null;
    scrim.classList.remove('open');
    try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  function renderSheet() {
    var id = state.hero, h = D.heroes[id];
    sheet.textContent = '';

    var head = el('div', 'sheet-head');
    head.appendChild(avatar(id));
    var ttl = el('h2', '', nm(h.n)); ttl.id = 'sheet-title';
    head.appendChild(ttl);
    var c = el('button', 'close', t('close')); c.type = 'button'; c.onclick = closeHero;
    head.appendChild(c);
    sheet.appendChild(head);

    // 포지션별 요약 (선택한 랭크 구간)
    var played = POS.filter(function (p) { return find(state.tier, p, id); });
    if (played.length && !find(state.tier, state.hpos, id)) state.hpos = played[0];
    var s1 = el('section');
    s1.appendChild(el('h3', '', t('byPos', { t: T[lang].tier[state.tier] })));
    if (!played.length) {
      s1.appendChild(el('p', 'empty', t('noStats')));
    } else {
      var pg = el('div', 'posgrid');
      played.forEach(function (p) {
        var f = find(state.tier, p, id);
        var card = el('button', 'poscard');
        card.type = 'button';
        card.setAttribute('aria-pressed', p === state.hpos ? 'true' : 'false');
        card.appendChild(el('span', 'p', T[lang].pos[p]));
        card.appendChild(el('span', 'w ' + (f.row[1] >= 50 ? 'up' : 'down'), pct(f.row[1])));
        card.appendChild(el('span', 's', t('rankOf', { r: f.rank, n: f.total })));
        card.appendChild(el('span', 's', t('pickBan', { p: pct(f.row[2]), b: pct(f.row[3]) })));
        card.onclick = function () { state.hpos = p; renderSheet(); };
        pg.appendChild(card);
      });
      s1.appendChild(pg);
    }
    sheet.appendChild(s1);

    // 랭크 구간별 비교 (선택한 포지션)
    var s2 = el('section');
    s2.appendChild(el('h3', '', t('byTier', { p: T[lang].pos[state.hpos] })));
    var wrap = el('div', 'tablewrap'), table = el('table'), thead = el('thead'), trh = el('tr');
    ['thTier', 'win', 'thRank', 'pick', 'ban'].forEach(function (k) { trh.appendChild(el('th', '', t(k))); });
    thead.appendChild(trh); table.appendChild(thead);
    var tb = el('tbody');
    TIER.forEach(function (tr) {
      var f = find(tr, state.hpos, id), row = el('tr', tr === state.tier ? 'cur' : '');
      row.appendChild(el('td', '', T[lang].tier[tr]));
      if (f) {
        row.appendChild(el('td', f.row[1] >= 50 ? 'up' : 'down', pct(f.row[1])));
        row.appendChild(el('td', '', f.rank + ' / ' + f.total));
        row.appendChild(el('td', '', pct(f.row[2])));
        row.appendChild(el('td', '', pct(f.row[3])));
      } else {
        var td = el('td', '', t('none')); td.colSpan = 4; td.style.color = 'var(--mute)';
        row.appendChild(td);
      }
      tb.appendChild(row);
    });
    table.appendChild(tb); wrap.appendChild(table); s2.appendChild(wrap);
    sheet.appendChild(s2);

    // 빌드
    var s3 = el('section');
    s3.appendChild(el('h3', '', t('build')));
    var build = el('div', 'build');
    var B = (D.builds || {})[id];
    // 아이콘에 마우스를 올리면 이름이 뜨고, 누르면(터치 화면) 묶음 제목 옆에 이름이 표시된다.
    function group(label, refs, numbered, round) {
      if (!refs || !refs.length) return;
      var g = el('div', 'bgroup');
      var ghead = el('div', 'bhead');
      ghead.appendChild(el('span', 'blabel', label));
      var picked = el('span', 'bpicked');
      picked.setAttribute('aria-live', 'polite');
      ghead.appendChild(picked);
      g.appendChild(ghead);
      var chips = el(numbered ? 'ol' : 'ul', 'chips');
      refs.forEach(function (ref, i) {
        var thing = D.things[ref] || [['?'], ''], name = nm(thing[0]), src = thing[1];
        var li = el('li');
        var b = el('button', 'icon' + (round ? ' round' : ''));
        b.type = 'button'; b.title = name; b.setAttribute('aria-label', name);
        function asText() { b.className = 'chip'; b.textContent = name; }
        if (src) {
          var img = new Image();
          img.alt = ''; img.loading = 'lazy';
          img.onerror = asText;
          img.src = src;
          b.appendChild(img);
          if (numbered) b.appendChild(el('span', 'no', i + 1));
        } else asText();
        b.onclick = function () {
          each(chips.querySelectorAll('.on'), function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          picked.textContent = name;
        };
        li.appendChild(b);
        chips.appendChild(li);
      });
      g.appendChild(chips);
      build.appendChild(g);
    }
    if (B) {
      group(t('bStart'), B.s);
      group(t('bCore'), B.c, true);
      group(t('bBoots'), B.b);
      group(t('bFinal'), B.f, true);
      group(t('bKey'), B.r.slice(0, 1), false, true);
      group(t('bRunes'), B.r.slice(1), false, true);
      group(t('bSpells'), B.sp);
      build.appendChild(el('p', '', t('buildNote', { v: B.p ? t('buildPatch', { v: B.p }) : '' })));
    } else {
      build.appendChild(el('p', '', t('noBuild')));
    }
    if (h.g) {
      var a = el('a', 'go', t('guide'));
      a.href = h.g; a.target = '_blank'; a.rel = 'noopener';
      build.appendChild(a);
    }
    s3.appendChild(build);
    sheet.appendChild(s3);
  }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeHero(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.hero) closeHero(); });
  function fromHash() {
    var hash = location.hash || '';
    var m = /^#c-(\d+)$/.exec(hash);
    if (m && D.heroes[m[1]]) { if (state.hero !== m[1]) openHero(m[1], state.pos); return; }
    if (state.hero) { state.hero = null; scrim.classList.remove('open'); }
    if (hash === '#patch-notes') showView('patch');
    else if (hash === '' || hash === '#') showView(state.view || 'stats');
  }
  window.addEventListener('hashchange', fromHash);

  // 화면 전환: 승률표 / 패치 노트
  var viewStats = $('view-stats'), viewPatch = $('view-patch');
  var viewBtns = $('views').children, patchBuilt = false;
  function showView(v) {
    state.view = v;
    viewStats.hidden = v !== 'stats';
    viewPatch.hidden = v !== 'patch';
    each(viewBtns, function (b) {
      if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (v === 'patch' && !patchBuilt) { buildPatches(); patchBuilt = true; }
  }
  each(viewBtns, function (b) {
    b.onclick = function () {
      showView(b.dataset.view);
      try { history.replaceState(null, '', location.pathname + location.search + (b.dataset.view === 'patch' ? '#patch-notes' : '')); } catch (e) {}
    };
  });

  // 패치 노트 속 챔피언 이름(어느 언어든, 대만 표기 포함)으로 챔피언을 찾는다
  var heroByName = {};
  function key(s) { return String(s).toLowerCase().replace(/[\s'’.·&]/g, ''); }
  Object.keys(D.heroes).forEach(function (id) {
    var h = D.heroes[id];
    h.n.concat(h.x ? [h.x] : []).forEach(function (n) { if (n) heroByName[key(n)] = id; });
  });
  function heroId(name) { return heroByName[key(name)]; }

  // "A → B" 줄은 바뀐 뒤 값(B)을 강조한다
  function changeLine(text) {
    var li = el('li'), i = text.lastIndexOf('→');
    if (i < 0) { li.textContent = text; return li; }
    li.appendChild(document.createTextNode(text.slice(0, i + 1) + ' '));
    li.appendChild(el('span', 'to', text.slice(i + 1).trim()));
    return li;
  }
  function namesOf(sec) {
    // 소제목(lv 3)만 있는 항목은 묶음 이름이라 요약에서는 실제 변경 항목만 센다
    var real = sec.g.filter(function (g) { return sec.k === 'champ' || g.c.length || g.lv !== 3; });
    return (real.length ? real : sec.g).map(function (g) { return g.n; });
  }
  function buildPatches() {
    var all = D.patches || {};
    if (Array.isArray(all)) all = { ko: all };
    var P = all[lang] && all[lang].length ? all[lang] : (all.en || all.ko || []);
    // 다시 그릴 때 펼쳐 둔 패치는 그대로 둔다
    var wasOpen = {};
    each(viewPatch.querySelectorAll('details.patch'), function (d) { wasOpen[d.dataset.v] = d.open; });
    viewPatch.textContent = '';
    if (!P.length) { viewPatch.appendChild(el('p', 'empty', t('noPatch'))); return; }
    viewPatch.appendChild(el('p', 'pnote', t('patchIntro')));
    P.forEach(function (p, idx) {
      var d = el('details', 'patch');
      d.dataset.v = p.v;
      d.open = p.v in wasOpen ? wasOpen[p.v] : idx === 0;
      var sum = el('summary');
      sum.appendChild(el('span', 'pver', p.v));
      sum.appendChild(el('span', 'pdate', p.date));
      var nChamp = 0, nEtc = 0;
      p.s.forEach(function (s) { if (s.k === 'champ') nChamp += s.g.length; else nEtc += namesOf(s).length; });
      sum.appendChild(el('span', 'pcount', (nChamp ? t('nChamp', { n: nChamp }) + ' · ' : '') + t('nEtc', { n: nEtc })));
      d.appendChild(sum);

      var body = el('div', 'pbody');
      if (p.desc) body.appendChild(el('p', 'pdesc', p.desc));

      // 한눈에 보기
      var glance = el('div', 'glance');
      glance.appendChild(el('h3', '', t('glance')));
      p.s.forEach(function (s) {
        var row = el('div', 'grow');
        var names = namesOf(s);
        row.appendChild(el('span', 'gt', s.t + ' ' + names.length));
        if (s.k === 'champ') {
          var box = el('div', 'champs');
          s.g.forEach(function (g) {
            var id = heroId(g.n);
            var label = id ? nm(D.heroes[id].n) : g.n;
            var c = el(id ? 'button' : 'span', 'champ');
            if (id) {
              c.type = 'button'; c.title = t('viewWin', { n: label });
              c.appendChild(avatar(id));
              c.onclick = function () { openHero(id, state.pos); };
            } else c.style.paddingLeft = '10px';
            c.appendChild(document.createTextNode(label));
            box.appendChild(c);
          });
          row.appendChild(box);
        } else {
          var shown = names.slice(0, 12).join(', ');
          row.appendChild(el('span', 'names', shown + (names.length > 12 ? t('more', { n: names.length - 12 }) : '')));
        }
        glance.appendChild(row);
      });
      body.appendChild(glance);

      // 항목별 변경 내용 (눌러서 펼침)
      var secs = el('div');
      p.s.forEach(function (s) {
        var sd = el('details', 'sec'), ss = el('summary');
        ss.appendChild(el('span', '', s.t));
        ss.appendChild(el('span', 'n', t('count', { n: namesOf(s).length })));
        sd.appendChild(ss);
        var sb = el('div', 'secbody');
        s.g.forEach(function (g) {
          var pg = el('div', 'pg' + (g.lv === 3 ? ' sub' : ''));
          var gn = el('div', 'gn');
          var id = s.k === 'champ' ? heroId(g.n) : null;
          if (id) gn.appendChild(avatar(id));
          gn.appendChild(document.createTextNode(id ? nm(D.heroes[id].n) : g.n));
          pg.appendChild(gn);
          g.c.forEach(function (c) {
            if (c.t) pg.appendChild(el('div', 'ct', c.t));
            if (c.l.length) {
              var ul = el('ul');
              c.l.forEach(function (line) { ul.appendChild(changeLine(line)); });
              pg.appendChild(ul);
            }
            if (c.x) pg.appendChild(el('div', 'cut', t('cut')));
          });
          sb.appendChild(pg);
        });
        sd.appendChild(sb);
        secs.appendChild(sd);
      });
      body.appendChild(secs);

      var a = el('a', 'orig', t('orig', { v: p.v }));
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      body.appendChild(a);
      d.appendChild(body);
      viewPatch.appendChild(d);
    });
  }

  applyLang();
  showView('stats');
  fromHash();
})();
</script>
</body>
</html>
