name: 통계 자동 갱신

on:
  schedule:
    # 4시간마다 확인한다. 중국 쪽 통계가 올라오는 시각이 일정하지 않아
    # 하루 한 번만 돌리면 아직 안 올라온 날을 놓친다. 바뀐 게 없으면 아무것도 하지 않는다.
    - cron: "20 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 새 패치 노트 받기 (실패해도 통계 갱신은 계속)
        run: python fetch_patches.py || echo "패치 노트를 받지 못해 기존 내용을 유지합니다"

      - name: 통계 받아서 index.html 다시 만들기 (접속 오류면 최대 3번 시도)
        run: |
          for i in 1 2 3; do
            python update.py && exit 0
            echo "::warning::통계 갱신 실패 ($i/3), 잠시 뒤 다시 시도합니다"
            sleep 30
          done
          exit 1

      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet -- index.html patches.json history.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html patches.json history.json
          git commit -m "통계 자동 갱신"
          git push
