name: 통계 자동 갱신

on:
  schedule:
    # 매일 06:30 (한국 시간) = 21:30 UTC
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 통계 받아서 index.html 다시 만들기
        run: python update.py

      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet -- index.html; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "통계 자동 갱신"
          git push
